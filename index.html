-DIR-Q46", "n": 46, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "E", "img": "img/AMP26-DIR-Q46.webp", "pages": ["img/AMP26-DIR-p15.webp"], "base": null, "text": "", "source": "Amparo · Diretor de Escola", "p": 15, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "AMP26-DIR-Q47", "n": 47, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "A", "img": "img/AMP26-DIR-Q47.webp", "pages": ["img/AMP26-DIR-p15.webp"], "base": null, "text": "", "source": "Amparo · Diretor de Escola", "p": 15, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "AMP26-DIR-Q49", "n": 49, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "B", "img": "img/AMP26-DIR-Q49.webp", "pages": ["img/AMP26-DIR-p16.webp"], "base": null, "text": "", "source": "Amparo · Diretor de Escola", "p": 16, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "AMP26-DIR-Q50", "n": 50, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "C", "img": "img/AMP26-DIR-Q50.webp", "pages": ["img/AMP26-DIR-p16.webp"], "base": null, "text": "", "source": "Amparo · Diretor de Escola", "p": 16, "role": "both", "preferred": "DIR", "fallback": false, "author": "Dermeval Saviani", "secondary": []}, {"id": "POT26-DIR-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "B", "img": "img/POT26-DIR-Q01.webp", "pages": ["img/POT26-DIR-p2.webp"], "base": "POT26-DIR-T1", "text": "QUESTÃO 01 \nO texto “As crianças não são o futuro do mundo” \né predominantemente: \n(A) dissertativo, com apresentação de ideias \nsobre como ser um bom pai. \n(B) dissertativo, com apresentação de ideias \nsobre o meio ambiente. \n(C) narrativo, com apresentação de dados \nimaginários sobre o planeta. \n(D) narrativo, apresentando a rotina diária do \nnarrador. \n(E) descritivo, apresentando características da \nFloresta Amazônica.", "source": "Potim · Diretor de Escola", "p": 2, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q02", "n": 2, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "C", "img": "img/POT26-DIR-Q02.webp", "pages": ["img/POT26-DIR-p2.webp"], "base": "POT26-DIR-T1", "text": "QUESTÃO 02 \nO autor do texto é: \n(A) quem apresenta o conteúdo com base nas \nexperiências de outra pessoa, exclusivamente. \n(B) alguém que fez uma importante palestra \ncomo jornalista. \n(C) a própria pessoa que apresenta o conteúdo, \nincluindo sua experiência pessoal. \n(D) uma pessoa que não possui absolutamente \nnenhum hábito de preservação do ambiente. \n(E) uma pessoa que não possui filhos e nem \nparentes, e por isso se mantém muito distante do \ntema do texto.", "source": "Potim · Diretor de Escola", "p": 2, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q03", "n": 3, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "D", "img": "img/POT26-DIR-Q03.webp", "pages": ["img/POT26-DIR-p3.webp"], "base": "POT26-DIR-T1", "text": "QUESTÃO 03 \nO que justifica o conteúdo do título do texto “As \ncrianças não são o futuro do mundo”, segundo o \nautor, é que: \n(A) as crianças não terão que se preocupar com o \nmeio ambiente no futuro. \n(B) \nas \ncrianças \nsão \nseres \nnaturalmente \nirresponsáveis e sem consciência. \n(C) não existe a necessidade de se preocupar com \no futuro do mundo. \n(D) a responsabilidade sobre o futuro do mundo \né dos adultos de hoje. \n(E) o assunto sobre as condições do meio \nambiente não é algo preocupante.", "source": "Potim · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q04", "n": 4, "area": "LP", "eixo": "LP04", "topic": "Ortografia e acentuação", "key": "A", "img": "img/POT26-DIR-Q04.webp", "pages": ["img/POT26-DIR-p3.webp"], "base": null, "text": "QUESTÃO 04 \nAssinale a alternativa em que todas as palavras \nestão grafadas corretamente, de acordo com as \nregras vigentes em Língua Portuguesa. \n(A) Ao escrever, preste muita atenção nos hifens \nentre as palavras. \n(B) Suas idéias não foram muito bem aceitas pela \norganização. \n(C) Ela apresentou uma postura de muito desdem \nem relação às propostas. \n(D) Os ítens para debate serão apresentados no \nencontro. \n(E) Faremos uma pausa, e nesse interim vamos \nretomar o debate.", "source": "Potim · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q05", "n": 5, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "B", "img": "img/POT26-DIR-Q05.webp", "pages": ["img/POT26-DIR-p3.webp"], "base": null, "text": "QUESTÃO 05 \nAssinale a alternativa cuja palavra destacada \npossui natureza substantiva, conferindo nome a \nalgum ser. \n(A) Conheci um rapaz muito bem-humorado. \n(B) O bem sempre haverá de vencer o mal. \n(C) Tem certeza de que está passando bem? \n(D) Fiquei sabendo que você mora bem longe. \n(E) Espero que tenha chegado bem da viagem.", "source": "Potim · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q06", "n": 6, "area": "LP", "eixo": "LP11", "topic": "Crase", "key": "A", "img": "img/POT26-DIR-Q06.webp", "pages": ["img/POT26-DIR-p3.webp"], "base": null, "text": "QUESTÃO 06 \nAssinale a alternativa cuja sentença apresenta o \nuso adequado do acento grave indicativo de \ncrase. \n(A) Todos nós vamos sair daqui à francesa, antes \nque nos vejam. \n(B) Trouxe uma pequena lembrança à todos que \nme ajudaram naquela viagem. \n(C) Fiz referência à tudo quanto lembrei nos \nmeus momentos de desespero. \n(D) De domingo à domingo, ele estudava com \nafinco para as provas. \n(E) Gostaria de ajudar à todas as pessoas que me \nderam apoio no passado.", "source": "Potim · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q07", "n": 7, "area": "LP", "eixo": "LP08", "topic": "Sintaxe", "key": "B", "img": "img/POT26-DIR-Q07.webp", "pages": ["img/POT26-DIR-p3.webp"], "base": null, "text": "QUESTÃO 07 \nAssinale a alternativa que apresenta um período \nem que o sujeito sofre a ação expressa pelo \nverbo, caracterizando uma voz passiva. \n(A) Vendemos muitas casas e apartamentos ao \nlongo do mês, rendendo muitas vantagens \ncompetitivas. \n(B) \nForam \nrecepcionados \npor \ntodos \nos \ncolaboradores da empresa os chefes que voltaram \npremiados. \n(C) Chegaram as encomendas que fizemos pelo \nsite de compras e vendas. \n(D) Havia muito tempo que eu não me sentia tão \nconfortável. \n(E) Comprei um relógio muito caro por vias \nlegais e viáveis.", "source": "Potim · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q08", "n": 8, "area": "LP", "eixo": "LP13", "topic": "Redação oficial", "key": "B", "img": "img/POT26-DIR-Q08.webp", "pages": ["img/POT26-DIR-p3.webp"], "base": null, "text": "QUESTÃO 08 \nAssinale a alternativa que apresenta o nome do \ndocumento técnico oficial que tem por objetivo \nfazer um registro escrito dos fatos e decisões de \numa reunião ou assembleia. \n(A) Ofício. \n(B) Ata. \n(C) Memorando. \n(D) Circular. \n(E) Atestado.", "source": "Potim · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q09", "n": 9, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "D", "img": "img/POT26-DIR-Q09.webp", "pages": ["img/POT26-DIR-p4.webp"], "base": null, "text": "QUESTÃO 09 \n \nNa placa acima, as formas verbais utilizadas se \nencontram no: \n(A) presente do modo indicativo. \n(B) presente do modo subjuntivo. \n(C) pretérito perfeito do indicativo. \n(D) modo imperativo afirmativo. \n(E) modo imperativo negativo.", "source": "Potim · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q10", "n": 10, "area": "LP", "eixo": "LP13", "topic": "Redação oficial", "key": "C", "img": "img/POT26-DIR-Q10.webp", "pages": ["img/POT26-DIR-p4.webp"], "base": null, "text": "QUESTÃO 10 \nEm relação à redação técnica oficial, assinale \numa das exigências corretas para os textos \nproduzidos. \n(A) \nAmbiguidade \nna \napresentação \ndas \ninformações, como resultado de imaginação e \ncriatividade. \n(B) Períodos longos, de forma que o máximo de \ninformações sejam concentradas em grandes \nparágrafos. \n(C) Objetividade nas informações apresentadas, \nevitando rodeios de palavras e excesso de \nintercalações.  \n(D) Uso de linguagem coloquial, a fim de que as \ninformações sejam compreendidas por qualquer \ntipo de leitor. \n(E) Ausência de informações como remetente, \ndestinatário, assunto e objetivos, para que os \ntextos sejam mais sucintos.", "source": "Potim · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q11", "n": 11, "area": "MRL", "eixo": "MRL06", "topic": "Médias", "key": "B", "img": "img/POT26-DIR-Q11.webp", "pages": ["img/POT26-DIR-p4.webp"], "base": null, "text": "QUESTÃO 11 \nDaniela e Guilherme trabalham em um escritório \ncomo analistas de dados. Daniela informou a \nGuilherme que a média aritmética de 41 números \né 12. Guilherme lembrou que ainda faltava \nincluir o último dado, que ele havia acabado de \nreceber, ao conjunto. \nSe o valor da nova média, atualizada com esse \núltimo dado, é 16, qual foi o número que \nGuilherme recebeu e incluiu? \nAssinale a alternativa correta: \n(A) 138 \n(B) 180 \n(C) 222 \n(D) 96 \n(E) 4", "source": "Potim · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q12", "n": 12, "area": "MRL", "eixo": "MRL02", "topic": "MMC e MDC", "key": "C", "img": "img/POT26-DIR-Q12.webp", "pages": ["img/POT26-DIR-p4.webp"], "base": null, "text": "QUESTÃO 12 \nRicky Carmichael e Jeremy McGrath são dois \npilotos \nfamosos \nde \nmotocross. \nEm \num \ndeterminado evento, Carmichael e McGrath irão \nse apresentar correndo em sentido opostos e ao \nmesmo tempo. McGrath dá uma volta na pista a \ncada 3 minutos e Carmichael a cada 7 minutos. \nEm um determinado momento eles se cruzam em \num ponto P da pista.  \nEm quanto tempo eles voltarão a se cruzar pela \nprimeira vez nesse mesmo ponto P? \nAssinale a alternativa que indica a resposta \ncorreta. \n(A) 15 minutos \n(B) 18 minutos \n(C) 21 minutos \n(D) 24 minutos \n(E) 25 minutos", "source": "Potim · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q13", "n": 13, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "A", "img": "img/POT26-DIR-Q13.webp", "pages": ["img/POT26-DIR-p5.webp"], "base": null, "text": "QUESTÃO 13 \nUm produto custa R$ 200,00 e está sendo \nvendido com um desconto de 15%. Após a \ncompra, Bárbara percebeu que não gostou do \nproduto e decidiu revendê-lo por um valor 40% \nmenor do que o valor que pagou após o desconto. \nAssinale a alternativa que indica o valor pelo \nqual Bárbara revendeu o produto: \n(A) R$ 102,00 \n(B) R$ 110,00 \n(C) R$ 150,00 \n(D) R$ 170,00 \n(E) R$ 238,00", "source": "Potim · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q14", "n": 14, "area": "MRL", "eixo": "MRL05", "topic": "Regra de três", "key": "C", "img": "img/POT26-DIR-Q14.webp", "pages": ["img/POT26-DIR-p5.webp"], "base": null, "text": "QUESTÃO 14 \nKelvin é um concurseiro muito esforçado e \nacredita que está na iminência de sua aprovação. \nSua preparação envolve a resolução intensiva de \nquestões. Por exemplo, ele resolve 2.500 \nquestões por semana e, agora que o edital foi \npublicado, pretende manter esse ritmo para \nrealizar uma boa prova daqui a quatro meses. \nConsiderando que cada mês tem quatro semanas \ne que ele manterá esse mesmo ritmo, quantas \nquestões Kelvin terá resolvido até o dia da prova? \nAssinale a alternativa correta: \n(A) 35.000 questões \n(B) 38.000 questões \n(C) 40.000 questões \n(D) 42.500 questões \n(E) 45.000 questões", "source": "Potim · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q15", "n": 15, "area": "MRL", "eixo": "MRL10", "topic": "Medidas e conversões", "key": "C", "img": "img/POT26-DIR-Q15.webp", "pages": ["img/POT26-DIR-p5.webp"], "base": null, "text": "QUESTÃO 15 \nPedro Henrique, servidor público, realizou três \ntarefas em sequência e sem pausas entre elas. \nTodas as tarefas levaram o mesmo tempo para \nserem executadas. A primeira tarefa iniciou às \n9h20min, e a segunda tarefa terminou às \n13h24min. \nEm qual horário Pedro Henrique terminou a \nterceira tarefa? Assinale a alternativa correta. \n(A) 13h53min \n(B) 14h23min \n(C) 15h26min \n(D) 15h45min \n(E) 21h12min", "source": "Potim · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q16", "n": 16, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "C", "img": "img/POT26-DIR-Q16.webp", "pages": ["img/POT26-DIR-p5.webp"], "base": null, "text": "QUESTÃO 16 \nMohamed Salim investiu na compra de uma ação \ne, após um mês, decidiu vendê-la. O valor de \nvenda foi exatamente a metade do valor pago na \ncompra. \nNesse contexto, qual é a razão entre o preço de \nvenda e o preço de compra?  \nAssinale a alternativa correta: \n(A) 1:1 \n(B) 2:1 \n(C) 1:2 \n(D) 3:2 \n(E) 2:3", "source": "Potim · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q17", "n": 17, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "D", "img": "img/POT26-DIR-Q17.webp", "pages": ["img/POT26-DIR-p5.webp"], "base": null, "text": "QUESTÃO 17 \nConsidere o quadrado ABCD, cujos vértices são \nA(1, 1), B(5, 1), C(5, 5) e D(1, 5), expressos em \nmetros.  \nA área desse quadrado é igual a: ______ m2. \nCom base nesse contexto, assinale a alternativa \ncorreta que preenche a lacuna acima. \n(A) 8 \n(B) 12 \n(C) 15 \n(D) 16 \n(E) 25", "source": "Potim · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q19", "n": 19, "area": "MRL", "eixo": "MRL13", "topic": "Sequências", "key": "D", "img": "img/POT26-DIR-Q19.webp", "pages": ["img/POT26-DIR-p6.webp"], "base": null, "text": "QUESTÃO 19 \nVocê, um concurseiro dedicado, está resolvendo \numa questão de Matemática e Raciocínio Lógico \ncom a seguinte proposta: \nDois números, 𝑎 e 𝑏, são, respectivamente, o \ndécimo quinto e o décimo sexto elementos de \numa sequência numérica do tipo progressão \naritmética. O número 𝑎 é o maior número natural \nformado por algarismos distintos, múltiplo de 2 e \nmenor que 200. Já o número 𝑏 \n é o menor número natural par, maior que 200. \nDado esse contexto, podemos afirmar que essa \nprogressão aritmética é: \n(A) decrescente, com razão igual a 4. \n(B) crescente, com razão igual a 6. \n(C) o décimo primeiro termo é 192. \n(D) os décimos primeiro, segundo e terceiro \ntermos são, respectivamente, 182, 186 e 190. \n(E) o décimo terceiro termo é 194.", "source": "Potim · Diretor de Escola", "p": 6, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q20", "n": 20, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "B", "img": "img/POT26-DIR-Q20.webp", "pages": ["img/POT26-DIR-p6.webp"], "base": null, "text": "QUESTÃO 20 \nManoel irá comprar uma TV de 50” (50 \npolegadas), com dimensões de 111 cm × 57,48 \ncm. Ele foi informado de que essa medida \ncorresponde à diagonal da TV, que é de \naproximadamente 125 cm. Manoel possui uma \nestante com espaço disponível de 120 cm × 80 \ncm, cuja diagonal é de aproximadamente 144,22 \ncm. \nCom base nesse contexto, analise as afirmações \na seguir e assinale a alternativa correta: \nI. Como a diagonal da TV é de 125 cm e o espaço \ndisponível é de 144,22 cm, além da comparação \ndireta das demais dimensões de largura e altura, \npodemos concluir que a TV caberá na estante.  \nII. A TV ultrapassa os limites da estante, pois sua \nlargura é maior que o espaço disponível. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(D) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI. \n(E) As asserções I e II são proposições falsas. \n \nNOÇÕES DE INFORMÁTICA", "source": "Potim · Diretor de Escola", "p": 6, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q21", "n": 21, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "A", "img": "img/POT26-DIR-Q21.webp", "pages": ["img/POT26-DIR-p6.webp"], "base": null, "text": "Ç\nQUESTÃO 21 \nConsiderando as funções presentes na área de \ntrabalho do Windows e em sua barra de tarefas, \nassinale a alternativa que completa corretamente \na lacuna a seguir:  \n“O ___________ do Windows constitui um \nelemento central do sistema operativo, que \npermite o acesso aos programas, configurações e \ndocumentos do usuário. Integra ainda um motor \nde busca eficaz e a possibilidade de fixar \naplicações.” \n(A) menu Iniciar \n(B) Mozilla  \n(C) Paint \n(D) Spotfi \n(E) Cartoon", "source": "Potim · Diretor de Escola", "p": 6, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q22", "n": 22, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "C", "img": "img/POT26-DIR-Q22.webp", "pages": ["img/POT26-DIR-p7.webp"], "base": null, "text": "QUESTÃO 22 \nAssinale a alternativa que preenche corretamente \na lacuna no texto abaixo, de acordo com as \nformas de interação com o conjunto de \naplicativos do Microsoft Windows. \nA ________ tem a função de ancorar aplicativos \nde uso frequente para facilitar o seu lançamento, \nexibir uma visualização dos programas em \nfuncionamento e controlar as notificações do \nambiente operacional. \n(A) conectividade  \n(B) ferramenta de captura  \n(C) barra de tarefas \n(D) central de ações \n(E) lixeira", "source": "Potim · Diretor de Escola", "p": 7, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q23", "n": 23, "area": "INF", "eixo": "INF05", "topic": "Correio eletrônico", "key": "A", "img": "img/POT26-DIR-Q23.webp", "pages": ["img/POT26-DIR-p7.webp"], "base": null, "text": "QUESTÃO 23 \nCom relação ao uso de correio eletrônico, analise \nas alternativas a seguir e assinale a opção que \napresenta o nome de um programa utilizado na \norganização de e-mails.  \n(A) Outlook. \n(B) Paint. \n(C) Norton. \n(D) Bloco de Notas. \n(E) Prompt de Comando.", "source": "Potim · Diretor de Escola", "p": 7, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q24", "n": 24, "area": "INF", "eixo": "INF05", "topic": "Correio eletrônico", "key": "A", "img": "img/POT26-DIR-Q24.webp", "pages": ["img/POT26-DIR-p7.webp"], "base": null, "text": "QUESTÃO 24 \nO que é um anexo em um e-mail? \n(A) Um arquivo que pode ser enviado junto com \numa mensagem de e-mail. Esses arquivos podem \nincluir \ndocumentos, \nimagens, \nvídeos, \napresentações e outros tipos de conteúdo digital.  \n(B) Um programa de computador que protege \ncontra vírus em mensagens de e-mail. \n(C) O endereço eletrônico do remetente da \nmensagem. \n(D) O tamanho máximo permitido para uma \ncaixa de entrada de e-mail. \n(E) Um tipo de servidor de e-mail que armazena \nmensagens antigas.", "source": "Potim · Diretor de Escola", "p": 7, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q25", "n": 25, "area": "INF", "eixo": "INF02", "topic": "Word", "key": "E", "img": "img/POT26-DIR-Q25.webp", "pages": ["img/POT26-DIR-p7.webp"], "base": null, "text": "QUESTÃO 25 \nNo Microsoft Word, qual recurso de estruturação \nde documentos pode ser usado para listar os \ntermos e tópicos discutidos em um documento, \njuntamente com as páginas em que eles \naparecem? \n(A) Tradutor automático. \n(B) Corretor ortográfico. \n(C) Layout. \n(D) Idioma. \n(E) Índice. \n \nCONHECIMENTOS ESPECÍFICOS", "source": "Potim · Diretor de Escola", "p": 7, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q26", "n": 26, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "C", "img": "img/POT26-DIR-Q26.webp", "pages": ["img/POT26-DIR-p7.webp"], "base": null, "text": "QUESTÃO 26 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que preenche \ncorretamente a lacuna: \nO Projeto Político-Pedagógico é um documento \nem que se registra o resultado do processo \n__________ estabelecido por aqueles atores que \nestudam a escola e por ela respondem em \nparceria (gestores, professores, técnicos e demais \nfuncionários, \nrepresentação \nestudantil, \nrepresentação da família e da comunidade local). \n \n(A) burocrático \n(B) competitivo \n(C) negocial \n(D) religioso \n(E) geográfico", "source": "Potim · Diretor de Escola", "p": 7, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q27", "n": 27, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "A", "img": "img/POT26-DIR-Q27.webp", "pages": ["img/POT26-DIR-p8.webp"], "base": null, "text": "QUESTÃO 27 \nA transversalidade no planejamento exige \nintegração entre áreas e sujeitos escolares. \nAnalise as asserções a seguir. \nI. Para ser tratada transversalmente, a temática \natravessa, \nestabelece \nelos, \nenriquece, \ncomplementa temas e/ou atividades tratadas por \ndisciplinas, eixos ou áreas do conhecimento. \nII. A transversalidade é um processo que \ndispensa a participação coletiva, bastando a \natuação do professor na sua disciplina. \n \n(A) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Potim · Diretor de Escola", "p": 8, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q28", "n": 28, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "B", "img": "img/POT26-DIR-Q28.webp", "pages": ["img/POT26-DIR-p8.webp"], "base": null, "text": "QUESTÃO 28 \nA \nescola \ntem \npapel \nfundamental \nna \ndemocratização da sociedade. Analise as \nasserções a seguir. \nI. A democratização da sociedade exige, \nnecessariamente, informação e conhecimento \npara que a pessoa possa situar-se no mundo, \nargumentar, reivindicar e ampliar novos direitos. \nII. A informação toma uma relevância maior \nquando se lida com os vários tipos de \nconhecimentos \ne \nsaberes, \nsejam \neles \ncaracterizados como tecnológicos, instrumentais, \npopulares, filosóficos, sociológicos, científicos, \npedagógicos, entre outros. \n \n(A) A asserção I é uma proposição falsa, e a II é \nverdadeira. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é verdadeira, e a II é falsa. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não complementa a I.", "source": "Potim · Diretor de Escola", "p": 8, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q29", "n": 29, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "A", "img": "img/POT26-DIR-Q29.webp", "pages": ["img/POT26-DIR-p8.webp"], "base": null, "text": "QUESTÃO 29 \nDe acordo com Miguel Arroyo, as políticas e \ndiretrizes curriculares refletem concepções sobre \no papel da escola e do conhecimento. Analise as \nafirmativas \nabaixo \ne \nmarque-as \ncomo \nverdadeiras (V) ou falsas (F). \n( ) As políticas e as diretrizes curriculares \ntambém estão transpassadas por disputas entre \nmanter estilos normatizantes ou optar por \norientações mais políticas. \n( ) A incorporação de novos saberes e culturas \nproduzidos nos movimentos sociais é uma das \npossibilidades no campo das disputas do \ncurrículo. \n( ) O currículo escolar é neutro e livre de conflitos \nideológicos ou políticos. \n \nAssinale a alternativa correta: \n(A) V – V – F \n(B) F – V – V \n(C) V – F – F \n(D) F – F – V \n(E) V – F – V", "source": "Potim · Diretor de Escola", "p": 8, "role": "both", "preferred": "DIR", "fallback": false, "author": "Miguel Arroyo", "secondary": []}, {"id": "POT26-DIR-Q30", "n": 30, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "B", "img": "img/POT26-DIR-Q30.webp", "pages": ["img/POT26-DIR-p8.webp"], "base": null, "text": "QUESTÃO 30 \nA educação inclusiva propõe uma nova forma de \ncompreender o papel da escola e da sociedade. \nAnalise as afirmativas abaixo. \nI. A educação inclusiva constitui um paradigma \neducacional fundamentado na concepção de \ndireitos humanos. \nII. Esse paradigma conjuga igualdade e diferença \ncomo valores indissociáveis. \nIII. A inclusão escolar limita-se à adaptação \ncurricular e não envolve mudança estrutural ou \ncultural da escola. \nAssinale a alternativa correta. \n(A) I, II e III estão corretas. \n(B) Apenas I e II estão corretas. \n(C) Apenas II e III estão corretas. \n(D) Apenas I e III estão corretas. \n(E) Apenas I está correta.", "source": "Potim · Diretor de Escola", "p": 8, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q31", "n": 31, "area": "CE", "eixo": "CE15", "topic": "Tecnologias educacionais", "key": "B", "img": "img/POT26-DIR-Q31.webp", "pages": ["img/POT26-DIR-p9.webp"], "base": null, "text": "QUESTÃO 31 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que preenche \ncorretamente a lacuna: \nAs tecnologias digitais desafiam as instituições a \nsair do ensino tradicional, em que o professor é o \ncentro, \npara \numa \naprendizagem \nmais \n__________ e integrada, com \nmomentos \npresenciais e outros a distância. \n \n(A) fragmentada \n(B) participativa \n(C) hierárquica \n(D) espiritual \n(E) geográfica", "source": "Potim · Diretor de Escola", "p": 9, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q32", "n": 32, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "C", "img": "img/POT26-DIR-Q32.webp", "pages": ["img/POT26-DIR-p9.webp"], "base": null, "text": "QUESTÃO 32 \nA construção do conhecimento na escola resulta \nda interação entre diferentes sujeitos e condições \nque \ntornam \no \nprocesso \neducativo \nmais \nsignificativo. Sobre esse tema, analise as \nasserções a seguir e assinale a alternativa correta. \nI – Construir a qualidade social da educação \npressupõe \ncompreender \nos \ninteresses \nda \ncomunidade escolar e promover o cuidado e a \naprendizagem de forma integrada, articulando \nprincípios, finalidades, objetivos e concepções \ncurriculares. \nEssa \nconstrução \nenvolve \na \nparticipação de todos os sujeitos da escola e o uso \nadequado dos espaços e recursos disponíveis. \nII – A qualidade social está restrita às práticas \npedagógicas, não abrangendo os aspectos físicos, \nmateriais \ne \nestruturais \nda \nescola. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Potim · Diretor de Escola", "p": 9, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q33", "n": 33, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "C", "img": "img/POT26-DIR-Q33.webp", "pages": ["img/POT26-DIR-p9.webp"], "base": null, "text": "QUESTÃO 33 \nPaulo Freire destaca que a curiosidade pode ser \nexercida de modo crítico ou de forma \n“domesticada”. De acordo com essa ideia, o que \nocorre quando a curiosidade é “domesticada”? \nAssinale a alternativa correta. \n(A) O aluno aprende de forma crítica e \nconsciente. \n(B) \nO \nprofessor \npromove \na \nautonomia \nintelectual. \n(C) \nO \nprocesso \nde \nensino \nlimita-se \nà \nmemorização mecânica. \n(D) O conhecimento é construído de maneira \ncolaborativa. \n(E) O pensamento reflexivo se fortalece.", "source": "Potim · Diretor de Escola", "p": 9, "role": "both", "preferred": "DIR", "fallback": false, "author": "Paulo Freire", "secondary": []}, {"id": "POT26-DIR-Q34", "n": 34, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "C", "img": "img/POT26-DIR-Q34.webp", "pages": ["img/POT26-DIR-p9.webp"], "base": null, "text": "QUESTÃO 34 \nNo contexto escolar, o cuidar envolve princípios \nque orientam a convivência humana e a forma de \nestar no mundo. Sobre este tema, assinale a \nalternativa correta. \n(A) O cuidado é uma função técnica e \nadministrativa, restrita à gestão escolar. \n(B) O cuidado se limita ao cumprimento de \nprocedimentos pedagógicos e de segurança. \n(C) O valor do cuidado no cotidiano escolar está \nfundamentado na ética e na estética, que rege a \nconvivência do indivíduo no coletivo, que \npressupõe \nrelações \nde \ncooperação \ne \nsolidariedade, de respeito à alteridade e à \nliberdade. \n(D) O cuidado diz respeito apenas à preservação \nambiental e à sustentabilidade. \n(E) O cuidado é uma prática isolada, voltada \nexclusivamente às relações interpessoais.", "source": "Potim · Diretor de Escola", "p": 9, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q35", "n": 35, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "B", "img": "img/POT26-DIR-Q35.webp", "pages": ["img/POT26-DIR-p10.webp"], "base": null, "text": "QUESTÃO 35 \nComplete corretamente a lacuna de acordo com \no pensamento de Luckesi: \nO ato de examinar se caracteriza pela \nclassificação e seletividade, enquanto o ato de \navaliar \nse \ncaracteriza \npelo \nseu \ncaráter \n__________ e pela inclusão. \n(A) examinatório \n(B) diagnóstico \n(C) punitivo \n(D) quantitativo \n(E) seletivo", "source": "Potim · Diretor de Escola", "p": 10, "role": "both", "preferred": "DIR", "fallback": false, "author": "Cipriano Luckesi", "secondary": []}, {"id": "POT26-DIR-Q36", "n": 36, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "C", "img": "img/POT26-DIR-Q36.webp", "pages": ["img/POT26-DIR-p10.webp"], "base": null, "text": "QUESTÃO 36 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que completa \ncorretamente a lacuna: \nO professor deve saber orientar, avaliar e \nelaborar \npropostas, \nisto \né, \ninterpretar \ne \n__________ o conhecimento. \n(A) ignorar \n(B) desconsiderar \n(C) reconstruir \n(D) decorar \n(E) repetir", "source": "Potim · Diretor de Escola", "p": 10, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q37", "n": 37, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "B", "img": "img/POT26-DIR-Q37.webp", "pages": ["img/POT26-DIR-p10.webp"], "base": null, "text": "QUESTÃO 37 \nObserve o enunciado abaixo e assinale a \nalternativa que completa corretamente a lacuna: \nO contexto __________ das escolas é o fator \nmais importante para análise de resultados \neducacionais. \n \n(A) espiritual \n(B) socioeconômico \n(C) classificatório \n(D) tecnológico \n(E) disciplinar", "source": "Potim · Diretor de Escola", "p": 10, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q38", "n": 38, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "E", "img": "img/POT26-DIR-Q38.webp", "pages": ["img/POT26-DIR-p10.webp"], "base": null, "text": "QUESTÃO 38 \nA \ngestão \ndemocrática \né \num \nprincípio \nfundamental da educação. Analise as afirmativas \na seguir e marque-as como verdadeiras (V) ou \nfalsas (F). \n( ) A gestão democrática se fundamenta em \nquatro elementos: participação, pluralismo, \nautonomia e transparência. \n( ) A gestão democrática ocorre de forma \nautoritária, com decisões centralizadas apenas na \ndireção escolar. \n( ) A gestão democrática na escola e nos sistemas \nde ensino torna-se um processo de construção da \ncidadania emancipada. \n \nAssinale a alternativa correta. \n(A) V – F – F \n(B) V – V – F \n(C) F – V – F \n(D) F – F – V \n(E) V – F – V", "source": "Potim · Diretor de Escola", "p": 10, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q40", "n": 40, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "B", "img": "img/POT26-DIR-Q40.webp", "pages": ["img/POT26-DIR-p11.webp"], "base": null, "text": "QUESTÃO 40 \nA LDB define as incumbências dos Municípios \nna organização da educação nacional. Analise as \nafirmativas a seguir. \nI. Cabe aos Municípios organizar, manter e \ndesenvolver os órgãos e instituições oficiais dos \nseus sistemas de ensino, integrando-os às \npolíticas e planos educacionais da União e dos \nEstados. \nII. Os Municípios devem oferecer a educação \ninfantil em creches e pré-escolas, e, com \nprioridade, o ensino fundamental, permitida a \natuação em outros níveis de ensino somente \nquando estiverem atendidas plenamente as \nnecessidades de sua área de competência e com \nrecursos \nacima \ndos \npercentuais \nmínimos \nvinculados \npela \nConstituição \nFederal \nà \nmanutenção e desenvolvimento do ensino. \nIII. É de responsabilidade exclusiva do Governo \nFederal o transporte escolar dos alunos da rede \nmunicipal. \nAssinale a alternativa correta. \n(A) I, II e III estão corretas. \n(B) Apenas I e II estão corretas. \n(C) Apenas II e III estão corretas. \n(D) Apenas I e III estão corretas. \n(E) Apenas I está correta.", "source": "Potim · Diretor de Escola", "p": 11, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q41", "n": 41, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "E", "img": "img/POT26-DIR-Q41.webp", "pages": ["img/POT26-DIR-p11.webp"], "base": null, "text": "QUESTÃO 41 \nA Educação em Direitos Humanos busca \npromover a mudança e a transformação social. \nSobre seus princípios, assinale a alternativa \ncorreta. \n(A) A dignidade humana é um princípio \nsecundário, voltado apenas a questões legais e \nadministrativas. \n(B) O respeito à dignidade humana é restrito aos \ngrupos majoritários da sociedade. \n(C) A dignidade humana está relacionada apenas \nà igualdade econômica entre os cidadãos. \n(D) A Educação em Direitos Humanos \nfundamenta-se \nexclusivamente \nem \nvalores \nreligiosos. \n(E) O princípio da dignidade humana considera \nos diálogos interculturais e a efetiva promoção de \ndireitos que garantam às pessoas viverem de \nacordo com seus pressupostos de dignidade.", "source": "Potim · Diretor de Escola", "p": 11, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q42", "n": 42, "area": "CE", "eixo": "LEG_ECA", "topic": "ECA", "key": "C", "img": "img/POT26-DIR-Q42.webp", "pages": ["img/POT26-DIR-p11.webp"], "base": null, "text": "QUESTÃO 42 \nA educação é um direito fundamental assegurado \na todas as crianças e adolescentes. Sobre esse \ndireito, analise as asserções a seguir e assinale a \nalternativa correta. \nI – A criança e o adolescente têm direito à \neducação, visando ao pleno desenvolvimento de \nsua pessoa, preparo para o exercício da cidadania \ne qualificação para o trabalho. \nII – O direito à educação é garantido apenas às \ncrianças matriculadas em escolas particulares, \nconforme previsto no Estatuto da Criança e do \nAdolescente. \n(A) As asserções I e II são proposições \nverdadeiras, e a II complementa a I. \n(B) As asserções I e II são proposições \nverdadeiras, mas a II não complementa a I. \n(C) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(D) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(E) As asserções I e II são proposições falsas.", "source": "Potim · Diretor de Escola", "p": 11, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q44", "n": 44, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "B", "img": "img/POT26-DIR-Q44.webp", "pages": ["img/POT26-DIR-p12.webp"], "base": null, "text": "QUESTÃO 44 \nA Constituição Federal de 1988 estabelece \nprincípios fundamentais para a organização do \nensino no país. Sobre este tema, assinale a \nalternativa correta. \n(A) O ensino fundamental deve priorizar apenas \nconteúdos \ntécnicos \ne \ncientíficos, \ndesconsiderando aspectos culturais. \n(B) \nOs \nconteúdos \nmínimos \ndo \nensino \nfundamental devem assegurar formação básica \ncomum e respeito aos valores culturais e \nartísticos, nacionais e regionais. \n(C) O ensino religioso não tem matrícula \nfacultativa, de acordo com a Constituição \nFederal. \n(D) O ensino fundamental não precisa seguir \nparâmetros nacionais, apenas locais. \n(E) A Constituição não menciona a inclusão do \nensino religioso como disciplina nas escolas \npúblicas.", "source": "Potim · Diretor de Escola", "p": 12, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q45", "n": 45, "area": "CE", "eixo": "LEG_BNCC", "topic": "BNCC", "key": "B", "img": "img/POT26-DIR-Q45.webp", "pages": ["img/POT26-DIR-p12.webp"], "base": null, "text": "QUESTÃO 45 \nObserve o enunciado abaixo e assinale a \nalternativa que completa corretamente a lacuna: \n \nA Base Nacional Comum Curricular (BNCC) é \num documento de caráter __________ que define \no \nconjunto \norgânico \ne \nprogressivo \nde \naprendizagens essenciais que todos os alunos \ndevem desenvolver ao longo das etapas e \nmodalidades da Educação Básica \n \n(A) opcional \n(B) normativo \n(C) ilustrativo \n(D) experimental \n(E) geográfico", "source": "Potim · Diretor de Escola", "p": 12, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q47", "n": 47, "area": "CE", "eixo": "LEG_13722", "topic": "Lei Lucas", "key": "C", "img": "img/POT26-DIR-Q47.webp", "pages": ["img/POT26-DIR-p12.webp"], "base": null, "text": "QUESTÃO 47 \nA Lei nº 13.722/2018 aborda a capacitação em \nnoções básicas de primeiros socorros para \nprofessores e funcionários da educação básica. \nSobre o que determina essa lei, assinale a \nalternativa correta. \n(A) A capacitação em primeiros socorros deve \nser oferecida apenas a professores de escolas \nprivadas. \n(B) Apenas profissionais da área da saúde podem \nfrequentar os cursos de primeiros socorros. \n(C) Os cursos de primeiros socorros têm por \nobjetivo capacitar os professores e funcionários \npara identificar e agir preventivamente em \nsituações de emergência e urgência médicas, até \nque o suporte médico especializado, local ou \nremoto, se torne possível. \n(D) A lei estabelece que a capacitação deve \nocorrer exclusivamente em hospitais e centros de \nsaúde. \n(E) A capacitação em primeiros socorros é \nfacultativa e depende da autorização dos pais dos \nalunos.", "source": "Potim · Diretor de Escola", "p": 12, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q48", "n": 48, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "A", "img": "img/POT26-DIR-Q48.webp", "pages": ["img/POT26-DIR-p13.webp"], "base": null, "text": "QUESTÃO 48 \nSobre o clima escolar, analise as afirmativas a \nseguir. \nI. À medida que descobre mais de si e do outro, \no sujeito compartilha saberes com o grupo, \nestreita as relações de amizade, mostra-se \nfavorável a discutir amplamente atitudes que vão \nrepercutir para o bom clima escolar e, \nconsequentemente, para a redução da violência e \na revalorização da educação. \nII. As relações interpessoais na escola devem \nlimitar-se às atividades formais de ensino e \naprendizagem. \nIII. A construção de vínculos e amizades entre os \nsujeitos prejudica a convivência e o respeito \nmútuo. \nAssinale a alternativa correta. \n(A) Apenas I está correta. \n(B) Apenas II está correta. \n(C) Apenas III está correta. \n(D) Apenas I e II estão corretas. \n(E) Apenas I e III estão corretas.", "source": "Potim · Diretor de Escola", "p": 13, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q49", "n": 49, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "A", "img": "img/POT26-DIR-Q49.webp", "pages": ["img/POT26-DIR-p13.webp"], "base": null, "text": "QUESTÃO 49 \nA gestão democrática pressupõe a participação e \no trabalho coletivo na escola. Analise as \nafirmativas \na seguir e marque-as \ncomo \nverdadeiras (V) ou falsas (F). \n( ) O Conselho Escolar é um órgão colegiado que \nrepresenta a comunidade escolar e local, atuando \nem sintonia com a administração da escola. \n( ) O Conselho Escolar deve limitar-se às \ndecisões financeiras, sem interferir em aspectos \npedagógicos. \n( ) A gestão democrática dispensa a participação \nda comunidade, pois as decisões cabem apenas à \ndireção da escola. \nAssinale a alternativa correta. \n(A) V – F – F \n(B) F – V – F \n(C) F – F – V \n(D) F – V – V \n(E) V – V – F", "source": "Potim · Diretor de Escola", "p": 13, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-DIR-Q50", "n": 50, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "C", "img": "img/POT26-DIR-Q50.webp", "pages": ["img/POT26-DIR-p13.webp"], "base": null, "text": "QUESTÃO 50 \nA Lei de Diretrizes e Bases da Educação \nNacional (LDB) define os diferentes contextos \nem que a educação se desenvolve. Sobre esse \ntema, assinale a alternativa correta. \n(A) A educação ocorre exclusivamente nas \ninstituições escolares, sem relação com outras \ndimensões da vida social. \n(B) A LDB reconhece que os processos \nformativos se desenvolvem apenas nas escolas \npúblicas e privadas. \n(C) A educação abrange os processos formativos \nque se desenvolvem na vida familiar, na \nconvivência \nhumana, \nno \ntrabalho, \nnas \ninstituições \nde \nensino \ne \npesquisa, \nnos \nmovimentos sociais e organizações da sociedade \ncivil e nas manifestações culturais. \n(D) O trabalho e a convivência humana não são \nconsiderados espaços de formação na LDB. \n(E) A educação é restrita aos processos formais \nde ensino e pesquisa científica.", "source": "Potim · Diretor de Escola", "p": 13, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "A", "img": "img/POT26-SUP-Q01.webp", "pages": ["img/POT26-SUP-p2.webp"], "base": "POT26-SUP-T1", "text": "QUESTÃO 01 \nNo texto “Um grande passo para a humanidade”, \no autor demonstra: \n(A) empolgação diante de um feito histórico. \n(B) desmotivação diante da nova corrida \nespacial. \n(C) pouco caso sobre as novas gerações. \n(D) preocupação com as viagens espaciais. \n(E) falta de interesse sobre o assunto de \nexploração espacial.", "source": "Potim · Supervisor de Ensino", "p": 2, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q02", "n": 2, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "E", "img": "img/POT26-SUP-Q02.webp", "pages": ["img/POT26-SUP-p2.webp"], "base": "POT26-SUP-T1", "text": "QUESTÃO 02 \nO autor do texto “Um grande passo para a \nhumanidade” apresenta as ideias na forma de: \n(A) repasse de experiências e vivências tidas por \numa outra pessoa. \n(B) organização de ideias sobre um assunto que \nele não acompanha muito. \n(C) documentário técnico e científico, com \ninformações que poucas pessoas conseguem \nacompanhar. \n(D) desvalorização da capacidade tecnológica do \nhomem. \n(E) depoimento pessoal, com base em suas \npróprias experiências e vivências.", "source": "Potim · Supervisor de Ensino", "p": 2, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q03", "n": 3, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "D", "img": "img/POT26-SUP-Q03.webp", "pages": ["img/POT26-SUP-p2.webp"], "base": "POT26-SUP-T1", "text": "QUESTÃO 03 \n“Num dia de julho o homem rompeu a cadeia \nque o prendia à Terra desde o começo da nossa \nhistória” \nA palavra destacada no trecho acima é sinônima \nde: \n(A) “manteve”. \n(B) “confirmou”. \n(C) “continuou”. \n(D) “quebrou”. \n(E) “afirmou”.", "source": "Potim · Supervisor de Ensino", "p": 2, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q04", "n": 4, "area": "LP", "eixo": "LP04", "topic": "Ortografia e acentuação", "key": "B", "img": "img/POT26-SUP-Q04.webp", "pages": ["img/POT26-SUP-p3.webp"], "base": null, "text": "QUESTÃO 04 \nAssinale a alternativa em que todas as palavras \natendem corretamente às normas de grafia \nvigentes em Língua Portuguesa. \n(A) O seu texto contém vários ítens que não são \naceitáveis dentro do nosso padrão. \n(B) O voo dos pássaros e das máquinas é um \nfascínio para a humanidade. \n(C) Por favor, entregue-me o ofício para que eu \npossa colocar a minha rúbrica. \n(D) Não tenha atitudes tão exarcebadas diante de \ntão pouca coisa. \n(E) Gostaria de apresentar-lhe as idéias que tenho \npara o novo projeto da empresa.", "source": "Potim · Supervisor de Ensino", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q05", "n": 5, "area": "LP", "eixo": "LP11", "topic": "Crase", "key": "C", "img": "img/POT26-SUP-Q05.webp", "pages": ["img/POT26-SUP-p3.webp"], "base": null, "text": "QUESTÃO 05 \nAssinale a alternativa cuja frase se encontra \ntotalmente correta em relação ao emprego do \nacento grave indicador de crase. \n(A) Quero dizer à todos o quanto estou feliz por \nassumir uma nova função. \n(B) Eles acabaram ficando face à face com os \nnovos problemas da firma. \n(C) Todos vocês acabaram ficando à procura de \nproblemas onde não existiam. \n(D) Fiz referência à tudo que estava me \nincomodando nos últimos dias. \n(E) Há muitos anos que não viajo à Brasília para \nvisitar meus parentes.", "source": "Potim · Supervisor de Ensino", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q06", "n": 6, "area": "LP", "eixo": "LP08", "topic": "Sintaxe", "key": "A", "img": "img/POT26-SUP-Q06.webp", "pages": ["img/POT26-SUP-p3.webp"], "base": null, "text": "QUESTÃO 06 \nAssinale a alternativa que apresenta uma oração \ncom um verbo de ligação, estabelecendo um elo \nentre o sujeito e seu predicativo. \n(A) Você acabou se tornando o inimigo número \num no combate à dengue. \n(B) Preciso de todas as coisas em seu devido \nlugar. \n(C) Quero um compromisso sério com o trabalho \ne o desenvolvimento da empresa.  \n(D) Nunca me referi a uma situação tão \nextravagante assim. \n(E) Jamais me disseram aquelas palavras duras e \ncruéis.", "source": "Potim · Supervisor de Ensino", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q07", "n": 7, "area": "LP", "eixo": "LP07", "topic": "Concordância", "key": "C", "img": "img/POT26-SUP-Q07.webp", "pages": ["img/POT26-SUP-p3.webp"], "base": null, "text": "QUESTÃO 07 \nAssinale a alternativa cuja frase se encontra \ncorreta em relação à concordância verbal. \n(A) Haviam inúmeros problemas a serem \nsolucionados naquela gestão. \n(B) Existia muitos casos ainda sem solução até \naquele momento. \n(C) Havia muitas pessoas interessadas na compra \ndo produto. \n(D) Houveram pessoas que desafiaram a própria \nlógica das coisas. \n(E) Existe muitos processos atrasados no sistema \njudiciário.", "source": "Potim · Supervisor de Ensino", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q08", "n": 8, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "B", "img": "img/POT26-SUP-Q08.webp", "pages": ["img/POT26-SUP-p3.webp"], "base": null, "text": "QUESTÃO 08 \n \nA placa acima expressa o sentido de ordem ou \npedido, empregando a forma verbal no: \n(A) gerúndio. \n(B) infinitivo. \n(C) particípio. \n(D) imperativo negativo. \n(E) imperativo afirmativo.", "source": "Potim · Supervisor de Ensino", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q09", "n": 9, "area": "LP", "eixo": "LP07", "topic": "Concordância", "key": "D", "img": "img/POT26-SUP-Q09.webp", "pages": ["img/POT26-SUP-p4.webp"], "base": null, "text": "QUESTÃO 09 \nAssinale \na \nalternativa \nque \nse \napresenta \ntotalmente correta, de acordo com as normas da \nredação técnica oficial e da gramática padrão da \nLíngua Portuguesa. \n(A) Seguem anexo todos os documentos que \nforam escaneados. \n(B) As fotos necessárias para o processo seguem \nanexo ao formulário. \n(C) As provas anexa serão encaminhadas ainda \nhoje. \n(D) Seguem anexas as documentações que foram \nsolicitadas por e-mail. \n(E) Você me solicitou os comprovantes anexo ao \ndocumento da Diretoria.", "source": "Potim · Supervisor de Ensino", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q10", "n": 10, "area": "LP", "eixo": "LP13", "topic": "Redação oficial", "key": "E", "img": "img/POT26-SUP-Q10.webp", "pages": ["img/POT26-SUP-p4.webp"], "base": null, "text": "QUESTÃO 10 \nAssinale a alternativa que apresenta o nome do \ndocumento da redação técnica oficial que tem \ncomo função transferir direitos de uma pessoa \npara outra, para assinar em nome da primeira. \n(A) Atestado \n(B) Ofício \n(C) Memorando \n(D) Relatório \n(E) Procuração \n \nMATEMÁTICA E RACIOCÍNIO LÓGICO", "source": "Potim · Supervisor de Ensino", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q11", "n": 11, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "E", "img": "img/POT26-SUP-Q11.webp", "pages": ["img/POT26-SUP-p4.webp"], "base": null, "text": "QUESTÃO 11 \nGarcia fez uma pesquisa recentemente e \nidentificou que o preço de um determinado \nproduto sofreu um aumento de 15% e, em um \nintervalo de uma semana, passou por um novo \naumento, no qual seu valor triplicou em relação \nao valor inicial. \nNesse contexto, qual é o valor final (após o \nsegundo aumento) expresso em porcentagem do \nvalor após o primeiro aumento? \nAssinale a alternativa que indica a resposta \ncorreta. \n(A) 300% \n(B) 200% \n(C) 230% \n(D) 245,87% \n(E) 260,87%", "source": "Potim · Supervisor de Ensino", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q13", "n": 13, "area": "MRL", "eixo": "MRL02", "topic": "MMC e MDC", "key": "B", "img": "img/POT26-SUP-Q13.webp", "pages": ["img/POT26-SUP-p4.webp"], "base": null, "text": "QUESTÃO 13 \nDurante as apresentações dos Trabalhos de \nConclusão de Curso (TCC) do curso de Gestão \nde Negócios da Universidade Alfa, o professor \nresponsável organizou os grupos em ciclos \nregulares, cada um em uma sala diferente. O \ngrupo A apresenta seu projeto a cada 15 minutos, \no grupo B a cada 30 minutos e o grupo C a cada \n60 minutos. Todos iniciaram suas apresentações \nsimultaneamente às 9h da manhã. \nAssinale a alternativa que indica o horário em \nque os três grupos voltarão a se apresentar ao \nmesmo tempo pela primeira vez: \n(A) 9h30 \n(B) 10h00 \n(C) 10h30 \n(D) 11h00 \n(E) 11h30", "source": "Potim · Supervisor de Ensino", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q14", "n": 14, "area": "MRL", "eixo": "MRL06", "topic": "Médias", "key": "C", "img": "img/POT26-SUP-Q14.webp", "pages": ["img/POT26-SUP-p5.webp"], "base": null, "text": "QUESTÃO 14 \nDurante uma análise do saldo de gols de um \ndeterminado time do Campeonato Brasileiro, um \nrepórter divulgou que os gols pró (gols a favor) do \nlíder do campeonato, nas últimas seis rodadas, foram: \n2 – 4 – 0 – 2 – 1– 3 \nCom base nesses dados, qual é a média simples \nde gols desse time por jogo?  \nAssinale a alternativa correta. \n(A) 1 gol \n(B) 1,5 gols \n(C) 2 gols \n(D) 2,5 gols \n(E) 3,0 gols", "source": "Potim · Supervisor de Ensino", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q15", "n": 15, "area": "MRL", "eixo": "MRL05", "topic": "Regra de três", "key": "D", "img": "img/POT26-SUP-Q15.webp", "pages": ["img/POT26-SUP-p5.webp"], "base": null, "text": "QUESTÃO 15 \nRejane decidiu preparar waffles para um café da \nmanhã especial. Ela se lembrou da receita que viu \nem um programa de culinária, onde o chef \nexplicou que, para fazer 120 waffles, eram \nnecessários 2 litros de leite e 1,2 kg de farinha. \nAo verificar sua despensa, Lívia percebeu que \ntinha apenas 800 mL de leite e 600 g de farinha. \nMantendo a proporção da receita original, qual é \no maior número de waffles que Lívia conseguirá \npreparar com os ingredientes disponíveis? \nAssinale a alternativa correta: \n(A) 80 \n(B) 72 \n(C) 60 \n(D) 48 \n(E) 40", "source": "Potim · Supervisor de Ensino", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q16", "n": 16, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "A", "img": "img/POT26-SUP-Q16.webp", "pages": ["img/POT26-SUP-p5.webp"], "base": null, "text": "QUESTÃO 16 \nDevanir aplicou 50 mil reais, sendo 10 mil reais \nnuma caderneta de poupança e 40 mil reais em \nações.  \nNesse contexto, qual é a razão entre o valor \naplicado em ações e o valor aplicado em \ncaderneta? Assinale a resposta correta. \n(A) 4:1 \n(B) 1:4 \n(C) 5:4 \n(D) 1:5 \n(E) 4:5", "source": "Potim · Supervisor de Ensino", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q17", "n": 17, "area": "MRL", "eixo": "MRL01", "topic": "Números e operações", "key": "C", "img": "img/POT26-SUP-Q17.webp", "pages": ["img/POT26-SUP-p5.webp"], "base": null, "text": "QUESTÃO 17 \nConsidere a seguinte operação: \n𝑦= 8,333333 …\n5\n3\n \nSabendo que o número decimal 8,3333333… \npertence ao conjunto dos racionais e pode ser \nrepresentado por uma fração, reescreva a \noperação utilizando frações e calcule o valor de \ny. \nAssinale a alternativa correta: \n(A) 𝑦= \n42\n3  \n(B) 𝑦=\n1\n5 \n(C) 𝑦= 5 \n(D) 𝑦= 4,8 \n(E) 𝑦=\n41\n3", "source": "Potim · Supervisor de Ensino", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q18", "n": 18, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "C", "img": "img/POT26-SUP-Q18.webp", "pages": ["img/POT26-SUP-p6.webp"], "base": null, "text": "QUESTÃO 18 \nConsidere o triângulo retângulo abaixo: \n \nSabendo que o lado b mede 4 unidades e que o \nlado a corresponde a 75% do valor de b, qual será \no comprimento da diagonal c? \nAssinale a resposta correta. \n(A) 3 \n(B) 4 \n(C) 5 \n(D) 6 \n(E) 7", "source": "Potim · Supervisor de Ensino", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": ["Porcentagem"]}, {"id": "POT26-SUP-Q19", "n": 19, "area": "MRL", "eixo": "MRL07", "topic": "Juros simples", "key": "B", "img": "img/POT26-SUP-Q19.webp", "pages": ["img/POT26-SUP-p6.webp"], "base": null, "text": "QUESTÃO 19 \nZuleide começou a fazer renda extra vendendo \nbolos caseiros e, com os lucros acumulados, \ndecidiu aplicar um capital de R$ 5.000,00 em \numa modalidade de investimento com juros \nsimples, à taxa de 3% ao mês, durante 6 meses. \nAssinale a alternativa que indica o valor total dos \njuros gerados ao final desse período. \n(A) R$ 700,00 \n(B) R$ 900,00 \n(C) R$ 1.000,00 \n(D) R$ 1.200,00 \n(E) R$ 1.500,00", "source": "Potim · Supervisor de Ensino", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q20", "n": 20, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "C", "img": "img/POT26-SUP-Q20.webp", "pages": ["img/POT26-SUP-p6.webp"], "base": null, "text": "QUESTÃO 20 \nJuvenal está assistindo seu podcast favorito sobre \nfinanças pessoais e gostou de um trecho em que \no apresentador afirma que o ideal é que os gastos \nessenciais representem, no máximo, 70% do \nsalário. \nAtualmente, Juvenal compromete 84% de sua \nrenda mensal com gastos essenciais. Sem alterar \nseus gastos atuais, para que esses gastos passem \na representar exatamente 70% de seu salário, ele \nprecisaria receber um aumento mínimo, em \nrelação ao salário atual, de ____. \nAssinale a alternativa correta que completa a \nlacuna acima. \n(A) 10% \n(B) 15% \n(C) 20% \n(D) 25% \n(E) 30%  \n \nNOÇÕES DE INFORMÁTICA", "source": "Potim · Supervisor de Ensino", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q21", "n": 21, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "D", "img": "img/POT26-SUP-Q21.webp", "pages": ["img/POT26-SUP-p6.webp"], "base": null, "text": "NOÇÕES DE INFORMÁTICA \nQUESTÃO 21 \nAssinale a alternativa que apresenta uma \nafirmação correta sobre a área de trabalho no \nsistema operacional Windows:  \n(A) A área de trabalho do Windows não permite \nnenhuma personalização por parte do usuário. \n(B) Somente o usuário administrador pode \nadicionar atalhos e arquivos na área de trabalho. \n(C) A área de trabalho do Windows permite \napenas a criação de atalhos de programas, não \nsendo possível inserir pastas ou arquivos. \n(D) Um mesmo usuário pode configurar \ndiferentes áreas de trabalho de acordo com suas \npreferências. \n(E) O único atalho nativo presente na área de \ntrabalho é o Gerenciador de Dispositivos.", "source": "Potim · Supervisor de Ensino", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q22", "n": 22, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "A", "img": "img/POT26-SUP-Q22.webp", "pages": ["img/POT26-SUP-p7.webp"], "base": null, "text": "QUESTÃO 22 \nO aplicativo Bloco de Notas do sistema \noperacional Windows é classificado como: \n(A) Um editor de textos. \n(B) Um conversor de unidades. \n(C) Uma calculadora eletrônica. \n(D) Um antivírus. \n(E) Um dispositivo de rastreamento.", "source": "Potim · Supervisor de Ensino", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q23", "n": 23, "area": "INF", "eixo": "INF02", "topic": "Word", "key": "E", "img": "img/POT26-SUP-Q23.webp", "pages": ["img/POT26-SUP-p7.webp"], "base": null, "text": "QUESTÃO 23 \nAo redigir textos utilizando o Microsoft Word no \nsistema operacional Windows, a caixa de diálogo \n“Fonte”, que permite configurar tamanho, estilo \ne tipo de letra, está localizada na guia:  \n(A) Correspondências. \n(B) Referências. \n(C) Catalogação. \n(D) Dicionário. \n(E) Página Inicial.", "source": "Potim · Supervisor de Ensino", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q24", "n": 24, "area": "INF", "eixo": "INF03", "topic": "Excel", "key": "A", "img": "img/POT26-SUP-Q24.webp", "pages": ["img/POT26-SUP-p7.webp"], "base": null, "text": "QUESTÃO 24 \nNo Microsoft Excel as células são referenciadas \npor sua localização na linha e na coluna da \nplanilha, portanto, a célula A1 fica na primeira \nlinha da coluna: \n(A) A \n(B) D \n(C) E \n(D) 0 \n(E) 2", "source": "Potim · Supervisor de Ensino", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q25", "n": 25, "area": "INF", "eixo": "INF05", "topic": "Correio eletrônico", "key": "C", "img": "img/POT26-SUP-Q25.webp", "pages": ["img/POT26-SUP-p7.webp"], "base": null, "text": "QUESTÃO 25 \nO correio eletrônico (e-mail) é o serviço básico \nde: \n(A) Impressão remota de documentos. \n(B) Armazenamento local de arquivos. \n(C) Comunicação na rede de internet. \n(D) Monitoramento de dispositivos móveis. \n(E) Execução de programas em segundo plano.", "source": "Potim · Supervisor de Ensino", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q26", "n": 26, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "E", "img": "img/POT26-SUP-Q26.webp", "pages": ["img/POT26-SUP-p7.webp"], "base": null, "text": "QUESTÃO 26 \nAssinale a alternativa que apresenta um princípio \ndo Parecer CNE/CEB 20/2009 (Revisão das \nDiretrizes Nacionais para a Educação Infantil) \ncorretamente definido. \n(A) \nPrincípios \néticos: \nvalorização \nda \nsensibilidade, da criatividade, da ludicidade e da \ndiversidade \nde \nmanifestações \nartísticas \ne \nculturais. \n(B) \nPrincípios \npolíticos: \nvalorização \nda \nsensibilidade, da criatividade, da ludicidade e da \ndiversidade \nde \nmanifestações \nartísticas \ne \nculturais. \n(C) \nPrincípios \npolíticos: \nvalorização \nda \nautonomia, da responsabilidade, da solidariedade \ne do respeito \n(D) Princípios estéticos: dos direitos de \ncidadania, do exercício da criticidade e do \nrespeito à ordem democrática. \n(E) Princípios éticos: valorização da autonomia, \nda responsabilidade, da solidariedade e do \nrespeito.", "source": "Potim · Supervisor de Ensino", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q27", "n": 27, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "B", "img": "img/POT26-SUP-Q27.webp", "pages": ["img/POT26-SUP-p7.webp"], "base": null, "text": "QUESTÃO 27 \nAnalise os itens a seguir com fundamento no \nartigo 14 da Lei de Diretrizes e Bases da \nEducação (Lei nº 9.394/1996). \nI. Lei dos respectivos Estados e Municípios e do \nDistrito Federal definirá as normas da gestão \ndemocrática do ensino público na educação \nbásica, de acordo com as suas peculiaridades e \nconforme o princípio da participação dos \nprofissionais da educação na elaboração do \nprojeto pedagógico da escola. \nII. Normas da gestão democrática do ensino \npúblico na educação básica deverão obedecer ao \nprincípio da participação das comunidades \nescolar e local nas reuniões de treinamento \npedagógico entre coordenadores e professores.     \nAssinale a alternativa correta: \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é uma justificativa da I. \n(D) As asserções I e II são proposições \nverdadeiras, mas a II não é uma justificativa da I. \n(E) As asserções I e II são proposições falsas.", "source": "Potim · Supervisor de Ensino", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q28", "n": 28, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "C", "img": "img/POT26-SUP-Q28.webp", "pages": ["img/POT26-SUP-p8.webp"], "base": null, "text": "QUESTÃO 28 \nAs Diretrizes Nacionais para a Educação em \nDireitos Humanos (Parecer CNE/CP 8/2012) \nestabelecem \nobjetivos \nque \norientam \no \nplanejamento e o desenvolvimento de diversas \nações da Educação em Direitos Humanos, \nadequando-os às necessidades, às características \nde seus sujeitos e ao contexto nos quais são \nefetivados. Analise os objetivos abaixo e \nclassifique-os em verdadeiro (V) ou falso (F).  \n(      ) Construção de sociedades que valorizem e \ndesenvolvam condições para a garantia da \ndignidade humana. \n(      ) Possibilidade de que a pessoa e/ou grupo \nsocial se reconheça como sujeito de direitos, \nainda que não seja capaz de exercê-los e \npromovê-los e sem necessidade de que reconheça \ne respeite os direitos do outro. \n(    ) Desenvolvimento da sensibilidade ética nas \nrelações interpessoais, em que cada indivíduo \nseja capaz de perceber o outro em sua condição \nhumana. \n(      ) Formação para a vida, no exercício dos \nDireitos Humanos, priorizando-se a organização \npolítica e econômica em detrimento da \norganização social e cultural. \nAssinale a alternativa correta. \n(A) V – F – F– F \n(B) V – V – F– F \n(C) V – F – V – F \n(D) F – F – F– V \n(E) F – F – F – F", "source": "Potim · Supervisor de Ensino", "p": 8, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q29", "n": 29, "area": "CE", "eixo": "LEG_13722", "topic": "Lei Lucas", "key": "A", "img": "img/POT26-SUP-Q29.webp", "pages": ["img/POT26-SUP-p8.webp"], "base": null, "text": "QUESTÃO 29 \nA Lei nº 13.722/2018 torna obrigatória a \ncapacitação em noções básicas de primeiros \nsocorros de professores e funcionários de \nestabelecimentos de ensino públicos e privados \nde educação básica e de estabelecimentos de \nrecreação infantil. A respeito dessa Lei, assinale \na alternativa correta. \n(A) Os estabelecimentos de ensino de educação \nbásica da rede pública, por meio dos respectivos \nsistemas de ensino, deverão capacitar professores \ne funcionários em noções de primeiros socorros. \n(B) Os estabelecimentos de ensino de educação \nbásica e de recreação infantil da rede privada não \nprecisarão capacitar professores em noções de \nprimeiros socorros, apenas os funcionários de \napoio à educação especializada. \n(C) O curso deverá ser ofertado a cada dez anos \ne destinar-se-á à capacitação e/ou à reciclagem de \nparte dos professores e funcionários dos \nestabelecimentos de ensino e recreação, ficando \no servidor em treinamento afastado por um mês \nde suas atividades ordinárias. \n(D) A quantidade de profissionais capacitados \nem cada estabelecimento de ensino ou de \nrecreação será sempre de um professor e um \nfuncionário \npara \ntoda \na \nescola \nindependentemente do tamanho do corpo de \nprofessores e funcionários ou do fluxo de \natendimento de crianças e adolescentes no \nestabelecimento. \n(E) A responsabilidade pela capacitação dos \nprofessores e funcionários dos estabelecimentos \npúblicos caberá exclusivamente ao coordenador.", "source": "Potim · Supervisor de Ensino", "p": 8, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q30", "n": 30, "area": "CE", "eixo": "LEG_12686", "topic": "Educação especial — Decreto 12.686/2025", "key": "D", "img": "img/POT26-SUP-Q30.webp", "pages": ["img/POT26-SUP-p9.webp"], "base": null, "text": "QUESTÃO 30 \nSão objetivos da Política Nacional de Educação \nEspecial Inclusiva, EXCETO: \n(A) Assegurar a existência de redes educacionais \ninclusivas em todos os níveis, etapas e \nmodalidades dos sistemas de ensino. \n(B) Garantir o acesso, a participação, a \npermanência e a aprendizagem dos estudantes \nque são o público da educação especial nos \nestabelecimentos de ensino, em classes comuns. \n(C) Assegurar o Atendimento Educacional \nEspecializado (AEE) em todos os níveis, etapas \ne modalidades de ensino. \n(D) Promover a aprendizagem somente na \neducação básica, até os níveis e as etapas de \nensino fundamental. \n(E) Garantir as adaptações razoáveis, nos \ndiferentes \nníveis, \netapas \ne \nmodalidades \neducacionais, \nconsideradas \nsuas \npolíticas \ncurriculares, avaliativas e de planejamento.", "source": "Potim · Supervisor de Ensino", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q31", "n": 31, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "B", "img": "img/POT26-SUP-Q31.webp", "pages": ["img/POT26-SUP-p9.webp"], "base": null, "text": "QUESTÃO 31 \nA gestão democrática representa um princípio \nimportante para a educação pública. Sobre esse \ntema, assinale a alternativa correta. \n(A) A adoção da gestão democrática é uma \nescolha facultativa dos gestores escolares. \n(B) A gestão democrática da educação é um \ndireito da sociedade e um dever do Poder \nPúblico. \n(C) A gestão democrática restringe-se às escolas \nprivadas que optarem por esse modelo. \n(D) A implementação da gestão democrática \ndepende apenas da vontade da comunidade \nescolar. \n(E) A gestão democrática não altera em nada o \ncontexto escolar.", "source": "Potim · Supervisor de Ensino", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q32", "n": 32, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "A", "img": "img/POT26-SUP-Q32.webp", "pages": ["img/POT26-SUP-p9.webp"], "base": null, "text": "QUESTÃO 32 \nO gestor escolar tem papel fundamental na \nmediação das relações e na prevenção de \nconflitos no ambiente educacional. Analise as \nafirmativas a seguir. \nI. O conflito emerge em toda situação em que se \ncompartilham espaços, atividades, normas e \nsistemas de poder e a escola é um deles. \nII. Cabe ao gestor resolver pessoalmente todos os \nconflitos, sem envolver os demais participantes. \nIII. A mediação do gestor deve ocorrer de forma \nautoritária, priorizando a imposição de decisões. \nAssinale a alternativa correta. \n(A) I apenas. \n(B) I e II apenas. \n(C) II e III apenas. \n(D) I e III apenas. \n(E) III apenas.", "source": "Potim · Supervisor de Ensino", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q33", "n": 33, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "B", "img": "img/POT26-SUP-Q33.webp", "pages": ["img/POT26-SUP-p9.webp"], "base": null, "text": "QUESTÃO 33 \nO desenvolvimento integral da criança e do \nadolescente depende de fundamentos que \norientem as práticas educativas. Sobre esse tema, \nassinale a alternativa correta. \n(A) O desenvolvimento integral da criança e do \nadolescente \nindepende \ndas \ncondições \nde \nliberdade e dignidade. \n(B) Não se pode pressupor um desenvolvimento \nintegral da criança e do adolescente, em \ncondições de liberdade e dignidade se não, de \nforma deliberada, se tomar esses valores como \nfundamentos basilares das práticas de cuidar e de \neducar. \n(C) A liberdade e a dignidade são valores \nsecundários nas práticas de ensino e cuidado \nescolar. \n(D) O cuidar e o educar são processos separados \ne não dependem de fundamentos éticos. \n(E) \nO \ndesenvolvimento \nintegral \nocorre \nnaturalmente, sem necessidade de valores \nformativos.", "source": "Potim · Supervisor de Ensino", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q34", "n": 34, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "A", "img": "img/POT26-SUP-Q34.webp", "pages": ["img/POT26-SUP-p10.webp"], "base": null, "text": "QUESTÃO 34 \nA escola tem papel essencial na construção de \numa educação inclusiva e na superação das \npráticas excludentes. Analise as afirmativas a \nseguir e marque-as como verdadeiras (V) ou \nfalsas (F). \n( ) A escola historicamente se caracterizou pela \nvisão da educação que delimita a escolarização \ncomo privilégio de um grupo, uma exclusão que \nfoi \nlegitimada \nnas \npolíticas \ne \npráticas \neducacionais reprodutoras da ordem social. \n( ) A democratização da educação eliminou \ncompletamente as formas de exclusão nos \nsistemas de ensino. \n( ) A partir do processo de democratização da \neducação \nse \nevidencia \no \nparadoxo \ninclusão/exclusão, quando os sistemas de ensino \nuniversalizam \no \nacesso, \nmas \ncontinuam \nexcluindo indivíduos e grupos considerados fora \ndos padrões homogeneizadores da escola. \n \nAssinale a alternativa correta: \n(A) V – F – V \n(B) V – V – F \n(C) F – V – V \n(D) F – F – V \n(E) V – F – F", "source": "Potim · Supervisor de Ensino", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q35", "n": 35, "area": "CE", "eixo": "CE07", "topic": "Didática e metodologias", "key": "B", "img": "img/POT26-SUP-Q35.webp", "pages": ["img/POT26-SUP-p10.webp"], "base": null, "text": "QUESTÃO 35 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que completa \ncorretamente a lacuna: \nPela \nabordagem \ninterdisciplinar \nocorre \na \ntransversalidade do conhecimento de diferentes \ndisciplinas, \npor \nmeio \nda \nação \ndidático-\npedagógica mediada pela __________ dos \nprojetos temáticos. \n(A) geografia \n(B) pedagogia \n(C) espiritualidade \n(D) classificação \n(E) fragmentação", "source": "Potim · Supervisor de Ensino", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q36", "n": 36, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "A", "img": "img/POT26-SUP-Q36.webp", "pages": ["img/POT26-SUP-p10.webp"], "base": null, "text": "QUESTÃO 36 \nA avaliação institucional é um processo que deve \ncontribuir para a melhoria da qualidade da \neducação. Analise as afirmativas a seguir e \nmarque-as como verdadeiras (V) ou falsas (F). \n( ) A discussão mais aprofundada da avaliação \ninstitucional articulada ao conhecimento da \nrealidade \ndos \ncontextos \nregionais \ne \nsocioculturais e da desigualdade das escolas \nbrasileiras deverá colaborar na superação da \nadoção dos resultados dessas avaliações como \nmedida punitiva aos docentes, tal como tem sido \nfeito, lamentavelmente, por algumas redes de \nensino. \n( ) Os resultados das avaliações institucionais \ndevem ser utilizados como forma de punição aos \ndocentes. \n( ) A expectativa é de que essa problematização \npossa fazer avançar, de fato, o direito à educação \ne à aprendizagem. \n \nAssinale a alternativa correta. \n(A) V – F – V \n(B) V – V – F \n(C) F – V – V \n(D) F – F – V \n(E) V – F – F", "source": "Potim · Supervisor de Ensino", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q37", "n": 37, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "B", "img": "img/POT26-SUP-Q37.webp", "pages": ["img/POT26-SUP-p10.webp"], "base": null, "text": "QUESTÃO 37 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que completa \ncorretamente a lacuna: \nO compromisso com a permanência do estudante \nna escola é um desafio a ser assumido por todos, \nporque, além das determinações sociopolíticas e \nculturais, das diferenças individuais e da \n__________ escolar vigente, há algo que supera \na política reguladora dos processos educacionais: \nhá os fluxos migratórios, além de outras variáveis \nque se refletem no processo educativo. \n \n(A) classificação \n(B) organização \n(C) disciplina \n(D) estrutura física \n(E) metodologia", "source": "Potim · Supervisor de Ensino", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q38", "n": 38, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "A", "img": "img/POT26-SUP-Q38.webp", "pages": ["img/POT26-SUP-p11.webp"], "base": null, "text": "QUESTÃO 38 \nA formação de professores é elemento essencial \npara a melhoria da qualidade da Educação Básica \ne para o fortalecimento das práticas pedagógicas. \nAnalise as asserções a seguir. \nI – As políticas de formação docente devem \npromover a formação de professores na \nperspectiva da educação integral, dos direitos \nhumanos, da sustentabilidade ambiental e das \nrelações étnico-raciais, com vistas à construção \nde um ambiente escolar inclusivo e cooperativo. \nII – A formação docente deve ocorrer de forma \nisolada, sem articulação com as instituições de \nensino superior ou com as necessidades das redes \npúblicas de ensino. \nAssinale a alternativa correta. \n(A) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(B) As asserções I e II são proposições \nverdadeiras, e a II complementa a I. \n(C) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Potim · Supervisor de Ensino", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q39", "n": 39, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "B", "img": "img/POT26-SUP-Q39.webp", "pages": ["img/POT26-SUP-p11.webp"], "base": null, "text": "QUESTÃO 39 \nO atendimento educacional especializado busca \ngarantir condições de aprendizagem a estudantes \ncom necessidades específicas. Assinale a \nalternativa que expressa corretamente essa \nconcepção de atendimento. \n \n(A) O AEE deve funcionar de forma isolada, sem \narticulação com a proposta pedagógica da escola \ncomum. \n(B) O atendimento educacional especializado \ndisponibiliza programas de enriquecimento \ncurricular, o ensino de linguagens e códigos \nespecíficos de comunicação e sinalização, ajudas \ntécnicas e tecnologia assistiva, dentre outros. \n(C) O AEE destina-se apenas a alunos com \ndificuldades temporárias de aprendizagem, sem \nnecessidade de recursos específicos. \n(D) O atendimento especializado deve substituir \ntotalmente o ensino regular, priorizando o \ntrabalho individualizado. \n(E) O AEE restringe-se ao uso de tecnologias \ndigitais e não envolve ações pedagógicas.", "source": "Potim · Supervisor de Ensino", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q40", "n": 40, "area": "CE", "eixo": "CE17", "topic": "Supervisão e assessoria", "key": "C", "img": "img/POT26-SUP-Q40.webp", "pages": ["img/POT26-SUP-p11.webp"], "base": null, "text": "QUESTÃO 40 \nA avaliação da Educação Básica está inserida em \num regime de colaboração entre os entes \nfederados. Analise as afirmativas a seguir. \nI. O regime de colaboração tem como finalidade \neliminar a autonomia dos sistemas de ensino, \npromovendo padronização nacional. \nII. O regime de colaboração desconsidera a \nautonomia d
