· Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q13", "n": 13, "area": "MRL", "eixo": "MRL10", "topic": "Medidas e conversões", "key": "C", "img": "img/CAI25-SUP-Q13.webp", "pages": ["img/CAI25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 13 \nUma calçada de extensão de 2 km será construída \nutilizando-se blocos de concreto de 10 cm de \nlargura, que serão instalados lado a lado. Quantos \nblocos serão necessários para construir a \ncalçada? \n(A) 200. \n(B) 2000. \n(C) 20.000. \n(D) 200.000. \n(E) 2.000.000.", "source": "Caieiras · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q14", "n": 14, "area": "MRL", "eixo": "MRL06", "topic": "Médias", "key": "D", "img": "img/CAI25-SUP-Q14.webp", "pages": ["img/CAI25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 14 \nEm uma prova, a média aritmética simples das \nnotas de uma turma com 30 alunos foi 6,8. Para \najudar os alunos, o professor decidiu aplicar uma \nprova complementar contendo uma única \nquestão. Aqueles que acertaram a questão dada \ntiveram sua nota acrescida de 1,0 ponto. Os que \nerraram, não pontuaram. O professor recalculou \na média e resultou em 7,6. Com isso, quantos \nalunos acertaram a questão complementar? \n(A) 18. \n(B) 20. \n(C) 22. \n(D) 24. \n(E) 28.", "source": "Caieiras · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q15", "n": 15, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "D", "img": "img/CAI25-SUP-Q15.webp", "pages": ["img/CAI25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 15 \nQual deve ser a altura, em metros, de um \nparalelepípedo que tem uma base quadrada de \nlado 80 cm para que seu volume seja 1 metro \ncúbico?  \n(A) 10/8 m. \n(B) 10/64 m. \n(C) 100/8 m. \n(D) 100/64 m. \n(E) 100/16 m.", "source": "Caieiras · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q16", "n": 16, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "C", "img": "img/CAI25-SUP-Q16.webp", "pages": ["img/CAI25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 16 \nA figura abaixo mostra um triângulo ABC e dois \npontos D e E sobre o segmento AB. O ponto D é \no ponto médio do segmento AB e o ponto E é o \nponto médio do segmento DB. \n \nSe a área do triângulo ABC é 16 cm2, então a área \ndo triângulo AEC é: \n(A) 15 cm2. \n(B) 13 cm2.  \n(C) 12 cm2. \n(D) 11 cm2. \n(E) 10 cm2.", "source": "Caieiras · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": ["Razão e proporção"]}, {"id": "CAI25-SUP-Q17", "n": 17, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "A", "img": "img/CAI25-SUP-Q17.webp", "pages": ["img/CAI25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 17 \nEstima-se que um atleta perca 3,5 kg de água por \nhora durante uma atividade física intensa. Além \ndisso, sabe-se que perdas de água maiores que \n5% do peso corporal já são suficientes para \nprovocar vômitos e náuseas. Nesta situação, \nquantas horas de atividade física intensa fariam \ncom que um atleta de 70 kg perdesse 5% do seu \npeso corporal? \n(A) 1,0. \n(B) 1,5. \n(C) 2,0. \n(D) 2,5. \n(E) 4,0.", "source": "Caieiras · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q18", "n": 18, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "E", "img": "img/CAI25-SUP-Q18.webp", "pages": ["img/CAI25-SUP-p6.webp"], "base": null, "text": "QUESTÃO 18 \nUm zoológico possui duas espécies de aves, chamadas de A e B. No total, há X aves, e a proporção \nentre a quantidade de aves da espécie A e da espécie B é de 5:7. Após um imprevisto, metade das aves \nda espécie A fugiu. Qual será a nova proporção entre as quantidades das espécies A e B após a fuga?   \n(A) 10/14. \n(B) 10/12. \n(C) 5/12. \n(D) 10/7. \n(E) 5/14.", "source": "Caieiras · Supervisor Pedagógico", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q20", "n": 20, "area": "MRL", "eixo": "MRL13", "topic": "Sequências", "key": "B", "img": "img/CAI25-SUP-Q20.webp", "pages": ["img/CAI25-SUP-p7.webp"], "base": null, "text": "QUESTÃO 20 \nObserve a seguinte sequência figural: \n \n \nPerceba que o 7° elemento é igual ao primeiro; o \n8° elemento será igual ao segundo, e assim \nsucessivamente. O 554° elemento será igual ao: \n(A) 1°. \n(B) 2°. \n(C) 3°. \n(D) 4°. \n(E) 5°. \n \nNOÇÕES DE INFORMÁTICA", "source": "Caieiras · Supervisor Pedagógico", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q23", "n": 23, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "C", "img": "img/CAI25-SUP-Q23.webp", "pages": ["img/CAI25-SUP-p7.webp"], "base": null, "text": "QUESTÃO 23 \nO Bloco de Notas é um Software do sistema \noperacional Windows desde suas primeiras \nversões. Ele é amplamente utilizado para rotinas \nsimples. Considerando as funcionalidades desse \nsoftware, assinale a alternativa correta.  \n(A) O Bloco de Notas permite salvar arquivos em \nformatos como .docx e .pdf diretamente. \n(B) \nEle \noferece \nrecursos \navançados \nde \nformatação, como inserção de tabelas e gráficos. \n(C) O software é capaz de criar e editar arquivos \ncom extensões como .txt. \n(D) Ele está disponível apenas nas edições \nprofissionais do Windows. \n(E) O Bloco de Notas possui integração com \nprogramas externos para edição colaborativa.", "source": "Caieiras · Supervisor Pedagógico", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q25", "n": 25, "area": "INF", "eixo": "INF03", "topic": "Excel", "key": "D", "img": "img/CAI25-SUP-Q25.webp", "pages": ["img/CAI25-SUP-p8.webp"], "base": null, "text": "QUESTÃO 25 \nNo Microsoft Excel 2019, diversas ferramentas \nestão disponíveis para facilitar a navegação e o \nmanuseio de dados em planilhas. Com base nesse \nrecurso, assinale a alternativa que descreve \ncorretamente a função da opção \"Congelar \nPainéis\", localizada na guia \"Exibir\":  \n(A) Permitir que o usuário insira comentários \nfixos em células específicas da planilha. \n(B) Travar a edição de uma área selecionada, \nimpedindo alterações acidentais. \n(C) Fixar apenas as colunas iniciais para facilitar \na visualização dos títulos. \n(D) Congelar uma parte da planilha para mantê-\nla visível enquanto o restante é percorrido. \n(E) Configurar a exibição em tela cheia para \nfacilitar a análise de grandes volumes de dados.", "source": "Caieiras · Supervisor Pedagógico", "p": 8, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q28", "n": 28, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "E", "img": "img/CAI25-SUP-Q28.webp", "pages": ["img/CAI25-SUP-p9.webp"], "base": null, "text": "QUESTÃO 28 \nAlguns ponderamentos acerca da escola foram \npropostos abaixo, analise-os: \nI – A escola pública deve ser democrática, \ngarantindo a todos o acesso e a permanência, no \nmínimo, nos oito anos de escolarização, \nproporcionando um ensino de qualidade que leve \nem conta as características específicas dos alunos \nque atualmente a frequentam. \nII – A escola deve ser democrática, também, no \nsentido de que devem vigorar, nela, mecanismos \ndemocráticos de gestão interna envolvendo a \nparticipação conjunta da direção, dos professores \ne dos pais. \nIII – A escola deve ser gratuita porque é um \ndireito essencial dos indivíduos para se \nconstituírem como cidadãos. \nIV - A transformação da escola depende da \ntransformação da sociedade, pois a forma de \norganização do sistema socioeconômico interfere \nno trabalho escolar e no rendimento dos alunos. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III e IV \n(B) I, II e III apenas \n(C) I, III e IV apenas \n(D) I, II e IV apenas \n(E) II, III e IV apenas", "source": "Caieiras · Supervisor Pedagógico", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q29", "n": 29, "area": "CE", "eixo": "CE07", "topic": "Didática e metodologias", "key": "C", "img": "img/CAI25-SUP-Q29.webp", "pages": ["img/CAI25-SUP-p10.webp"], "base": null, "text": "QUESTÃO 29 \nAlguns pontos sobre a didática foram destacados \nabaixo. Analise cada afirmativa, marque V \n(verdadeiro) e F (falso) e, posteriormente, a \nalternativa correspondente. \n[...] A história da didática é posterior ao \naparecimento do ensino. \n[...] Na chamada Antiguidade Clássica (gregos e \nromanos) e no período medieval também se \ndesenvolvem formas de ação pedagógica, em \nescolas, mosteiros, igrejas, universidades. \n[...] Especificamente, a didática, como teoria do \nensino, que sistematize o pensamento didático e \no estudo científico das formas de ensinar \napareceu formalmente no século XVI. \n[...] Definindo-se como mediação escolar dos \nobjetivos e conteúdos do ensino, a didática \ninvestiga as condições e formas que vigoram no \nensino e, ao mesmo tempo, os fatores reais \n(sociais, \npolíticos, \nculturais, \npsicossociais) \ncondicionantes das relações entre a docência e a \naprendizagem. \n(A) V, V, V, V \n(B) V, V, F, V \n(C) F, V, F, V \n(D) F, F, F, V \n(E) V, V, F, F", "source": "Caieiras · Supervisor Pedagógico", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q30", "n": 30, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "E", "img": "img/CAI25-SUP-Q30.webp", "pages": ["img/CAI25-SUP-p10.webp"], "base": null, "text": "QUESTÃO 30 \nEm relação aos aspectos relacionados com a \navaliação de desempenho dos profissionais da \neducação, destaque a alternativa que traz um erro \nconceitual. \n(A) A racionalidade, que marca as políticas \neducacionais do país, considera a importância do \ndocente como agente que corrobora para o \navanço da qualidade do processo de ensino e \naprendizagem. \n(B) A avaliação de desempenho docente é um \nprocesso sistemático que visa analisar e melhorar \na eficácia e a eficiência dos professores em sala \nde aula. \n(C) A avaliação de desempenho docente é \nbaseada em indicadores específicos que podem \nvariar de uma instituição para outra. \n(D) Avaliação de desempenho docente é válida, \nindependentemente dos resultados alcançados, \nquer sejam de ordem positiva e/ou negativa.  \n(E) Um dos aspectos que mais contribui para a \nimplementação de uma avaliação de desempenho \ndocente é seu caráter objetivo que facilita a coleta \ne mensuração dos dados obtidos.", "source": "Caieiras · Supervisor Pedagógico", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q31", "n": 31, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "B", "img": "img/CAI25-SUP-Q31.webp", "pages": ["img/CAI25-SUP-p10.webp"], "base": null, "text": "QUESTÃO 31 \nUma série de situações contribuem para a criação \nde um ambiente conflituoso. Um desses \nexemplos refere-se à vulgarização e banalização \ndos bens culturais educacionais que são \nproduzidos \ne \nconsumidos \npadronizada \ne \nartificialmente. Como é chamado o exemplo \nanteriormente contextualizado? \n(A) Vulgarização \n(B) Massificação \n(C) Padronização \n(D) Democratização \n(E) Descentralização", "source": "Caieiras · Supervisor Pedagógico", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q32", "n": 32, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "C", "img": "img/CAI25-SUP-Q32.webp", "pages": ["img/CAI25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 32 \nPara compreender a dimensão de desempenho e \neficácia das unidades escolares, é preciso \ncompreender o conceito de qualidade. Assim, \nleia os enunciados abaixo: \nI - O conceito de qualidade apresenta uma série \nde atributos, tais como: totalizante, abrangente, \nmultidimensional, \nsocial \ne \nhistoricamente \ndeterminado. \nII - A qualidade tem como um de seus \ndiferenciais: a capacidade de existência em si \nmesma. \nIII – O contexto educacional é considerado o \nindicador crucial de qualidade, porque representa \na estratégia básica de formação humana. \nIV – A qualidade educação é mensurável e \naferida por diferentes indicadores. \nV - Para qualificar as instituições escolares é \npreciso adequá-las para a lógica de competição, \ncomo sinônimo de eficiência e produtividade. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III, IV e V \n(B) I, II e IV apenas \n(C) I, III, IV e V apenas \n(D) II, III e V apenas \n(E) I, II, III e IV apenas", "source": "Caieiras · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q33", "n": 33, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "C", "img": "img/CAI25-SUP-Q33.webp", "pages": ["img/CAI25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 33 \nEm termos práticos, a educação inclusiva pauta-\nse em qual dos modelos abaixo definidos? \n(A) Modelo político \n(B) Modelo integrativo \n(C) Modelo social \n(D) Modelo assistencialista \n(E) Modelo educacional", "source": "Caieiras · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q34", "n": 34, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "E", "img": "img/CAI25-SUP-Q34.webp", "pages": ["img/CAI25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 34 \nAs tendências pedagógicas variam conforme o \nmodelo de gestão assumido. Nesse sentido, \nanalise as afirmativas abaixo: \nI – Todos os atores e todas as variáveis presentes \nna organização escolar afetam o trabalho na sala \nde aula. \nII – A percepção e as atitudes da direção e dos \nprofessores \nem \nrelação \naos \nalunos \nsão \nimportantes fatores que corroboram tanto para o \nsucesso como para o insucesso dos educandos. \nIII – A eficácia e o aproveitamento escolar dos \nalunos são condicionados às características \norganizacionais das escolas. \nIV – A gestão da escola no centro das políticas \neducacionais, dentro do ideário neoliberal, \nratifica o papel central assumido pelo Estado. \nV – Na perspectiva sociocrítica, os profissionais \ntem maior poder de decisão. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III, IV e V \n(B) I, II e IV apenas \n(C) I, II, IV e V apenas \n(D) II, III e V apenas \n(E) I, II, III e V apenas", "source": "Caieiras · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q35", "n": 35, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "A", "img": "img/CAI25-SUP-Q35.webp", "pages": ["img/CAI25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 35 \nQual das tendências abaixo propõe uma ação \npedagógica otimista, do ponto de vista político, \nacreditando que a educação tem poderes quase \nabsolutos sobre a sociedade? \n(A) Tendência redentora \n(B) Tendência transformadora \n(C) Tendência reprodutivista \n(D) Tendência sociocrítica \n(E) Tendência neoliberal", "source": "Caieiras · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q36", "n": 36, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "D", "img": "img/CAI25-SUP-Q36.webp", "pages": ["img/CAI25-SUP-p12.webp"], "base": null, "text": "QUESTÃO 36 \nAo analisar a gestão democrática da escola, é \npossível apontar uma série de objetivos que \nembasam as ações a serem tomadas. Alguns \ndesse objetivos foram descritos abaixo. No \nentanto, há um erro conceitual em uma das \nalternativas, assinale-a: \n(A) Formação ética. \n(B) Desenvolvimento de capacidades cognitivas \ne operativas dos alunos. \n(C) \nDesenvolvimento \nda \ncriatividade, \nda \nsensibilidade, da imaginação \n(D) Formação para a cidadania, pautada \nespecificamente na integração ao mercado de \ntrabalho. \n(E) Preparação para o processo produtivo e para \no mundo tecnológico e comunicacional.", "source": "Caieiras · Supervisor Pedagógico", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q37", "n": 37, "area": "CE", "eixo": "CE17", "topic": "Supervisão e assessoria", "key": "C", "img": "img/CAI25-SUP-Q37.webp", "pages": ["img/CAI25-SUP-p12.webp"], "base": null, "text": "QUESTÃO 37 \nDentro da gestão democrática, é importante \nponderar o papel assumido pelo supervisor, no \nintuito de verificar se ele condiz com o \nposicionamento assumido pela gestão da unidade \neducacional. Nesse sentido, analise as asserções \nabaixo: \nI – Concentra-se nos detalhes que caracterizam a \nrotina educativa. \nII – Deseja ser respeitado pelo cargo que possui. \nIII – Valoriza apenas as ideias objetivas que lhe \nforem sugeridas. \nIV – Usa inconscientemente os métodos \ndemocráticos. \nV – Acredita que outras pessoas devem ter \noportunidade para assumir responsabilidades e \nfunções. \nÉ falso o que se afirma em: \n(A) I e II apenas \n(B) II, III e IV apenas \n(C) I, II, III e IV apenas \n(D) I, II, III, IV e V \n(E) II, III e V apenas", "source": "Caieiras · Supervisor Pedagógico", "p": 12, "role": "SUP", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q38", "n": 38, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "B", "img": "img/CAI25-SUP-Q38.webp", "pages": ["img/CAI25-SUP-p12.webp"], "base": null, "text": "QUESTÃO 38 \nAnalise \nas \nasserções \nabaixo, \nmarque, \nposteriormente, a alternativa correspondente. \nI - No que se refere à área de currículo, observa-\nse que, em lugar dos currículos rígidos e mínimos \npara um mercado de trabalho mais estável, se \ntornou necessário instituir currículos mais \nflexíveis e com eixos temáticos mais amplos e \ndiversificados, tendo em vista um mercado de \ntrabalho cambiante e instável, que demanda \nalterações \npermanentes \nna \nformação \ndos \ntrabalhadores e consumidores. \nII – Geralmente, observa-se que o currículo em \nação ou ativo (o que acontece efetivamente na \nsala de aula) e o currículo oculto (aquele que não \né dito, embora seja carregado de sentido) tornam-\nse muitas vezes o currículo real ou vivido no \ninterior \ndas \ninstituições \nformativas, \nem \nconsonância ao currículo preestabelecido. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é uma justificativa da I. \n(D) As asserções I e II são proposições \nverdadeiras, e a II não é uma justificativa da I. \n(E) As asserções I e II são proposições falsas.", "source": "Caieiras · Supervisor Pedagógico", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q40", "n": 40, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "C", "img": "img/CAI25-SUP-Q40.webp", "pages": ["img/CAI25-SUP-p13.webp"], "base": null, "text": "QUESTÃO 40 \nAnalise as assertivas abaixo, marque V \n(verdadeiro) e F (falso) e, posteriormente, a \nalternativa correspondente. \n[...] A avaliação da aprendizagem escolar adquire \nseu sentido na medida em que se articula com um \nprojeto pedagógico e com seu consequente \nprojeto de ensino. \n[...] A avaliação, no sentido geral, possui uma \nfinalidade em si; enquanto que, no sentido \nespecífico, não possui essa finalidade; ela \nsubsidia um curso de ação que visa construir um \nresultado previamente definido. \n[...] A avaliação subsidia decisões a respeito da \naprendizagem dos educandos, tendo em vista \ngarantir a qualidade do resultado que estamos \nconstruindo. \n[...] A prática da avaliação da aprendizagem \ncorrobora para tomada de decisões no sentido de \nconstruir com e nos educandos conhecimentos, \nhabilidades e hábitos que possibilitem o seu \nefetivo \ndesenvolvimento, \npor \nmeio \nda \nassimilação ativa do legado cultural da \nsociedade. \n(A) V, V, V, V \n(B) F, V, F, V \n(C) V, F, V, V \n(D) F, F, V, V \n(E) V, V, V, F", "source": "Caieiras · Supervisor Pedagógico", "p": 13, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q42", "n": 42, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "D", "img": "img/CAI25-SUP-Q42.webp", "pages": ["img/CAI25-SUP-p13.webp"], "base": null, "text": "QUESTÃO 42 \nEm relação a alguns ponderamentos sobre a \npsicologia da educação, analise as assertivas \nabaixo e assinale a que traz um erro conceitual. \n(A) A psicologia da educação objetiva a \ninvestigação e a pesquisa sobre os mecanismos \nde aprendizagem em crianças e adultos, as táticas \ne estratégias educacionais e o funcionamento da \ninstituição escolar. \n(B) No desenvolvimento de suas concepções \nteóricas e definição de seu objeto de estudo, a \npsicologia \nda \neducação \nfoi \ninfluenciada \nprincipalmente pela filosofia. \n(C) A década de 1920 e 1930 marca o contexto \nda psicologia da educação pautado em métricas \nde inteligência.  \n(D) Na década de 60, surge a revolução \ncognitiva, também conhecida como abordagem \nbehaviorista. \n(E) Dentro da perspectiva cognitiva, destacam-se \nestudiosos como Piaget e Vygotsky. Em relação \nà perspectiva piagetiana, observa-se que o \ndesenvolvimento humano ocorre por meio dos \naspectos \nfisiomotor, \nintelectual, \nafetivo-\nemocional e social.", "source": "Caieiras · Supervisor Pedagógico", "p": 13, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q43", "n": 43, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "D", "img": "img/CAI25-SUP-Q43.webp", "pages": ["img/CAI25-SUP-p13.webp"], "base": null, "text": "QUESTÃO 43 \nA educação inclusiva apresenta os aspectos \nabaixo definidos, exceto: \n(A) Em todas as etapas e modalidades da \neducação básica, o atendimento educacional \nespecializado é organizado para apoiar o \ndesenvolvimento dos alunos, constituindo oferta \nobrigatória dos sistemas de ensino. \n(B) O atendimento educacional especializado \nidentifica, \nelabora \ne \norganiza \nrecursos \npedagógicos e de acessibilidade que eliminem as \nbarreiras para a plena participação dos alunos, \nconsiderando as suas necessidades específicas. \n(C) O atendimento educacional especializado \ncomplementa e/ou suplementa a formação dos \nalunos com vistas à autonomia e independência \nna escola e fora dela. \n(D) Ao longo de todo processo de escolarização, \no atendimento educacional especializado deve \nestar articulado com a proposta pedagógica da \neducação especial. \n(E) A inclusão escolar tem início na educação \ninfantil, \nonde \nse \ndesenvolvem \nas \nbases \nnecessárias para a construção do conhecimento e \nseu desenvolvimento global.", "source": "Caieiras · Supervisor Pedagógico", "p": 13, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q44", "n": 44, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "E", "img": "img/CAI25-SUP-Q44.webp", "pages": ["img/CAI25-SUP-p14.webp"], "base": null, "text": "QUESTÃO 44 \nEm consonância literal com as Diretrizes \ncurriculares nacionais gerais para a educação \nbásica, observam-se os seguintes objetivos: \nI – Sistematizar os princípios e diretrizes gerais \nda educação básica contidos na Constituição, na \nLDB e demais dispositivos legais, traduzindo-os \nem orientações que contribuam para assegurar a \nformação básica comum nacional, tendo como \nfoco os sujeitos que dão vida ao currículo e à \nescola. \nII – Estimular a reflexão crítica e propositiva que \ndeve subsidiar a formulação, execução e \navaliação do projeto político-pedagógico da \nescola de educação básica. \nIII – Orientar os cursos de formação inicial e \ncontinuada de profissionais – docentes, técnicos, \nfuncionários da educação básica, os sistemas \neducativos dos diferentes entes federados e as \nescolas que os integram, indistintamente da rede \na que pertençam. \nCondiz integralmente com as diretrizes: \n(A) I apenas \n(B) II apenas \n(C) I e II apenas \n(D) II e III apenas \n(E) I, II e III", "source": "Caieiras · Supervisor Pedagógico", "p": 14, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q45", "n": 45, "area": "CE", "eixo": "CE07", "topic": "Didática e metodologias", "key": "E", "img": "img/CAI25-SUP-Q45.webp", "pages": ["img/CAI25-SUP-p14.webp"], "base": null, "text": "QUESTÃO 45 \nSão características do Sistema de Avaliação da \nEducação Básica, as afirmativas abaixo, exceto: \n(A) Conjunto de avaliações externas. \n(B) Larga escala. \n(C) \nReflete \nos \nníveis \nde \naprendizagem \ndemonstrados pelos estudantes avaliados. \n(D) O resultado da avaliação é um indicativo da \nqualidade do ensino brasileiro. \n(E) Avalia especificamente as escolas e as redes \nmunicipais e estaduais de ensino.", "source": "Caieiras · Supervisor Pedagógico", "p": 14, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q46", "n": 46, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "C", "img": "img/CAI25-SUP-Q46.webp", "pages": ["img/CAI25-SUP-p14.webp"], "base": null, "text": "QUESTÃO 46 \nDentro dos fundamentos e diretrizes da educação \nbásica, um termo que merece atenção é a \ntransversalidade. Nesse contexto, sobre a \ntransversalidade, é impertinente afirmar: \n(A) A transversalidade é entendida como uma \nforma de organizar o trabalho didático-\npedagógico em que temas, eixos temáticos são \nintegrados às disciplinas, às áreas ditas \nconvencionais de forma a estarem presentes em \ntodas elas. \n(B) \nA \ntransversalidade \ndifere-se \nda \ninterdisciplinaridade e complementam-se; ambas \nrejeitam a concepção de conhecimento que toma \na realidade como algo estável, pronto e acabado. \n(C) A interdisciplinaridade refere-se se à \ndimensão \ndidático-pedagógica \ne \na \ntransversalidade, à abordagem epistemológica \ndos objetos de conhecimento. \n(D) A prática interdisciplinar facilita o exercício \nda transversalidade. \n(E) A interdisciplinaridade e o exercício da \ntransversalidade ou do trabalho pedagógico \ncentrado em eixos temáticos, organizados em \nredes de conhecimento, contribuem para que a \nescola dê conta de tornar os seus sujeitos \nconscientes de seus direitos e deveres e da \npossibilidade de se tornarem aptos a aprender a \ncriar novos direitos, coletivamente.", "source": "Caieiras · Supervisor Pedagógico", "p": 14, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q47", "n": 47, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "B", "img": "img/CAI25-SUP-Q47.webp", "pages": ["img/CAI25-SUP-p14.webp"], "base": null, "text": "QUESTÃO 47 \nObserve os enunciados abaixo, assinale o que \ncondiz \ncom \nas \nseguintes \ncaracterísticas: \nrepresenta “uma maneira de encadear e articular \nas diferentes atividades ao longo de uma unidade \ndidática. Assim, é possível analisar as diferentes \nformas de intervenção segundo as atividades que \nse realizam e, principalmente, pelo sentido que \nadquirem \nem \nrealização \na \ndeterminados \nobjetivos educativos”. \n(A) Papel dos professores e dos alunos. \n(B) \nSequências \nde \natividades \nde \nensino/aprendizagem ou sequências didáticas. \n(C) Forma de estruturação dos diferentes alunos \ne da dinâmica grupal. \n(D) Organização dos conteúdos segundo a lógica. \n(E) Utilização dos espaços e do tempo.", "source": "Caieiras · Supervisor Pedagógico", "p": 14, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q49", "n": 49, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "B", "img": "img/CAI25-SUP-Q49.webp", "pages": ["img/CAI25-SUP-p15.webp"], "base": null, "text": "QUESTÃO 49 \nDentre os projetos pedagógicos, destaca-se a \nimportância do projeto político-pedagógico. \nAlgumas \nde \nsuas \ncaracterísticas \nforam \ndestacadas abaixo, analise-as e assinale a \nalternativa incorreta. \n(A) Plano global da instituição \n(B) Sistematização definitiva de um processo de \nplanejamento participativo. \n(C) \nGeralmente, \nsua \nprogramação \nprevê \natividades para todo o ano, ou mesmo para vários \nanos. \n(D) Concretiza-se de forma processual. \n(E) Funciona como uma espécie de “guarda-\nchuva” para outros projetos, acolhendo, dando \nunidade e organicidade.", "source": "Caieiras · Supervisor Pedagógico", "p": 15, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q50", "n": 50, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "C", "img": "img/CAI25-SUP-Q50.webp", "pages": ["img/CAI25-SUP-p15.webp"], "base": null, "text": "QUESTÃO 50 \nSobre a progressão continuada, analise as \nassertivas abaixo, marque V (verdadeiro) e F \n(falso) \ne, \nposteriormente, \na \nalternativa \ncorrespondente. \n[...] A progressão continuada constitui uma \nmetodologia em que o educando deve alcançar \nhabilidades, competências e conhecimentos \ndentro de um intervalo de tempo anual. \n[...] Na progressão continuada, a reprodução cede \nespaço para a recuperação por meio de aulas de \nreforço. \n[...] Os ciclos de ensino são adaptados ao \ncontexto regional que caracteriza as unidades de \nensino no país. \n[...] A progressão continuada aplica-se a qualquer \nproposta político-pedagógica. \n[...] O ensino por ciclos é uma forma de tentar \nregularizar o fluxo dos alunos ao longo dos anos \ndentro de uma escola ou rede de ensino; de modo \na equiparar o fracasso escolar das altas taxas de \nreprovação e repetência de séries. \n(A) F, F, F, F, F  \n(B) V, F, V, F, V \n(C) F, V, V, F, F \n(D) V, V, V, F, F \n(E) F, V, V, V, F", "source": "Caieiras · Supervisor Pedagógico", "p": 15, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q26", "n": 26, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "B", "img": "img/CAI25-COO-Q26.webp", "pages": ["img/CAI25-COO-p8.webp"], "base": null, "text": "QUESTÃO 26 \nA organização da escola centrada no processo de \ndesenvolvimento do educando representa uma \nrealidade almejada e contextualizada na literatura \npor diferentes abordagens teóricas. Nesse \ncontexto, o papel do coordenador pedagógico é \ndescrito, como por exemplo, na obra de Almeida \ne Placco. Segundo a perspectiva das referidas \nautoras, analise as afirmativas abaixo: \nI – Por meio da conscientização da necessidade \nda adoção de uma nova postura por parte dos \neducadores, ratifica-se a possibilidade de se \ntransformar a realidade educacional. \nII – A função inovadora da educação não é um \nmovimento contínuo, mas sim que alterna \nruptura e continuidade. \nIII – Uma educação compromissada com a \nformação do homem capaz de analisar de forma \ncrítica a sua realidade é uma ação capaz de \nsuperar os determinantes geradores de exclusão. \nIV – Os movimentos de reprodução e de \ntransformação \nque \nocorrem \nno \nâmbito \neducacional não ocorrem de forma simultânea, \nmas alternada, de forma cíclica. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III e IV  \n(B) I, II e III apenas \n(C) II, III e IV apenas \n(D) I, II e IV apenas \n(E) I, III e IV apenas", "source": "Caieiras · Coordenador Pedagógico", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q27", "n": 27, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "C", "img": "img/CAI25-COO-Q27.webp", "pages": ["img/CAI25-COO-p9.webp"], "base": null, "text": "QUESTÃO 27 \nAnalise \nas \nasserções \nabaixo, \nmarque, \nposteriormente, a alternativa pertinente. \nI - Os compromissos assumidos em prol da \nprática verdadeiramente transformadora devem \nser explicitados por meio do projeto político-\npedagógico. \nII - É necessário que os diferentes atores, \nenvolvidos no processo educacional, apresentem \nsuas necessidades, expectativas e estratégias em \nrelação à mudança e construam um efetivo \ntrabalho coletivo em torno do projeto político-\npedagógico da escola. \n \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(D) As asserções I e II são proposições \nverdadeiras, e a II não é um complemento da I. \n(E) As asserções I e II são proposições falsas.", "source": "Caieiras · Coordenador Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q28", "n": 28, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "E", "img": "img/CAI25-COO-Q28.webp", "pages": ["img/CAI25-COO-p9.webp"], "base": null, "text": "QUESTÃO 28 \nAo analisar algumas das características do \nprojeto político-pedagógico, dentro da visão de \nAlves e Sass, destacam-se os aspectos abaixo \nelencados. Analise cada um deles, destaque a \nalternativa que possui um dado que difere da \nperspectiva apresentada na obra: “Formação de \nProfessores e Campos do Conhecimento”. \n(A) Ponto de referência da unidade escolar. \n(B) Representa o documento-base da escola. \n(C) Constitui a fisionomia da instituição. \n(D) Representa a maneira como é disposta a \norganização interna. \n(E) Delineia as fontes de interdependência \nadministrativa, pedagógica e financeira.", "source": "Caieiras · Coordenador Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q29", "n": 29, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "C", "img": "img/CAI25-COO-Q29.webp", "pages": ["img/CAI25-COO-p9.webp"], "base": null, "text": "QUESTÃO 29 \nDe \nacordo \ncom \nVasconcellos, \n“com \no \ncrescimento da autonomia escolar, vai ganhando \nimportância cada vez maior a avaliação da escola \nno seu conjunto, feita por ela mesma, na medida \nem que está buscando se aperfeiçoar; trata-se de \numa espécie de autoavaliação da escola. No \npassado, a avaliação da escola era feita por um \nsistema centralizador e baseada em parâmetros \nformais e burocráticos (dados estatísticos, \nrelatórios), tendo pouco efeito formativo”. \nDentro do contexto explicitado, qual é a parte \nconstituinte do projeto político-pedagógico que \nse refere à avaliação institucional? \n(A) Marco operativo \n(B) Programação  \n(C) Diagnóstico \n(D) Marco situacional \n(E) Marco filosófico", "source": "Caieiras · Coordenador Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": "Celso Vasconcellos", "secondary": []}, {"id": "CAI25-COO-Q30", "n": 30, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "C", "img": "img/CAI25-COO-Q30.webp", "pages": ["img/CAI25-COO-p9.webp"], "base": null, "text": "QUESTÃO 30 \nDentro dos ponderamentos do Ministério da \nEducação, por meio da obra: Subsídio para a \ngestão dos sistemas educacionais inclusivos, \nanalise as afirmativas abaixo. Marque V \n(verdadeiro) e F (falso) e, posteriormente, a \nalternativa correspondente. \n[...] O século XX, em quase toda a sua totalidade, \ndemonstra que a sociedade brasileira, suas \nagências \nformadoras \ne \nseus \nagentes \nempregadores eram regidos por padrões de \nnormalidade. \n[...] Ao pautar as ações em padrões de \nnormalidade, \nas \npessoas \ncom \ndeficiência \nnaturalmente são excluídas do âmbito social. \n[...] A criação de instituições especializadas ou \nclasses especiais, pelo Estado, representa a \nprimeira ação de rompimento com a conduta \npautada em padrões de normalidade.  \n[...] O desafio da educação é assegurar um ensino \nde qualidade que beneficie a todos os alunos, em \nque se perceba a educação especial como uma \nmodalidade transversal que perpassa todos os \nníveis, etapas e modalidades de ensino. \n(A) V, V, V, V \n(B) F, V, F, V \n(C) V, V, F, V \n(D) F, F, V, V \n(E) V, V, F, F", "source": "Caieiras · Coordenador Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q31", "n": 31, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "C", "img": "img/CAI25-COO-Q31.webp", "pages": ["img/CAI25-COO-p10.webp"], "base": null, "text": "QUESTÃO 31 \nA educação inclusiva pressupõe novas relações \npedagógicas centradas nos modos de aprender \ndas diferentes crianças e jovens e de relações \nsociais que valorizam a diversidade em todas as \natividades, espaços e formas de convivência e \ntrabalho. Dessa forma, na efetivação do direito de \ntodos à educação, o direito à igualdade e o direito \nà diferença são ____________e os direitos \nespecíficos \nservem \npara \neliminar \nas \ndiscriminações e garantir a plena inclusão social. \n(A) invioláveis \n(B) questionáveis \n(C) indissociáveis \n(D) assegurados \n(E) dissociáveis", "source": "Caieiras · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q32", "n": 32, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "C", "img": "img/CAI25-COO-Q32.webp", "pages": ["img/CAI25-COO-p10.webp"], "base": null, "text": "QUESTÃO 32 \nA afetividade na escola é um tema abordado por \nValéria Amorim Arantes. Percebe-se que os \naspectos \nrelativos \nà \nafetividade \nsão \ndeterminantes para a construção de um ambiente \nvoltado para o prazer de ensinar e aprender. \nDentro dessa linha de raciocínio, analise as \nafirmativas abaixo: \nI – Inteligência e afetividade são diferentes em \nnatureza e dissociáveis na conduta concreta da \ncriança. \nII – Ratifica-se que não há nenhuma conduta que \nseja apenas afetiva ou apenas cognitiva. \nIII – A afetividade exerce influência constante \nsobre o funcionamento da inteligência. \nIV – A afetividade modifica as estruturas da \ninteligência. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III e IV \n(B) I e II apenas \n(C) II, III apenas \n(D) I, II e IV apenas \n(E) I, III e IV apenas", "source": "Caieiras · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q33", "n": 33, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "D", "img": "img/CAI25-COO-Q33.webp", "pages": ["img/CAI25-COO-p10.webp"], "base": null, "text": "QUESTÃO 33 \nPor meio da Constituição Federal, é possível \ncompreender \nalguns \naspectos \nacerca \nda \ndimensão social e política do papel do professor \ne do gestor educacional dentro da concepção da \neducação no contexto nacional. Ao analisar as \nações propostas constitucionalmente, qual a \nconcepção que o atendimento escolar deve \napresentar? \n(A) Descentralização \n(B) Centralização \n(C) Melhoria \n(D) Universalização \n(E) Promoção", "source": "Caieiras · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q34", "n": 34, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "A", "img": "img/CAI25-COO-Q34.webp", "pages": ["img/CAI25-COO-p10.webp"], "base": null, "text": "QUESTÃO 34 \nA autonomia da escola pode ser analisada a partir \nda autonomia dos professores, em que se destaca, \npor exemplo, a obra de Contreras. Em \nconsonância com a referida obra, analise as \nasserções abaixo: \nI – A perda da autonomia por parte dos \nprofessores \ndecorre \nda \nproletarização \nda \nprofissão. \nII – Muitas vezes, a autonomia dos professores, \nembora utilizada em discursos pedagógicos e \nmeios acadêmicos, \nrevela uma dimensão \nsuperficial, empregada apenas como instrumento \nde controle ou justificativa dos objetivos da \nadministração pública. \nIII – Os professores também demonstram \ndesconhecimento em relação à dimensão que a \nautonomia deve abranger. \nIV – O autor, ao analisar traços que caracterizam \ncada profissão, como, por exemplo, saber \nsistemático ou competência, vocação, licença \nexclusiva no campo de trabalho, independência \nou autonomia , dentre outros, ratifica que o \ndocente ainda é um semiprofissional, pois não \napresenta muito desses traços. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III e IV \n(B) I, II e III apenas \n(C) II, III e IV apenas \n(D) I, II e IV apenas  \n(E) I, III e IV apenas", "source": "Caieiras · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q35", "n": 35, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "C", "img": "img/CAI25-COO-Q35.webp", "pages": ["img/CAI25-COO-p11.webp"], "base": null, "text": "QUESTÃO 35 \nA dimensão social do papel do professor e do \ngestor educacional é marcada por uma série de \ndesafios, como os destacados a seguir. Analise \ncada um deles, marque V (verdadeiro) e F (falso) \ne, posteriormente, a alternativa correspondente. \n[...] O caráter moral deve ser sempre subordinado \nao caráter contratual que regulamenta as ações \neducacionais. \n[...] O compromisso social refere-se ao \ncompromisso que a educação assume com a \ncomunidade. \n[...] O compromisso social docente está atrelado \nà consciência que cada profissional possui sobre \nas consequências de sua prática pedagógica. \n[...] Dentro do âmbito do compromisso social \nassumido, observa-se a necessidade de se \nconduzir a educação democraticamente, fugindo \nda autocomplacência e do individualismo \ncompetitivo. \n(A) V, V, V, V \n(B) V, V, F, F \n(C) F, V, V, V \n(D) F, F, V, V \n(E) F, F, F, V", "source": "Caieiras · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q36", "n": 36, "area": "CE", "eixo": "LEG_BNCC", "topic": "BNCC", "key": "A", "img": "img/CAI25-COO-Q36.webp", "pages": ["img/CAI25-COO-p11.webp"], "base": null, "text": "QUESTÃO 36 \nPara compreender as variáveis que caracterizam \no trabalho pedagógico, é preciso reportar aos \ninstrumentos legais e normativos. Nesse sentido, \nde acordo com o texto presente na BNCC, \ncomplete o excerto abaixo com os termos \ncorrespondentes: \nOs modificadores devem ser entendidos como a \nexplicação da situação ou condição em que a a \nhabilidade deve ser desenvolvida, considerando \n___________ dos alunos. Ainda assim, as \nhabilidades não descrevem ações ou condutas \n________________ do professor, nem induzem \nà opção por abordagens ou metodologias. Essas \nescolhas estão no âmbito dos currículos e dos \nprojetos pedagógicos [...]. \n(A) a faixa etária / esperadas  \n(B) a aptidão / inadequadas  \n(C) as deficiências / apropriadas \n(D) o aprendizado / obrigatórias \n(E) o desenvolvimento / necessárias", "source": "Caieiras · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q37", "n": 37, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "B", "img": "img/CAI25-COO-Q37.webp", "pages": ["img/CAI25-COO-p11.webp"], "base": null, "text": "QUESTÃO 37 \nHá diferentes concepções de planejamento \nescolar, sendo que Vasconcellos, em sua obra: \nCoordenação do Trabalho Pedagógico – Do \nprojeto político pedagógico ao cotidiano da sala \nde aula, defende como referencial para a \nconsecução do projeto político-pedagógico um \ndeterminado tipo de planejamento, assinale-o: \n(A) Planejamento centralizado \n(B) Planejamento participativo \n(C) Planejamento global \n(D) Planejamento operacional \n(E) Planejamento de abordagem", "source": "Caieiras · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q38", "n": 38, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "C", "img": "img/CAI25-COO-Q38.webp", "pages": ["img/CAI25-COO-p11.webp"], "base": null, "text": "QUESTÃO 38 \nA concepção e a abrangência do trabalho da \navaliação, segundo Cappelletti, foram delineadas \npor meios das asserções abaixo: \nI – No processo de avaliação e reconstrução \ncurricular, destaca-se a necessidade de uma \ncompreensão mais aprofundada sobre todas as \nvariáveis que interferem na sistematização da \navaliação educacional, que seja capaz de revelar \no que se encontra implícito, dentro das relações \nde poder. \nII – Isso se confirma uma vez que as realidades \nsociais, além de complexas, são polarizadas, \ngeradas no campo dos conflitos, onde as \nconcordâncias e discordâncias são expressas pela \ncomunicação. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(D) As asserções I e II são proposições \nverdadeiras, e a II não é um complemento da I. \n(E) As asserções I e II são proposições falsas.", "source": "Caieiras · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q39", "n": 39, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "C", "img": "img/CAI25-COO-Q39.webp", "pages": ["img/CAI25-COO-p12.webp"], "base": null, "text": "QUESTÃO 39 \nSegundo a LDB, analise as afirmativas abaixo \nem relação aos aspectos que caracterizam a \navaliação e o acompanhamento do rendimento \nescolar: \nI \n– \nA \navaliação \ndeve \nser \nconstruída \nespecificamente \npor \nmeio \nde \nmétricas \nquantitativas. \nII – A avaliação não deve ocorrer apenas ao \ntérmino de um ciclo, mas é construída no dia a \ndia do aluno. \nIII - Os critérios de avaliação do aproveitamento \nescolar deverão ser elaborados em consonância \ncom a organização curricular do estabelecimento \nde ensino. \nIV - Para que a avaliação cumpra sua finalidade \neducativa, deverá ser contínua, permanente e \ncumulativa. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III e IV \n(B) I, II e III apenas \n(C) II, III e IV apenas \n(D) I, II e IV apenas \n(E) I, III e IV apenas", "source": "Caieiras · Coordenador Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q40", "n": 40, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "B", "img": "img/CAI25-COO-Q40.webp", "pages": ["img/CAI25-COO-p12.webp"], "base": null, "text": "QUESTÃO 40 \nConforme Chrispino, qual das variáveis abaixo é \ndefinida pelo referido autor como a forma \nprincipal de lidar com o conflito escolar? \n(A) Controle \n(B) Mediação \n(C) Correção \n(D) Intervenção \n(E) Avaliação", "source": "Caieiras · Coordenador Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q41", "n": 41, "area": "CE", "eixo": "CE07", "topic": "Didática e metodologias", "key": "B", "img": "img/CAI25-COO-Q41.webp", "pages": ["img/CAI25-COO-p12.webp"], "base": null, "text": "QUESTÃO 41 \nPensar os desafios presentes no contexto do \nprocesso educacional, em prol da construção de \num \nensino \ncom \nqualidade, \ndemanda \na \nobservância de inúmeros fatores, conforme \ndescreve Moran, Masetto e Behrens. Dentro \ndesse contexto, analise as afirmativas abaixo, \nmarque V (verdadeiro) e F (falso) e, na \nsequência, a alternativa pertinente: \n[...] Ensino de qualidade e educação de qualidade \nsão conceitos diferentes, sendo que cada um \ndeles possui uma dimensão própria. \n[...] O ensino é pensado especificamente por \nmeio \nda \ncompreensão \ndas \náreas \ndo \nconhecimento. \n[...] O objetivo principal do ensino é a \ntransformação da vida humana por meio de \nprocessos permanentes de aprendizagem. \n[...] A concepção de ensino é pautada em normas, \ntradições e leis, mas não deixa de ser pessoal, \npois cada um desenvolve seu estilo, aprendem e \nensinam. \n(A) V, V, V, V \n(B) V, V, F, V \n(C) V, F, V, V \n(D) V, V, V, F \n(E) F, V, V, V", "source": "Caieiras · Coordenador Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q42", "n": 42, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "B", "img": "img/CAI25-COO-Q42.webp", "pages": ["img/CAI25-COO-p13.webp"], "base": null, "text": "QUESTÃO 42 \nHá vários instrumentos que contribuem para \nmelhorar a integração entre escola e família e \ncomunidade, bem como a relação dos próprios \nestudantes com a instituição educacional, como \nos descritos abaixo: \nI – A Associação de Pais e Mestres (APM) \nrepresenta uma instituição que possibilita a \nparticipação da família, em que se oportuniza a \nintegração entre a escola e a comunidade. \nII - O grêmio estudantil é uma entidade autônoma \ne seus representantes são os alunos que buscam \ndefender os seus interesses individuais e \ncoletivos (todos os alunos da escola). \nIII - O conselho de classe e série representa um \nelemento de participação ativa do aluno previsto \nna legislação educacional. \nIV - Os colegiados escolares são formados \nespecificamente por representantes de cada \ninstituição de ensino, ou seja, diretor, professores \ne demais funcionários, em que são abordadas \nquestões \nfinanceiras, \nadministrativas \ne \npedagógicas. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III e IV \n(B) I, II e III apenas \n(C) II, III e IV apenas \n(D) I, II e IV apenas \n(E) I, III e IV apenas", "source": "Caieiras · Coordenador Pedagógico", "p": 13, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q43", "n": 43, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "E", "img": "img/CAI25-COO-Q43.webp", "pages": ["img/CAI25-COO-p13.webp"], "base": null, "text": "QUESTÃO 43 \nEm relação às diferentes concepções da gestão \nescolar, dentro da perspectiva da Libâneo, \nassinale a alternativa que não condiz com a \nconcepção autogestionária: \n(A) Ausência de direção centralizada. \n(B) Acentuação da participação direta. \n(C) Tende a recusar o exercício de autoridade. \n(D) \nTende \na \nrecusar \nas \nformas \nmais \nsistematizadas de organização e gestão. \n(E) Baseia-se na relação orgânica entre a direção \ne a participação dos membros da equipe.", "source": "Caieiras · Coordenador Pedagógico", "p": 13, "role": "both", "preferred": "both", "fallback": false, "author": "José Carlos Libâneo", "secondary": []}, {"id": "CAI25-COO-Q45", "n": 45, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "D", "img": "img/CAI25-COO-Q45.webp", "pages": ["img/CAI25-COO-p13.webp"], "base": null, "text": "QUESTÃO 45 \nSegundo \nVasconcellos, \nalgumas \nsituações \ndificultam a elaboração do projeto político-\npedagógica. Uma delas é pautada no receito de \nque ao definir uma linha de trabalho para a \nescola, obrigatoriamente, há a necessidade de se \nfiliar a alguma concepção corrente, como por \nexemplo: construtivismo, educação libertadora \netc. O exemplo anteriormante definido refere-se \na: \n(A) Comodismo por parte dos sujeitos \n(B) Imediatismo \n(C) Perfeccionismo \n(D) Nominalismo \n(E) Formalismo", "source": "Caieiras · Coordenador Pedagógico", "p": 13, "role": "both", "preferred": "both", "fallback": false, "author": "Celso Vasconcellos", "secondary": []}, {"id": "CAI25-COO-Q46", "n": 46, "area": "CE", "eixo": "CE08", "topic": "Ensino por competências", "key": "E", "img": "img/CAI25-COO-Q46.webp", "pages": ["img/CAI25-COO-p14.webp"], "base": null, "text": "QUESTÃO 46 \nA questão da diversidade é retratada por diversos \nautores, como por exemplo: Jacques Delors. \nDentro dos ponderamentos apresentados pelo \nautor, analise as afirmativas abaixo e assinale a \nque possui um erro conceitual. \n(A) A educação plural é considerada como um \nprincípio ativo de enriquecimento cultural e \ncívico das sociedades contemporâneas. \n(B) A educação adaptada a diferentes grupos \nminoritários é considerada prioritária para o \natendimento à diversidade humana. \n(C) A desvinculação entre o desenvolvimento \neconômico e o desenvolvimento humano é fato \ngerador de significativas ameaças à vida humana. \n(D) O aprender a viver juntos é considerado um \ndos eixos da aprendizagem. \n(E) É por meio da educação que se trabalha a \naprendizagem da cidadania, que somente é \ndesenvolvida por meio da sistematização do \nsaber.", "source": "Caieiras · Coordenador Pedagógico", "p": 14, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q47", "n": 47, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "D", "img": "img/CAI25-COO-Q47.webp", "pages": ["img/CAI25-COO-p14.webp"], "base": null, "text": "QUESTÃO 47 \nDe acordo com a Lei nº 9.394/1996, “o Fórum \ndos Conselhos Escolares é um colegiado de \ncaráter deliberativo que tem como finalidades o \nfortalecimento dos Conselhos Escolares de sua \ncircunscrição e a efetivação do processo \ndemocrático nas unidades educacionais e nas \ndiferentes instâncias decisórias, com vistas a \nmelhorar a qualidade da educação, norteado \npelos seguintes princípios[...]”: \nI – democratização da gestão. \nII – democratização do acesso e permanência. \nIII – qualidade social da educação. \nCompleta corretamento o excerto anterior: \n(A) I apenas \n(B) I e II apenas \n(C) II apenas \n(D) I, II e III \n(E) II e III apenas", "source": "Caieiras · Coordenador Pedagógico", "p": 14, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-COO-Q49", "n": 49, "area": "CE", "eixo": "LEG_BNCC", "topic": "BNCC", "key": "E", "img": "img/CAI25-COO-Q49.webp", "pages": ["img/CAI25-COO-p15.webp"], "base": null, "text": "QUESTÃO 49 \nDe acordo com a BNCC, analise as asserções \nabaixo: \nI - A LDB deixa claros dois conceitos decisivos \npara todo o desenvolvimento da questão \ncurricular no Brasil. O primeiro, já antecipado \npela Constituição, estabelece a relação entre o \nque é básico-comum e o que é diverso em matéria \ncurricular: as competências e diretrizes são \ndiversas, os currículos são comuns. \nII - O segundo refere-se ao foco do currículo. Ao \ndizer que os conteúdos curriculares estão a \nserviço do desenvolvimento de competências, a \nLDB orienta para a definição das aprendizagens \nque compreendem os conteúdos mínimos a ser \nensinados. Essas são duas noções fundantes da \nBNCC. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(D) As asserções I e II são proposições \nverdadeiras, e a II não é um complemento da I. \n(E) As asserções I e II são proposições falsas.", "source": "Caieiras · Coordenador Pedagógico", "p": 15, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "A", "img": "img/JER26-ORI-Q01.webp", "pages": ["img/JER26-ORI-p2.webp"], "base": "JER26-ORI-T1", "text": "QUESTÃO 01 \nDe acordo com o texto “A velocidade da \nhistória”, a ideia de construir um mapa que \n“correspondia em extensão a cada milímetro da \nregião cartografada” era: \n(A) inútil, pois era mais fácil percorrer a própria \nregião do que seguir o mapa. \n(B) muito útil, pois o usuário acabava tendo uma \nvisão completa sobre a região. \n(C) imprescindível para os estudantes de \ngeografia. \n(D) imprescindível para os estudantes de história. \n(E) muito prático, pois o usuário poderia ter, em \nsuas mãos, uma boa visão sobre a região.", "source": "Jeriquara · Orientador Educacional", "p": 2, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q02", "n": 2, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "B", "img": "img/JER26-ORI-Q02.webp", "pages": ["img/JER26-ORI-p2.webp"], "base": "JER26-ORI-T1", "text": "QUESTÃO 02 \n“Era (...) tão minudente que melhor seria \npercorrer a própria região a pé ou a cavalo”. \nA palavra destacada no trecho acima é sinônima de: \n(A) “genérico”. \n(B) “minucioso”. \n(C) “generalista”. \n(D) “antiquado”. \n(E) “antigo”.", "source": "Jeriquara · Orientador Educacional", "p": 2, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q03", "n": 3, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "C", "img": "img/JER26-ORI-Q03.webp", "pages": ["img/JER26-ORI-p2.webp"], "base": "JER26-ORI-T1", "text": "QUESTÃO 03 \nA visão sobre história repassada pelo texto “A \nvelocidade da história” é a de que essa área do \nconhecimento humano: \n(A) nunca se altera. \n(B) não interfere nos mapas. \n(C) altera com muita rapidez.  \n(D) altera com muita lentidão. \n(E) altera para se adaptar aos mapas.", "source": "Jeriquara · Orientador Educacional", "p": 2, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q04", "n": 4, "area": "LP", "eixo": "LP03", "topic": "Figuras de linguagem", "key": "D", "img": "img/JER26-ORI-Q04.webp", "pages": ["img/JER26-ORI-p3.webp"], "base": null, "text": "QUESTÃO 04 \nAssinale a alternativa em que a palavra “onda” \nestá sendo empregada em sentido figurado. \n(A) A maior onda surfada até hoje foi de quase \n30 metros de altura. \n(B) O formato da onda no mar obedece a \nmovimentos bem cíclicos. \n(C) A inclinação da prancha de surfe para pegar \numa onda depende de técnicas bem sutis. \n(D) A nova onda do verão é usar roupas com \ncores bem fortes e vibrantes. \n(E) A meteorologia prevê, entre várias outras \ncoisas, a altura da onda ao longo do dia.", "source": "Jeriquara · Orientador Educacional", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q05", "n": 5, "area": "LP", "eixo": "LP12", "topic": "Coesão textual", "key": "E", "img": "img/JER26-ORI-Q05.webp", "pages": ["img/JER26-ORI-p3.webp"], "base": null, "text": "QUESTÃO 05 \nAssinale a alternativa cuja palavra destacada, de \nnatureza pronominal, substitui algo apresentado \nposteriormente. \n(A) Cinema, teatro, música, escultura, tudo tem \num conjunto de simbologias muito rico. \n(B) Todas as ciências a que o homem se dedica \nsão dotadas de grande importância na vida. \n(C) Eis o local onde foram gravadas várias cenas \ndo seriado que fez tanto sucesso. \n(D) Conversei com o gerente do banco e ele me \ndisse que nos arrumaria um empréstimo. \n(E) Na vida, quero que você aprenda isto: que \ncada pessoa tem um caráter diferente.", "source": "Jeriquara · Orientador Educacional", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q06", "n": 6, "area": "LP", "eixo": "LP08", "topic": "Sintaxe", "key": "C", "img": "img/JER26-ORI-Q06.webp", "pages": ["img/JER26-ORI-p3.webp"], "base": null, "text": "QUESTÃO 06 \nAssinale a alternativa cujo termo destacado se \nrefere ao agente, o ser que pratica a ação expressa \npelo verbo. \n(A) Estou com saudade de você, pois afinal há \ntempos em que não nos encontramos. \n(B) Estamos torcendo por vocês para que \nconsigam realizar os seus objetivos. \n(C) No filme, a mocinha ficou cercada de \ntubarões por todos os lados. \n(D) Compramos todos os equipamentos que \nestavam no estoque da loja. \n(E) Queremos sempre o melhor para todos os \nnossos clientes.", "source": "Jeriquara · Orientador Educacional", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q07", "n": 7, "area": "LP", "eixo": "LP08", "topic": "Sintaxe", "key": "E", "img": "img/JER26-ORI-Q07.webp", "pages": ["img/JER26-ORI-p3.webp"], "base": null, "text": "QUESTÃO 07 \n“Um bom livro é um diálogo ininterrupto(1) \nentre nós e o texto, entre nós e um autor que se \ntorna real(2). Um livro bom é um diálogo sem \nfim(3).” (Antônio Lobo Antunes) \nConsiderando os elementos identificados por \nnúmeros no enunciado acima, assinale a \nafirmativa correta: \n(A) (1) é um adjetivo que qualifica “um bom \nlivro”. \n(B) (3) é uma locução adjetiva que qualifica “um \nlivro bom”. \n(C) (2) é uma locução adjetiva que qualifica \n“nós”. \n(D) (3) é uma oração adjetiva que qualifica “um \nbom livro”. \n(E) (2) é uma oração adjetiva que qualifica “um \nautor”.", "source": "Jeriquara · Orientador Educacional", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q08", "n": 8, "area": "LP", "eixo": "LP13", "topic": "Redação oficial", "key": "B", "img": "img/JER26-ORI-Q08.webp", "pages": ["img/JER26-ORI-p3.webp"], "base": null, "text": "QUESTÃO 08 \nEm relação à redação técnica oficial, é correto \nafirmar que a linguagem deve apresentar-se: \n(A) de forma subjetiva, indireta, com repetições, \ncom coesão e coerência. \n(B) de forma objetiva, direta, sem redundâncias, \ncom coesão e coerência. \n(C) com o máximo de detalhismo e redundância \npossível, para firmar o conteúdo. \n(D) com muita criatividade, aproximando-se da \nmodalidade poética e literária. \n(E) com períodos longos, com poucos pontos-\nfinais, para economizar espaço.", "source": "Jeriquara · Orientador Educacional", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q09", "n": 9, "area": "LP", "eixo": "LP13", "topic": "Redação oficial", "key": "A", "img": "img/JER26-ORI-Q09.webp", "pages": ["img/JER26-ORI-p3.webp"], "base": null, "text": "QUESTÃO 09 \nEntre os documentos comuns na comunicação \ntécnica oficial, qual é o objetivo principal de uma \nata? \n(A) Fazer o registro dos fatos e decisões de uma \nreunião, sessão ou assembleia. \n(B) Delegar o poder de decisão de uma pessoa \nfísica ou jurídica para outra. \n(C) Apresentar um pedido de um conjunto de \npessoas. \n(D) Declarar um fato sobre uma pessoa física. \n(E) Realizar uma sindicância.", "source": "Jeriquara · Orientador Educacional", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q10", "n": 10, "area": "LP", "eixo": "LP08", "topic": "Sintaxe", "key": "D", "img": "img/JER26-ORI-Q10.webp", "pages": ["img/JER26-ORI-p4.webp"], "base": null, "text": "QUESTÃO 10 \n \nBECK, Alexandre. Tiras de Armandinho. Disponível em <https://fotografia.folha.uol.com.br/galerias/27431-tiras-de-\narmandinho>. \n \nNa oração “Preconceito se trata com educação!”, empregada na charge acima, é correto afirmar que: \n(A) “se” é um pronome reflexivo. \n(B) “com educação” indica finalidade. \n(C) “Educação” é o sujeito na voz passiva. \n(D) “Preconceito” é o sujeito na voz passiva. \n(E) “se trata” apresenta sujeito indeterminado. \n \nMATEMÁTICA E RACIOCÍNIO LÓGICO", "source": "Jeriquara · Orientador Educacional", "p": 4, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q13", "n": 13, "area": "MRL", "eixo": "MRL01", "topic": "Números e operações", "key": "E", "img": "img/JER26-ORI-Q13.webp", "pages": ["img/JER26-ORI-p5.webp"], "base": null, "text": "QUESTÃO 13 \nQual é o resultado da seguinte operação: \n3\n10 +  0,2 + \n5\n(0,01 . 500) = ? \n(A) 0,3 \n(B) 0,5 \n(C) 1,0 \n(D) 1,25 \n(E) 1,5", "source": "Jeriquara · Orientador Educacional", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": ["Números e operações"]}, {"id": "JER26-ORI-Q14", "n": 14, "area": "MRL", "eixo": "MRL02", "topic": "MMC e MDC", "key": "C", "img": "img/JER26-ORI-Q14.webp", "pages": ["img/JER26-ORI-p5.webp"], "base": null, "text": "QUESTÃO 14 \nConsidere os números 4 e 256. Assinale a \nalternativa \nque \napresenta \ncorretamente \no \nMáximo Divisor Comum (MDC) desses dois \nnúmeros: \n(A) 2 \n(B) 3 \n(C) 4 \n(D) 5 \n(E) 6", "source": "Jeriquara · Orientador Educacional", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q15", "n": 15, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "A", "img": "img/JER26-ORI-Q15.webp", "pages": ["img/JER26-ORI-p5.webp"], "base": null, "text": "QUESTÃO 15 \nA soma de dois números é 49. Se a razão entre \nesses números é 𝑎: 𝑏= 2: 5, quais são os valores \ndos números?  \nAssinale a alternativa que apresenta os valores de \na e b, mantendo a proporção a:b = 2:5, cuja soma \né 49: \n(A) a = 14 e b = 35 \n(B) a = 35 e b = 14 \n(C) a = 25 e b = 10 \n(D) a = 2 e b = 5 \n(E) a = 21 e b = 28", "source": "Jeriquara · Orientador Educacional", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q16", "n": 16, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "D", "img": "img/JER26-ORI-Q16.webp", "pages": ["img/JER26-ORI-p5.webp"], "base": null, "text": "QUESTÃO 16 \nAnalise as afirmativas a seguir, referentes a \nporcentagens. Em seguida, assinale a alternativa \ncorreta: \nI. 40% de 250 é igual a 100. \nII. Um aumento de 30% sobre 200 resulta em \n280. \nIII. 12% de 500 é igual a 60. \nIV. Reduzir um valor em 20% e depois aumentar \n20% nesse novo valor retorna ao valor inicial. \n(A) I, II, III e IV estão corretas. \n(B) Apenas I, II e III estão corretas. \n(C) Apenas II e III estão corretas. \n(D) Apenas I e III estão corretas. \n(E) Apenas I e IV estão corretas.", "source": "Jeriquara · Orientador Educacional", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q17", "n": 17, "area": "MRL", "eixo": "MRL05", "topic": "Regra de três", "key": "D", "img": "img/JER26-ORI-Q17.webp", "pages": ["img/JER26-ORI-p5.webp"], "base": null, "text": "QUESTÃO 17 \nUma fabricante japonesa de jet ski produz 260 \nunidades por semana. Assumindo que o ritmo de \nprodução se mantenha, assinale a alternativa que \nindica quantas unidades serão produzidas em 4 \nsemanas: \n(A) 260 unidades \n(B) 520 unidades \n(C) 780 unidades \n(D) 1.040 unidades  \n(E) 1.300 unidades", "source": "Jeriquara · Orientador Educacional", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q18", "n": 18, "area": "MRL", "eixo": "MRL06", "topic": "Médias", "key": "A", "img": "img/JER26-ORI-Q18.webp", "pages": ["img/JER26-ORI-p6.webp"], "base": null, "text": "QUESTÃO 18 \nO investigador Mustafá está analisando um caso \nde roubo em uma joalheria. O assaltante abriu o \ncofre digitando uma senha de quatro dígitos, mas \na única pista deixada para trás foi um papel com \nos seguintes números escritos: \n \n1482, 1496, 1510 e 1520 \n \nO detetive suspeita que o criminoso anotou esses \nnúmeros porque estão relacionados à senha \nutilizada no cofre. Após analisar os padrões, \nMustafá percebe que há um detalhe matemático \nimportante: a média aritmética dos números pode \nrevelar o código! \nCom base na pista encontrada, qual foi a senha \nutilizada para abrir o cofre? \n(A) 1502 \n(B) 0502 \n(C) 1515 \n(D) 1489 \n(E) 2051", "source": "Jeriquara · Orientador Educacional", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q19", "n": 19, "area": "MRL", "eixo": "MRL08", "topic": "Equações e sistemas", "key": "A", "img": "img/JER26-ORI-Q19.webp", "pages": ["img/JER26-ORI-p6.webp"], "base": null, "text": "QUESTÃO 19 \nRubens e Fabiana decidiram vender ingressos \npara um evento cultural em sua escola. Rubens \nvendeu apenas ingressos do tipo A, enquanto \nFabiana vendeu apenas ingressos do tipo B. Ao \nfinal do dia, eles somaram as vendas, que \ntotalizaram 48 ingressos vendidos e um valor \ntotal arrecadado de R$ 624,00. \nConsiderando que o ingresso tipo A custa \nR$ 12,00 e o tipo B custa R$ 18,00, qual é a \nquantidade de ingressos vendidos por Rubens e \npor Fabiana, respectivamente?  \nAssinale a alternativa correta. \n(A) 40 e 8 \n(B) 8 e 40 \n(C) 34 e 12 \n(D) 39 e 9 \n(E) 41 e 8", "source": "Jeriquara · Orientador Educacional", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q20", "n": 20, "area": "MRL", "eixo": "MRL13", "topic": "Sequências", "key": "B", "img": "img/JER26-ORI-Q20.webp", "pages": ["img/JER26-ORI-p6.webp"], "base": null, "text": "QUESTÃO 20 \nDurante uma partida de futebol, Jair percebeu \nque as cadeiras de uma seção do estádio \ncontinham uma numeração que seguia a seguinte \nsequência numérica: \n2, 4, 6, 8, 10, ...𝑎𝑛 \nSe essa lógica continuar, qual será o número da \n7ª cadeira da seção do estádio? \nAssinale a alternativa correta. \n(A) 12 \n(B) 14 \n(C) 16 \n(D) 18 \n(E) 20 \n \nNOÇÕES DE INFORMÁTICA", "source": "Jeriquara · Orientador Educacional", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q21", "n": 21, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "C", "img": "img/JER26-ORI-Q21.webp", "pages": ["img/JER26-ORI-p6.webp"], "base": null, "text": "QUESTÃO 21 \nAo salvar relatórios, formulários ou textos \nelaborados no computador institucional, o \nservidor público pode optar por diferentes locais \nde armazenamento. Considerando o conceito de \npastas no Windows e sua utilização no dia a dia \nprofissional, assinale a alternativa correta: \n(A) As pastas disponibilizadas ao usuário no \nWindows são criadas manualmente sempre que \num novo arquivo é salvo pela primeira vez. \n(B) A pasta denominada “Área de Trabalho” tem \nuso exclusivo do sistema operacional, não \npermitindo o armazenamento de arquivos criados \npelo usuário. \n(C) A pasta “Documentos” é um dos diretórios \ncriados automaticamente para cada usuário e \npode ser utilizada como local padrão para o \narmazenamento de arquivos de texto e materiais \nsimilares. \n(D) Arquivos só podem ser salvos no local \npreviamente indicado pelo sistema, não sendo \npossível escolher outra pasta no momento do \nsalvamento. \n(E) As pastas “Imagens”, “Músicas” e “Vídeos” \nexistem apenas quando o usuário instala \nprogramas específicos para esse tipo de arquivo.", "source": "Jeriquara · Orientador Educacional", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q23", "n": 23, "area": "INF", "eixo": "INF02", "topic": "Word", "key": "E", "img": "img/JER26-ORI-Q23.webp", "pages": ["img/JER26-ORI-p7.webp"], "base": null, "text": "QUESTÃO 23 \nDurante a preparação de um relatório oficial no \nMicrosoft Word, o servidor público necessita \najustar os espaços entre o conteúdo do texto e as \nbordas da página. Considerando a estrutura e os \nrecursos do programa, assinale a alternativa \ncorreta: \n(A) As margens das páginas são fixas e não \npodem ser alteradas pelo usuário após a criação \ndo documento. \n(B) O Word permite apenas a escolha de um \núnico modelo de margem, sem possibilidade de \npersonalização. \n(C) \nA \nalteração \ndas \nmargens \ninterfere \nexclusivamente no tamanho da fonte, não \nafetando a área útil da página. \n(D) As margens só podem ser ajustadas antes de \nqualquer texto ser digitado, sendo bloqueadas \napós o salvamento do arquivo. \n(E) É possível modificar as margens do \ndocumento por meio das opções de layout da \npágina, escolhendo valores predefinidos ou \nconfigurando medidas específicas.", "source": "Jeriquara · Orientador Educacional", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q24", "n": 24, "area": "INF", "eixo": "INF03", "topic": "Excel", "key": "A", "img": "img/JER26-ORI-Q24.webp", "pages": ["img/JER26-ORI-p7.webp"], "base": null, "text": "QUESTÃO 24 \nSobre a elaboração de tabelas e gráficos \nutilizando o software Microsoft Excel, assinale a \nalternativa que completa corretamente a lacuna \ndo texto a seguir: \nUma ____________ é um instrumento poderoso \npara calcular, resumir e analisar os dados que lhe \npossibilita \nver \ncomparações, \npadrões \ne \ntendências nos dados. \n(A) Tabela Dinâmica \n(B) Adjacência \n(C) Revisão Analítica \n(D) Referência \n(E) Tradução", "source": "Jeriquara · Orientador Educacional", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q25", "n": 25, "area": "INF", "eixo": "INF06", "topic": "Internet e segurança", "key": "B", "img": "img/JER26-ORI-Q25.webp", "pages": ["img/JER26-ORI-p7.webp"], "base": null, "text": "QUESTÃO 25 \nAssinale a alternativa que descreve como são \nconhecidos os programas de computador que \nhabilitam seus usuários a interagirem com \npáginas da web: \n(A) Selenium. \n(B) Browser. \n(C) Backup. \n(D) Black. \n(E) Catálogo. \n \nCONHECIMENTOS ESPECÍFICOS", "source": "Jeriquara · Orientador Educacional", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q26", "n": 26, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "E", "img": "img/JER26-ORI-Q26.webp", "pages": ["img/JER26-ORI-p7.webp"], "base": null, "text": "QUESTÃO 26 \nA Orientação Educacional passou por diferentes \nabordagens teóricas ao longo de sua história no \nBrasil. A perspectiva crítica, fundamentada em \nPaulo Freire, compreende a prática orientadora \ncomo \nprocesso \nde \nconscientização \ne \ntransformação \nsocial. \nEssa \nabordagem \ncaracteriza-se pela ênfase na: \n(A) Adaptação social. \n(B) Higiene mental. \n(C) Orientação vocacional. \n(D) Psicometria educacional. \n(E) Emancipação crítica.", "source": "Jeriquara · Orientador Educacional", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": "Paulo Freire", "secondary": []}, {"id": "JER26-ORI-Q27", "n": 27, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "C", "img": "img/JER26-ORI-Q27.webp", "pages": ["img/JER26-ORI-p8.webp"], "base": null, "text": "QUESTÃO 27 \nO trabalho coletivo na escola pressupõe \ndiferentes níveis de integração profissional. \nQuando orientadores educacionais, professores e \npsicólogos atuam de forma justaposta, cada um \nem \nsua \nespecialidade \nsem \nintegração \nmetodológica, essa prática caracteriza trabalho: \n(A) Interdisciplinar. \n(B) Transdisciplinar. \n(C) Multidisciplinar. \n(D) Pluridisciplinar. \n(E) Integrado.", "source": "Jeriquara · Orientador Educacional", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q28", "n": 28, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "A", "img": "img/JER26-ORI-Q28.webp", "pages": ["img/JER26-ORI-p8.webp"], "base": null, "text": "QUESTÃO 28 \nA construção coletiva do Projeto Político-\nPedagógico constitui eixo central da gestão \ndemocrática. O orientador educacional atua \ncomo articulador entre diferentes segmentos da \ncomunidade escolar nesse processo. O princípio \nque fundamenta essa participação ampliada é a: \n(A) Autonomia coletiva. \n(B) Centralização pedagógica. \n(C) Hierarquia funcional. \n(D) Verticalização decisória. \n(E) Representatividade formal.", "source": "Jeriquara · Orientador Educacional", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q29", "n": 29, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "D", "img": "img/JER26-ORI-Q29.webp", "pages": ["img/JER26-ORI-p8.webp"], "base": null, "text": "QUESTÃO 29 \nA mediação escolar constitui competência \nfundamental do orientador educacional nas \nrelações interpessoais. Durante conflito entre \ndocentes sobre metodologias divergentes, a \npostura mediadora adequada baseia-se no \nprincípio da: \n(A) Autoridade hierárquica. \n(B) Neutralidade técnica. \n(C) Imposição consensual. \n(D) Imparcialidade ativa. \n(E) Omissão estratégica.", "source": "Jeriquara · Orientador Educacional", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q30", "n": 30, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "B", "img": "img/JER26-ORI-Q30.webp", "pages": ["img/JER26-ORI-p8.webp"], "base": null, "text": "QUESTÃO 30 \nAs teorias das relações humanas aplicadas à \neducação enfatizam aspectos socioemocionais do \ntrabalho coletivo. A abordagem que reconhece \nimportância de grupos informais, motivação \nintrínseca e clima organizacional nas relações \nescolares fundamenta-se em: \n(A) Taylorismo educacional. \n(B) Escola das Relações Humanas. \n(C) Administração Científica. \n(D) Burocracia weberiana. \n(E) Gestão por competências.", "source": "Jeriquara · Orientador Educacional", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q34", "n": 34, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "D", "img": "img/JER26-ORI-Q34.webp", "pages": ["img/JER26-ORI-p9.webp"], "base": null, "text": "QUESTÃO 34 \n O documento de Pluralidade Cultural propõe o \ncombate a todas as formas de discriminação. A \natitude psicológica e social caracterizada pela \nvisão de mundo onde o indivíduo considera o seu \npróprio grupo étnico ou cultura como o centro de \ntudo e superior aos demais é definida como: \n(A) Racismo. \n(B) Preconceito. \n(C) Estereótipo. \n(D) Etnocentrismo. \n(E) Segregação.", "source": "Jeriquara · Orientador Educacional", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q35", "n": 35, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "E", "img": "img/JER26-ORI-Q35.webp", "pages": ["img/JER26-ORI-p9.webp"], "base": null, "text": "QUESTÃO 35 \nA concepção de avaliação nos PCN afasta-se da \nfunção meramente classificatória ou punitiva. \nPara orientar a intervenção pedagógica e ajustar \no processo de ensino às necessidades dos alunos, \na avaliação deve assumir um caráter contínuo, \nsistemático e fundamentalmente: \n(A) Seletivo. \n(B) Excludente. \n(C) Somativo. \n(D) Comparativo. \n(E) Diagnóstico.", "source": "Jeriquara · Orientador Educacional", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q36", "n": 36, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "E", "img": "img/JER26-ORI-Q36.webp", "pages": ["img/JER26-ORI-p9.webp"], "base": null, "text": "QUESTÃO 36 \nEm uma reunião pedagógica para resolver um \nproblema complexo de fluxo de alunos, a técnica \nde dinâmica de grupo
