TÃO 12 \nObserve a tabela de preços de uma sorveteria: \nSorvete \nValor \n1 Bola \nR$ 8,00 \n2 Bolas \nR$ 14,00 \n3 Bolas \nR$ 18,00 \n \nSe a sorveteria vender 120 bolas de sorvete por \ndia, indique a diferença entre a receita (valor total \narrecadado) obtida pela sorveteria caso todas as \nvendas do dia fossem de sorvetes de 3 bolas, e \ncaso todas fossem de sorvetes de 1 bola: \n(A) R$ 170,00. \n(B) R$ 410,00. \n(C) R$ 240,00. \n(D) R$ 140,00. \n(E) R$ 120,00.", "source": "Caieiras · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q13", "n": 13, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "D", "img": "img/CAI25-DIR-Q13.webp", "pages": ["img/CAI25-DIR-p4.webp"], "base": null, "text": "QUESTÃO 13 \nUm hexágono é construído a partir de seis \ntriângulos equiláteros de lado L, conforme a \nfigura à esquerda: \n \nJá a figura à direita mostra o mesmo hexágono \nevidenciando duas diferentes diagonais, que são \nos segmentos AE e BE. Indique o comprimento \nda diagonal AE considerando que o lado L mede \n1 cm: \n(A) √5. \n(B) √2. \n(C) 2√2. \n(D) √3. \n(E) 3√3.", "source": "Caieiras · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q14", "n": 14, "area": "MRL", "eixo": "MRL10", "topic": "Medidas e conversões", "key": "D", "img": "img/CAI25-DIR-Q14.webp", "pages": ["img/CAI25-DIR-p4.webp"], "base": null, "text": "QUESTÃO 14 \nUm papel de formato retangular tem largura 1 \nmetro e comprimento 2 metros. A partir desse \npapel serão recortados quadradinhos de 1 mm de \nlado. Qual o maior número de quadradinhos que \npoderão ser recortados? \n(A) 2 mil. \n(B) 20 mil. \n(C) 200 mil. \n(D) 2 milhões. \n(E) 20 milhões.", "source": "Caieiras · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q15", "n": 15, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "A", "img": "img/CAI25-DIR-Q15.webp", "pages": ["img/CAI25-DIR-p5.webp"], "base": null, "text": "QUESTÃO 15 \nUm estudante pega um pedaço quadrado de \npapel, cujo lado é 10 cm, e corta-o ao meio. \nDepois ele pega um dos pedaços cortados e corta-\no ao meio novamente de modo a formar dois \nnovos quadrados. Qual o perímetro de um desses \nnovos quadrados resultantes? \n(A) 20 cm. \n(B) 5 cm. \n(C) 8 cm. \n(D) 25 cm. \n(E) 12 cm.", "source": "Caieiras · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q16", "n": 16, "area": "MRL", "eixo": "MRL06", "topic": "Médias", "key": "B", "img": "img/CAI25-DIR-Q16.webp", "pages": ["img/CAI25-DIR-p5.webp"], "base": null, "text": "QUESTÃO 16 \nUm time jogou 30 partidas num campeonato de \nfutebol. A cada partida vencida, o time ganha 3 \npontos. A cada partida empatada, o time ganha 1 \nponto. E a cada partida perdida, o time não \npontua. Sabe-se que a média de pontos por \npartida do time foi de 1,2 pontos. Sabendo-se \nainda que o time empatou 6 partidas, quantas \npartidas o time perdeu? \n(A) 10. \n(B) 14.  \n(C) 6. \n(D) 5. \n(E) 4.", "source": "Caieiras · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q17", "n": 17, "area": "MRL", "eixo": "MRL01", "topic": "Números e operações", "key": "E", "img": "img/CAI25-DIR-Q17.webp", "pages": ["img/CAI25-DIR-p5.webp"], "base": null, "text": "QUESTÃO 17 \nO resultado da operação: \n1\n5 −1\n4 \nResulta em um número: \n(A) Maior que 0,05. \n(B) Menor que −0,5. \n(C) Menor que −0,1. \n(D) Menor que 0,5 e maior que 0. \n(E) Menor que 0,1 e maior que −0,5.", "source": "Caieiras · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q18", "n": 18, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "E", "img": "img/CAI25-DIR-Q18.webp", "pages": ["img/CAI25-DIR-p5.webp"], "base": null, "text": "QUESTÃO 18 \nUm curso preparatório oferece desconto na \nmensalidade aos estudantes mais bem-colocados \nem um simulado. Aos 5 primeiros colocados, o \ncurso oferece 100% de desconto, aos 10 \nseguintes oferece 50% de desconto e aos 10 \nseguintes oferece 20% de desconto. Sabendo-se \nque a mensalidade do curso é R$ 120,00, qual o \nvalor investido mensalmente em desconto pelo \ncurso? \n(A) R$ 2.400,00. \n(B) R$ 890,00. \n(C) R$ 1.200,00. \n(D) R$ 600,00. \n(E) R$ 1.440,00.", "source": "Caieiras · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q19", "n": 19, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "B", "img": "img/CAI25-DIR-Q19.webp", "pages": ["img/CAI25-DIR-p5.webp"], "base": null, "text": "QUESTÃO 19 \nUm cliente aplicou R$ 1.200,00 na sua conta \nbancária. Suponha que o banco cobra 1% do \nvalor aplicado para cobrir taxas administrativas. \nApós a cobrança, quanto ficará o saldo do \ncliente? \n(A) R$ 1.140,00. \n(B) R$ 1.188,00.  \n(C) R$ 1.199,00. \n(D) R$ 1.190,00. \n(E) R$ 1.180,00.", "source": "Caieiras · Diretor de Escola", "p": 5, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q20", "n": 20, "area": "MRL", "eixo": "MRL09", "topic": "Tabelas e gráficos", "key": "C", "img": "img/CAI25-DIR-Q20.webp", "pages": ["img/CAI25-DIR-p6.webp"], "base": null, "text": "QUESTÃO 20 \nA figura abaixo mostra o número de eventos de precipitação extrema, com chuva acima de 80 e 100 \nmilímetros/dia, na região metropolitana de São Paulo, desde 1970 até 2020: \n \nFonte: Adaptado de Jornal da USP. Disponível em: https://jornal.usp.br/ciencias/ciencias-ambientais/dados-\ncomprovam-aumento-de-eventos-climaticos-extremos-em-sao-paulo/. Acesso em 10/12/2024. \nAnalisando o gráfico, é correto afirmar que: \n(A) Os eventos de precipitação extrema se mantiveram constantes nos 50 anos investigados. \n(B) Em alguma década investigada, o número de chuvas acima de 100 mm/dia foi maior que o número \nde chuvas acima de 80 mm/dia. \n(C) Em todas as décadas a partir de 1981 observou-se o aumento no número de chuvas acima de 100 \nmm/dia, em comparação à década anterior. \n(D) Na década de 2001-2010, houve um crescimento muito elevado (mais de 100%) no número de \nchuvas acima de 100 mm/dia, em relação à década anterior. \n(E) Entre 1971 e 2000, observou-se um progressivo crescimento no número de chuvas acima de 80 \nmm/dia. \n \nNOÇÕES DE INFORMÁTICA", "source": "Caieiras · Diretor de Escola", "p": 6, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q22", "n": 22, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "A", "img": "img/CAI25-DIR-Q22.webp", "pages": ["img/CAI25-DIR-p7.webp"], "base": null, "text": "QUESTÃO 22 \nNo sistema operacional Windows, o comando \nAlt + Tab tem a função de:  \n(A) Alternar entre os aplicativos abertos \nenquanto pressiona Tab várias vezes. \n(B) Atualiza a janela atual. \n(C) Move o cursor para o início do próximo \nparágrafo. \n(D) Altera o layout do teclado. \n(E) Executa o aplicativo como administrador da \nBarra de tarefas.", "source": "Caieiras · Diretor de Escola", "p": 7, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q24", "n": 24, "area": "INF", "eixo": "INF06", "topic": "Internet e segurança", "key": "D", "img": "img/CAI25-DIR-Q24.webp", "pages": ["img/CAI25-DIR-p7.webp"], "base": null, "text": "QUESTÃO 24 \nNo âmbito das tecnologias de rede e navegação \nna internet, existem sistemas que permitem o \ncompartilhamento de informações de forma \ninterna, segura e organizada, sendo utilizados \npara facilitar a comunicação e a gestão de dados \ndentro de uma organização. \nUm sistema semelhante à Internet, mas que é \nrestrito ao uso interno dos colaboradores de uma \nempresa, é denominado:  \n(A) Extranet. \n(B) VNP. \n(C) LANT. \n(D) Intranet. \n(E) WANT.", "source": "Caieiras · Diretor de Escola", "p": 7, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q28", "n": 28, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "E", "img": "img/CAI25-DIR-Q28.webp", "pages": ["img/CAI25-DIR-p8.webp"], "base": null, "text": "QUESTÃO 28 \nPor meio do CEDAC, é possível ter uma \ndimensão da importância do regimento escolar, \numa vez que ele estabelece as diretrizes \nadministrativas e as orientações para a vida \nescolar em conformidade com a legislação \nnacional vigente. De acordo com o texto em \nquestão, observa-se que o regimento interno \nmaterializa o Projeto Político Pedagógico na \nforma de: \nI - procedimentos \nII – funções \nIII – regras \nIV – composição de cada um dos diferentes \nsegmentos e setores da unidade \nÉ verdadeiro o que se afirma em: \n(A) I, II, III, IV \n(B) I, II e III apenas \n(C) II, III e IV apenas \n(D) I, III e IV apenas \n(E) I, II e IV apenas", "source": "Caieiras · Diretor de Escola", "p": 8, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q29", "n": 29, "area": "CE", "eixo": "CE07", "topic": "Didática e metodologias", "key": "D", "img": "img/CAI25-DIR-Q29.webp", "pages": ["img/CAI25-DIR-p8.webp"], "base": null, "text": "QUESTÃO 29 \nUma das formas de pensar a organização da \nescola \ncentrada \nno \ndesenvolvimento \ndo \neducando é por meio das metodologias ativas. \nDentro dessa sistemática, Bacich e Moran (2018) \nafirmam que as escolas têm demonstrado uma \nmudança de postura, em que se observa modelos \nmais centrados no aprendizado ativo, por meio \ndos aspectos abaixo elencados. No entanto, há \num erro conceitual em uma das alternativas, \nassinale-a: \n(A) valores fundamentais \n(B) jogos, atividades e leituras \n(C) desafios relevantes \n(D) ênfase nos tempos individuais \n(E) projetos pessoais, de vida e de aprendizagem", "source": "Caieiras · Diretor de Escola", "p": 8, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q31", "n": 31, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "D", "img": "img/CAI25-DIR-Q31.webp", "pages": ["img/CAI25-DIR-p9.webp"], "base": null, "text": "QUESTÃO 31 \nAo analisar as políticas educacionais, tomando \npor parâmetro as reflexões de Ilona Becskeházy, \npautada na realidade dos anos 1980, é pertinente \nafirmar: \n(A) A descentralização é uma ação contrária à \ndemocratização do ensino. \n(B) Ao analisar a relação democracia e \ndescentralização, \nobserva-se \nque \na \nmunicipalização do ensino exerce uma força \ncontrária, dificultando esse tipo de interação. \n(C) Por meio da LDB, observa-se que a \ndescentralização do ensino ocorre do nível \nfederal para o nível municipal. \n(D) No que se refere à descentralização, observa-\nse que esse conceito possui uma amplitude vaga \ne ambíguo, marcada por fatores de ordem política \n(divergências entre direita e esquerda). \n(E) A simples administração local do ensino \nrepresenta por si só uma garantia da construção \nde um sistema democrático de ensino.", "source": "Caieiras · Diretor de Escola", "p": 9, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q32", "n": 32, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "A", "img": "img/CAI25-DIR-Q32.webp", "pages": ["img/CAI25-DIR-p9.webp"], "base": null, "text": "QUESTÃO 32 \nO compromisso político assumido tem como \nrespaldo os direitos humanos. Segundo o \nCaderno de Educação em Direitos Humanos, os \ndireitos humanos são pautados em uma série de \ncaracterísticas, como as destacadas abaixo. \nAnalise \ncada \ncaracterística, \nmarque \nV \n(Verdadeiro) e F (falso) e, posteriormente, a \nalternativa pertinente. \n[...] Universalidade – obriga Estado e sociedade \na respeitarem os direitos humanos sem quaisquer \ntipos de restrição. \n[...] Indivisibilidade – significa que a violação de \nqualquer direito gera violações de numerosos \noutros. \n[...] Inviolabilidade – estabelece que os direitos \nhumanos não podem ser desrespeitados, sob pena \nde \nresponsabilidades \ncivis, \npenais \ne \nadministrativas. \n[...] Imprescritibilidade – refere-se ao fato de que \no decurso do tempo não pode elidir os direitos \nhumanos, como no caso de racismo e tortura. \nÉ verdadeiro o que se afirma em:  \n(A) V, V, V, V \n(B) V, F, V, V \n(C) F, V, V, V  \n(D) V, V, F, V \n(E) V, V, V, F", "source": "Caieiras · Diretor de Escola", "p": 9, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q33", "n": 33, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "B", "img": "img/CAI25-DIR-Q33.webp", "pages": ["img/CAI25-DIR-p10.webp"], "base": null, "text": "QUESTÃO 33 \nHá \nvários \ninstrumentos \nque \nauxiliam \na \nconsecução do planejamento escolar, como por \nexemplo, o Plano de Desenvolvimento da Escola \n(PDE-Escola). De acordo com o documento: \n“Como Elaborar o Plano de Desenvolvimento da \nEscola: aumentando o desempenho da escola por \nmeio do planejamento eficaz”, analise o excerto \nabaixo, \ncompletando-o \ncom \nos \ntermos \ncorrespondentes. \nPara começar a elaboração do PDE-Escola, a \nequipe escolar deve seguir algumas etapas como \na de preparação, organização e divulgação para \nelaboração, em seguida deve se fazer um \ndiagnóstico da realidade ou análise situacional da \nescola. \nA \npartir \ndeste \ndiagnóstico, \né \nimprescindível \na \ndefinição \nda \nvisão \n_____________ \ne \no \nplano \nde \nsuporte \n___________, posteriormente a execução do \nplano de ações determinadas pela escola e por \núltimo monitoramento e avaliação das ações e \ndos resultados alcançados (BRASIL, 2006, \np.24). \n(A) tática / operacional \n(B) estratégica / estratégico \n(C) operacional / tático \n(D) global / individual \n(E) individual / global", "source": "Caieiras · Diretor de Escola", "p": 10, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q34", "n": 34, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "A", "img": "img/CAI25-DIR-Q34.webp", "pages": ["img/CAI25-DIR-p10.webp"], "base": null, "text": "QUESTÃO 34 \nO ensino fundamental obrigatório, com duração \nde 9 (nove) anos, gratuito na escola pública, \niniciando-se aos 6 (seis) anos de idade, terá por \nobjetivo a formação básica do cidadão. Nesse \nsentido, quais são os meios básicos, definidos por \nmeio do artigo 32 da LDB, a serem considerados \nno desenvolvimento da capacidade de aprender? \n(A) Pleno domínio da leitura, da escrita e do \ncálculo. \n(B) Pleno domínio da leitura e da escrita. \n(C) Domínio intermediário da leitura, da escrita \ne do cálculo. \n(D) Domínio progressivo da leitura, da escrita e \ndo cálculo. \n(E) Pleno domínio da leitura e da escrita e \ndomínio básico do cálculo.", "source": "Caieiras · Diretor de Escola", "p": 10, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q35", "n": 35, "area": "CE", "eixo": "CE08", "topic": "Ensino por competências", "key": "B", "img": "img/CAI25-DIR-Q35.webp", "pages": ["img/CAI25-DIR-p10.webp"], "base": null, "text": "QUESTÃO 35 \nA prática pedagógica adotada influencia a \ndimensão sociopolítica do papel tanto do \nprofessor como do gestor educacional. Delors \n(2001), em sua obra: Educação: um tesouro a \ndescobrir, \ndetalha \nquatro \npilares \ndo \nconhecimento, explicitados abaixo: \nI – Aprender a conhecer = interesse \nII – Aprender a fazer = coragem de executar, de \ncorrer riscos, de errar mesmo na busca de acertar. \nIII – Aprender a conviver = desafio da \nconvivência. \nIV – Aprender a ser = menos importante, pois \nnão possui relação com a dimensão profissional, \nmas apenas subjetiva. \nÉ verdadeiro o que se afirma em: \n(A) I, II, III e IV \n(B) I, II e III apenas \n(C) II, III e IV apenas \n(D) I, III e IV apenas \n(E) I, II e IV apenas", "source": "Caieiras · Diretor de Escola", "p": 10, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q37", "n": 37, "area": "CE", "eixo": "CE15", "topic": "Tecnologias educacionais", "key": "D", "img": "img/CAI25-DIR-Q37.webp", "pages": ["img/CAI25-DIR-p11.webp"], "base": null, "text": "QUESTÃO 37 \nO \nambiente \neducacional \né \num \nfator \npreponderante na construção de um processo \nensino aprendizagem pautado em uma vivência \nprazerosa. São inúmeras estratégias que podem \nser implementadas nesse sentido, como por \nexemplo, o ensino híbrido que é discutido por \nmeio da obra de Bacich, Tanzi e Trevisani.  \nEm \nobservância \naos \nponderamentos \ndos \nreferidos autores, assinale V (verdadeiro) e F \n(falso) \ne, \nposteriormente, \na \nalternativa \ncorrespondente. \n[...] O ensino híbrido acompanha a educação, \numa vez que o aprendizado ocorre tanto em \nprocessos organizados como informais. \n[...] A metodologia híbrida oportuniza desafios \nque estimulam o aprendizado do aluno, a partir \nde \natividades \nenvolvendo \nresolução \nde \nproblemas ou criação de projetos complexos. \n[...] A metodologia híbrida tem maior efetividade \nquando direcionada ao aluno individualmente. \n[...] A metodologia híbrida é considerada como \num método flexível, dando autonomia para se \npersonalizar e planejar o que é fundamental para \natender às necessidades de cada aluno. \n(A) V, V, V, V \n(B) V, F, V, F \n(C) V, V, F, F \n(D) V, V, F, V \n(E) F, V, F, V", "source": "Caieiras · Diretor de Escola", "p": 11, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q38", "n": 38, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "D", "img": "img/CAI25-DIR-Q38.webp", "pages": ["img/CAI25-DIR-p11.webp"], "base": null, "text": "QUESTÃO 38 \nHá inúmeras formas de avaliação que podem ser \nimplementadas \nno \nintuito \nde \navaliar \ne \nacompanhar o rendimento escolar do educando. \nUma dessas formas é a avaliação escolar \nformativa que possui uma de suas características \ndescrita por meio de qual alternativa? \n(A) É normalmente aplicada ao final de um \ndeterminado ciclo e/ou unidade letiva. \n(B) É considerada a mais comum pelo sistema de \nensino do Brasil. \n(C) \nConsidera-se \ndesde \nhabilidades \ne \ncompetências até pontos fortes e fracos que \npermitem que a escola elabore um plano \npedagógico que considere as necessidades do \naluno.  \n(D) Seu objetivo é medir o desempenho do aluno \nao longo do ensino-aprendizagem oferecido pela \nescola, sendo realizada várias vezes ao longo do \nano letivo, em diferentes contextos. \n(E) Abrange apenas uma parte do material \napresentado ao aluno, sendo considerado \nimportante enviar os resultados dessa avaliação \nescolar para a família do estudante acompanhar o \nprocesso de aprendizagem.", "source": "Caieiras · Diretor de Escola", "p": 11, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q39", "n": 39, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "D", "img": "img/CAI25-DIR-Q39.webp", "pages": ["img/CAI25-DIR-p11.webp"], "base": null, "text": "QUESTÃO 39 \nA gestão de projetos depende do planejamento, \nseleção e organização dos conteúdos a serem \ntrabalhados. Alguns aspectos relativos a essas \nvariáveis foram contextualizados por Heloísa \nLück. De acordo com a perspectiva da autora, \nqual das alternativas abaixo refere-se ao processo \nde interligação entre membros da comunidade \ninterna e externa da escola? \n(A)  Planejamento do trabalho escolar \n(B) Princípios da educação e da gestão escolar \n(C) Organização do trabalho escolar \n(D)  Gestão democrática e participativa \n(E)  Avaliação institucional", "source": "Caieiras · Diretor de Escola", "p": 11, "role": "both", "preferred": "DIR", "fallback": false, "author": "Heloísa Lück", "secondary": []}, {"id": "CAI25-DIR-Q41", "n": 41, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "A", "img": "img/CAI25-DIR-Q41.webp", "pages": ["img/CAI25-DIR-p12.webp"], "base": null, "text": "QUESTÃO 41 \nO planejamento escolar, dentro da perspectiva de \nParo, leva-nos a refletir acerca do amadorismo \npedagógico. Sobre o amadorismo pedagógico, \nsão verdadeiras as afirmativas abaixo, exceto: \n(A) Reconhece \na importância da teoria \npedagógica. \n(B) Ignora as práticas pedagógicas. \n(C) Favorece a adoção do mais pernicioso senso \ncomum em educação. \n(D) Perpetua o pseudoensino. \n(E) Legitima a improvisação.", "source": "Caieiras · Diretor de Escola", "p": 12, "role": "both", "preferred": "DIR", "fallback": false, "author": "Vitor Henrique Paro", "secondary": []}, {"id": "CAI25-DIR-Q42", "n": 42, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "C", "img": "img/CAI25-DIR-Q42.webp", "pages": ["img/CAI25-DIR-p12.webp"], "base": null, "text": "QUESTÃO 42 \nAnalise as asserções seguintes, a partir da obra da \nComunidade Educativa CEDAC: O que revela o \nespaço escolar?  \nI - Se partirmos do princípio de que a escola é um \nlugar de socialização, devemos ensinar os \nestudantes a lidar com os desentendimentos, não \nsimplesmente negá-los. A convivência em grupo \nacarreta conflitos, já que a relação entre \nindivíduos prevê interesses, opiniões e atitudes \ndiversas.  \nII - Dessa forma, é importante que essas questões \nestejam explicitadas no PPP da instituição. Para \nrefletir sobre o tema, podem ser propostas \nassembleias, conselhos de classe e pesquisas, \npara, assim, ajudar os alunos a compreender a \nnatureza dos problemas coletivos e a propor \nsoluções para enfrentá-los. Muitas vezes, é no \npátio ou nas quadras que se percebe a atuação de \num líder ou o isolamento de um aluno. É \nnecessário estar atento a essas relações, o que \najuda a equipe escolar a entender os problemas \nque surgem no grupo.  \n \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(D) As asserções I e II são proposições \nverdadeiras, e a II não é um complemento da I. \n(E) As asserções I e II são proposições falsas.", "source": "Caieiras · Diretor de Escola", "p": 12, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q43", "n": 43, "area": "CE", "eixo": "LEG_BNCC", "topic": "BNCC", "key": "B", "img": "img/CAI25-DIR-Q43.webp", "pages": ["img/CAI25-DIR-p13.webp"], "base": null, "text": "QUESTÃO 43 \nAnalise os enunciados abaixo, assinale o que traz \numa informação incorreta em relação à \ntranscrição literal extraída do texto da BNCC \n(Base Nacional Comum Curricular). \n(A) Em um país como o Brasil, com autonomia \ndos entes federados, acentuada diversidade \ncultural e profundas desigualdades sociais, a \nbusca por equidade na educação demanda \ncurrículos diferenciados e adequados a cada \nsistema, rede e instituição escolar. \n(B) A equidade reconhece, aprecia e acolhe os \npadrões de sociabilidade das várias culturas que \nsão parte da identidade brasileira, por meio da \nproposição de um currículo nacional. \n(C) A equidade reafirma seu compromisso de \nreverter a situação de exclusão histórica que \nmarginaliza muitos grupos minoritários – como \nos indígenas e os quilombolas – e as pessoas que \nnão \npuderam \nestudar \nou \ncompletar \nsua \nescolaridade na idade própria \n(D) A equidade supõe a igualdade de \noportunidades para ingressar, permanecer e \naprender na escola, por meio do estabelecimento \nde \num \npatamar \nde \naprendizagem \ne \ndesenvolvimento a que todos têm direito. \n(E) Se a igualdade é pactuada em nível nacional, \na equidade é efetivada nas decisões curriculares \ne didático-pedagógicas das Secretarias de \nEducação.", "source": "Caieiras · Diretor de Escola", "p": 13, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q44", "n": 44, "area": "CE", "eixo": "LEG_13257", "topic": "Marco Legal da Primeira Infância", "key": "B", "img": "img/CAI25-DIR-Q44.webp", "pages": ["img/CAI25-DIR-p13.webp"], "base": null, "text": "QUESTÃO 44 \nConforme a Lei 13.257/2016, as políticas \npúblicas voltadas ao atendimento dos direitos da \ncriança na primeira infância serão elaboradas e \nexecutadas de forma a [...]: \nI - atender ao interesse superior da criança e à sua \ncondição de sujeito de direitos e de cidadã.  \nII - incluir a participação da criança na definição \ndas ações que lhe digam respeito, em \nconformidade com suas características etárias e \nde desenvolvimento. \nIII - respeitar a individualidade e os ritmos de \ndesenvolvimento das crianças e valorizar a \ndiversidade da infância brasileira, assim como as \ndiferenças entre as crianças em seus contextos \nsociais e culturais. \nIV - reduzir as desigualdades no acesso aos bens \ne serviços que atendam aos direitos da criança na \nprimeira infância, priorizando o investimento \npúblico na promoção da justiça social, da \nequidade e da inclusão das crianças com \nnecessidades especiais. \nCompleta corretamente o enunciado anterior, as \nseguintes alternativas: \n(A) I, II, III e IV \n(B) I, II e III apenas \n(C) II, III e IV apenas \n(D) I, III e IV apenas \n(E) I, II e IV apenas", "source": "Caieiras · Diretor de Escola", "p": 13, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q46", "n": 46, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "C", "img": "img/CAI25-DIR-Q46.webp", "pages": ["img/CAI25-DIR-p14.webp"], "base": null, "text": "QUESTÃO 46 \nAo analisar o trabalho da avaliação, dentro da \nconcepção da investigação crítica, analise as \nafirmativas, marque V (verdadeiro) e F (falso) e, \nposteriormente, a alternativa correta. \n[...] A investigação crítica impossibilita o \nconfronto teórico/prático. \n[...] A investigação crítica não se constitui como \numa intervenção intencional. \n[...] A investigação crítica oportuniza a \nressignificação das ações/decisões em prol da \nresposta para o problema investigado. \n[...] A investigação crítica trabalha o âmbito \nqualitativo das questões de ordem teórica e \nsocial. \n(A) F, F, F, F \n(B) V, V, V, V \n(C) F, F, V, V \n(D) F, V, F, V \n(E) F, V, V, V", "source": "Caieiras · Diretor de Escola", "p": 14, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q47", "n": 47, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "E", "img": "img/CAI25-DIR-Q47.webp", "pages": ["img/CAI25-DIR-p14.webp"], "base": null, "text": "QUESTÃO 47 \nRetomando a obra: Gestão do Conflito Escolar: \nDa Classificação dos Conflitos aos Modelos de \nMediação, escrita por Álvaro Chrispino, assinale \na alternativa que condiz com a perspectiva do \nreferido autor. \n(A) O conflito caracteriza-se como uma situação \nque precisa ser evitada a todo custo. \n(B) O conflito não pode ser considerado como \numa manifestação natural, pois ele altera toda a \nestrutura do contexto educacional. \n(C) O conflito desregula as relações sociais. \n(D) O conflito impede a definição das \nidentidades das partes que defendem suas \nposições. \n(E) O conflito possui inúmeras vantagens que \nmuitas vezes não são reconhecidas, mas que são \nreais.", "source": "Caieiras · Diretor de Escola", "p": 14, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q48", "n": 48, "area": "CE", "eixo": "LEG_ECA", "topic": "ECA", "key": "E", "img": "img/CAI25-DIR-Q48.webp", "pages": ["img/CAI25-DIR-p14.webp"], "base": null, "text": "QUESTÃO 48 \nEm consonância com o Estatuto da Criança e do \nAdolescente, assinale a alternativa que condiz \ncom o instrumento legal. \n(A) Para efeitos desta Lei, a criança é a pessoa \ncom até 11 anos de idade incompletos e o \nadolescente, de onze a dezoito anos. \n(B) Essa Lei não se aplica a nenhum caso que \nexceda a idade de 18 anos. \n(C) Criança e adolescente gozam de direitos \nespecíficos a cada uma das faixas etárias que \ncompreendem suas especificidades. \n(D) Os direitos enunciados nesta Lei têm maior \ndirecionamento aos indivíduos em situação de \nvulnerabilidade. \n(E) O cumprimento dos direitos enunciados nesta \nLei são considerados como deveres da família, da \ncomunidade, da sociedade em geral e do poder \npúblico.", "source": "Caieiras · Diretor de Escola", "p": 14, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q49", "n": 49, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "B", "img": "img/CAI25-DIR-Q49.webp", "pages": ["img/CAI25-DIR-p14.webp"], "base": null, "text": "QUESTÃO 49 \nA dinâmica escolar, dentro da perspectiva \nconstitucional, apresenta os objetivos abaixo. No \nentanto, uma das alternativas foi mal construída, \nassinale-a: \n(A) Erradicação do analfabetismo. \n(B) Especialização do atendimento escolar. \n(C) Formação para o trabalho. \n(D) Melhoria da qualidade do ensino. \n(E) \nPromoção \nhumanística, \ncientífica \ne \ntecnológica do país.", "source": "Caieiras · Diretor de Escola", "p": 14, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q50", "n": 50, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "B", "img": "img/CAI25-DIR-Q50.webp", "pages": ["img/CAI25-DIR-p15.webp"], "base": null, "text": "QUESTÃO 50 \nAnalise as asserções abaixo, marque a alternativa \ncorrespondente. \nI - A organização e a gestão constituem o \nconjunto das condições e dos meios utilizados \npara assegurar o bom funcionamento da \ninstituição escolar, de modo que alcance os \nobjetivos educacionais esperados. Os termos \norganização e gestão são frequentemente \nassociados à ideia de administração, governo, \nprovisão de condições de funcionamento de \ndeterminada \ninstituição \nsocial \n– \nfamília, \nempresa, escola, órgão público, entidades \nsindicais, culturais, científicas etc. – para a \nrealização de seus objetivos. \nII - No caso da escola, a organização e a gestão \nreferem-se ao conjunto de normas, diretrizes, \nestrutura organizacional, ações e procedimentos \nque asseguram a racionalização do uso de \nrecursos humanos, materiais, financeiros e \nintelectuais assim como a coordenação e o \nacompanhamento do trabalho das pessoas. Por \nracionalização, compreende-se o uso moderado \ndos recursos disponíveis. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(C) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(D) As asserções I e II são proposições \nverdadeiras, e a II não é um complemento da I. \n(E) As asserções I e II são proposições falsas.", "source": "Caieiras · Diretor de Escola", "p": 15, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q01", "n": 1, "area": "LP", "eixo": "LP03", "topic": "Figuras de linguagem", "key": "B", "img": "img/VAR25-ORI-Q01.webp", "pages": ["img/VAR25-ORI-p2.webp"], "base": "VAR25-ORI-T1", "text": "QUESTÃO 01 \nO texto é marcado pela figura de linguagem: \n(A) eufemismo, ao referir-se à morte súbita com \ntermos que amenizem sua gravidade. \n(B) prosopopeia, ao atribuir ao coração vontade \nprópria e capacidade de falar. \n(C) ironia, ao expressar o apreço do coração pelo \nfutebol com palavras depreciativas. \n(D) onomatopeia, ao fazer menção às batidas do \ncoração. \n(E) sinestesia, ao mesclar sensações visuais e \nauditivas para descrever o coração.", "source": "Varginha · Orientador Escolar", "p": 2, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q02", "n": 2, "area": "LP", "eixo": "LP12", "topic": "Coesão textual", "key": "C", "img": "img/VAR25-ORI-Q02.webp", "pages": ["img/VAR25-ORI-p3.webp"], "base": "VAR25-ORI-T1", "text": "QUESTÃO 02 \nConsidere o seguinte excerto: “Da qual, por uma \ncruel coincidência, depende a nossa.” O \npronome relativo empregado neste excerto \nretoma no texto o termo antecedente: \n(A) “tudo que lhe atribuem”. \n(B) “músculo egoísta”. \n(C) “sua própria sobrevivência”.  \n(D) “embalagem”.   \n(E) “fisiologia medíocre”.", "source": "Varginha · Orientador Escolar", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q03", "n": 3, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "A", "img": "img/VAR25-ORI-Q03.webp", "pages": ["img/VAR25-ORI-p3.webp"], "base": "VAR25-ORI-T1", "text": "QUESTÃO 03 \nAnalise as sentenças a seguir, retiradas do texto: \nI. Paris, Nantes, Marselha ou qualquer outra \ncidade, é tudo o mesmo para ele [...] \nII. [...] desde que ele tenha um lugar seguro onde \npossa bater e cuidar da sua vidinha. \nIII. Mas de repente ele se deu conta e pediu \nsatisfações. \nO pronome pessoal “ele” é empregado como \noblíquo apenas em: \n(A) I. \n(B) II. \n(C) III. \n(D) I e II. \n(E) II e III.", "source": "Varginha · Orientador Escolar", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q04", "n": 4, "area": "LP", "eixo": "LP09", "topic": "Colocação pronominal", "key": "A", "img": "img/VAR25-ORI-Q04.webp", "pages": ["img/VAR25-ORI-p3.webp"], "base": "VAR25-ORI-T1", "text": "QUESTÃO 04 \nO excerto a seguir cuja colocação pronominal \nestá incorreta, de acordo com a norma-padrão da \nlíngua portuguesa, é: \n(A) — Me leva pra casa. \n(B) — Desculpe. Eu tentei substituí-lo pelo \ndistanciamento crítico, mas... \n(C) — Você sabia disso quando me trouxe para \ncá?  \n(D) O coração não se interessa por futebol. \n(E) Trata-se de um mero músculo, e de um \nmúsculo egoísta, que só quer saber da sua própria \nsobrevivência.", "source": "Varginha · Orientador Escolar", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q05", "n": 5, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "E", "img": "img/VAR25-ORI-Q05.webp", "pages": ["img/VAR25-ORI-p3.webp"], "base": "VAR25-ORI-T1", "text": "QUESTÃO 05 \nO \nadvérbio \nque \nmelhor \nsubstitui \n“deliberadamente”, \nem \n“— \nVocê \ndeliberadamente me trouxe a um evento em que \neu posso parar de repente, mesmo não tendo \nnada a ver com isso?”, é: \n(A) especificamente. \n(B) inevitavelmente. \n(C) indiscriminadamente. \n(D) imponderadamente. \n(E) resolutamente.", "source": "Varginha · Orientador Escolar", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q06", "n": 6, "area": "LP", "eixo": "LP08", "topic": "Sintaxe", "key": "B", "img": "img/VAR25-ORI-Q06.webp", "pages": ["img/VAR25-ORI-p3.webp"], "base": null, "text": "QUESTÃO 06 \nA sentença em que se verifica um substantivo \npróprio como complemento verbal é: \n(A) Piracicaba é uma cidade do interior de São \nPaulo. \n(B) As provas corrigidas eram entregues a Pedro \npor correspondência.  \n(C) A admiração é crucial em um relacionamento \namoroso. \n(D) Os escoteiros da escola de São João fizeram \numa arrecadação de alimentos. \n(E) Essas velas perfumadas são invenção daquela \ngarota.", "source": "Varginha · Orientador Escolar", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q07", "n": 7, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "C", "img": "img/VAR25-ORI-Q07.webp", "pages": ["img/VAR25-ORI-p3.webp"], "base": null, "text": "QUESTÃO 07 \nAssinale a alternativa em que o elemento em \ndestaque é um advérbio de possibilidade ou \ndúvida. \n(A) Há rumores de que eles sequer avisaram \nsobre as demissões. \n(B) Não gosto desse tipo de comportamento, \ntampouco de rebeldia.  \n(C) Ter optado por me afastar fora, quiçá, a \nminha melhor decisão. \n(D) Muito provavelmente aquele exame será \nreaplicado.  \n(E) Tudo o que fizeram foi realmente de \ncoração.", "source": "Varginha · Orientador Escolar", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q08", "n": 8, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "E", "img": "img/VAR25-ORI-Q08.webp", "pages": ["img/VAR25-ORI-p4.webp"], "base": null, "text": "QUESTÃO 08 \nVerifica-se verbo irregular apenas em: \n(A) Não jogue plástico nos oceanos.  \n(B) \nA \ncozinheira \nsovou \no \npão \npor \naproximadamente uma hora.  \n(C) Hidrate-se especialmente nos dias de calor \nescaldante. \n(D) Eles provaram ao juiz sua inocência.  \n(E) Vimos as fotos do seu casamento nas redes \nsociais.", "source": "Varginha · Orientador Escolar", "p": 4, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q09", "n": 9, "area": "LP", "eixo": "LP04", "topic": "Ortografia e acentuação", "key": "A", "img": "img/VAR25-ORI-Q09.webp", "pages": ["img/VAR25-ORI-p4.webp"], "base": null, "text": "QUESTÃO 09 \nNão ocorre desvio ortográfico apenas em: \n(A) Desejo a você as melhores bênçãos do \nmundo.  \n(B) A subrregião da metrópole está passando por \ndiversos problemas sanitários. \n(C) Seu desvanescimento tem a ver com a tristeza \nque vêm sentindo.  \n(D) Esses garotos são mal-criados com seus \nprofessores. \n(E) Todas as meia-noites são estreladas no \ncampo.", "source": "Varginha · Orientador Escolar", "p": 4, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q10", "n": 10, "area": "LP", "eixo": "LP12", "topic": "Coesão textual", "key": "A", "img": "img/VAR25-ORI-Q10.webp", "pages": ["img/VAR25-ORI-p4.webp"], "base": null, "text": "QUESTÃO 10 \nConsidere a seguinte sentença: “Tinha vontade \nde se mudar para outro país, todavia não podia \nfazê-lo.” A palavra “todavia”, neste contexto, \nexprime o mesmo sentido de: \n(A) contudo. \n(B) caso. \n(C) senão. \n(D) outrossim. \n(E) consoante.", "source": "Varginha · Orientador Escolar", "p": 4, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q11", "n": 11, "area": "MRL", "eixo": "MRL08", "topic": "Equações e sistemas", "key": "D", "img": "img/VAR25-ORI-Q11.webp", "pages": ["img/VAR25-ORI-p4.webp"], "base": null, "text": "QUESTÃO 11 \nEm uma padaria, um cliente leva 400 gramas de \npão doce e 300 gramas de pão de mel, ele paga \num total de R$ 13,80. Em outro dia, o mesmo \ncliente leva 200 g de pão doce e 500 g de pão de \nmel, pagando um total de R$ 14,60. Nesta \nsituação, qual o preço por kg do pão de mel? \n(A) R$ 18,50. \n(B) R$ 21,50. \n(C) R$ 15,50. \n(D) R$ 22,00. \n(E) R$ 17,00.", "source": "Varginha · Orientador Escolar", "p": 4, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q13", "n": 13, "area": "MRL", "eixo": "MRL14", "topic": "Conjuntos", "key": "D", "img": "img/VAR25-ORI-Q13.webp", "pages": ["img/VAR25-ORI-p5.webp"], "base": null, "text": "QUESTÃO 13 \nNuma escola, sabe-se que 45% dos funcionários \nfalam inglês, 65% falam espanhol e 25% falam \nambas as línguas. Se há 500 funcionários no \ntotal, quantos não falam nem inglês nem \nespanhol? \n(A) 125. \n(B) 55. \n(C) 15. \n(D) 75. \n(E) 155.", "source": "Varginha · Orientador Escolar", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q14", "n": 14, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "B", "img": "img/VAR25-ORI-Q14.webp", "pages": ["img/VAR25-ORI-p5.webp"], "base": null, "text": "QUESTÃO 14 \nUma determinada empresa multinacional de \ntecnologia teve um lucro líquido de 1 bilhão de \nreais no primeiro semestre do ano. Esta empresa \npagará a cada um dos seus diretores uma fração \ndesse lucro correspondente a 0,01%. Quanto \ncada diretor irá receber? \n(A) R$ 10.000,00. \n(B) R$ 100.000,00. \n(C) R$ 1.000.000,00. \n(D) R$ 10.000.000,00. \n(E) R$ 100.000.000,00.", "source": "Varginha · Orientador Escolar", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q15", "n": 15, "area": "MRL", "eixo": "MRL13", "topic": "Sequências", "key": "D", "img": "img/VAR25-ORI-Q15.webp", "pages": ["img/VAR25-ORI-p5.webp"], "base": null, "text": "QUESTÃO 15 \nObserve a seguinte sequência lógica numérica: \n1, 1, 2, 3, 5, 8, 13, ...   \nQual será o 10° elemento desta sequência? \n(A) 98. \n(B) 89. \n(C) 21. \n(D) 55. \n(E) 34.", "source": "Varginha · Orientador Escolar", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q16", "n": 16, "area": "MRL", "eixo": "MRL13", "topic": "Sequências", "key": "C", "img": "img/VAR25-ORI-Q16.webp", "pages": ["img/VAR25-ORI-p5.webp"], "base": null, "text": "QUESTÃO 16 \nObserve a seguinte sequência lógica figural: \n \n \n \nO quadrado do primeiro elemento tem lado  \n1 cm e tem sua diagonal medida pela variável d1, \nconforme a figura. Os próximos elementos são \nsequências de quadrados que são sucessivamente \ninscritos a partir do quadrado inicial. A diagonal \ncorrespondente ao n-ésimo elemento é a diagonal \ndo quadrado mais interno inscrito. Nesta \nsituação, \nqual \na \nmedida \nda \ndiagonal \ncorrespondente ao 4° elemento, em centímetros? \n(A) \n1\n2√2. \n(B) \n1\n√2.  \n(C) \n1\n2. \n(D) √2\n4 . \n(E) \n2√2\n3 .", "source": "Varginha · Orientador Escolar", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": ["Sequências"]}, {"id": "VAR25-ORI-Q17", "n": 17, "area": "MRL", "eixo": "MRL05", "topic": "Regra de três", "key": "B", "img": "img/VAR25-ORI-Q17.webp", "pages": ["img/VAR25-ORI-p5.webp"], "base": null, "text": "QUESTÃO 17 \nMaria possui uma horta onde colhe 60 kg de \ntomates por dia, que são utilizados na fabricação \nde molho de tomate. Com cada 4 kg de tomate, \nela fabrica 1 litro de molho. O molho fabricado é \nentão dividido em potes de 250 ml, que são \nempacotados em caixas de 10 potes. Cada caixa \né vendida por R$ 50,00. Quanto Maria arrecada \npor dia com a venda do molho? \n(A) R$ 900,00. \n(B) R$ 300,00. \n(C) R$ 1500,00. \n(D) R$ 450,00. \n(E) R$ 600,00.", "source": "Varginha · Orientador Escolar", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q18", "n": 18, "area": "MRL", "eixo": "MRL05", "topic": "Regra de três", "key": "A", "img": "img/VAR25-ORI-Q18.webp", "pages": ["img/VAR25-ORI-p6.webp"], "base": null, "text": "QUESTÃO 18 \nSeis pintores conseguem pintar 360 m2 de parede em 5 dias. Em quantos dias 12 pintores conseguirão \npintar 720 m2 de parede supondo a mesma produtividade? \n(A) 5. \n(B) 10.  \n(C) 12. \n(D) 6. \n(E) 24.", "source": "Varginha · Orientador Escolar", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q19", "n": 19, "area": "MRL", "eixo": "MRL09", "topic": "Tabelas e gráficos", "key": "E", "img": "img/VAR25-ORI-Q19.webp", "pages": ["img/VAR25-ORI-p6.webp"], "base": null, "text": "QUESTÃO 19 \nObserve o gráfico a seguir que mostra a evolução do estado nutricional, segundo o IMC, entre \n1974/1975 e 2002/2003 de homens adultos. O eixo das ordenadas mostra a porcentagem desta \npopulação em cada condição: \n \nAdaptado de: Batista Filho M, et al.. Anemia e obesidade: um paradoxo da transição nutricional brasileira. Cadernos de Saúde Pública 2008; 24(14). \nAnalisando o gráfico, é INCORRETO afirmar que: \n(A) Em 1974/1975, mais de 70% da população de homens adultos tinha o peso considerado normal. \n(B) Em 2002/2003, menos de 50% da população de homens adultos tinha o peso considerado normal. \n(C) A porcentagem de homens adultos com obesidade aumentou entre 1974/1975 e 2003. \n(D) A porcentagem de homens adultos com baixo peso diminuiu de 1974/1975 para 2002/2003. \n(E) Em 1989, a porcentagem de homens com peso normal era inferior à porcentagem de homens com \nsobrepeso.", "source": "Varginha · Orientador Escolar", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q20", "n": 20, "area": "MRL", "eixo": "MRL14", "topic": "Conjuntos", "key": "B", "img": "img/VAR25-ORI-Q20.webp", "pages": ["img/VAR25-ORI-p7.webp"], "base": null, "text": "QUESTÃO 20 \nConsidere a seguinte argumentação: \n1. Se João vai ao cinema, então ele compra \npipoca. \n2. Se João compra pipoca, então ele fica \nsatisfeito. \n3. João não comprou pipoca. \nCom base nessas premissas, qual das conclusões \nabaixo pode ser logicamente inferida? \n(A) João foi ao cinema, mas não ficou satisfeito. \n(B) João não foi ao cinema. \n(C) João ficou satisfeito, mas não comprou \npipoca. \n(D) João não foi ao cinema e ficou satisfeito. \n(E) Se João não compra pipoca, então ele não fica \nsatisfeito. \n \nNOÇÕES DE INFORMÁTICA", "source": "Varginha · Orientador Escolar", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q21", "n": 21, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "E", "img": "img/VAR25-ORI-Q21.webp", "pages": ["img/VAR25-ORI-p7.webp"], "base": null, "text": "NOÇÕ S\nN O\nC\nQUESTÃO 21 \nA área de trabalho é a principal área exibida na \ntela quando você liga o computador e faz logon \nno Windows. Nela, é possível criar novos itens, \ncomo:  \n(A) Spam. \n(B) Hardware \n(C) Periféricos de saída. \n(D) Periféricos de entrada. \n(E) Pastas.", "source": "Varginha · Orientador Escolar", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q22", "n": 22, "area": "INF", "eixo": "INF06", "topic": "Internet e segurança", "key": "D", "img": "img/VAR25-ORI-Q22.webp", "pages": ["img/VAR25-ORI-p7.webp"], "base": null, "text": "QUESTÃO 22 \nDentre as opções a seguir, qual representa um \nnavegador amplamente utilizado para acessar e \ninteragir com conteúdo da internet?  \n(A) Oracle. \n(B) Postgres. \n(C) Java. \n(D) Google Chrome. \n(E) Winzip.", "source": "Varginha · Orientador Escolar", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q23", "n": 23, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "D", "img": "img/VAR25-ORI-Q23.webp", "pages": ["img/VAR25-ORI-p7.webp"], "base": null, "text": "QUESTÃO 23 \n \nO Windows dispõe de ferramentas que auxiliam \nna interação do usuário com os recursos do \nsistema. O facilitador em destaque na imagem \nacima, que pode ser encontrado na parte inferior \nda área de trabalho, na barra de tarefas, tem como \nprincipal função:  \n(A) Limpar a caixa de e-mail. \n(B) Bloquear o acesso a pastas e arquivos. \n(C) Limpar o cache de navegação do browser. \n(D) Pesquisar e localizar documentos, pastas, \naplicativos, \nentre \noutros \nelementos, \nno \ncomputador. \n(E) Trocar a senha de acesso do sistema.", "source": "Varginha · Orientador Escolar", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q25", "n": 25, "area": "INF", "eixo": "INF03", "topic": "Excel", "key": "B", "img": "img/VAR25-ORI-Q25.webp", "pages": ["img/VAR25-ORI-p7.webp"], "base": null, "text": "QUESTÃO 25 \nUma fórmula no Microsoft Excel é uma \nsequência de valores constantes, referências de \ncélulas (o endereço da célula), nomes, funções ou \noperadores que produzem um novo valor a partir \ndos valores existentes. As fórmulas sempre \ncomeçam com um sinal de:  \n(A) Mais (+). \n(B) Igual (=). \n(C) Menos (–). \n(D) Porcentagem (%). \n(E) Divisão (÷).", "source": "Varginha · Orientador Escolar", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q27", "n": 27, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "C", "img": "img/VAR25-ORI-Q27.webp", "pages": ["img/VAR25-ORI-p8.webp"], "base": null, "text": "QUESTÃO 27 \nO orientador escolar deve atuar como um facilitador do desenvolvimento integral dos alunos, \nconectando e mediando as relações entre eles. Considerando seu papel no interior das instituições \neducativas, analise as asserções a seguir e a relação proposta entre elas. \nI – O orientador escolar deve atuar articulado à gestão democrática da escola, participando ativamente \ndos espaços colegiados. \nPORQUE \nII – Sua função histórico-cultural está relacionada à adaptação dos alunos às normas escolares, \ngarantindo o cumprimento disciplinar das regras institucionais. \nSobre as asserções acima, assinale a alternativa correta. \n(A) As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I. \n(B) As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I. \n(C) A asserção I é uma proposição verdadeira, e a II é uma proposição falsa. \n(D) A asserção I é uma proposição falsa, e a II é uma proposição verdadeira. \n(E) As asserções I e II são proposições falsas.", "source": "Varginha · Orientador Escolar", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q29", "n": 29, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "C", "img": "img/VAR25-ORI-Q29.webp", "pages": ["img/VAR25-ORI-p9.webp"], "base": null, "text": "QUESTÃO 29 \nDesde a promulgação da Lei de Diretrizes e Bases da Educação Nacional – LDB 9.394/1996, o Brasil \npassou a regulamentar a formação dos profissionais de educação, destacando que funções como \nsupervisão, administração e orientação escolar exigem preparação acadêmica específica. \nDe acordo com a LDB, assinale a alternativa que apresenta corretamente a formação exigida para \nprofissionais que atuam em orientação escolar. \n(A) A formação é opcional e pode ocorrer em qualquer curso de nível superior, sem exigência de base \ncomum nacional. \n(B) A formação de profissionais para atuação no serviço de orientação escolar será realizada em cursos \ntécnicos ou de extensão. \n(C) A formação de profissionais para atuação no serviço de orientação escolar será feita mediante \ngraduação em pedagogia ou a pós-graduação, garantida uma base comum nacional. \n(D) A formação é exclusiva em nível de pós-graduação, sem possibilidade de graduação em pedagogia. \n(E) A formação de profissionais para orientação escolar deve ocorrer apenas em cursos livres \noferecidos \npelas \nuniversidades.", "source": "Varginha · Orientador Escolar", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q30", "n": 30, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "C", "img": "img/VAR25-ORI-Q30.webp", "pages": ["img/VAR25-ORI-p9.webp"], "base": null, "text": "QUESTÃO 30 \nO Art. 14 da LDB (9.394/1996), estabelece que a gestão democrática do ensino público na educação \nbásica deve ser definida por leis dos Estados, Municípios e do Distrito Federal, considerando suas \npeculiaridades. Entre os princípios previstos, destacam-se: \nI – a participação dos profissionais da educação na elaboração do _________________. \nII – a participação das comunidades escolar e local em ___________________________ e em \n___________________________ ou equivalentes. \n \nConsiderando o exposto, assinale a alternativa que completa corretamente as lacunas. \n(A) plano de ensino da escola - Conselhos de Classe - Fóruns Estaduais de Educação. \n(B) regimento interno da escola - Conselhos Tutelares - Conselhos de Educação. \n(C) projeto pedagógico da escola - Conselhos Escolares - Fóruns dos Conselhos Escolares. \n(D) plano pedagógico da rede - Conselhos Municipais - Fóruns de Educação Básica. \n(E) currículo mínimo da escola - Conselhos Estaduais - Fóruns de Políticas Públicas.", "source": "Varginha · Orientador Escolar", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q31", "n": 31, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "A", "img": "img/VAR25-ORI-Q31.webp", "pages": ["img/VAR25-ORI-p9.webp"], "base": null, "text": "QUESTÃO 31 \nOs docentes são levados a incorporar uma postura de defensores intransigentes dos conteúdos e dos \nrituais de sua transmissão-apreensão, ainda que sua criatividade seja cerceada e milhões de percursos \nescolares sejam truncados. Para os gestores, ser docente competente é ser fiel a essa visão sagrada dos \nconteúdos, cumprir rigorosamente todos os processos e rituais. (ARROYO, 2013). \nA lógica predominante na gestão e no currículo escolar pode gerar impactos negativos, principalmente: \n(A) na diversidade cultural e na construção da identidade dos alunos. \n(B) no desempenho financeiro das escolas. \n(C) na expansão de programas tecnológicos na educação. \n(D) na formação de professores em cursos técnicos. \n(E) no aumento do número de horas de aula por disciplina.", "source": "Varginha · Orientador Escolar", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": "Miguel Arroyo", "secondary": []}, {"id": "VAR25-ORI-Q33", "n": 33, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "B", "img": "img/VAR25-ORI-Q33.webp", "pages": ["img/VAR25-ORI-p10.webp"], "base": null, "text": "QUESTÃO 33 \nCipriano Luckesi (2011) discute a questão do autoritarismo presente na prática da avaliação \neducacional escolar e sugere uma possível superação desse paradigma por vias intraescolares. Analise \nos itens a seguir, à luz da concepção de avaliação formativa crítica proposta pelo autor. \nI. Avaliações classificatórias compatíveis com o modelo conservador enfatizam a disciplina, a \nobediência e o controle da conduta. \nII. A avaliação transformadora deve ser diagnóstica, preocupando-se com intervenções que permitam \no avanço do educando. \nIII. Avaliações que reproduzem o autoritarismo contribuem para a autonomia do estudante e para a \ntransformação social. \nIV. A lógica de aprovação/reprovação faz parte do ato de “examinar”, característico da escola \ndisciplinadora. \nV. A avaliação democrática consiste em detectar dificuldades para orientar novas ações pedagógicas, \ne não para selecionar alunos. \n \nÉ correto o que se afirma em:  \n(A) I, II e III apenas. \n(B) I, II, IV e V apenas. \n(C) II, III e V apenas. \n(D) I, IV e V apenas. \n(E) I, II, III, IV e V.", "source": "Varginha · Orientador Escolar", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": "Cipriano Luckesi", "secondary": []}, {"id": "VAR25-ORI-Q34", "n": 34, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "D", "img": "img/VAR25-ORI-Q34.webp", "pages": ["img/VAR25-ORI-p11.webp"], "base": null, "text": "QUESTÃO 34 \nAlgumas concepções pedagógicas defendem que a prática avaliativa deve estar vinculada à melhoria \ndo processo de aprendizagem, enquanto outras ainda se orientam por procedimentos que classificam \nalunos com base apenas no resultado final. À luz da distinção entre examinar e avaliar, segundo Luckesi \n(2011), é correto afirmar que: \n(A) Examinar e avaliar são práticas semelhantes, pois ambas priorizam a classificação em notas e \nconceitos. \n(B) O exame valoriza a intervenção pedagógica para que todos os estudantes aprendam, enquanto a \navaliação preocupa-se apenas com o resultado final. \n(C) Na avaliação formativa, o que o aluno ainda não aprendeu é desconsiderado, pois não pode mais \nser modificado durante o processo. \n(D) O ato de examinar centra-se no produto da aprendizagem e reforça a lógica classificatória, ao passo \nque o ato de avaliar tem caráter diagnóstico, voltado à intervenção no processo. \n(E) O exame é dialógico e flexível, interessando-se mais pelo processo do que pelo resultado da \naprendizagem.", "source": "Varginha · Orientador Escolar", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": "Cipriano Luckesi", "secondary": []}, {"id": "VAR25-ORI-Q35", "n": 35, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "C", "img": "img/VAR25-ORI-Q35.webp", "pages": ["img/VAR25-ORI-p11.webp"], "base": null, "text": "QUESTÃO 35 \nSegundo Heloísa Lück (2009), a cultura organizacional escolar se constitui a partir das experiências \ncoletivas e sofre forte influência da liderança exercida no grupo. A ausência de uma liderança \nintencional e sistemática pode levar à consolidação de práticas centradas em interesses pessoais, \nimediatistas e pouco educativas. Assim, o papel do gestor escolar está diretamente associado a: \n(A) estabelecer normas rígidas de funcionamento escolar, evitando a participação coletiva e \nassegurando o cumprimento de regras externas. \n(B) atuar prioritariamente sobre aspectos administrativos e burocráticos, garantindo que os processos \ninternos sigam os regulamentos legais. \n(C) conduzir o grupo escolar à reflexão sobre seus resultados, competências e atitudes, à luz de \nobjetivos educacionais e valores institucionais. \n(D) restringir-se à mediação de conflitos pontuais entre professores e estudantes, sem intervir nas \ndimensões subjetivas e contextuais da escola. \n(E) centralizar as decisões pedagógicas, de modo a evitar divergências de concepções e preservar a \nhomogeneidade da cultura escolar.", "source": "Varginha · Orientador Escolar", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": "Heloísa Lück", "secondary": []}, {"id": "VAR25-ORI-Q36", "n": 36, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "E", "img": "img/VAR25-ORI-Q36.webp", "pages": ["img/VAR25-ORI-p11.webp"], "base": null, "text": "QUESTÃO 36 \nO Art. 211 da Constituição Federal estabelece que a União, os Estados, o Distrito Federal e os \nMunicípios devem organizar, em regime de colaboração, seus sistemas de ensino, definindo \nresponsabilidades específicas entre os entes federativos quanto às etapas educacionais que devem \npriorizar. Assinale a alternativa correta acerca das responsabilidades educacionais dos entes \nfederativos. \n(A) A União deve atuar prioritariamente na educação infantil e no ensino médio. \n(B) Os municípios concentram sua atuação prioritária no ensino fundamental e médio. \n(C) Os estados e o DF atuam prioritariamente no ensino fundamental e no ensino superior. \n(D) Os estados atuam prioritariamente na educação infantil, enquanto os municípios se concentram no \nensino médio. \n(E) Os municípios atuam prioritariamente na educação infantil e no ensino fundamental.", "source": "Varginha · Orientador Escolar", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q37", "n": 37, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "D", "img": "img/VAR25-ORI-Q37.webp", "pages": ["img/VAR25-ORI-p12.webp"], "base": null, "text": "QUESTÃO 37 \nA Constituição Federal (1988) determina que a lei deverá estabelecer o Plano Nacional de Educação \n(PNE), com duração decenal, visando articular o sistema nacional de educação em regime de \ncolaboração e definir diretrizes, objetivos, metas e estratégias para garantir o direito à educação nas \ndiversas etapas, níveis e modalidades de ensino. \nDe acordo com o Art. 214, são objetivos que devem orientar o Plano Nacional de Educação: \nI. Erradicação do analfabetismo. \nII. Universalização do atendimento escolar. \nIII. Ampliação do ensino privado no país como forma de garantia de acesso de todos a educação. \nIV. Melhoria da qualidade do ensino. \nV. Formação para o trabalho. \n \nEstá correto o que se afirma em: \n(A) I, II e III, apenas. \n(B) I, II e IV, apenas. \n(C) II, III e V, apenas. \n(D) I, II, IV e V, apenas. \n(E) I, II, III, IV e V.", "source": "Varginha · Orientador Escolar", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q40", "n": 40, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "E", "img": "img/VAR25-ORI-Q40.webp", "pages": ["img/VAR25-ORI-p13.webp"], "base": null, "text": "QUESTÃO 40 \nA Base Nacional Comum Curricular (BNCC) para o Ensino Médio define uma nova reconfiguração \ndo currículo, articulando o desenvolvimento de competências cognitivas, sociais e emocionais com a \npromoção da autonomia do estudante. Além disso, visa preparar os estudantes para a vida acadêmica, \nprofissional e cidadã, garantindo uma educação integral e inclusiva. \nDe acordo com o Art. 35-B da Lei nº 9.394/1996, assinale a alternativa que apresenta uma compreensão \ncorreta sobre a organização curricular atual do Ensino Médio: \n(A) O desenvolvimento de projetos de vida e a preparação para o mundo do trabalho são secundários, \nficando subordinados apenas à aquisição de conhecimentos teóricos. \n(B) A organização curricular prioriza exclusivamente itinerários formativos ligados à formação técnica \ne profissional, com menor peso para a formação geral básica. \n(C) O currículo é opcionalmente mediado por tecnologia, podendo substituir totalmente a presença \nfísica dos estudantes nas aulas. \n(D) A valorização de experiências extraescolares aplica-se apenas a estágios profissionais \nremunerados, não abrangendo projetos acadêmicos ou participação em grêmios estudantis. \n(E) O currículo combina formação geral básica e itinerários formativos, integrando saberes nas áreas \ndo conhecimento, metodologias investigativas e experiências práticas conectadas à vida comunitária e \nsocial.", "source": "Varginha · Orientador Escolar", "p": 13, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q41", "n": 41, "area": "CE", "eixo": "LEG_13722", "topic": "Lei Lucas", "key": "D", "img": "img/VAR25-ORI-Q41.webp", "pages": ["img/VAR25-ORI-p14.webp"], "base": null, "text": "QUESTÃO 41 \nA Lei nº 13.722/2018, conhecida como Lei Lucas, determina a adoção de medidas de capacitação \nbásica em primeiros socorros nas instituições de ensino, com o objetivo de ampliar a segurança e a \nproteção de estudantes em situações emergenciais. Conforme o estabelecido pela lei, é correto afirmar \nque ela: \n(A) prevê que apenas os estabelecimentos públicos que atendem à Educação Infantil e ao Ensino \nFundamental promovam a capacitação em primeiros socorros.  \n(B) estabelece que a capacitação será facultativa, dependendo da adesão dos profissionais da escola ou \ncreche ou das necessidades locais.  \n(C) determina que o Ministério da Saúde é o único responsável por organizar e custear os cursos de \ncapacitação em primeiros socorros.  \n(D) determina que estabelecimentos de ensino de educação básica da rede pública e privada capacitem \nprofessores e funcionários em noções de primeiros socorros, visando agir em situações de emergência. \n(E) dispensa unidades privadas de recreação infantil da capacitação, responsabilizando apenas os \nestabelecimentos \npúblicos.", "source": "Varginha · Orientador Escolar", "p": 14, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q42", "n": 42, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "B", "img": "img/VAR25-ORI-Q42.webp", "pages": ["img/VAR25-ORI-p14.webp"], "base": null, "text": "QUESTÃO 42 \nA Educação em Direitos Humanos fundamenta-se em princípios que orientam práticas pedagógicas \ncomprometidas com a dignidade, a justiça social e a formação cidadã. Considerando os princípios da \nEducação em Direitos Humanos (Parecer CNE/CP nº 8/2012), analise as assertivas a seguir.  \nI. A laicidade do Estado é princípio da Educação em Direitos Humanos e está vinculada à liberdade de \ncrença, ao respeito à diversidade religiosa e à atuação estatal sem proselitismo. \nII. O princípio da igualdade de direitos está relacionado à universalidade dos direitos civis, políticos, \neconômicos, sociais e culturais, sem qualquer forma de discriminação. \nIII. O reconhecimento e a valorização das diferenças referem-se à transformação das desigualdades \nexistentes em diferenças legítimas entre indivíduos e grupos. \nIV. A sustentabilidade socioambiental não se vincula à Educação em Direitos Humanos, pois se limita \nà educação ambiental. \nV. A democracia na educação é considerada princípio por exigir a participação de todos os envolvidos \nno processo educativo. \nÉ correto o que se afirma em: \n(A) I, II e III, apenas. \n(B) I, II e V, apenas. \n(C) I, IV e V, apenas. \n(D) II, III e IV, apenas. \n(E) III, IV e V, apenas.", "source": "Varginha · Orientador Escolar", "p": 14, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q44", "n": 44, "area": "CE", "eixo": "LEG_ECA", "topic": "ECA", "key": "C", "img": "img/VAR25-ORI-Q44.webp", "pages": ["img/VAR25-ORI-p15.webp"], "base": null, "text": "QUESTÃO 44 \nAnalise as afirmativas e marque V para verdadeiro e F para falso, de acordo com o Estatuto da Criança \ne do Adolescente (Lei nº 8.069/1990). \nA criança e o adolescente têm direito à educação, visando ao pleno desenvolvimento de sua pessoa, \npreparo para o exercício da cidadania e qualificação para o trabalho, assegurando-se-lhes: \n(  ) igualdade de condições para o acesso e permanência na escola. \n(  ) direito de ser respeitado por seus educadores. \n(  ) direito de organização e participação em entidades estudantis. \n(  ) progressiva extensão da obrigatoriedade e gratuidade ao ensino médio. \n \nAssinale a alternativa que apresenta a sequência correta. \n(A) V, V, V, V \n(B) V, V, F, F \n(C) V, V, V, F \n(D) F, F, V, V \n(E) F, F, F, V", "source": "Varginha · Orientador Escolar", "p": 15, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-ORI-Q48", "n": 48, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "C", "img": "img/VAR25-ORI-Q48.webp", "pages": ["img/VAR25-ORI-p17.webp"], "base": null, "text": "QUESTÃO 48 \nSegundo Vasconcellos (2000), o Projeto Político-Pedagógico (PPP) precisa ser entendido como um \ninstrumento teórico-metodológico que ajuda a resolver problemas, transformar a prática e, no limite, \ntornar menor o sofrimento.  \nConsiderando o entendimento desse autor, analise as assertivas a seguir e a relação proposta entre elas.  \nI. O Projeto Político-Pedagógico se caracteriza por ser um processo de planejamento participativo, \ndinâmico e não acabado, orientado para a transformação da realidade escolar. \nPORQUE \nII. Dada a obrigatoriedade de construção do documento nas instituições educacionais, o PPP \ncorresponde a um documento formal e definitivo, elaborado pela gestão para atender às exigências \nadministrativas internas e externas. \nSobre as asserções acima, assinale a alternativa correta. \n(A) As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I. \n(B) As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I. \n(C) A asserção I é uma proposição verdadeira, e a II é uma proposição falsa. \n(D) A asserção I é uma proposição falsa, e a II é uma proposição verdadeira. \n(E) As asserções I e II são proposições falsas.", "source": "Varginha · Orientador Escolar", "p": 17, "role": "both", "preferred": "both", "fallback": false, "author": "Celso Vasconcellos", "secondary": []}, {"id": "VAR25-ORI-Q49", "n": 49, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "C", "img": "img/VAR25-ORI-Q49.webp", "pages": ["img/VAR25-ORI-p17.webp"], "base": null, "text": "QUESTÃO 49 \n“Planejar é antecipar mentalmente uma ação a ser realizada e agir de acordo com o previsto, Planejar \nnão é, pois, apenas algo que se faz antes de agir, mas é também agir em função daquilo que se pensou” \n(VASCONCELLOS, 2000). Considerando essa concepção do autor, assinale a alternativa que melhor \nrepresenta a função do planejamento educacional. \n(A) Estabelecer normas rígidas para controle do trabalho docente, sem considerar o contexto da escola. \n(B) Planejar ações pedagógicas como formalidade administrativa, sem relação direta com o cotidiano \nescolar. \n(C) Promover ações educativas conscientes e intencionais, organizando condições objetivas e \nsubjetivas para que o processo aconteça e se desenvolva ao longo do tempo. \n(D) Substituir a criatividade docente, definindo passo a passo todas as atividades escolares. \n(E) Planejar o cumprimento de metas externas, sem interferir na realidade escolar.", "source": "Varginha · Orientador Escolar", "p": 17, "role": "both", "preferred": "both", "fallback": false, "author": "Celso Vasconcellos", "secondary": []}, {"id": "VAR25-ORI-Q50", "n": 50, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "A", "img": "img/VAR25-ORI-Q50.webp", "pages": ["img/VAR25-ORI-p17.webp"], "base": null, "text": "QUESTÃO 50 \nMaria Teresa Manton, na defesa de uma efetiva inclusão escolar, discute algumas condições que \ncontribuem para que as escolas se tornem espaços vivos de acolhimento e de formação para todos os \nalunos e de como transformá-las em ambientes educacionais verdadeiramente inclusivos.  \nDe acordo com a perspectiva dessa autora, assinale a alternativa que melhor expressa a ideia central da \ninclusão escolar. \n(A) A inclusão escolar demanda modernização das escolas, repensando métodos de ensino, avaliação \ne organização, reconhecendo que dificuldades podem surgir da forma como a aprendizagem é \nconcebida e aplicada. \n(B) A inclusão escolar considera que as dificuldades dos alunos são exclusivamente individuais, sem \nrelação com as práticas escolares. \n(C) A inclusão escolar exige que todos os alunos sigam um modelo único de ensino, sem ajustes para \ndificuldades individuais. \n(D) A inclusão escolar consiste em garantir a presença física de alunos com deficiência nas salas de \naula. \n(E) A inclusão escolar mantém práticas de avaliação rígidas, a fim de atender aos princípios de uma \nescola democrática e equitativa.", "source": "Varginha · Orientador Escolar", "p": 17, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "B", "img": "img/CAI25-SUP-Q01.webp", "pages": ["img/CAI25-SUP-p2.webp"], "base": "CAI25-SUP-T1", "text": "QUESTÃO 01 \nCom a leitura do texto, depreende-se que, na \nvisão da narradora: \n(A) Não há diferença entre os temperamentos \nurbanos e os rurais. \n(B) Estar no meio rural não é um impeditivo para \nque se saiba das notícias mais recentes. \n(C) Não se pode ter qualquer perspectiva sobre \nos acontecimentos recentes estando no meio \nrural.  \n(D) Os meios urbanos têm povos mais alegres \nque os dos meios rurais. \n(E) Viver no meio rural prejudica a saúde tanto \nquanto viver no meio urbano.", "source": "Caieiras · Supervisor Pedagógico", "p": 2, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q02", "n": 2, "area": "LP", "eixo": "LP03", "topic": "Figuras de linguagem", "key": "D", "img": "img/CAI25-SUP-Q02.webp", "pages": ["img/CAI25-SUP-p3.webp"], "base": "CAI25-SUP-T1", "text": "QUESTÃO 02 \nNo excerto “Vocês são os dançarinos no palco e \nnão enxergam a plateia no escuro”, é \npredominante \na \nfigura \nde \nlinguagem \ndenominada: \n(A) perífrase. \n(B) sinestesia. \n(C) comparação. \n(D) metáfora. \n(E) metonímia.", "source": "Caieiras · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q03", "n": 3, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "E", "img": "img/CAI25-SUP-Q03.webp", "pages": ["img/CAI25-SUP-p3.webp"], "base": "CAI25-SUP-T1", "text": "QUESTÃO 03 \nUm termo sinônimo de “elementar”, no excerto \n“lembrarei também a verdade elementar de que \nnão há perspectiva sem distância”, é: \n(A) indiferente. \n(B) ocasional. \n(C) transcendente. \n(D) inigualável. \n(E) fundamental.", "source": "Caieiras · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q04", "n": 4, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "D", "img": "img/CAI25-SUP-Q04.webp", "pages": ["img/CAI25-SUP-p3.webp"], "base": "CAI25-SUP-T1", "text": "QUESTÃO 04 \nConsiderando-se as diferentes funções que a \npalavra “que” pode desempenhar, no contexto \n“Eis por que esta semana me parto”, o vocábulo \natua como: \n(A) conjunção integrante. \n(B) conjunção causal. \n(C) conjunção comparativa. \n(D) pronome relativo. \n(E) pronome interrogativo.", "source": "Caieiras · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q05", "n": 5, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "A", "img": "img/CAI25-SUP-Q05.webp", "pages": ["img/CAI25-SUP-p3.webp"], "base": "CAI25-SUP-T1", "text": "QUESTÃO 05 \nAnalise o seguinte excerto, com especial atenção \naos pronomes enumerados: \n“Vivemos dentro demais dos acontecimentos, \nsomos absorvidos por eles(1), sugestionados por \neles(2), exacerbados por eles(3). Eles(4) é que \nnos \narrastam, \nnão \nsomos \nnós \nque \nos \nesmiuçamos”. \nAinda que se apresentem de uma mesma forma, \nos pronomes em destaque desempenham funções \nsintáticas diferentes. Por essa razão, classificam-\nse, respectivamente, como:  \n(A) (1) pronome pessoal oblíquo tônico; (2) \npronome pessoal oblíquo tônico; (3) pronome \npessoal oblíquo tônico; (4) pronome pessoal reto. \n(B) (1) pronome pessoal oblíquo átono; (2) \npronome pessoal oblíquo átono; (3) pronome \npessoal oblíquo átono; (4) pronome pessoal reto. \n(C) (1) pronome pessoal reto; (2) pronome \npessoal reto; (3) pronome pessoal reto; (4) \npronome pessoal reto. \n(D) (1) pronome pessoal oblíquo tônico; (2) \npronome pessoal oblíquo tônico; (3) pronome \npessoal reto; (4) pronome pessoal reto. \n(E) (1) pronome pessoal reto; (2) pronome \npessoal reto; (3) pronome pessoal oblíquo átono; \n(4) pronome pessoal oblíquo átono.", "source": "Caieiras · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q06", "n": 6, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "C", "img": "img/CAI25-SUP-Q06.webp", "pages": ["img/CAI25-SUP-p3.webp"], "base": "CAI25-SUP-T1", "text": "QUESTÃO 06 \nAs palavras destacadas no excerto a seguir, “Lá \npara onde eu vou tem milhões, sim, milhões mais \nde povo do que aqui”, pertencem à classe \ngramatical: \n(A) pronome. \n(B) substantivo. \n(C) advérbio. \n(D) conjunção. \n(E) preposição.", "source": "Caieiras · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q07", "n": 7, "area": "LP", "eixo": "LP09", "topic": "Colocação pronominal", "key": "D", "img": "img/CAI25-SUP-Q07.webp", "pages": ["img/CAI25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 07 \nA ênclise está aplicada em conformidade com a \nnorma-padrão da língua portuguesa apenas em: \n(A) Despedirei-me dos alunos assim que \npossível. \n(B) Um dia tudo transforma-se em pó.  \n(C) Sempre lembro-me daquele verão.  \n(D) A companhia de teatro enviou uma carta, \nconvidando-o para o evento. \n(E) Aquela conversa teria dado-lhe ainda mais \nexpectativas.", "source": "Caieiras · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q08", "n": 8, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "C", "img": "img/CAI25-SUP-Q08.webp", "pages": ["img/CAI25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 08 \nNas palavras apresentadas a seguir, foram \ndestacados \ndiferentes \nelementos \nmórficos. \nIdentifique aquela cuja parte em destaque \ncorresponde a um morfema de número. \n(A) moça.  \n(B) livreiro. \n(C) cachoeiras. \n(D) inanimado. \n(E) escrevente.", "source": "Caieiras · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q09", "n": 9, "area": "LP", "eixo": "LP04", "topic": "Ortografia e acentuação", "key": "D", "img": "img/CAI25-SUP-Q09.webp", "pages": ["img/CAI25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 09 \nNão há erro ortográfico apenas em: \n(A) Seu humor estava tão afetado que se \npertubava rápidamente.  \n(B) Abriram uma excessão àqueles que não \nentregaram os documentos solicitados. \n(C) A gincana beneficiente será realizada no \npróximo sábado. \n(D) A juíza é intransigente em processos \nintermunicipais.  \n(E) As enchentes inflingiram um grande prejuízo \naos comerciantes da região.", "source": "Caieiras · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q10", "n": 10, "area": "LP", "eixo": "LP10", "topic": "Regência", "key": "B", "img": "img/CAI25-SUP-Q10.webp", "pages": ["img/CAI25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 10 \nTodas as sentenças a seguir apresentam regência \nverbal transitiva direta, exceto: \n(A) Não é fácil perdoar essas ofensas. \n(B) À turbulência sucedeu a calmaria.  \n(C) A postura da mulher implicou sua demissão. \n(D) A menina amedrontada chamou sua mãe.  \n(E) Bateu a porta sem qualquer explicação. \n \nMATEMÁTICA E RACIOCÍNIO LÓGICO", "source": "Caieiras · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q11", "n": 11, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "E", "img": "img/CAI25-SUP-Q11.webp", "pages": ["img/CAI25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 11 \nUm agricultor observa o crescimento de uma de \nsuas plantas. Ele mensura que às 14h00 do dia 01 \nde janeiro, a planta tinha 5 cm de comprimento, \ne que no mesmo horário no dia 21 de janeiro (do \nmesmo ano), a planta já estava com 9 cm de \ncomprimento. Se a planta continuar crescendo na \nmesma proporção em centímetros por dia, qual \ntamanho terá às 14h00 do dia 20 de fevereiro do \nmesmo ano? Considere que o mês de janeiro tem \n31 dias. \n(A) 21 cm. \n(B) 12 cm. \n(C) 14 cm. \n(D) 16 cm. \n(E) 15 cm.", "source": "Caieiras · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-SUP-Q12", "n": 12, "area": "MRL", "eixo": "MRL05", "topic": "Regra de três", "key": "A", "img": "img/CAI25-SUP-Q12.webp", "pages": ["img/CAI25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 12 \nEm uma gráfica, 4 impressoras juntas conseguem \nimprimir 960 livros em 12 horas. A gráfica \ndecide comprar mais 2 impressoras iguais às \nanteriores. Quantas horas serão necessárias para \nque todas as 6 impressoras juntas imprimam os \nmesmos 960 livros? \n(A) 8 horas. \n(B) 10 horas. \n(C) 9 horas. \n(D) 6 horas. \n(E) 18 horas.", "source": "Caieiras
