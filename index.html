 mais indicada para gerar \num grande volume de ideias criativas em curto \nespaço de tempo é: \n(A) Role-playing. \n(B) Estudo de caso. \n(C) Grupo focal. \n(D) Dramatização. \n(E) Tempestade de ideias (Brainstorming).", "source": "Jeriquara · Orientador Educacional", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q38", "n": 38, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "C", "img": "img/JER26-ORI-Q38.webp", "pages": ["img/JER26-ORI-p9.webp"], "base": null, "text": "QUESTÃO 38 \nEm um conflito entre professor e coordenador, a \ntécnica de comunicação que o orientador deve \nadotar para facilitar o diálogo, demonstrando \ncompreensão e checagem correta da mensagem \nrecebida, é a: \n(A) Comunicação não-violenta. \n(B) Mediação de terceiros. \n(C) Escuta ativa com paráfrase \n(D) Assertividade positiva. \n(E) Discurso persuasivo.", "source": "Jeriquara · Orientador Educacional", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q39", "n": 39, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "A", "img": "img/JER26-ORI-Q39.webp", "pages": ["img/JER26-ORI-p10.webp"], "base": null, "text": "QUESTÃO 39 \nPara avaliar a efetividade de um novo projeto \npedagógico ao longo de sua implementação, \npermitindo ajustes contínuos, o tipo de avaliação \nmais adequado é o: \n(A) Processo. \n(B) Produto final. \n(C) Diagnóstico inicial. \n(D) Resultado padronizado. \n(E) Somativo externo.", "source": "Jeriquara · Orientador Educacional", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q44", "n": 44, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "C", "img": "img/JER26-ORI-Q44.webp", "pages": ["img/JER26-ORI-p10.webp"], "base": null, "text": "QUESTÃO 44 \nNo cotidiano escolar, o(a) OE precisa investigar \naumento de evasão e conflitos recorrentes, \ndefinindo hipóteses sem induzir respostas. \nIdentifique a técnica mais adequada para \ndiagnóstico institucional: \n(A) Aplicação de teste projetivo em amostra de \nestudantes. \n(B) Entrevista única com a direção e conclusão \nimediata. \n(C) Triangulação de indicadores, observação e \nescuta qualificada. \n(D) \nQuestionário \nanônimo \napenas \ncom \nalternativas fechadas. \n(E) Registro livre de impressões sem protocolo \nde coleta.", "source": "Jeriquara · Orientador Educacional", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q45", "n": 45, "area": "CE", "eixo": "CE17", "topic": "Supervisão e assessoria", "key": "E", "img": "img/JER26-ORI-Q45.webp", "pages": ["img/JER26-ORI-p11.webp"], "base": null, "text": "QUESTÃO 45 \nApós o diagnóstico, o(a) OE deve organizar a \nintervenção com equipe e família, garantindo \nacompanhamento e avaliação de resultados. \nIdentifique a metodologia mais compatível com \nesse objetivo: \n(A) Orientação pontual e retorno somente se \nhouver nova queixa. \n(B) Encaminhamento direto para serviço externo, \nsem pactuação. \n(C) Reunião expositiva para informar regras, sem \ndevolutiva. \n(D) Intervenção centrada em advertência e \nsuspensão graduada. \n(E) Plano de acompanhamento com metas, \nresponsáveis e monitoramento.", "source": "Jeriquara · Orientador Educacional", "p": 11, "role": "SUP", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q46", "n": 46, "area": "CE", "eixo": "CE07", "topic": "Didática e metodologias", "key": "A", "img": "img/JER26-ORI-Q46.webp", "pages": ["img/JER26-ORI-p11.webp"], "base": null, "text": "QUESTÃO 46 \nA articulação entre teoria e prática constitui \ndesafio central no processo de construção do \nconhecimento escolar. O orientador educacional \nacompanha professores que dominam conteúdos \ndisciplinares, mas apresentam dificuldades em \ntranspô-los didaticamente. Essa problemática \nevidencia dissociação entre saberes: \n(A) Disciplinar e pedagógico. \n(B) Científico e popular. \n(C) Acadêmico e técnico. \n(D) Formal e informal. \n(E) Teórico e empírico.", "source": "Jeriquara · Orientador Educacional", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q47", "n": 47, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "D", "img": "img/JER26-ORI-Q47.webp", "pages": ["img/JER26-ORI-p11.webp"], "base": null, "text": "QUESTÃO 47 \nA participação do orientador educacional na \nconstrução curricular envolve articulação entre \nprescrições oficiais e realidade local. Ao mediar \nadaptações da BNCC considerando contexto \nsociocultural da comunidade, o orientador atua \nna dimensão do currículo: \n(A) Formal oficial. \n(B) Oculto institucional. \n(C) Avaliado externo. \n(D) Praticado real. \n(E) Nulo ausente.", "source": "Jeriquara · Orientador Educacional", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-ORI-Q48", "n": 48, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "C", "img": "img/JER26-ORI-Q48.webp", "pages": ["img/JER26-ORI-p11.webp"], "base": null, "text": "QUESTÃO 48 \nA concepção crítico-social dos conteúdos, \ndefendida por Libâneo, influenciou práticas da \nOrientação Educacional brasileira. Segundo essa \nabordagem, o papel do orientador na mediação \ndas relações escolares deve priorizar: \n(A) Ajustamento psicológico. \n(B) Neutralidade técnica. \n(C) Apropriação crítica do conhecimento. \n(D) Espontaneísmo pedagógico. \n(E) Diretividade autoritária.", "source": "Jeriquara · Orientador Educacional", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": "José Carlos Libâneo", "secondary": []}, {"id": "JER26-ORI-Q50", "n": 50, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "B", "img": "img/JER26-ORI-Q50.webp", "pages": ["img/JER26-ORI-p11.webp"], "base": null, "text": "QUESTÃO 50 \nA coordenação pedagógica pressupõe tempos e \nespaços \ninstitucionalizados \npara \nformação \ncontinuada docente. O orientador que organiza \nencontros semanais para estudo coletivo, \nplanejamento integrado e análise de práticas está \nimplementando: \n(A) Supervisão hierárquica. \n(B) Horário de trabalho pedagógico coletivo. \n(C) Reunião administrativa. \n(D) Conselho de classe. \n(E) Assembleia docente.", "source": "Jeriquara · Orientador Educacional", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "C", "img": "img/JER26-COO-Q01.webp", "pages": ["img/JER26-COO-p2.webp"], "base": "JER26-COO-T1", "text": "QUESTÃO 01 \nO texto “A solidão dentro dos elevadores” é \npredominantemente: \n(A) descritivo, apresentando características sobre \na mecânica dos elevadores. \n(B) narrativo, apresentando os detalhes de um \nacontecimento dentro de um elevador. \n(C) dissertativo, tratando sobre um aspecto do \ncomportamento humano em sociedade. \n(D) didático, orientando os leitores sobre como \nproceder em elevadores sociais. \n(E) histórico, mostrando a evolução das \nmáquinas até chegar aos modernos elevadores.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 2, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q02", "n": 2, "area": "LP", "eixo": "LP03", "topic": "Figuras de linguagem", "key": "D", "img": "img/JER26-COO-Q02.webp", "pages": ["img/JER26-COO-p2.webp"], "base": "JER26-COO-T1", "text": "QUESTÃO 02 \nAssinale a alternativa em que a palavra ou \nexpressão destacada no trecho está sendo \nempregada em seu sentido próprio, real. \n(A) “Máquinas que são incenso e altar para a \narrogância quase infinita dos homens”. \n(B) “numa manhã de inverno, fria e úmida, cinza \ne triste, como as ruas da cidade.” \n(C) “a solidão das ruas (...) dentro de um elevador \npode ser mais dura e mais cinza.” \n(D) “sem saber que atitude tomar, se respondem \nou continuam olhando para o chão”. \n(E) “mais frio do que o frio das ruas que o vento \nassola e a garoa tortura.”", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 2, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q03", "n": 3, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "B", "img": "img/JER26-COO-Q03.webp", "pages": ["img/JER26-COO-p3.webp"], "base": "JER26-COO-T1", "text": "QUESTÃO 03 \n“muito mais frio do que o frio das ruas que o \nvento assola e a garoa tortura.” \nA palavra destacada no trecho acima é sinônima \nde: \n(A) “edifica’, “constrói”. \n(B) “devasta”, “destrói”. \n(C) “ajuda”, “recupera”. \n(D) “sopra”, “refresca”. \n(E) “soma”, “adiciona”", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q04", "n": 4, "area": "LP", "eixo": "LP04", "topic": "Ortografia e acentuação", "key": "C", "img": "img/JER26-COO-Q04.webp", "pages": ["img/JER26-COO-p3.webp"], "base": null, "text": "QUESTÃO 04 \nAssinale a alternativa em que todas as palavras \nestão grafadas de acordo com a norma-padrão \nvigente em Língua Portuguesa. \n(A) Sózinho em suas dependências, ele se abstém \nde qualquer tipo de contato. \n(B) As pessoas vêem as mudanças com muito \nbons olhos. \n(C) Num ínterim, todas as ideias foram colocadas \nem prática imediatamente. \n(D) Próximo ao estádio, concentravam-se os \natletas olimpicos. \n(E) Em outros tempos, os indicios de insatisfação \neram próximos da normalidade.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q05", "n": 5, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "A", "img": "img/JER26-COO-Q05.webp", "pages": ["img/JER26-COO-p3.webp"], "base": null, "text": "QUESTÃO 05 \n“Acho que todo escritor é um leitor de si \nmesmo.” (Michel Laub) \nAssinale a alternativa correta em relação à \nanálise do enunciado acima: \n(A) A forma verbal “Acho” tem o mesmo sentido \nque “Penso”, “Imagino”. \n(B) A expressão “todo escritor” tem o mesmo \nsentido que “o escritor todo”. \n(C) O termo “de si mesmo” completa o sentido \nde “escritor”. \n(D) O termo “mesmo” tem o sentido idêntico a \n“igual”, “semelhante”. \n(E) A conjunção “que” introduz uma oração com \na função de sujeito.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q06", "n": 6, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "E", "img": "img/JER26-COO-Q06.webp", "pages": ["img/JER26-COO-p3.webp"], "base": null, "text": "QUESTÃO 06 \nAssinale a alternativa cuja expressão completa a \nlacuna abaixo corretamente, com a forma verbal \nde acordo com a norma-padrão. \n“Tudo ficará bem quando ele se __________.” \n(A) recompor do susto \n(B) propor mudanças sérias \n(C) impor momentos de lazer \n(D) predispor aos estudos \n(E) dispuser ao trabalho", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q07", "n": 7, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "A", "img": "img/JER26-COO-Q07.webp", "pages": ["img/JER26-COO-p3.webp"], "base": null, "text": "QUESTÃO 07 \n“O livro não está aí para padronizar coisas e sim, \npara, através da ficção, ou dos ensaios, expandir \npensamentos e pontos de vista” (Roger Mello) \nA palavra destacada no pensamento acima possui \no sentido de: \n(A) \nfinalidade \ne \npode \nser \nsubstituída \nadequadamente por “a fim de”. \n(B) \nfinalidade \ne \npode \nser \nsubstituída \nadequadamente por “afim de”. \n(C) consequência e pode ser substituída \nadequadamente por “a fim de”. \n(D) consequência e pode ser substituída \nadequadamente por “afim de”. \n(E) causa e pode ser substituída adequadamente \npor “a fim de”.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q08", "n": 8, "area": "LP", "eixo": "LP13", "topic": "Redação oficial", "key": "D", "img": "img/JER26-COO-Q08.webp", "pages": ["img/JER26-COO-p3.webp"], "base": null, "text": "QUESTÃO 08 \nEntre \nos \ndocumentos \nque \nintegram \na \ncomunicação técnica oficial, qual é o objetivo da \nprocuração? \n(A) Declarar a veracidade de um fato.  \n(B) Apresentar a formação e a experiência de um \ndeterminado candidato. \n(C) Registrar as decisões de uma reunião ou \nassembleia. \n(D) Outorgar direitos para alguém representar \numa outra pessoa física ou jurídica.  \n(E) Realizar um levantamento de ocorrências \nrelacionadas a um determinado fato.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 3, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q09", "n": 9, "area": "LP", "eixo": "LP03", "topic": "Figuras de linguagem", "key": "B", "img": "img/JER26-COO-Q09.webp", "pages": ["img/JER26-COO-p4.webp"], "base": null, "text": "QUESTÃO 09 \n \n \nBECK, Alexandre. Tiras de Armandinho. Disponível em <https://fotografia.folha.uol.com.br/galerias/27431-tiras-de-\narmandinho>. \n \nNa tirinha acima, a “tristeza” é empregada sob qual figura de linguagem? \n(A) Metonímia \n(B) Prosopopeia \n(C) Pleonasmo \n(D) Hipérbole \n(E) Ironia", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 4, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q10", "n": 10, "area": "LP", "eixo": "LP07", "topic": "Concordância", "key": "E", "img": "img/JER26-COO-Q10.webp", "pages": ["img/JER26-COO-p4.webp"], "base": null, "text": "QUESTÃO 10 \nAssinale a alternativa que apresenta a palavra destacada totalmente de acordo com as normas de \nconcordância da redação técnica oficial. \n(A) Envio-lhe anexo os atestados relacionados ao caso tratado pela diretoria. \n(B) Seguem as tratativas anexo ao pedido de reconsideração da conduta do servidor. \n(C) Estão anexa ao processo as declarações do oficial de justiça. \n(D) Anexos, vai o livro de atas que foi solicitado pela nova gestão. \n(E) Envio-lhe anexas as cópias da certidão solicitadas pela gerência da empresa.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 4, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q11", "n": 11, "area": "MRL", "eixo": "MRL01", "topic": "Números e operações", "key": "B", "img": "img/JER26-COO-Q11.webp", "pages": ["img/JER26-COO-p5.webp"], "base": null, "text": "QUESTÃO 11 \nQual é o resultado da seguinte operação: \n5\n7\n10\n7\n+  0,87 − \n37\n4\n100\n4\n= ? \n(A) 0,5 \n(B) 1 \n(C) 0,87 \n(D) 1,37 \n(E) 1,74", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q12", "n": 12, "area": "MRL", "eixo": "MRL02", "topic": "MMC e MDC", "key": "E", "img": "img/JER26-COO-Q12.webp", "pages": ["img/JER26-COO-p5.webp"], "base": null, "text": "QUESTÃO 12 \nConsidere os números 7 e 2401. Assinale a \nalternativa que apresenta corretamente o Mínimo \nMúltiplo Comum (MMC) desses dois números: \n(A) 7 \n(B) 49 \n(C) 70 \n(D) 343 \n(E) 2401", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q14", "n": 14, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "B", "img": "img/JER26-COO-Q14.webp", "pages": ["img/JER26-COO-p5.webp"], "base": null, "text": "QUESTÃO 14 \nAnalise as assertivas abaixo, referentes a \nporcentagens, e classifique-as em verdadeiro (V) \nou falso (F). Em seguida, assinale a alternativa \ncorreta: \n(__) 75 é 15% de 500. \n(__) 113% de 650 é igual a 734,5.  \n(__) 12% de 600 é igual a 60. \n(__) 30 é 25% de 150. \n(A) V – F – F – F \n(B) V – V – F – F \n(C) F – V – V – V \n(D) F – F – F – V \n(E) F – F – F – F", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q15", "n": 15, "area": "MRL", "eixo": "MRL05", "topic": "Regra de três", "key": "E", "img": "img/JER26-COO-Q15.webp", "pages": ["img/JER26-COO-p5.webp"], "base": null, "text": "QUESTÃO 15 \nUm avião percorre 1.127,82 km em 1,5 horas. \nMantendo a mesma velocidade, assinale a \nalternativa que apresenta a distância percorrida \nem 1 hora e 20 minutos: \n(A) 650,0 km  \n(B) 700,0 km \n(C) 800,0 km \n(D) 900,0 km \n(E) 1.000,0 km", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q16", "n": 16, "area": "MRL", "eixo": "MRL06", "topic": "Médias", "key": "C", "img": "img/JER26-COO-Q16.webp", "pages": ["img/JER26-COO-p5.webp"], "base": null, "text": "QUESTÃO 16 \nDurante um processo seletivo, Thiago realizou \nquatro provas, cada uma valendo peso 2. As \nnotas obtidas foram: \n• Prova 1: 6,0 \n• Prova 2: 8,0 \n• Prova 3: 7,0 \n• Prova 4: 9,0 \nSabendo que todas as provas possuem o mesmo \npeso, qual foi a média ponderada final do \nThiago? \nAssinale a alternativa correta. \n(A) 6,5 \n(B) 7,0 \n(C) 7,5 \n(D) 8,0 \n(E) 8,5", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 5, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q17", "n": 17, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "D", "img": "img/JER26-COO-Q17.webp", "pages": ["img/JER26-COO-p6.webp"], "base": null, "text": "QUESTÃO 17 \nA soma de dois números é 324. Se a razão entre \nesses números é 𝑎: 𝑏= 1: 3, quais são os valores \ndos números?  \nAssinale a alternativa que apresenta os valores de \na e b, mantendo a proporção a:b = 1:3, cuja soma \né 324. \n(A) a = 243 e b = 729 \n(B) a = 81 e b = 27 \n(C) a = 27 e b = 81 \n(D) a = 81 e b = 243 \n(E) a = 243 e b = 81", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q18", "n": 18, "area": "MRL", "eixo": "MRL08", "topic": "Equações e sistemas", "key": "C", "img": "img/JER26-COO-Q18.webp", "pages": ["img/JER26-COO-p6.webp"], "base": null, "text": "QUESTÃO 18 \nConsidere o sistema de equações do primeiro \ngrau abaixo: \n{ 2𝑥−𝑦= 7\n3𝑥+ 𝑦= 13 \nAssinale a alternativa que apresenta os valores \ncorretos de 𝑥 e 𝑦, respectivamente, que resolvem \no sistema acima. \n(A) 𝑥= 2 e 𝑦= 3 \n(B) 𝑥= 3 e 𝑦= −4 \n(C) 𝑥= 4 e 𝑦= 1 \n(D) 𝑥= 5 e 𝑦= −3 \n(E) 𝑥= 1 e 𝑦= 6", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q19", "n": 19, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "D", "img": "img/JER26-COO-Q19.webp", "pages": ["img/JER26-COO-p6.webp"], "base": null, "text": "QUESTÃO 19 \nSara comprou um pacote de biscoitos de nata \ncontendo 15 unidades, com peso total de 0,120 \nkg. O preço do produto é cobrado por quilo, ao \nvalor de R$ 89,50 por kg. \nCom base nessas informações, qual é o valor \npago por cada biscoito de nata? \nAssinale a alternativa correta. \n(A) R$ 0,12 \n(B) R$ 0,52 \n(C) R$ 0,62 \n(D) R$ 0,72 \n(E) R$ 0,82", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q20", "n": 20, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "D", "img": "img/JER26-COO-Q20.webp", "pages": ["img/JER26-COO-p6.webp"], "base": null, "text": "QUESTÃO 20 \nGilmar é engenheiro civil da prefeitura de \nJeriquara e está desenvolvendo um projeto de \ninstalação de uma tubulação de esgoto ao longo \nda Avenida Francisco Gonçalves Costa. Gilmar \nmediu a distância entre os pontos A e B, na Rua \nCoronel Francisco Lino, e encontrou 246,67 \nmetros. Depois, mediu a distância entre os pontos \nB e C, na Rua Joaquim Alves Costa, obtendo \n83,74 metros. A tubulação será instalada paralela \nà linha AC e terá o mesmo comprimento, \nconforme mostrado na figura a seguir. \n \n \n \nCom base nessas informações e considerando \nque os segmentos AB e BC formam um ângulo \nreto, determine o comprimento aproximado da \nreta AC. Assinale a alternativa correta: \n(A) 100,0 m \n(B) 150,4 m \n(C) 200,0 m \n(D) 260,5 m \n(E) 350,5 m", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 6, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": ["Geometria"]}, {"id": "JER26-COO-Q21", "n": 21, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "E", "img": "img/JER26-COO-Q21.webp", "pages": ["img/JER26-COO-p7.webp"], "base": null, "text": "QUESTÃO 21 \nAo \npreparar \num \ndocumento \npara \nser \ncompartilhado com outros setores, garantindo \nque \nseu \nconteúdo \nnão \nseja \nalterado \nindevidamente, o servidor opta por salvá-lo em \num formato amplamente utilizado no sistema \nWindows. Considerando as características dos \narquivos, assinale a alternativa correta: \n(A) Arquivos PDF permitem edição irrestrita do \nconteúdo por qualquer usuário, sem necessidade \nde programas específicos. \n(B) O formato PDF é utilizado apenas para \nimagens e não comporta textos ou formulários \ndigitais. \n(C) Arquivos PDF possuem tamanho fixo e não \nvariam de acordo com o tipo ou quantidade de \nconteúdo inserido. \n(D) O formato PDF é incompatível com o \nsistema operacional \nWindows e depende \nexclusivamente de plataformas online. \n(E) Documentos salvos no formato PDF \npreservam a disposição visual do conteúdo para \nleitura, compartilhamento e impressão.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q22", "n": 22, "area": "INF", "eixo": "INF02", "topic": "Word", "key": "A", "img": "img/JER26-COO-Q22.webp", "pages": ["img/JER26-COO-p7.webp"], "base": null, "text": "QUESTÃO 22 \nDurante a edição de um texto no Microsoft Word \nconfigurado no idioma português, na versão \nrecente, o usuário deseja aplicar o recurso de \nsublinhado ao trecho previamente selecionado. \nPara essa ação, deve ser utilizado qual dos \nseguintes atalhos de teclado? \n(A) Ctrl + S. \n(B) Ctrl + Shift + F8. \n(C) Ctrl + Alt + Z. \n(D) Shift + F6. \n(E) Ctrl + Alt.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q23", "n": 23, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "B", "img": "img/JER26-COO-Q23.webp", "pages": ["img/JER26-COO-p7.webp"], "base": null, "text": "QUESTÃO 23 \nDurante a execução de diferentes atividades no \ncomputador institucional, um servidor decide \norganizar seus trabalhos utilizando mais de uma \nárea \nde \ntrabalho \nno \nsistema \nWindows. \nConsiderando esse recurso, assinale a alternativa \ncorreta: \n(A) A criação de uma nova área de trabalho \nsubstitui automaticamente a anterior, apagando \narquivos e programas abertos. \n(B) As áreas de trabalho adicionais permitem \nseparar janelas e aplicativos em ambientes \ndistintos, sem excluir dados do usuário. \n(C) Ao criar uma nova área de trabalho, o \nWindows impede a personalização do nome \ndesse ambiente virtual. \n(D) A funcionalidade de múltiplas áreas de \ntrabalho está disponível apenas mediante \ninstalação de softwares externos ao sistema. \n(E) As áreas de trabalho criadas no Windows \nservem exclusivamente para alterar a aparência \nvisual do sistema, sem impacto na organização \ndas tarefas.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q24", "n": 24, "area": "INF", "eixo": "INF03", "topic": "Excel", "key": "C", "img": "img/JER26-COO-Q24.webp", "pages": ["img/JER26-COO-p7.webp"], "base": null, "text": "QUESTÃO 24 \nUm servidor utiliza o Microsoft Excel para \nelaborar uma planilha contendo nome e \nsobrenome de servidores em colunas distintas, \ncom a finalidade de gerar um único campo de \nidentificação. Considerando o uso de fórmulas no \nExcel, assinale a alternativa correta quanto ao \nrecurso empregado para unir textos de células \ndiferentes: \n(A) A junção de textos em células distintas é \nrealizada exclusivamente por meio de atalhos de \nteclado, sem utilização de fórmulas. \n(B) O Excel utiliza operadores matemáticos, \ncomo soma e subtração, para unir conteúdos \ntextuais em uma única célula. \n(C) O operador & permite associar valores de \ntexto provenientes de uma ou mais células, \nresultando em uma única sequência textual. \n(D) A combinação de textos só é possível quando \nas células envolvidas contêm exclusivamente \nvalores numéricos. \n(E) Para unir textos no Excel, é obrigatório \nconverter previamente as células em formato de \ndata.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q25", "n": 25, "area": "INF", "eixo": "INF06", "topic": "Internet e segurança", "key": "A", "img": "img/JER26-COO-Q25.webp", "pages": ["img/JER26-COO-p8.webp"], "base": null, "text": "QUESTÃO 25 \nAcerca do conceito de hiperlink na navegação na \ninternet, analise as assertivas a seguir e assinale \nV, para as verdadeiras, ou F, para as falsas: \n( ) Hiperlinks podem ser representados por \npalavras ou imagens que direcionam o usuário a \noutros conteúdos digitais. \n(   ) O uso de hiperlinks permite a navegação \nentre páginas distintas sem a necessidade de \ndigitar manualmente novos endereços. \n( ) Hiperlinks são arquivos armazenados \nobrigatoriamente no computador do usuário, não \ndependendo de conexão com a internet. \n(   ) A ativação de um hiperlink pode direcionar \no usuário para outra página, documento ou seção \ndo mesmo site. \nAssinale a alternativa que apresenta a sequência \ncorreta, de cima para baixo: \n(A) V – V – F – V. \n(B) V – F – F – V. \n(C) F – V – V – F. \n(D) F – F – V – V. \n(E) V – V – V – F. \n \nCONHECIMENTOS ESPECÍFICOS", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q26", "n": 26, "area": "CE", "eixo": "LEG_12686", "topic": "Educação especial — Decreto 12.686/2025", "key": "B", "img": "img/JER26-COO-Q26.webp", "pages": ["img/JER26-COO-p8.webp"], "base": null, "text": "QUESTÃO 26 \nDe acordo com o artigo 4º da Política Nacional \nde Educação Especial Inclusiva, assinale a \nalternativa que apresenta corretamente um dos \nobjetivos dessa Política: \n(A) Eliminar a matrícula de estudantes da \neducação especial na educação superior. \n(B) Reduzir a distorção idade-série do público da \neducação especial e a desigualdade de acesso, \nbem \ncomo \nmelhorar \nas \ncondições \nde \npermanência na educação superior. \n(C) Restringir programas educacionais apenas \naos estudantes com deficiência física. \n(D) Priorizar ações educacionais somente para \nestudantes \ncom \naltas \nhabilidades \nou \nsuperdotação. \n(E) Substituir programas educacionais por ações \nassistenciais.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q27", "n": 27, "area": "CE", "eixo": "LEG_12686", "topic": "Educação especial — Decreto 12.686/2025", "key": "E", "img": "img/JER26-COO-Q27.webp", "pages": ["img/JER26-COO-p8.webp"], "base": null, "text": "QUESTÃO 27 \nDe acordo com o artigo 17º da Política Nacional \nde Educação Especial Inclusiva, que trata dos \nobjetivos da Rede Nacional de Educação \nEspecial Inclusiva, assinale a alternativa que \ncorresponde corretamente a um desses objetivos: \n(A) Restringir a formação continuada dos \nprofissionais \nda \neducação \nàs \ninstituições \nprivadas. \n(B) Limitar a produção de conhecimento sobre \neducação especial inclusiva ao ensino superior. \n(C) Eliminar o monitoramento das políticas de \neducação especial inclusiva. \n(D) Centralizar o atendimento educacional \nespecializado fora das redes públicas de ensino. \n(E) Fortalecer os serviços de apoio técnico e a \nprodução de materiais acessíveis para a educação \nespecial inclusiva.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q29", "n": 29, "area": "CE", "eixo": "LEG_ECA", "topic": "ECA", "key": "A", "img": "img/JER26-COO-Q29.webp", "pages": ["img/JER26-COO-p9.webp"], "base": null, "text": "QUESTÃO 29 \nNos termos do art. 56 da Lei nº 8.069/1990 \n(Estatuto da Criança e do Adolescente), analise \nas afirmativas a seguir e assinale a alternativa que \napresenta a sequência correta, considerando V \n(VERDADEIRO) ou F (FALSO): \n( ) Os dirigentes de estabelecimentos de ensino \nfundamental devem comunicar ao Conselho \nTutelar os casos de maus-tratos envolvendo seus \nalunos. \n( ) A reiteração de faltas injustificadas e a evasão \nescolar, após esgotados os recursos escolares, \ndevem ser comunicadas ao Conselho Tutelar. \n( ) O baixo rendimento em uma disciplina \nespecífica, sem histórico de repetência, deve ser \nobrigatoriamente comunicado ao Conselho \nTutelar. \n(A) V, V, F. \n(B) V, V, V. \n(C) F, F, V. \n(D) F, V, V. \n(E) F, F, F.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q30", "n": 30, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "C", "img": "img/JER26-COO-Q30.webp", "pages": ["img/JER26-COO-p9.webp"], "base": null, "text": "QUESTÃO 30 \nDe acordo com a Resolução nº 7, de 14 de \ndezembro de 2010, que fixa as Diretrizes \nCurriculares \nNacionais \npara \no \nEnsino \nFundamental, assinale a alternativa correta: \n(A) O Ensino Fundamental é uma faculdade do \nEstado, cabendo à família decidir sobre sua \noferta. \n(B) O Ensino Fundamental é um direito público \nsubjetivo e um dever exclusivo da família. \n(C) O Ensino Fundamental é um direito público \nsubjetivo, sendo dever do Estado e da família \nassegurar sua oferta a todos. \n(D) O Ensino Fundamental público pode ser \noferecido mediante processo seletivo. \n(E) A oferta do Ensino Fundamental público e \ngratuito pode ser condicionada aos critérios de \ndesempenho escolar.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q31", "n": 31, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "C", "img": "img/JER26-COO-Q31.webp", "pages": ["img/JER26-COO-p9.webp"], "base": null, "text": "QUESTÃO 31 \nA \norganização \ncurricular \ndo \nEnsino \nFundamental, \nconforme \nestabelecido \npela \nResolução nº 7, de 14 de dezembro de 2010, \nprevê uma estrutura específica. Sobre essa \norganização, assinale a alternativa correta: \n(A) O currículo do Ensino Fundamental é \ncomposto exclusivamente por conteúdo definido \npelo Ministério da Educação. \n(B) O currículo do Ensino Fundamental possui \napenas uma parte diversificada, definida por cada \nescola. \n(C) O currículo do Ensino Fundamental tem uma \nbase nacional comum, complementada por uma \nparte diversificada nos sistemas de ensino e nas \nescolas. \n(D) O currículo do Ensino Fundamental é \nlivremente \ndefinido \npelas \nfamílias \ndos \nestudantes. \n(E) O currículo do Ensino Fundamental pode \nvariar totalmente, sem necessidade de uma base \ncomum.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q32", "n": 32, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "E", "img": "img/JER26-COO-Q32.webp", "pages": ["img/JER26-COO-p9.webp"], "base": null, "text": "QUESTÃO 32 \nA Lei nº 9.394/1996 define o conceito de \neducação \ne \nestabelece \ncaracterísticas \nda \neducação escolar. Sobre esse tema, assinale a \nalternativa correta: \n(A) A educação limita-se aos processos \nformativos que ocorrem exclusivamente nas \ninstituições de ensino. \n(B) A educação escolar ocorre, prioritariamente, \nfora das instituições próprias de ensino. \n(C) A educação escolar deve estar desvinculada \ndas experiências sociais e profissionais dos \nestudantes. \n(D) A educação escolar independe do ensino e \ndas instituições educacionais. \n(E) A educação abrange diversos processos \nformativos e a educação escolar deve estar \nvinculada ao mundo do trabalho e à prática \nsocial.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q33", "n": 33, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "B", "img": "img/JER26-COO-Q33.webp", "pages": ["img/JER26-COO-p10.webp"], "base": null, "text": "QUESTÃO 33 \nA \nConstituição \nFederal \nassegura \nàs \nuniversidades em um regime jurídico próprio. \nSobre o art. 207 da Constituição da República, \nassinale a alternativa correta: \n(A) As universidades possuem autonomia apenas \nadministrativa, devendo submeter suas decisões \nacadêmicas ao Poder Executivo. \n(B) As universidades gozam de autonomia \ndidático-científica, administrativa e de gestão \nfinanceira e patrimonial, observando o princípio \nda indissociabilidade entre ensino, pesquisa e \nextensão. \n(C) A admissão de professores e pesquisadores \nestrangeiros é vedada em qualquer hipótese. \n(D) O regime previsto no art. 207 aplica-se \nexclusivamente às universidades públicas. \n(E) O princípio da indissociabilidade entre \nensino, pesquisa e extensão não se aplica às \ninstituições de pesquisa científica.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q34", "n": 34, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "D", "img": "img/JER26-COO-Q34.webp", "pages": ["img/JER26-COO-p10.webp"], "base": null, "text": "QUESTÃO 34 \nNos termos da Constituição Federal, o ensino \noferecido pela iniciativa privada é permitido, \ndesde que sejam respeitadas determinadas \ncondições. Sobre esse tema, assinale a alternativa \ncorreta: \n(A) O ensino privado pode funcionar sem \nqualquer controle ou autorização do Poder \nPúblico. \n(B) O ensino privado não precisa seguir os \nparâmetros de qualidade exigidos das escolas \npúblicas. \n(C) O ensino privado só pode ser ofertado em \nnível superior. \n(D) O ensino privado deve cumprir as normas \ngerais da educação nacional e passar por \nautorização e avaliação de qualidade pelo Poder \nPúblico. \n(E) A iniciativa privada pode substituir \nintegralmente o ensino público obrigatório.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q35", "n": 35, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "A", "img": "img/JER26-COO-Q35.webp", "pages": ["img/JER26-COO-p10.webp"], "base": null, "text": "QUESTÃO 35 \nLeia o enunciado abaixo e assinale a alternativa \nque apresenta o termo INCORRETO: \nA Lei nº 9.394/1996 (Lei de Diretrizes e Bases \nda Educação Nacional) organiza a educação \nescolar em níveis, estabelecendo sua estrutura \nbásica no ordenamento jurídico brasileiro. \nSegundo essa Lei, a educação escolar compõe-se \nde: \n(A) Educação do Idoso.  \n(B) Ensino Médio. \n(C) Educação Superior. \n(D) Ensino Fundamental. \n(E) Educação Infantil.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q36", "n": 36, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "B", "img": "img/JER26-COO-Q36.webp", "pages": ["img/JER26-COO-p10.webp"], "base": null, "text": "QUESTÃO 36 \nA Lei de Diretrizes e Bases da Educação \nNacional estabelece regras específicas para a \norganização da Educação Infantil. Ao contrário \nda creche, onde a frequência não é requisito para \no ano letivo, na pré-escola a lei exige o controle \nde frequência pela instituição, condicionando a \nvalidade do ano letivo ao comparecimento \nmínimo do total de horas de: \n(A) 50%. \n(B) 60%. \n(C) 75%. \n(D) 70%. \n(E) 55%.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q39", "n": 39, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "C", "img": "img/JER26-COO-Q39.webp", "pages": ["img/JER26-COO-p11.webp"], "base": null, "text": "QUESTÃO 39 \nO Parecer CNE/CP 8/2012 – Educação em \nDireitos Humanos estabelece que a Educação em \nDireitos Humanos (EDH) não deve ser reduzida \na uma disciplina isolada, mas sim permear toda a \nestrutura pedagógica. A forma preferencial de \ninserção \ndos \nconhecimentos \nde \nDireitos \nHumanos na organização curricular da Educação \nBásica é a: \n(A) Facultativa. \n(B) Suplementar. \n(C) Transversal. \n(D) Modular. \n(E) Optativa.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q40", "n": 40, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "A", "img": "img/JER26-COO-Q40.webp", "pages": ["img/JER26-COO-p11.webp"], "base": null, "text": "QUESTÃO 40 \nUm(a) coordenador(a) precisa revisar o currículo \nsem perder coerência entre objetivos, atividades \ne \navaliação, \nmantendo \nprogressão \nde \ncomplexidade ao longo do ano. Identifique o \nprincípio \ncurricular \nmais \ndiretamente \nmobilizado: \n(A) Alinhamento construtivo. \n(B) Avaliação normativa. \n(C) Planejamento reativo. \n(D) Currículo oculto. \n(E) Seriação administrativa.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q41", "n": 41, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "B", "img": "img/JER26-COO-Q41.webp", "pages": ["img/JER26-COO-p11.webp"], "base": null, "text": "QUESTÃO 41 \nA equipe docente relata baixa adesão a decisões \ne pouca corresponsabilização, apesar de reuniões \nfrequentes. A coordenação decide adotar rotinas \nde \npactuação, \ndevolutiva \ne \nregistro \nde \nencaminhamentos. Identifique o instrumento de \ngestão mais compatível: \n(A) Memorando circular sem discussão. \n(B) Ata com plano de ação e responsáveis. \n(C) Quadro de avisos para comunicados. \n(D) Relatório anual apenas descritivo. \n(E) Diário de classe individual.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q42", "n": 42, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "C", "img": "img/JER26-COO-Q42.webp", "pages": ["img/JER26-COO-p11.webp"], "base": null, "text": "QUESTÃO 42 \nUm(a) coordenador(a) pretende fortalecer clima \nde confiança e reduzir microconflitos entre \ndocentes, sem centralizar decisões. Identifique a \nprática de liderança mais alinhada: \n(A) Liderança coercitiva. \n(B) Liderança carismática personalista. \n(C) Liderança distribuída com autonomia \npactuada. \n(D) Liderança burocrática por controle de \npresença. \n(E) Liderança transacional por punição.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q43", "n": 43, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "A", "img": "img/JER26-COO-Q43.webp", "pages": ["img/JER26-COO-p11.webp"], "base": null, "text": "QUESTÃO 43 \nNo estágio pré-operatório descrito por Piaget, o \npensamento da criança apresenta características \npeculiares. A tendência infantil de atribuir vida, \nsentimentos, intenções e consciência a objetos \ninanimados ou fenômenos da natureza é \ntecnicamente denominada: \n(A) Animismo. \n(B) Realismo. \n(C) Artificialismo. \n(D) Finalismo. \n(E) Egocentrismo.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q44", "n": 44, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "B", "img": "img/JER26-COO-Q44.webp", "pages": ["img/JER26-COO-p12.webp"], "base": null, "text": "QUESTÃO 44 \nArnold Gesell foi pioneiro no estudo das normas \nde \ncrescimento, \nenfatizando \nos \nfatores \nbiológicos. A teoria que defende que o \ndesenvolvimento ocorre em uma sequência fixa \ne previsível, determinada fundamentalmente pela \ngenética e pelo crescimento do sistema nervoso, \né o: \n(A) Interacionismo. \n(B) Maturacionismo. \n(C) Ambientalismo. \n(D) Construtivismo. \n(E) Behaviorismo.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q45", "n": 45, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "E", "img": "img/JER26-COO-Q45.webp", "pages": ["img/JER26-COO-p12.webp"], "base": null, "text": "QUESTÃO 45 \nA Teoria da Aprendizagem Significativa de \nDavid Ausubel postula que a construção do \nconhecimento \nocorre \nquando \numa \nnova \ninformação se conecta de modo substantivo e não \narbitrário a um aspecto relevante da estrutura \ncognitiva prévia do aluno. Esse conhecimento \nespecífico \npreexistente, \nque \nserve \nde \n\"ancoradouro\" para o novo saber, é tecnicamente \ndenominado: \n(A) Esquema. \n(B) Signo. \n(C) Gestalt. \n(D) Andaime. \n(E) Subsunçor.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q46", "n": 46, "area": "CE", "eixo": "CE15", "topic": "Tecnologias educacionais", "key": "C", "img": "img/JER26-COO-Q46.webp", "pages": ["img/JER26-COO-p12.webp"], "base": null, "text": "QUESTÃO 46 \nA ferramenta digital que melhor caracteriza uma \nabordagem ativa de aprendizagem por projeto é \no uso de: \n(A) Apresentações de slides lineares. \n(B) Planilhas eletrônicas para cálculos. \n(C) Ambientes virtuais de colaboração. \n(D) Questionários online de múltipla escolha. \n(E) Listas de exercícios digitalizadas.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q47", "n": 47, "area": "CE", "eixo": "CE15", "topic": "Tecnologias educacionais", "key": "A", "img": "img/JER26-COO-Q47.webp", "pages": ["img/JER26-COO-p12.webp"], "base": null, "text": "QUESTÃO 47 \nSobre \nas \nTecnologias \nda \nInformação \ne \nComunicação aplicadas à educação, o Kahoot! \nfornece quizzes gamificados para fixação de \nconteúdo em grupo. É classificada no grupo de: \n(A) Ferramentas Interativas. \n(B) Plataformas de Aprendizagem Online. \n(C) Produção de Conteúdo. \n(D) Realidade Virtual. \n(E) Realidade Amplificada.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q48", "n": 48, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "C", "img": "img/JER26-COO-Q48.webp", "pages": ["img/JER26-COO-p12.webp"], "base": null, "text": "QUESTÃO 48 \nO \nProjeto \nPolítico-Pedagógico \nconstitui \nidentidade \nda \nescola \ne \ndireciona \nações \neducativas. \nA \ndimensão \nque \nestabelece \nfundamentos \nfilosóficos, \nconcepções \nde \neducação, sociedade e conhecimento que \norientam práticas pedagógicas institucionais é \ndenominada: \n(A) Operacional. \n(B) Administrativa. \n(C) Epistemológica. \n(D) Financeira. \n(E) Logística.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q49", "n": 49, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "B", "img": "img/JER26-COO-Q49.webp", "pages": ["img/JER26-COO-p12.webp"], "base": null, "text": "QUESTÃO 49 \nA construção de práticas colaborativas na escola \npressupõe superação do isolamento docente. O \ncoordenador que organiza grupos de estudo \npermanentes \nonde \nprofessores \npesquisam, \nplanejam coletivamente e refletem sobre práticas \nestá implementando estratégia de: \n(A) Supervisão vertical. \n(B) Comunidade de aprendizagem. \n(C) Controle pedagógico. \n(D) Fiscalização didática. \n(E) Inspeção curricular.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-COO-Q50", "n": 50, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "E", "img": "img/JER26-COO-Q50.webp", "pages": ["img/JER26-COO-p13.webp"], "base": null, "text": "QUESTÃO 50 \nO planejamento participativo na escola envolve \ndiferentes níveis hierárquicos de organização \ntemporal. O instrumento que detalha objetivos, \nconteúdos, metodologias e avaliação para \nperíodo letivo específico de uma disciplina é o \nplano: \n(A) Curricular institucional. \n(B) Gestão democrática. \n(C) Político-pedagógico. \n(D) Desenvolvimento institucional. \n(E) Ensino disciplinar.", "source": "Jeriquara · Coordenador Educacional Pedagógico", "p": 13, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q26", "n": 26, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "C", "img": "img/JER26-INF-Q26.webp", "pages": ["img/JER26-INF-p7.webp"], "base": null, "text": "QUESTÃO 26 \nNos termos do art. 58 da Lei de Diretrizes e Bases \nda Educação Nacional (Lei nº 9.394/96), a \nmodalidade de educação escolar oferecida, \npreferencialmente, na rede regular de ensino, \ndestinada \na \neducandos \ncom \ndeficiência, \ntranstornos globais do desenvolvimento e altas \nhabilidades ou superdotação recebe o nome de: \n(A) Educação Supletiva. \n(B) Educação Básica.  \n(C) Educação Especial. \n(D) Educação Profissional. \n(E) Educação Escolar Indígena.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q27", "n": 27, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "A", "img": "img/JER26-INF-Q27.webp", "pages": ["img/JER26-INF-p8.webp"], "base": null, "text": "QUESTÃO 27 \nLeia o enunciado abaixo com atenção, e assinale \na alternativa que apresenta corretamente o termo \ncorreto para completar a lacuna: \nDe acordo com o artigo 205 da Constituição \nFederal, a ____________, é um direito de todos \ne dever do Estado e da família, será promovida e \nincentivada com a colaboração da sociedade, \ntendo por finalidade o pleno desenvolvimento da \npessoa, o preparo para o exercício da cidadania e \na qualificação para o trabalho. \n(A) Educação. \n(B) Trabalho. \n(C) Ciência. \n(D) Lazer. \n(E) Tecnologia.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q28", "n": 28, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "D", "img": "img/JER26-INF-Q28.webp", "pages": ["img/JER26-INF-p8.webp"], "base": null, "text": "QUESTÃO 28 \nA Constituição Federal de 1988 estabelece \ndiretrizes específicas acerca da organização do \nensino fundamental no Brasil. Considerando o \ndisposto no artigo 210 da CF, assinale a \nalternativa CORRETA: \n(A) O ensino fundamental deverá ter conteúdos \nmínimos uniformes em todo o território nacional, \nvedada qualquer adaptação aos valores regionais \nou culturais. \n(B) O ensino religioso constitui disciplina \nobrigatória nas escolas públicas de ensino \nfundamental, devendo ser ministrado em caráter \nconfessional. \n(C) \nO \nensino \nfundamental \nregular \nserá \nministrado \nexclusivamente \nem \nlíngua \nportuguesa, sendo vedada a utilização de línguas \nmaternas por comunidades indígenas. \n(D) Serão fixados conteúdos mínimos para o \nensino fundamental, assegurando formação \nbásica comum e respeito aos valores culturais e \nartísticos, \nnacionais \ne \nregionais, \nsendo \nfacultativa a matrícula no ensino religioso. \n(E) O ensino religioso poderá ser ofertado apenas \nfora do horário regular das escolas públicas de \nensino fundamental.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q30", "n": 30, "area": "CE", "eixo": "LEG_12686", "topic": "Educação especial — Decreto 12.686/2025", "key": "D", "img": "img/JER26-INF-Q30.webp", "pages": ["img/JER26-INF-p8.webp"], "base": null, "text": "QUESTÃO 30 \nUma escola pública municipal discute a \naplicação da Política Nacional de Educação \nEspecial na Perspectiva da Educação Inclusiva e \nquestiona se um estudante diagnosticado com \nTranstorno do Espectro Autista (TEA) deve ser \nenquadrado como pessoa com deficiência para \nfins de atendimento educacional especializado. \nCom base no Decreto nº 12.686/2025, é correto \nafirmar que: \n(A) O estudante com transtorno do espectro \nautista não é considerado pessoa com deficiência \npara fins educacionais. \n(B) O estudante com transtorno do espectro \nautista somente será considerado pessoa com \ndeficiência no ensino especial segregado. \n(C) O enquadramento depende da avaliação \ndiscricionária da escola. \n(D) O estudante com transtorno do espectro \nautista é considerado pessoa com deficiência \npara fins da Política Nacional de Educação \nEspecial Inclusiva. \n(E) O reconhecimento ocorre apenas após \ndecisão judicial específica.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 8, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q31", "n": 31, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "E", "img": "img/JER26-INF-Q31.webp", "pages": ["img/JER26-INF-p9.webp"], "base": null, "text": "QUESTÃO 31 \nDe acordo com a Resolução nº 7, de 14 de \ndezembro de 2010, que fixa as Diretrizes \nCurriculares \nNacionais \npara \no \nEnsino \nFundamental de 9 anos, o art. 29 destaca a \nimportância de assegurar aos alunos um percurso \ncontínuo de aprendizagens. Para isso, é \nnecessário: \n(A) Manter independentes todas as etapas da \nEducação Básica. \n(B) Priorizar apenas os anos iniciais do Ensino \nFundamental. \n(C) Substituir a articulação entre etapas por \navaliações padronizadas. \n(D) Restringir a articulação pedagógica ao \ninterior do Ensino Fundamental. \n(E) Articular a Educação Infantil, o Ensino \nFundamental e o Ensino Médio.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q32", "n": 32, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "A", "img": "img/JER26-INF-Q32.webp", "pages": ["img/JER26-INF-p9.webp"], "base": null, "text": "QUESTÃO 32 \nDe acordo com a Lei de Diretrizes e Bases da \nEducação Nacional (Lei nº 9.394/96), o ensino \nfundamental é obrigatório e possui regras \nespecíficas. Assinale a alternativa que apresenta \ncorretamente às características desse nível de \nensino: \n(A) Tem duração de 9 anos, é gratuito na escola \npública e inicia-se aos 6 anos de idade. \n(B) Tem duração de 10 anos e inicia-se, \nobrigatoriamente, aos 7 anos de idade. \n(C) Não é obrigatório e pode ser cobrado pelas \nescolas públicas. \n(D) Destina-se apenas à preparação para o \ningresso no ensino superior. \n(E) Pode ser substituído por cursos livres, a \ncritério da família.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q33", "n": 33, "area": "CE", "eixo": "LEG_ECA", "topic": "ECA", "key": "C", "img": "img/JER26-INF-Q33.webp", "pages": ["img/JER26-INF-p9.webp"], "base": null, "text": "QUESTÃO 33 \nNos termos do art. 55 da Lei nº 8.069/1990 \n(Estatuto da Criança e do Adolescente), assinale \na alternativa correta acerca da obrigação \nrelacionada à Matrícula Escolar: \n(A) A matrícula dos filhos na rede regular de \nensino é a faculdade dos pais ou responsáveis. \n(B) Apenas o Estado possui o dever de assegurar \na matrícula escolar. \n(C) Os pais ou responsável têm a obrigação legal \nde matricular seus filhos ou pupilos na rede \nregular de ensino. \n(D) A obrigação de matrícula aplica-se somente \naos responsáveis legais nomeados judicialmente. \n(E) A matrícula é exigida apenas para crianças \ncom idade inferior a seis anos.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q34", "n": 34, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "B", "img": "img/JER26-INF-Q34.webp", "pages": ["img/JER26-INF-p9.webp"], "base": null, "text": "QUESTÃO 34 \nNos termos do art. 6º da Resolução nº 7, de 14 de \ndezembro de 2010, os sistemas de ensino e as \nescolas devem adotar princípios éticos como \nnorteadores das políticas educativas e das ações \npedagógicas. \nAssinale \na \nalternativa \nque \ncorresponde a um princípio ético previsto nesse \ndispositivo: \n(A) Competitividade e meritocracia como \nfundamentos centrais do processo. \n(B) Justiça, solidariedade, liberdade e autonomia, \ncom respeito à dignidade da pessoa humana. \n(C) Neutralidade social e afastamento de temas \nrelacionados à diversidade. \n(D) \nPadronização \nde \ncomportamentos \ne \nsupressão da autonomia. \n(E) Seleção educacional baseada em critérios de \norigem social, apenas.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q35", "n": 35, "area": "CE", "eixo": "LEG_12686", "topic": "Educação especial — Decreto 12.686/2025", "key": "E", "img": "img/JER26-INF-Q35.webp", "pages": ["img/JER26-INF-p10.webp"], "base": null, "text": "QUESTÃO 35 \nConsiderando os princípios da Política Nacional \nde Educação Especial na Educação Inclusiva, \nassinale a alternativa que NÃO corresponde a um \ndesses princípios: \n(A) A diversidade humana como valor a ser \nreconhecido e promovido pela educação. \n(B) A promoção da equidade. \n(C)  A consolidação do trabalho intersetorial \ncomo estratégia para a atenção integral ao \npúblico da educação especial. \n(D) O combate, no contexto educacional, ao \ncapacitismo e à discriminação em todas as suas \nformas. \n(E) O desrespeito pela diversidade de estudantes \ncom deficiência e suas especificidades no âmbito \nda educação.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q37", "n": 37, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "B", "img": "img/JER26-INF-Q37.webp", "pages": ["img/JER26-INF-p10.webp"], "base": null, "text": "QUESTÃO 37 \nAs Diretrizes Curriculares Nacionais para a \nEducação Infantil fixam normas obrigatórias \npara a Educação Infantil. No que tange à \norganização do tempo, a proposta pedagógica \ndeve respeitar a carga horária mínima anual de \n800 horas, distribuída por um mínimo de dias de \nefetivo trabalho educacional de: \n(A) 180. \n(B) 200. \n(C) 220. \n(D) 205. \n(E) 190.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q38", "n": 38, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "E", "img": "img/JER26-INF-Q38.webp", "pages": ["img/JER26-INF-p10.webp"], "base": null, "text": "QUESTÃO 38 \nO Parecer CNE/CEB 20/2009 fundamenta a \nfunção sociopolítica e pedagógica da Educação \nInfantil, \nsuperando \na \nvisão \nmeramente \nassistencialista ou preparatória. O documento \nreafirma que a prática pedagógica deve ter como \neixos norteadores as interações e a brincadeira, \ngarantindo no currículo a indissociabilidade \nentre: \n(A) Teoria e Prática. \n(B) Escola e Comunidade. \n(C) Lúdico e Cognitivo. \n(D) Família e Estado. \n(E) Cuidar e Educar.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q39", "n": 39, "area": "CE", "eixo": "LEG_13257", "topic": "Marco Legal da Primeira Infância", "key": "C", "img": "img/JER26-INF-Q39.webp", "pages": ["img/JER26-INF-p10.webp"], "base": null, "text": "QUESTÃO 39 \nA Lei nº 13.257/2016 – Marco Legal da Primeira \nInfância – estabelece princípios e diretrizes para \na formulação e a implementação de políticas \npúblicas para a primeira infância em atenção à \nespecificidade e à relevância dos primeiros anos \nde vida no desenvolvimento infantil e na \nformação da personalidade. Para os efeitos desta \nLei, considera-se primeira infância o período que \nabrange os primeiros: \n(A) 3 anos completos. \n(B) 4 anos completos. \n(C) 6 anos completos. \n(D) 5 anos completos. \n(E) 7 anos completos.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q40", "n": 40, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "C", "img": "img/JER26-INF-Q40.webp", "pages": ["img/JER26-INF-p10.webp"], "base": null, "text": "QUESTÃO 40 \nEm relação à formação continuada docente, a \nmodalidade que se caracteriza pela pesquisa e \nreflexão coletiva sobre a prática pedagógica, \nvisando à transformação da realidade escolar, é \nconhecida como: \n(A) Capacitação em serviço. \n(B) Atualização curricular. \n(C) Pesquisa-ação. \n(D) Treinamento específico. \n(E) Curso de extensão.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q41", "n": 41, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "B", "img": "img/JER26-INF-Q41.webp", "pages": ["img/JER26-INF-p11.webp"], "base": null, "text": "QUESTÃO 41 \nA concepção de educação que entende o processo \neducativo \ncomo \num \ninstrumento \nde \nconscientização para a transformação social, \nconforme proposto por Paulo Freire, denomina-\nse: \n(A) Educação bancária. \n(B) Educação libertadora. \n(C) Educação tradicional. \n(D) Educação tecnicista. \n(E) Educação espontaneísta.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": "Paulo Freire", "secondary": []}, {"id": "JER26-INF-Q42", "n": 42, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "A", "img": "img/JER26-INF-Q42.webp", "pages": ["img/JER26-INF-p11.webp"], "base": null, "text": "QUESTÃO 42 \nNa contemporaneidade, compreende-se que a \nfunção social da escola extrapola a transmissão \nde \nconhecimentos \nconsolidados, \ndevendo \npriorizar também: \n(A) A formação para o exercício pleno da \ncidadania e o desenvolvimento do pensamento \ncrítico. \n(B) A preparação estritamente técnica para o \nmercado de trabalho em constante mudança. \n(C) A reprodução dos valores sociais e culturais \nhegemônicos sem questionamentos. \n(D) A seleção e classificação meritocrática dos \nalunos para diferentes percursos sociais. \n(E) A custódia e socialização primária das \ncrianças e adolescentes.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q43", "n": 43, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "C", "img": "img/JER26-INF-Q43.webp", "pages": ["img/JER26-INF-p11.webp"], "base": null, "text": "QUESTÃO 43 \nA perspectiva filosófica que fundamenta a \nconcepção \nda \nescola \ncomo \nespaço \nde \ndesenvolvimento \ndas \npotencialidades \ndo \nindivíduo, com foco no aluno como centro do \nprocesso, é o: \n(A) Marxismo. \n(B) Existencialismo. \n(C) Escolanovismo. \n(D) Positivismo. \n(E) Estruturalismo.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q44", "n": 44, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "D", "img": "img/JER26-INF-Q44.webp", "pages": ["img/JER26-INF-p11.webp"], "base": null, "text": "QUESTÃO 44 \nA \nteoria \nda \naprendizagem \nsignificativa \nestabelece \nprincípios \npara \nconstrução \nde \nconhecimentos duradouros. Segundo Ausubel, o \nconhecimento prévio do aluno que ancora novas \ninformações e permite atribuição de significados \né denominado: \n(A) Esquema cognitivo. \n(B) Zona proximal. \n(C) Estrutura mental. \n(D) Subsunçor. \n(E) Organizador prévio.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q45", "n": 45, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "A", "img": "img/JER26-INF-Q45.webp", "pages": ["img/JER26-INF-p11.webp"], "base": null, "text": "QUESTÃO 45 \nO Desenho Universal para Aprendizagem \n(DUA) propõe estratégias que beneficiam todos \nos estudantes desde o planejamento pedagógico. \nOs três princípios norteadores do DUA envolvem \nmúltiplas \nformas \nde \nrepresentação, \nação/expressão e: \n(A) Engajamento. \n(B) Avaliação. \n(C) Comunicação. \n(D) Socialização. \n(E) Memorização.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q46", "n": 46, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "E", "img": "img/JER26-INF-Q46.webp", "pages": ["img/JER26-INF-p11.webp"], "base": null, "text": "QUESTÃO 46 \nAs teorias curriculares críticas, fundamentadas \nem autores como Apple e Giroux, questionam \nneutralidade do conhecimento escolar. Essas \nteorias analisam como currículo reproduz ou \ntransforma relações de poder, enfatizando \nconceito de currículo como: \n(A) Documento oficial. \n(B) Lista de conteúdos. \n(C) Sequência didática. \n(D) Grade disciplinar. \n(E) Território contestado.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q47", "n": 47, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "B", "img": "img/JER26-INF-Q47.webp", "pages": ["img/JER26-INF-p12.webp"], "base": null, "text": "QUESTÃO 47 \nA pedagogia histórico-crítica, formulada por \nDermeval Saviani, propõe superação dialética \nentre pedagogias tradicional e nova. A etapa \nmetodológica \nonde \neducador \nrelaciona \nconteúdos à prática social dos educandos, \nproblematizando contradições, é denominada: \n(A) Síntese. \n(B) Problematização. \n(C) Catarse. \n(D) Instrumentalização. \n(E) Prática social inicial.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": "Dermeval Saviani", "secondary": []}, {"id": "JER26-INF-Q48", "n": 48, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "C", "img": "img/JER26-INF-Q48.webp", "pages": ["img/JER26-INF-p12.webp"], "base": null, "text": "QUESTÃO 48 \nUma \nescola \napresenta \nrotatividade \nalta, \ncomunicação defensiva e decisões concentradas, \napesar de “valores” formais de colaboração no \nregimento. Identifique o construto que melhor \nexplica essa discrepância: \n(A) Artefatos visíveis e símbolos. \n(B) Clima escolar percebido. \n(C) Cultura organizacional subjacente. \n(D) Estrutura curricular oficial. \n(E) Matriz de competências.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q49", "n": 49, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "D", "img": "img/JER26-INF-Q49.webp", "pages": ["img/JER26-INF-p12.webp"], "base": null, "text": "QUESTÃO 49 \nEm mediação, duas partes relatam a mesma \nsituação com “posições” incompatíveis, mas \nambas buscam segurança e reconhecimento. \nIdentifique o passo técnico mais indicado para \navançar o processo: \n(A) \nConfrontar \ncontradições \npara \ndefinir \nculpado. \n(B) Encerrar a sessão e registrar ocorrência. \n(C) Propor sanção educativa imediata. \n(D) \nExplorar \ninteresses \ne \nnecessidades \nsubjacentes. \n(E) Solicitar prova documental antes de \nprosseguir.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "JER26-INF-Q50", "n": 50, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "A", "img": "img/JER26-INF-Q50.webp", "pages": ["img/JER26-INF-p12.webp"], "base": null, "text": "QUESTÃO 50 \nNa gestão de conflitos, a coordenação deseja \nreduzir escaladas recorrentes em sala, com foco \nem \nprevisibilidade \ne \naprendizagem \nsocioemocional. Identifique a estratégia mais \ncompatível: \n(A) Protocolos restaurativos com acordos e \nacompanhamento. \n(B) Punições progressivas padronizadas sem \ndiálogo. \n(C) Encaminhamento externo imediato para \ntodos os casos. \n(D) Troca de turma como primeira resposta. \n(E) Suspensão como medida de rotina.", "source": "Jeriquara · Coordenador Educação Infantil", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VGP26-AS-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "A", "img": "img/VGP26-AS-Q01.webp", "pages": ["img/VGP26-AS-p2.webp"], "base": "VGP26-AS-T1", "text": "", "source": "Vargem Grande Paulista · Assistente Social", "p": 2, "role": "both", "preferred": "both", "fallback": false, "author": n
