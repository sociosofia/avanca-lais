os sistemas e ignora as diferenças \nregionais. \nIII. O regime de colaboração entre os entes \nfederados pressupõe o estabelecimento de regras \nde equivalência entre as funções distributiva, \nsupletiva, normativa, de supervisão e avaliação \nda educação nacional, respeitada a autonomia \ndos sistemas e valorizadas as diferenças \nregionais. \nAssinale a alternativa correta. \n(A) Apenas I está correta. \n(B) Apenas II está correta. \n(C) Apenas III está correta. \n(D) Apenas I e II estão corretas. \n(E) Apenas II e III estão corretas.", "source": "Potim · Supervisor de Ensino", "p": 11, "role": "SUP", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q41", "n": 41, "area": "CE", "eixo": "CE07", "topic": "Didática e metodologias", "key": "E", "img": "img/POT26-SUP-Q41.webp", "pages": ["img/POT26-SUP-p11.webp"], "base": null, "text": "QUESTÃO 41 \nA Didática ocupa papel central na formação \ndocente, articulando teoria e prática no processo \neducativo. Assinale a alternativa que expressa \ncorretamente sua concepção atual. \n(A) A Didática limita-se ao domínio de técnicas \ne métodos de ensino. \n(B) A Didática é um conjunto de regras fixas que \ngarantem o sucesso do ensino. \n(C) A Didática tem como foco principal a \nadministração escolar e as relações hierárquicas. \n(D) A Didática se restringe ao planejamento de \naulas expositivas. \n(E) A tem como objetivo os processos de ensino \ne de aprendizagem, ultrapassando a técnica, \nsendo um meio de compreensão crítica da \neducação e dos processos de ensino e de \naprendizagem.", "source": "Potim · Supervisor de Ensino", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q42", "n": 42, "area": "CE", "eixo": "CE15", "topic": "Tecnologias educacionais", "key": "A", "img": "img/POT26-SUP-Q42.webp", "pages": ["img/POT26-SUP-p12.webp"], "base": null, "text": "QUESTÃO 42 \nAs inovações em gestão e educação têm \ntransformado as formas de ensino e de \nqualificação profissional. Analise as afirmativas \na seguir. \nI. O ensino à distância via internet ampliou o \nacesso à educação, criando oportunidades para \nestudantes que antes não podiam cursar o ensino \nsuperior. \nII. As universidades corporativas surgiram para \natender exclusivamente ao público estudantil de \nescolas públicas. \nIII. Os programas de treinamento gerencial de \ngrandes corporações não contribuem para o \ndesenvolvimento profissional dos trabalhadores. \nAssinale a alternativa correta. \n(A) Apenas I está correta. \n(B) Apenas II está correta. \n(C) Apenas III está correta. \n(D) Apenas I e II estão corretas. \n(E) Apenas II e III estão corretas.", "source": "Potim · Supervisor de Ensino", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q43", "n": 43, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "A", "img": "img/POT26-SUP-Q43.webp", "pages": ["img/POT26-SUP-p12.webp"], "base": null, "text": "QUESTÃO 43 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que completa \ncorretamente a lacuna: \nUma das possibilidades de aplicação do \nplanejamento participativo na escola é a \nexistência do __________ Escolar, que deve \ncontar com a participação de representantes de \ntodos os segmentos da comunidade local e \nescolar. \n \n(A) Conselho \n(B) Currículo \n(C) Projeto \n(D) Planejamento \n(E) Comitê", "source": "Potim · Supervisor de Ensino", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q44", "n": 44, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "B", "img": "img/POT26-SUP-Q44.webp", "pages": ["img/POT26-SUP-p12.webp"], "base": null, "text": "QUESTÃO 44 \nA Psicologia da Educação deve contribuir \ncriticamente para a formação docente, evitando \nperspectivas \nreducionistas \ne \nexcludentes. \nAssinale a alternativa que expressa corretamente \nessa concepção. \n(A) A Psicologia da Educação deve manter-se \nneutra, restrita à avaliação e ao diagnóstico dos \nestudantes. \n(B) \nO \nsaber \npsicológico \ndeve \nser \npermanentemente revisitado para não se limitar a \numa posição de neutralidade e para evitar \nreforçar uma educação bancária e excludente. \n(C) A função da Psicologia da Educação é \ngarantir a mensuração precisa das diferenças \nindividuais e o mérito de cada estudante. \n(D) \nA \nPsicologia \nda \nEducação \ndeve \ncomprometer-se \ncom \na \nmanutenção \ndas \nepistemologias colonizadoras. \n(E) O papel da Psicologia da Educação é \nvalorizar apenas o desenvolvimento individual e \no desempenho acadêmico.", "source": "Potim · Supervisor de Ensino", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q45", "n": 45, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "C", "img": "img/POT26-SUP-Q45.webp", "pages": ["img/POT26-SUP-p12.webp"], "base": null, "text": "QUESTÃO 45 \nA progressão continuada propõe uma nova \ncompreensão da avaliação escolar. Assinale a \nalternativa que expressa corretamente essa \nconcepção. \n(A) O regime de progressão continuada significa \naprovação \nautomática, \ndesconsiderando \nas \netapas de escolaridade. \n(B) A avaliação deve ser vista como instrumento \nde repressão e comparação entre os alunos. \n(C) A avaliação, na progressão continuada, passa \na ser o instrumento guia na progressão do aluno \nno seu percurso escolar, apontando as diferenças \nna aquisição de habilidades e conhecimentos \nentre os alunos e orientando o trabalho do \nprofessor na condução desse processo \n(D) A progressão continuada elimina a \nnecessidade \nde \nacompanhamento \ndo \ndesempenho dos estudantes. \n(E) A avaliação escolar tem como função \nprincipal classificar e punir o aluno pelo baixo \nrendimento.", "source": "Potim · Supervisor de Ensino", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q46", "n": 46, "area": "CE", "eixo": "LEG_DCN", "topic": "Diretrizes curriculares", "key": "E", "img": "img/POT26-SUP-Q46.webp", "pages": ["img/POT26-SUP-p13.webp"], "base": null, "text": "QUESTÃO 46 \nAssinale a alternativa que NÃO apresenta um objetivo correto do Parecer CNE/CEB 20/2009 (Revisão \ndas Diretrizes Nacionais para a Educação Infantil). \n(A) As instituições de Educação Infantil devem assegurar a educação em sua integralidade, entendendo \no cuidado como algo indissociável ao processo educativo. \n(B) O combate ao racismo e às discriminações de gênero, socioeconômicas, étnico-raciais e religiosas \ndeve ser objeto de constante reflexão e intervenção no cotidiano da Educação Infantil. \n(C) As instituições necessariamente precisam conhecer as culturas plurais que constituem o espaço da \ncreche e da pré-escola, a riqueza das contribuições familiares e da comunidade, suas crenças e \nmanifestações, e fortalecer formas de atendimento articuladas aos saberes e às especificidades étnicas, \nlinguísticas, culturais e religiosas de cada comunidade. \n(D) A execução da proposta curricular requer atenção cuidadosa e exigente às possíveis formas de \nviolação da dignidade da criança. \n(E) O atendimento ao direito da criança na sua integralidade requer o cumprimento do dever do Estado \ncom a garantia de uma experiência educativa com qualidade superior para as crianças que apresentam \nmaiores notas nas avaliações na Educação Infantil.", "source": "Potim · Supervisor de Ensino", "p": 13, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q47", "n": 47, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "B", "img": "img/POT26-SUP-Q47.webp", "pages": ["img/POT26-SUP-p13.webp"], "base": null, "text": "QUESTÃO 47 \nDe acordo com a Lei de Diretrizes e Bases da Educação (Lei nº 9.394/1996), o Conselho Escolar, órgão \ndeliberativo, será composto do Diretor da Escola, membro nato, e de representantes das comunidades \nescolar e local, eleitos por seus pares. Analise as afirmativas a seguir: \nI. O Conselho Escolar será composto por representantes da categoria de professores, orientadores \neducacionais, supervisores e administradores escolares. \nII. O Conselho Escolar será composto por representantes dos demais servidores públicos que exerçam \natividades administrativas na escola.       \nIII. O Conselho Escolar será composto por representantes da categoria de estudantes.        \nIV. O Conselho Escolar será composto apenas por pais biológicos, sem possibilidade de aceitação de \npais adotivos ou outros responsáveis dos estudantes.        \nV. O Conselho Escolar será composto por representantes da categoria de membros da comunidade \nlocal.       \nAssinale a alternativa correta. \n(A) I, II, III, IV e V estão corretas. \n(B) Apenas I, II, III e V estão corretas. \n(C) Apenas I, II e IV estão corretas. \n(D) Apenas II, III e IV estão corretas. \n(E) Apenas III e V estão corretas.", "source": "Potim · Supervisor de Ensino", "p": 13, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q48", "n": 48, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "D", "img": "img/POT26-SUP-Q48.webp", "pages": ["img/POT26-SUP-p14.webp"], "base": null, "text": "QUESTÃO 48 \nO Parecer CNE/CP 8/2012 define a Educação em Direitos Humanos como um processo sistemático e \nmultidimensional que orienta a formação do sujeito de direitos, articulando as seguintes dimensões, \nEXCETO: \n(A) Apreensão de conhecimentos historicamente construídos sobre direitos humanos e a sua relação \ncom os contextos internacional, nacional e local. \n(B) Afirmação de valores, atitudes e práticas sociais que expressem a cultura dos direitos humanos em \ntodos os espaços da sociedade. \n(C) Formação de uma consciência cidadã capaz de se fazer presente em níveis cognitivo, social, cultural \ne político. \n(D) Desenvolvimento de processos metodológicos individuais e de construção pessoal, utilizando \nlinguagens e materiais didáticos descontextualizados. \n(E) Fortalecimento de práticas individuais e sociais que gerem ações e instrumentos em favor da \npromoção, da proteção e da defesa dos direitos humanos, bem como da reparação das violações.", "source": "Potim · Supervisor de Ensino", "p": 14, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-SUP-Q50", "n": 50, "area": "CE", "eixo": "LEG_13722", "topic": "Lei Lucas", "key": "A", "img": "img/POT26-SUP-Q50.webp", "pages": ["img/POT26-SUP-p14.webp"], "base": null, "text": "QUESTÃO 50 \nA Lei nº 13.722/2018 torna obrigatória a capacitação em noções básicas de primeiros socorros de \nprofessores e funcionários de estabelecimentos de ensino públicos e privados de educação básica e de \nestabelecimentos de recreação infantil. A respeito dessa Lei, assinale a alternativa correta. \n(A) Os cursos de primeiros socorros têm por objetivo capacitar os professores e funcionários para \nidentificar e agir preventivamente em situações de emergência e urgência médicas, até que o suporte \nmédico especializado, local ou remoto, se torne possível. \n(B) Os cursos de primeiros socorros serão ministrados sempre por entidades municipais especializadas \nem práticas de auxílio imediato e emergencial à população no caso dos estabelecimentos privados. \n(C) O conteúdo dos cursos de primeiros socorros básicos ministrados deverá ser padronizado, \nindependentemente da natureza e a faixa etária do público atendido nos estabelecimentos de ensino ou \nde recreação. \n(D) Os estabelecimentos de ensino ou de recreação das redes pública e particular não poderão manter \nsob sua guarda kits de primeiros socorros, pois o procedimento é sempre levar a vítima às entidades \nespecializadas em atendimento emergencial à população. \n(E) É facultado aos estabelecimentos de ensino guardar em arquivo a certificação que comprove a \nrealização da capacitação em primeiros socorros e o nome dos profissionais.", "source": "Potim · Supervisor de Ensino", "p": 14, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q31", "n": 31, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "A", "img": "img/POT26-COO-Q31.webp", "pages": ["img/POT26-COO-p9.webp"], "base": null, "text": "QUESTÃO 31 \nConsiderando que o PPP é um instrumento \nessencial para a gestão escolar democrática, \nanalise as afirmativas abaixo: \nI – O PPP é um instrumento de previsão e suporte \npara \na \navaliação \ndas \nações \neducativas \nprogramadas para a instituição como um todo. \nII – O PPP é referência e transcende o \nplanejamento da gestão e do desenvolvimento \nescolar, porque suscita e registra decisões \ncolegiadas que envolvem a comunidade escolar \ncomo um todo, projetando-as para além do \nperíodo do mandato de cada gestor. \nAssinale a alternativa correta: \n(A) As asserções I e II são verdadeiras, e a II \ncomplementa a I. \n(B) As asserções I e II são verdadeiras, mas a II \nnão complementa a I. \n(C) A asserção I é verdadeira, e a II é falsa. \n(D) A asserção I é falsa, e a II é verdadeira. \n(E) As asserções I e II são falsas.", "source": "Potim · Coordenador Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q32", "n": 32, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "A", "img": "img/POT26-COO-Q32.webp", "pages": ["img/POT26-COO-p9.webp"], "base": null, "text": "QUESTÃO 32 \nO planejamento pedagógico, quando concebido \nde forma transversal, requer ações integradas e \ncoletivas. Sobre esse processo, analise as \nafirmativas \na seguir e marque-as \ncomo \nverdadeiras (V) ou falsas (F). \n( ) A adoção de temas a serem tratados sob a \nperspectiva transversal exige da comunidade \neducativa clareza quanto aos princípios e às \nfinalidades da educação. \n( ) O planejamento das ações pedagógicas deve \nser desenvolvido de forma isolada pelos \nprofessores individualmente, sem necessidade de \nintegração. \n( ) Para ser tratada transversalmente, a temática \natravessa, \nestabelece \nelos, \nenriquece, \ncomplementa temas e/ou atividades tratadas por \ndisciplinas, eixos ou áreas do conhecimento. \n \nAssinale a alternativa correta. \n(A) V – F – V \n(B) V – V – F \n(C) F – V – V \n(D) F – V – F \n(E) F – F – F", "source": "Potim · Coordenador Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q33", "n": 33, "area": "CE", "eixo": "CE05", "topic": "Currículo", "key": "D", "img": "img/POT26-COO-Q33.webp", "pages": ["img/POT26-COO-p9.webp"], "base": null, "text": "QUESTÃO 33 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que preenche \ncorretamente a lacuna: \nAs políticas e diretrizes __________ estão \ntranspassadas por disputas entre manter estilos \nnormatizantes ou optar por orientações mais \npolíticas. \n \n(A) religiosas \n(B) geográficas \n(C) tradicionais \n(D) curriculares \n(E) teóricas", "source": "Potim · Coordenador Pedagógico", "p": 9, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q34", "n": 34, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "A", "img": "img/POT26-COO-Q34.webp", "pages": ["img/POT26-COO-p10.webp"], "base": null, "text": "QUESTÃO 34 \nA educação inclusiva representa uma mudança \nde paradigma na forma de compreender o direito \nà educação. Analise as afirmativas a seguir e \nmarque-as como verdadeiras (V) ou falsas (F). \n( ) O movimento mundial pela inclusão é uma \nação política, cultural, social e pedagógica, \ndesencadeada em defesa do direito de todos os \nalunos de estarem juntos, aprendendo e \nparticipando, sem nenhum tipo de discriminação. \n( ) A educação inclusiva constitui um paradigma \neducacional fundamentado na concepção de \ndireitos humanos, que conjuga igualdade e \ndiferença como valores indissociáveis. \n( ) A educação inclusiva restringe-se à criação de \nescolas e classes especiais para alunos com \ndeficiência. \n \nAssinale a alternativa correta. \n(A) V – V – F \n(B) F – V – V \n(C) V – F – F \n(D) F – F – V \n(E) V – F – V", "source": "Potim · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q35", "n": 35, "area": "CE", "eixo": "CE15", "topic": "Tecnologias educacionais", "key": "C", "img": "img/POT26-COO-Q35.webp", "pages": ["img/POT26-COO-p10.webp"], "base": null, "text": "QUESTÃO 35 \nObserve o enunciado abaixo e assinale a \nalternativa que apresenta o termo que preenche \ncorretamente a lacuna: \n \nAs tecnologias estão cada vez mais próximas do \nprofessor e do aluno, em qualquer momento; são \nmais ricas, complexas e __________. \n \n(A) monótonas \n(B) limitadas \n(C) atraentes \n(D) repetitivas \n(E) previsíveis", "source": "Potim · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q36", "n": 36, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "B", "img": "img/POT26-COO-Q36.webp", "pages": ["img/POT26-COO-p10.webp"], "base": null, "text": "QUESTÃO 36 \nPara Paulo Freire, a curiosidade é essencial no \nprocesso de ensino e aprendizagem. Assinale a \nalternativa que expressa corretamente o papel \ndessa curiosidade no trabalho do professor.  \n(A) É uma atitude que deve ser evitada para não \ndesviar o foco do conteúdo. \n(B) Exercer a minha curiosidade de forma correta \né um direito que tenho como gente e a que \ncorresponde o dever de lutar por ele, o direito à \ncuriosidade. \n(C) É uma característica apenas dos estudantes, \nnão sendo necessária ao docente. \n(D) Serve apenas para tornar as aulas mais \ndinâmicas e divertidas. \n(E) É substituída pela simples repetição de \ninformações.", "source": "Potim · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": "Paulo Freire", "secondary": []}, {"id": "POT26-COO-Q37", "n": 37, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "A", "img": "img/POT26-COO-Q37.webp", "pages": ["img/POT26-COO-p10.webp"], "base": null, "text": "QUESTÃO 37 \nSobre a diferença entre examinar e avaliar, \nsegundo Cipriano Luckesi, analise as afirmativas \nabaixo: \nI. \nO \nato \nde \nexaminar \nse \ncaracteriza, \nespecialmente \n(ainda \nque \ntenha \noutras \ncaracterísticas) pela classificação e seletividade \ndo educando. \nII. O ato de avaliar se caracteriza pelo seu \ndiagnóstico e pela inclusão. \nIII. O exame serve para compreender as \ndificuldades do aluno e replanejar o ensino. \n \nAssinale a alternativa correta. \n(A) Apenas I e II estão corretas. \n(B) Apenas II e III estão corretas. \n(C) Apenas I e III estão corretas. \n(D) Apenas I está correta. \n(E) Apenas III está correta.", "source": "Potim · Coordenador Pedagógico", "p": 10, "role": "both", "preferred": "both", "fallback": false, "author": "Cipriano Luckesi", "secondary": []}, {"id": "POT26-COO-Q38", "n": 38, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "C", "img": "img/POT26-COO-Q38.webp", "pages": ["img/POT26-COO-p11.webp"], "base": null, "text": "QUESTÃO 38 \nConsiderando a importância da mediação para o \nambiente escolar, analise as asserções abaixo: \nI – A mediação pode induzir a uma reorientação \ndas relações sociais, a novas formas de \ncooperação, de confiança e de solidariedade. \nII – A mediação induz atitudes de tolerância, \nresponsabilidade e iniciativa individual que \npodem contribuir para uma nova ordem social. \nAssinale a alternativa correta: \n(A) A asserção I é verdadeira, e a II é falsa. \n(B) As asserções I e II são verdadeiras, mas a II \nnão complementa a I. \n(C) As asserções I e II são verdadeiras, e a II \ncomplementa a I. \n(D) A asserção I é falsa, e a II é verdadeira. \n(E) As asserções I e II são falsas.", "source": "Potim · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q39", "n": 39, "area": "CE", "eixo": "CE14", "topic": "Formação continuada", "key": "E", "img": "img/POT26-COO-Q39.webp", "pages": ["img/POT26-COO-p11.webp"], "base": null, "text": "QUESTÃO 39 \nEm relação às competências e conhecimentos \nnecessários ao trabalho docente, analise as \nafirmativas \na seguir e marque-as \ncomo \nverdadeiras (V) ou falsas (F). \n \n( ) O professor precisa, particularmente, saber \norientar, avaliar e elaborar propostas, isto é, \ninterpretar e reconstruir o conhecimento. \n( ) É papel do professor conhecer e compreender \nas etapas de desenvolvimento dos estudantes \ncom os quais está lidando. \n( ) A atuação docente restringe-se à transmissão \ndos saberes específicos, sem considerar as \nrelações entre as áreas do conhecimento. \n \nAssinale a alternativa correta. \n(A) V – F – V \n(B) V – F – F \n(C) F – V – V \n(D) F – F – V \n(E) V – V – F", "source": "Potim · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q40", "n": 40, "area": "CE", "eixo": "CE12", "topic": "Direitos humanos", "key": "B", "img": "img/POT26-COO-Q40.webp", "pages": ["img/POT26-COO-p11.webp"], "base": null, "text": "QUESTÃO 40 \nComplete corretamente a lacuna do texto abaixo \nsobre a Educação em Direitos Humanos: \n \nA Educação em Direitos Humanos destina-se a \nformar crianças, jovens e adultos para participar \nativamente da vida __________ e exercitar seus \ndireitos e responsabilidades na sociedade. \n \n(A) pedagógica \n(B) democrática \n(C) econômica \n(D) geográfica \n(E) classificatória", "source": "Potim · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q41", "n": 41, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "B", "img": "img/POT26-COO-Q41.webp", "pages": ["img/POT26-COO-p11.webp"], "base": null, "text": "QUESTÃO 41 \nNa avaliação da educação é importante perceber \nque alguns aspectos, para além do processo de \nensino-aprendizagem, \nimpactam \nsignificativamente nos indicadores educacionais. \nAssinale a alternativa que expressa corretamente \nessa ideia. \n(A) \nO \ndesempenho \nescolar \ndepende \nexclusivamente \ndo \ntrabalho \npedagógico \nrealizado em sala de aula. \n(B) O contexto socioeconômico dos estudantes é \nfator \ndeterminante \npara \ncompreender \nos \nresultados das escolas. \n(C) Só o que é avaliado é o esforço individual dos \nprofessores e alunos, sem considerar fatores \nexternos. \n(D) As condições econômicas e culturais das \nfamílias \nnão \ninterferem \nnos \nindicadores \neducacionais. \n(E) Escolas com maior número de alunos tendem \na \napresentar \nautomaticamente \nmelhor \ndesempenho.", "source": "Potim · Coordenador Pedagógico", "p": 11, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q42", "n": 42, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "A", "img": "img/POT26-COO-Q42.webp", "pages": ["img/POT26-COO-p12.webp"], "base": null, "text": "QUESTÃO 42 \nA função social da escola está diretamente ligada \nà democratização da sociedade e à disseminação \ndo conhecimento. Analise as afirmativas a seguir \ne marque-as como verdadeiras (V) ou falsas (F). \n( ) A universalização da educação básica é \ncondição essencial para a disseminação do \nconhecimento \nsocialmente \nproduzido \ne \nacumulado. \n( ) A democratização da sociedade exige, \nnecessariamente, informação e conhecimento \npara que a pessoa possa situar-se no mundo, \nargumentar, reivindicar e ampliar novos direitos. \n( ) A função social da escola limita-se à \ntransmissão de conteúdos científicos, sem \nenvolver valores ou cidadania. \nAssinale a alternativa correta: \n(A) V – V – F \n(B) V – F – F \n(C) F – V – V \n(D) F – F – V \n(E) V – F – V", "source": "Potim · Coordenador Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q43", "n": 43, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "A", "img": "img/POT26-COO-Q43.webp", "pages": ["img/POT26-COO-p12.webp"], "base": null, "text": "QUESTÃO 43 \nA escola da Educação Básica tem um importante \npapel social e cultural. Com base nesta \nafirmação, analise as afirmativas abaixo. \nI. A escola de Educação Básica é espaço coletivo \nde convívio, onde são privilegiadas trocas, \nacolhimento e aconchego para garantir o bem-\nestar de crianças, adolescentes, jovens e adultos, \nno relacionamento entre si e com as demais \npessoas. \nII. A instituição é vista como espaço de exclusão \ndas diferenças culturais regionais. \nIII. Na escola se ressignifica e recria a cultura \nherdada, reconstruindo as identidades culturais, \nem que se aprende a valorizar as raízes próprias \ndas diferentes regiões do País. \nAssinale a alternativa correta: \n(A) I e III apenas. \n(B) I e II apenas. \n(C) II e III apenas. \n(D) I apenas. \n(E) III apenas.", "source": "Potim · Coordenador Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "POT26-COO-Q44", "n": 44, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "C", "img": "img/POT26-COO-Q44.webp", "pages": ["img/POT26-COO-p12.webp"], "base": null, "text": "QUESTÃO 44 \nA construção de uma escola de qualidade social \nrequer diálogo, colaboração e centralidade nas \naprendizagens. \nSobre \nos \nelementos \nindispensáveis a esse processo, analise as \nafirmativas abaixo e assinale a alternativa \ncorreta. \nI. A progressão automática é suficiente, por si só, \npara garantir a qualidade social da educação. \nII. A inclusão, a valorização das diferenças e o \natendimento à pluralidade e à diversidade \ncultural, resgatando e respeitando os direitos \nhumanos, individuais e coletivos e as várias \nmanifestações de cada comunidade. \nIII. A compatibilidade entre a proposta curricular \ne a infraestrutura, entendida como espaço \nformativo dotado de efetiva disponibilidade de \ntempos para a sua utilização e acessibilidade \n(A) I, II e III estão corretas. \n(B) Apenas I e II estão corretas. \n(C) Apenas II e III estão corretas. \n(D) Apenas I e III estão corretas. \n(E) Apenas II está correta.", "source": "Potim · Coordenador Pedagógico", "p": 12, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "B", "img": "img/VAR25-SUP-Q01.webp", "pages": ["img/VAR25-SUP-p2.webp"], "base": "VAR25-SUP-T1", "text": "QUESTÃO 01 \nAo mencionar que se compreende a demolição da \ncasa como “[...] uma sentença de liberdade”, o \nnarrador do texto: \n(A) Reflete acerca da superação de um \nsofrimento particular causado pela própria casa. \n(B) Faz uma comparação da demolição da casa \ncom o encerramento de ciclos da vida. \n(C) Considera, na verdade, que possuir bens \nmateriais é uma sentença de opressão. \n(D) Reflete sobre os transtornos causados pelo \nprocesso de demolição de um imóvel.  \n(E) Identifica que a liberdade só existe quando o \nser humano não detém bens materiais.", "source": "Varginha · Supervisor Pedagógico", "p": 2, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q02", "n": 2, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "A", "img": "img/VAR25-SUP-Q02.webp", "pages": ["img/VAR25-SUP-p3.webp"], "base": "VAR25-SUP-T1", "text": "QUESTÃO 02 \nO adjetivo que mais se aproxima em significado \ndo termo “involutivo”, empregado no trecho “A \ncasa encolhera-se, em processo involutivo”, é: \n(A) regressivo. \n(B) evolutivo. \n(C) progressivo. \n(D) invasivo. \n(E) decisivo.", "source": "Varginha · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q03", "n": 3, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "E", "img": "img/VAR25-SUP-Q03.webp", "pages": ["img/VAR25-SUP-p3.webp"], "base": "VAR25-SUP-T1", "text": "QUESTÃO 03 \nNo excerto “Fitou tranquilo o que tinha sido sua \ncasa e era um amontoado de caliça e tijolo [...]”, \no vocábulo “o” desempenha o papel gramatical \nde: \n(A) artigo definido. \n(B) artigo indefinido. \n(C) pronome oblíquo átono. \n(D) pronome oblíquo tônico. \n(E) pronome demonstrativo.", "source": "Varginha · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q04", "n": 4, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "A", "img": "img/VAR25-SUP-Q04.webp", "pages": ["img/VAR25-SUP-p3.webp"], "base": "VAR25-SUP-T1", "text": "QUESTÃO 04 \nA forma correta de superlativo absoluto sintético \ndo adjetivo “sereno”, que ocorre no excerto \n“[...] para aceitar de coração sereno o fim das \ncoisas [...]”, é: \n(A) sereníssimo. \n(B) serenérrimo. \n(C) serenicíssimo. \n(D) sereniquíssimo. \n(E) muito sereno.", "source": "Varginha · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q05", "n": 5, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "E", "img": "img/VAR25-SUP-Q05.webp", "pages": ["img/VAR25-SUP-p3.webp"], "base": "VAR25-SUP-T1", "text": "QUESTÃO 05 \nA contração que ocorre no excerto “Passando \npela rua, ele viu a casa já sem telhado [...]”, é \nformada por palavras das classes gramaticais: \n(A) preposição e conjunção. \n(B) preposição e pronome. \n(C) conjunção e artigo. \n(D) conjunção e pronome. \n(E) preposição e artigo.", "source": "Varginha · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q06", "n": 6, "area": "LP", "eixo": "LP11", "topic": "Crase", "key": "A", "img": "img/VAR25-SUP-Q06.webp", "pages": ["img/VAR25-SUP-p3.webp"], "base": null, "text": "QUESTÃO 06 \nO emprego do acento indicativo de crase está \ncorreto em: \n(A) Disse àqueles rapazes que não tinha a \nintenção de magoá-la.  \n(B) O problema é que você leva tudo à sério.  \n(C) O evento deve ocorrer daqui à duas semanas.  \n(D) Fez uma promessa à santa Rita, porque \nestava desesperada.  \n(E) Ofereço a minha solidariedade à todas as \npessoas que se sentiram ofendidas.", "source": "Varginha · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q07", "n": 7, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "B", "img": "img/VAR25-SUP-Q07.webp", "pages": ["img/VAR25-SUP-p3.webp"], "base": null, "text": "QUESTÃO 07 \nAssinale a alternativa em que há incorreção \nquanto à conjugação da forma verbal em \ndestaque.  \n(A) Os familiares do enfermo requereram ao \nmédico um atendimento mais humanizado. \n(B) Se eles se precavissem, isto não teria \nacontecido.  \n(C) Não interfiram nessas coisas! \n(D) Esses soldados contiveram as tropas \ninimigas durante a batalha.   \n(E) Interessante como nós convimos em todas \nessas observações.", "source": "Varginha · Supervisor Pedagógico", "p": 3, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q08", "n": 8, "area": "LP", "eixo": "LP04", "topic": "Ortografia e acentuação", "key": "D", "img": "img/VAR25-SUP-Q08.webp", "pages": ["img/VAR25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 08 \nDentre as palavras a seguir, aquela cuja forma \npluralizada está incorreta, considerando-se a \npresença do hífen, é: \n(A) mal-entendidos. \n(B) aquém-mares. \n(C) pés-de-meia. \n(D) bens-te-vi. \n(E) águas-de-colônia.", "source": "Varginha · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q09", "n": 9, "area": "LP", "eixo": "LP05", "topic": "Pontuação", "key": "C", "img": "img/VAR25-SUP-Q09.webp", "pages": ["img/VAR25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 09 \nA sentença que carece de vírgulas é:  \n(A) O rapaz que se acidentou foi ao hospital \ndurante a madrugada. \n(B) O som estava tão alto que ninguém conseguia \ndormir.  \n(C) Ele não gosta do fato de o bairro ser deserto. \nJá a garota do fato de não ter tantas árvores.  \n(D) O dia ainda não tinha raiado e já causava \nansiedade. \n(E) Veja se as coisas estão organizadas o bastante \npara o evento.", "source": "Varginha · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q10", "n": 10, "area": "LP", "eixo": "LP09", "topic": "Colocação pronominal", "key": "E", "img": "img/VAR25-SUP-Q10.webp", "pages": ["img/VAR25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 10 \nA \ncolocação \npronominal \nnão \nestá \nem \nconformidade com a norma-padrão da língua \nportuguesa apenas em: \n(A) Encontraram-se pela manhã, após o deixarem \nna escola. \n(B) Em se tratando de um problema de saúde, a \nurgência é necessária.  \n(C) Não se deixe levar pelas aparências.  \n(D) Quem me disse isso foi a própria mulher, que \nestava magoada com o ocorrido. \n(E) Eu darei-lhe todas as instruções necessárias \npara começar o trabalho.", "source": "Varginha · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q11", "n": 11, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "B", "img": "img/VAR25-SUP-Q11.webp", "pages": ["img/VAR25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 11 \nUm triângulo retângulo isóscele, cujos lados \nmenores medem 𝐿 cm foi dividido em faixas de \nigual altura, ℎ, conforme a figura: \n \n \nAs faixas foram devidamente enumeradas. Pode-\nse afirmar que a diferença entre a área da 1ª faixa \ne a área da 2ª faixa é dada por: \n(A) (𝐿−ℎ)2. \n(B) ℎ2. \n(C) \nℎ2√3\n4 . \n(D) \n𝐿ℎ\n2 . \n(E) \n(𝐿−ℎ)2\n4\n.", "source": "Varginha · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": ["Razão e proporção"]}, {"id": "VAR25-SUP-Q12", "n": 12, "area": "MRL", "eixo": "MRL08", "topic": "Equações e sistemas", "key": "B", "img": "img/VAR25-SUP-Q12.webp", "pages": ["img/VAR25-SUP-p4.webp"], "base": null, "text": "QUESTÃO 12 \nUm casal, Ana e Bruno, decide comprar um carro \nque custa R$ 60.000,00. Cada um tem um uma \nquantia guardada na poupança e comprarão o \ncarro à vista, cada um pagando uma determinada \nquantia. Sabe-se que Ana tem R$65.000,00 \nguardados e Bruno tem R$50.000,00. A quantia \nque cada um pagará será tal que, após a compra, \nos dois ficarão com os mesmos valores \nguardados na poupança. Nesta situação, qual o \nvalor que Ana pagará pelo carro? \n(A) R$ 39.000,00. \n(B) R$ 37.500,00.  \n(C) R$ 31.500,00. \n(D) R$ 27.500,00. \n(E) R$ 22.500,00.", "source": "Varginha · Supervisor Pedagógico", "p": 4, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q13", "n": 13, "area": "MRL", "eixo": "MRL11", "topic": "Geometria", "key": "B", "img": "img/VAR25-SUP-Q13.webp", "pages": ["img/VAR25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 13 \nUma pessoa recorta uma folha retangular de 20 \ncm x 30 cm em 600 quadrados idênticos. Se a \npessoa utilizar para recorte uma nova folha com \ndimensões 30 cm x 60 cm, e a pessoa deseja que \no lado dos novos quadrados seja 50% maior que \no lado dos quadrados anteriores, quantos novos \nquadrados conseguirá cortar? \n(A) 600. \n(B) 800. \n(C) 900. \n(D) 1000. \n(E) 1200.", "source": "Varginha · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q14", "n": 14, "area": "MRL", "eixo": "MRL08", "topic": "Equações e sistemas", "key": "C", "img": "img/VAR25-SUP-Q14.webp", "pages": ["img/VAR25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 14 \nCerto dia Pedro disse:  \n“Eu e meu pai fazemos aniversário no mesmo \ndia. Quando eu nasci, meu pai completou 25 \nanos.” \nEm um determinado ano, a idade que Pedro \ncompletou foi metade da idade que o seu pai \ncompletou. Se Pedro nasceu em 1990, qual foi \nesse ano? \n(A) 2005. \n(B) 2010. \n(C) 2015. \n(D) 2020. \n(E) 2025.", "source": "Varginha · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q15", "n": 15, "area": "MRL", "eixo": "MRL06", "topic": "Médias", "key": "A", "img": "img/VAR25-SUP-Q15.webp", "pages": ["img/VAR25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 15 \nSuponha que numa turma de universitários há 50 \nestudantes, e que a média aritmética simples das \nsuas idades é igual a 26 anos. Se um novo \nestudante ingressar nessa turma, com idade igual \nao dobro da média, então a nova média das \nidades em anos passará a ser, aproximadamente: \n(A) 26,5. \n(B) 27,7.  \n(C) 27,8. \n(D) 26,9. \n(E) 30,5.", "source": "Varginha · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q16", "n": 16, "area": "MRL", "eixo": "MRL04", "topic": "Porcentagem", "key": "C", "img": "img/VAR25-SUP-Q16.webp", "pages": ["img/VAR25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 16 \nNo Brasil, estima-se que 5% da população tem \nalgum conhecimento sobre a língua inglesa. \nSendo que dentre este grupo, 49% têm \nconhecimento básico, 31% têm conhecimento \nintermediário, 13% têm conhecimento avançado \ne 7% são fluentes. Considerando que a população \nbrasileira contém 210 milhões de pessoas, \nquantas pessoas têm conhecimento pelo menos \navançado em língua inglesa? \n(A) 27,3 milhões. \n(B) 210 mil.  \n(C) 2,1 milhões. \n(D) 273 mil. \n(E) 12,6 milhões.", "source": "Varginha · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q17", "n": 17, "area": "MRL", "eixo": "MRL03", "topic": "Razão e proporção", "key": "A", "img": "img/VAR25-SUP-Q17.webp", "pages": ["img/VAR25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 17 \nA altura do Monte Everest em relação ao nível do \nmar é cerca de 9 km. Se uma pessoa deseja \nmodelar uma miniatura do Monte Everest, de \nmodo que uma altura de 500 metros no mundo \nreal corresponda a 1 cm na sua miniatura, qual \nserá a altura do seu modelo, mantendo essa \nproporção? \n(A) 18 cm. \n(B) 24 cm.  \n(C) 9 cm. \n(D) 90 cm. \n(E) 1,8 cm.", "source": "Varginha · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q18", "n": 18, "area": "MRL", "eixo": "MRL02", "topic": "MMC e MDC", "key": "A", "img": "img/VAR25-SUP-Q18.webp", "pages": ["img/VAR25-SUP-p5.webp"], "base": null, "text": "QUESTÃO 18 \nUm agente de saúde visitará casas num bairro \nonde há 400 casas enumeradas de 301 a 700. Ele \nnão visitará todas elas, apenas as casas cujo \nnúmero não é múltiplo de 3 nem de 5, e fará a \nvisita em ordem crescente de número da casa. \nQual será o número da 137° casa visitada pelo \nagente? \n(A) 556. \n(B) 516. \n(C) 524. \n(D) 412. \n(E) 631.", "source": "Varginha · Supervisor Pedagógico", "p": 5, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q19", "n": 19, "area": "MRL", "eixo": "MRL12", "topic": "Dedução lógica", "key": "E", "img": "img/VAR25-SUP-Q19.webp", "pages": ["img/VAR25-SUP-p6.webp"], "base": null, "text": "QUESTÃO 19 \nConsidere as seguintes afirmações sobre cinco \npessoas, Ana, Bruno, Carlos, Dione e Érica: \n• Ana e Bruno são amigos. \n• Ana e Érica são amigas. \n• Érica e Bruno são amigos. \n• Carlos e Dione são amigos. \n• Carlos e Ana são amigos. \nAlém disso, sabe-se que: \n• Se duas pessoas são amigas, elas têm \nexatamente um amigo em comum. \nCom base nas informações acima, pode-se \nnecessariamente afirmar que: \n(A) Carlos é amigo de Bruno. \n(B) Dione e Érica são amigas.  \n(C) Dione e Bruno são amigos. \n(D) Bruno é amigo de todos os outros. \n(E) Dione e Ana são amigas.", "source": "Varginha · Supervisor Pedagógico", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q20", "n": 20, "area": "MRL", "eixo": "MRL01", "topic": "Números e operações", "key": "B", "img": "img/VAR25-SUP-Q20.webp", "pages": ["img/VAR25-SUP-p6.webp"], "base": null, "text": "QUESTÃO 20 \nEm um número com 5 algarismos, a soma de \ntodos os seus algarismos resulta em 15. Sabe-se \nque necessariamente esse número é divisível por: \n(A) 2. \n(B) 3. \n(C) 9. \n(D) 7. \n(E) 11. \n \nNOÇÕES DE INFORMÁTICA", "source": "Varginha · Supervisor Pedagógico", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q21", "n": 21, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "C", "img": "img/VAR25-SUP-Q21.webp", "pages": ["img/VAR25-SUP-p6.webp"], "base": null, "text": "QUESTÃO 21 \nO sistema operacional Windows suporta uma \nampla gama de aplicativos. Entre os programas \nnativos que são instalados juntamente com o \nsistema operacional, encontra-se:  \n(A) Sublime Text  \n(B) Adobe Acrobat. \n(C) Calculadora. \n(D) GIMP. \n(E) Inkscape.", "source": "Varginha · Supervisor Pedagógico", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q22", "n": 22, "area": "INF", "eixo": "INF01", "topic": "Windows", "key": "A", "img": "img/VAR25-SUP-Q22.webp", "pages": ["img/VAR25-SUP-p6.webp"], "base": null, "text": "QUESTÃO 22 \nO sistema operacional Windows disponibiliza, \ncomo ferramenta nativa para a captura de tela, \nqual dos programas listados a seguir?  \n(A) Ferramenta de Captura. \n(B) Windows Fax and Scan. \n(C) Windows Security Center. \n(D) Windows Explorer. \n(E) VirtualBox.", "source": "Varginha · Supervisor Pedagógico", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q24", "n": 24, "area": "INF", "eixo": "INF03", "topic": "Excel", "key": "D", "img": "img/VAR25-SUP-Q24.webp", "pages": ["img/VAR25-SUP-p6.webp"], "base": null, "text": "QUESTÃO 24 \nConsiderando a estrutura básica de uma planilha \ndesenvolvida no Microsoft Excel, pode-se \nafirmar \ncorretamente \nque \nos \nelementos \nidentificados com letras de A a Z e combinações \nde letras (AB, AC, etc.) são as: \n(A) Linhas. \n(B) Fórmulas. \n(C) Equações. \n(D) Colunas. \n(E) Fontes.", "source": "Varginha · Supervisor Pedagógico", "p": 6, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q25", "n": 25, "area": "INF", "eixo": "INF06", "topic": "Internet e segurança", "key": "B", "img": "img/VAR25-SUP-Q25.webp", "pages": ["img/VAR25-SUP-p7.webp"], "base": null, "text": "QUESTÃO 25 \nAo navegar pela internet no Microsoft Edge, o \nusuário do sistema tem alguns botões à \ndisposição na barra de ferramentas. Caso uma \npágina apresente erro e ele queira tentar \nrecarregá-la, qual botão deve utilizar? \n(A) Perfil \n \n(B) Atualizar \n \n(C) Favoritos \n \n(D) Pesquisar \n \n(E) Voltar \n \n \nCONHECIMENTOS ESPECÍFICOS", "source": "Varginha · Supervisor Pedagógico", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q26", "n": 26, "area": "CE", "eixo": "CE15", "topic": "Tecnologias educacionais", "key": "A", "img": "img/VAR25-SUP-Q26.webp", "pages": ["img/VAR25-SUP-p7.webp"], "base": null, "text": "QUESTÃO 26 \nRelacione \ncorretamente \nas \ninovações \neducacionais \nabaixo \ncom \nos \nexemplos \napresentados no texto, que confirmam a presença \ndas ondas de inovação na educação: \n \nI. Ensino à distância via internet \nII. Universidades corporativas \nIII. Escolas superiores comunitárias \n \na) Criou oportunidades para milhares de \nestudantes que antes não podiam pagar um curso \nuniversitário (e-learning). \nb) Dinamizaram a capacidade das pessoas de \nresolverem problemas específicos “on the job” \n(Petrobrás, IBM, GE e outras). \nc) Oferecem qualificação profissional acessível à \npopulação de baixa renda. \n \nIndique a alternativa que estabelece as relações \ncorretamente: \n(A) I – a; II – b; III – c. \n(B) I – b; II – a; III – c. \n(C) I – c; II – b; III – a. \n(D) I – a; II – c; III – b. \n(E) I – c; II – a; III – b.", "source": "Varginha · Supervisor Pedagógico", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q27", "n": 27, "area": "CE", "eixo": "CE03", "topic": "Gestão democrática", "key": "C", "img": "img/VAR25-SUP-Q27.webp", "pages": ["img/VAR25-SUP-p7.webp"], "base": null, "text": "QUESTÃO 27 \n“Antes da Constituição Federal de 1988, até era \npossível que os gestores dos sistemas e das \nescolas públicas pudessem optar por desenvolver \nou não um tipo de gestão que se baseasse nas \nrelações democráticas. Hoje, não mais. A gestão \ndemocrática \nda \neducação \né \n___________________.” \nAssinale a alternativa que preenche corretamente \na lacuna do texto acima: \n(A) uma recomendação das secretarias estaduais. \n(B) uma proposta facultativa dos conselhos \nescolares. \n(C) um direito da sociedade e um dever do Poder \nPúblico. \n(D) uma possibilidade prevista apenas no plano \npedagógico. \n(E) uma iniciativa exclusiva das comunidades \nescolares.", "source": "Varginha · Supervisor Pedagógico", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q28", "n": 28, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "A", "img": "img/VAR25-SUP-Q28.webp", "pages": ["img/VAR25-SUP-p7.webp"], "base": null, "text": "QUESTÃO 28 \nEm relação ao planejamento participativo nas \nescolas públicas, analise as afirmações a seguir e \nassinale a alternativa correta: \nI – Uma das possibilidades de aplicação do \nplanejamento participativo na escola é a \nexistência \ndo \nConselho \nEscolar \ne \nseu \nfuncionamento efetivo, tendo em vista que este \ndeve ser um órgão colegiado e, como tal, deve \ncontar com a participação de representantes de \ntodos os segmentos da comunidade local e \nescolar. \nII – O Conselho Escolar, por ser um órgão \ncolegiado, não deve participar das decisões sobre \naplicação de recursos financeiros, já que essas \ndecisões são de competência exclusiva da equipe \ngestora da escola. \n(A) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Varginha · Supervisor Pedagógico", "p": 7, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q29", "n": 29, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "B", "img": "img/VAR25-SUP-Q29.webp", "pages": ["img/VAR25-SUP-p8.webp"], "base": null, "text": "QUESTÃO 29 \nCom base nos princípios que orientam a atuação \nda gestão escolar na mediação de conflitos e na \npromoção de relações democráticas no ambiente \neducacional, \ncomplete \nadequadamente \nas \nlacunas do trecho a seguir. \n“O conflito emerge em toda situação em que se \ncompartilham espaços, atividades, normas e \nsistemas de poder e a escola é um deles, onde as \nsituações de conflitos aparecem a todo o \nmomento. Assim sendo, cabe ao gestor o papel \nde ________  e ________ do processo de tomada \nde decisões, pois a responsabilidade de ________  \nas divergências de opiniões deve ser dos \nenvolvidos diretos, para que não culmine em atos \nde ________  nos espaços escolares.” \n \nAssinale a alternativa que preenche corretamente \nas lacunas: \n(A) interventor – crítico – calar – indisciplina. \n(B) facilitador – organizador – solucionar – \nviolência. \n(C) crítico – juiz – criticar – punição. \n(D) conselheiro – defensor – criticar – \nagressividade. \n(E) gestor – controlador – contextualizar – \nbullying.", "source": "Varginha · Supervisor Pedagógico", "p": 8, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q30", "n": 30, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "C", "img": "img/VAR25-SUP-Q30.webp", "pages": ["img/VAR25-SUP-p8.webp"], "base": null, "text": "QUESTÃO 30 \nObserve o enunciado abaixo e assinale a \nalternativa que preenche corretamente a lacuna: \n“A mediação escolar possibilita, dentro da \nescola, a educação em valores, uma educação \npara a paz, e uma visão ________ acerca dos \nconflitos.” \n(A) imparcial. \n(B) problemática. \n(C) inovadora. \n(D) tradicional. \n(E) diagnóstica.", "source": "Varginha · Supervisor Pedagógico", "p": 8, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q31", "n": 31, "area": "CE", "eixo": "CE01", "topic": "Fundamentos da educação", "key": "B", "img": "img/VAR25-SUP-Q31.webp", "pages": ["img/VAR25-SUP-p8.webp"], "base": null, "text": "QUESTÃO 31 \nLeia o trecho a seguir: \nOs referenciais tradicionalmente selecionados \npara o ensino de Psicologia da Educação \nassumem como ponto de vista a necessidade da \nciência psicológica dentro de um curso de \nformação de professores. Esse lugar e esse papel \ndevem ser permanentemente revisitados, a fim de \nque o saber psicológico não se resuma a um lugar \nde neutralidade, de avaliação e de diagnóstico, \ncomprometido com as epistemologias dos \ncolonizadores, o que pode contribuir para a \nreafirmação de uma educação bancária, focada \nno déficit e que elege como recursos de \nenfrentamento a valorização do desenvolvimento \nindividual, o mérito de cada estudante e a \nexclusão de seus marcadores interseccionais. \n \nA partir da leitura do trecho acima, analise as \nafirmativas a seguir atribuindo V (verdadeiro) ou \nF (falso): \n( ) O texto propõe uma reavaliação constante da \nforma como os conteúdos de Psicologia são \napresentados na formação docente. \n( ) \nSegundo \no \nautor, \no \nconhecimento \npsicológico deve ser valorizado como área neutra \ne científica, sem influências socioculturais. \n( ) Uma das críticas feitas é à ideia de que o \nsucesso escolar depende apenas do esforço \nindividual, sem considerar outros fatores sociais. \n \nAssinale a alternativa correta: \n(A) V – V – V \n(B) V – F – V \n(C) V – F – F \n(D) F – F – V \n(E) F – V – F", "source": "Varginha · Supervisor Pedagógico", "p": 8, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q32", "n": 32, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "E", "img": "img/VAR25-SUP-Q32.webp", "pages": ["img/VAR25-SUP-p9.webp"], "base": null, "text": "QUESTÃO 32 \nSobre os fatores que impactam o Ideb, analise as \nafirmativas abaixo e, posteriormente, assinale a \nalternativa correta. \nI. O fator socioeconômico das famílias dos \nalunos pouco influencia os resultados obtidos \npelas escolas no Ideb. \nII. Para escolas que congregam mais alunos com \ncondições socioeconômicas desfavoráveis, é \nmuito mais difícil atingir as metas associadas ao \nIdeb. \nIII. O maior impacto no Ideb, como esperado e \ncompatível com a literatura da área educacional, \né a composição do grupo de alunos matriculados \nno estabelecimento de ensino. \n \n(A) Apenas I e II estão corretas. \n(B) Apenas II está correta. \n(C) Apenas I e III estão corretas. \n(D) I, II e III estão corretas. \n(E)  Apenas II e III estão corretas.", "source": "Varginha · Supervisor Pedagógico", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q33", "n": 33, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "B", "img": "img/VAR25-SUP-Q33.webp", "pages": ["img/VAR25-SUP-p9.webp"], "base": null, "text": "QUESTÃO 33 \nA organização da escola apresenta tanto aspectos \nque se mantêm ao longo do tempo quanto \nelementos que mudam conforme o contexto. \nDesta forma, as permanências estão relacionadas \nà \nhistória \nda \ninstituição, \nenquanto \nas \ntransitoriedades dizem respeito à(ao): \n(A) rotina pedagógica repetitiva dos educadores, \nque entendem que o melhor para a aprendizagem \ndos alunos é manter o mesmo planejamento todos \nos anos pois é na repetição que os aprendizados \nse consolidam. \n(B) diversidade dos sujeitos (educadores, \neducandos, famílias) que constroem o cotidiano \nescolar e o contexto em que o estabelecimento de \nensino se localiza. \n(C) normas e regras previamente definidas pela \ndireção. \n(D) currículo fixo estabelecido pela Secretaria da \nEducação. \n(E) estrutura física da escola, que raramente sofre \nalterações.", "source": "Varginha · Supervisor Pedagógico", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q34", "n": 34, "area": "CE", "eixo": "LEG_13146", "topic": "Lei Brasileira de Inclusão", "key": "D", "img": "img/VAR25-SUP-Q34.webp", "pages": ["img/VAR25-SUP-p9.webp"], "base": null, "text": "QUESTÃO 34 \nA educação inclusiva está respaldada por \nlegislações que asseguram o direito de todas as \npessoas, independentemente de suas condições, a \nterem acesso à aprendizagem em todos os níveis \nde ensino. Analise as afirmativas a seguir sobre \nesses dispositivos legais e assinale a alternativa \ncorreta. \nI - A Declaração Universal de Direitos Humanos \n(1948) e a Convenção sobre os Direitos das \nPessoas com Deficiência (2006) salientam   que   \ntodos   têm   o   direito   à   educação   sem \ndiscriminação. \nII - A Lei Brasileira de Inclusão da Pessoa com \nDeficiência (Lei nº 13.146/2015) torna opcional \na inclusão de alunos com deficiência nas escolas \nregulares, devendo ser priorizado o atendimento \ndestes alunos em escolas especializadas. \n(A) As asserções I e II são proposições falsas. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(D) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa.  \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Varginha · Supervisor Pedagógico", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q35", "n": 35, "area": "CE", "eixo": "CE13", "topic": "Relações e mediação de conflitos", "key": "C", "img": "img/VAR25-SUP-Q35.webp", "pages": ["img/VAR25-SUP-p9.webp"], "base": null, "text": "QUESTÃO 35 \nA superação dos desafios enfrentados pela \neducação escolar, especialmente a indisciplina, \nexige um conjunto de ações articuladas. \nConsiderando \nesse \ncontexto, \nassinale \na \nalternativa correta: \n(A) O planejamento pedagógico deve ser \nentendido como uma formalidade necessária \npara fins burocráticos. \n(B) A prática profissional do docente pode \nprescindir de responsabilidade e ética, desde que \nos resultados de aprendizagem sejam atingidos. \n(C) A proposta pedagógica deve ser revigorada \npor meio de projetos educacionais, recreio \ndirigido, reforço escolar e participação da \ncomunidade escolar. \n(D) Melhorias na infraestrutura e aquisição de \nmateriais devem ser delegadas exclusivamente \naos órgãos administrativos centrais. \n(E) A participação de alunos e famílias nas \nestratégias escolares deve ser evitada para \npreservar a autoridade da gestão.", "source": "Varginha · Supervisor Pedagógico", "p": 9, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q36", "n": 36, "area": "CE", "eixo": "CE11", "topic": "Educação inclusiva", "key": "B", "img": "img/VAR25-SUP-Q36.webp", "pages": ["img/VAR25-SUP-p10.webp"], "base": null, "text": "QUESTÃO 36 \nAssinale a alternativa correta sobre os benefícios \nda inclusão na educação: \nI. Algumas pesquisas apontam resultados \npositivos na inclusão na educação não somente \npara os estudantes com limitações, mas para \ntodos os alunos, estimulando a convivência \nrespeitosa com as diversidades e o trabalho em \nequipe. \nII. A importância de reformas sistêmicas para \nimplementar práticas inclusivas de maneira \neficaz \ne \ndestacando \na \nrelevância \nda \nresponsabilidade dos educadores e das políticas \neducacionais nesse processo. \nIII. Estudos apontam que a inclusão na educação \ngera poucos benefícios para o aluno com \ndeficiência e pode causar dificuldades para os \ndemais alunos e professores. \n(A) Somente I e III são verdadeiras. \n(B) Somente I e II são verdadeiras. \n(C) Somente III é verdadeira. \n(D) Somente I é verdadeira. \n(E) Somente II é verdadeira.", "source": "Varginha · Supervisor Pedagógico", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q37", "n": 37, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "B", "img": "img/VAR25-SUP-Q37.webp", "pages": ["img/VAR25-SUP-p10.webp"], "base": null, "text": "QUESTÃO 37 \nSobre as transformações na avaliação escolar \ncom base na crítica à perspectiva funcionalista, \nanalise as afirmativas abaixo: \nI. A avaliação manifesta-se como um mecanismo \nde diagnóstico da situação, tendo em vista o \navanço no processo de ensinar-e-aprender. \nII. A avaliação se coloca a serviço de uma prática \ndocente emancipatória, inclusiva, como um \ninstrumento para identificar novos rumos. \nIII. A perspectiva funcionalista, configurada no \nmodelo de currículo técnico-linear, reforça a \navaliação como um instrumento de diagnóstico \npedagógico. \n \nAssinale a alternativa correta: \n(A) I, II e III estão corretas. \n(B) Apenas I e II estão corretas. \n(C) Apenas II e III estão corretas. \n(D) Apenas I e III estão corretas. \n(E) Apenas I está correta.", "source": "Varginha · Supervisor Pedagógico", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q38", "n": 38, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "A", "img": "img/VAR25-SUP-Q38.webp", "pages": ["img/VAR25-SUP-p10.webp"], "base": null, "text": "QUESTÃO 38 \nConsiderando \npráticas \npedagógicas \nque \nvalorizam a diversidade cultural e a criatividade \nno processo avaliativo, complete as lacunas a \nseguir com as opções adequadas. \nA avaliação deve promover a expressão \n________ dos sujeitos em todas as atividades, \nexplorando o universo cultural mais restrito à \ncomunidade até o mais amplo, despertando o \nprazer da expressão escrita e da oralidade através \nde múltiplos ________ (dança, música, artes \nplásticas, jogos, dramaturgias, literatura, vídeos, \natividades artesanais, entre outros). O educador \nassume o ________ com o princípio de que todos \naprendem. \n \n(A)  criativa - recursos – compromisso. \n(B) oral - planejamentos – contrato. \n(C) criativa - jogos – planejamento. \n(D) multicultural - recursos – contrato. \n(E) oral - planejamentos – compromisso.", "source": "Varginha · Supervisor Pedagógico", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q39", "n": 39, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "B", "img": "img/VAR25-SUP-Q39.webp", "pages": ["img/VAR25-SUP-p10.webp"], "base": null, "text": "QUESTÃO 39 \nSobre o Projeto Político-Pedagógico (PPP) e sua \nelaboração, analise as afirmativas abaixo: \nI. O PPP demanda uma reflexão conjunta, que \ntorne possível agregar os interesses de todos os \nsegmentos da unidade escolar. \nII. Uma das possibilidades que emergem para a \nescola é construir uma prática pedagógica \norientada por uma ética do cuidado. \nIII. O PPP deve considerar apenas os aspectos \npedagógicos e administrativos da escola, sem \ninterferência dos desejos dos sujeitos envolvidos. \n \nAssinale a alternativa correta: \n(A) I, II e III estão corretas. \n(B) Apenas I e II estão corretas. \n(C) Apenas II e III estão corretas. \n(D) Apenas I e III estão corretas. \n(E) Apenas I está correta.", "source": "Varginha · Supervisor Pedagógico", "p": 10, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q40", "n": 40, "area": "CE", "eixo": "CE04", "topic": "Organização e gestão escolar", "key": "D", "img": "img/VAR25-SUP-Q40.webp", "pages": ["img/VAR25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 40 \nNa administração de projetos, a escolha da \npessoa responsável pela condução das ações \nrequer critérios específicos. Nesse contexto, é \nimportante considerar certas competências que \nfavoreçam o andamento eficaz do trabalho. Qual \ndas opções abaixo não corresponde a uma \ncaracterística considerada fundamental para a \natuação de um líder/gestor de projeto? \n(A) Liderança e capacidade de resolução de \nconflitos. \n(B) Capacidade de comunicação e habilidade de \nnegociação e influência. \n(C) Aptidão de planejamento, organização e \ncontrole. \n(D) Domínio técnico aprofundado sobre todos os \nsetores operacionais. \n(E) Habilidade de organização, planejamento e \ncontrole.", "source": "Varginha · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q41", "n": 41, "area": "CE", "eixo": "CE09", "topic": "Avaliação da aprendizagem", "key": "C", "img": "img/VAR25-SUP-Q41.webp", "pages": ["img/VAR25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 41 \nO regime de progressão continuada não significa \naprovação \nautomática, \nmuito \nmenos \ndesconsidera etapas de escolaridade a serem \nvencidas. Ele é, sim, um novo conceito a ser dado \nà avaliação na escola. A avaliação passa a ser o \ninstrumento guia na progressão do aluno no seu \npercurso escolar, apontando as diferenças na \naquisição de habilidades e conhecimentos entre \nos alunos e orientando o trabalho do professor na \ncondução desse processo. \nDeixa de ser \nrepressora, castradora e comparativa para ser \n________ e estimuladora do processo ensino-\naprendizagem. \n \nAssinale a alternativa que preenche corretamente \na lacuna do texto: \n(A) classificatória. \n(B) punitiva. \n(C) norteadora. \n(D) eliminatória. \n(E) premiadora.", "source": "Varginha · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q42", "n": 42, "area": "CE", "eixo": "CE06", "topic": "Planejamento e PPP", "key": "B", "img": "img/VAR25-SUP-Q42.webp", "pages": ["img/VAR25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 42 \nAo contrário de modelos pedagógicos rígidos e \npreviamente definidos, a construção de uma \nproposta educativa crítica demanda um processo \ncontínuo, atento às condições reais da escola e às \nnecessidades dos sujeitos envolvidos. Nesse \nsentido, o desenvolvimento de uma proposta \nenvolve etapas fundamentais como: observar a \nrealidade, fazer um levantamento crítico e \nformular ações que possam ser adaptadas durante \na trajetória. Assinale a alternativa que completa \ncorretamente as lacunas a seguir, de acordo com \no texto: \nUma proposta precisa: ver a situação da maneira \ncomo ela se apresenta; fazer um balanço do que \nexiste, do que falta e dos ______  a serem \nsolucionados; com base na realidade encontrada, \nno balanço crítico de seus problemas e nos \n______ traçados, elaborar a proposta e as formas \nde colocá-la em ação; ser capaz de ______  no \ncaminho, adaptar-se, romper ou manter práticas \ne processos, autoavaliar-se. \n(A) planejamentos / problemas / continuar. \n(B) problemas / objetivos / reformular-se. \n(C) alunos / projetos / estabilizar-se. \n(D) processos / planejamentos / mudar-se. \n(E) projetos / objetivos / continuar.", "source": "Varginha · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q43", "n": 43, "area": "CE", "eixo": "LEG_CF", "topic": "Constituição Federal", "key": "D", "img": "img/VAR25-SUP-Q43.webp", "pages": ["img/VAR25-SUP-p11.webp"], "base": null, "text": "QUESTÃO 43 \nA Constituição Federal de 1988, em seu artigo \n208, estabelece que o acesso ao ensino \nobrigatório e gratuito é direito público ________. \nOu seja, um direito que permite ao indivíduo \nacionar o Estado para garanti-lo, transformando \na norma geral em um direito pessoal. \nAssinale a alternativa que preenche corretamente \na lacuna do texto: \n(A) universal. \n(B) acessível. \n(C) coletivo. \n(D) subjetivo. \n(E) fundamental.", "source": "Varginha · Supervisor Pedagógico", "p": 11, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q45", "n": 45, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "E", "img": "img/VAR25-SUP-Q45.webp", "pages": ["img/VAR25-SUP-p12.webp"], "base": null, "text": "QUESTÃO 45 \nSobre a relação entre prática docente e tendências \npedagógicas, analise as afirmativas a seguir: \nI. Os educadores devido às informações \nrecebidas até propagam um discurso próximo do \nideal, porém em suas práticas não conseguem se \ndesvencilhar das práticas que estão arraigadas no \nseu cotidiano. \nII. As tendências pedagógicas são construídas \nexclusivamente a partir de teorias acadêmicas e \ndesvinculadas das expectativas sociais. \nIII. É de primordial importância que os \nprofessores \nconheçam \nas \ntendências \npedagógicas, para que estes possam construir \nconscientemente a sua própria trajetória político \npedagógica. \n \nAssinale a alternativa correta: \n(A) Apenas II está correta. \n(B) Apenas III está correta. \n(C) Apenas I e II estão corretas. \n(D) Apenas II e III estão corretas. \n(E) Apenas I e III estão corretas.", "source": "Varginha · Supervisor Pedagógico", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q46", "n": 46, "area": "CE", "eixo": "CE02", "topic": "Teorias pedagógicas", "key": "B", "img": "img/VAR25-SUP-Q46.webp", "pages": ["img/VAR25-SUP-p12.webp"], "base": null, "text": "QUESTÃO 46 \nA respeito da Didática da Pedagogia Histórico-\nCrítica, analise as afirmações a seguir e assinale \na alternativa correta: \nI – Nessa teoria, o conhecimento constrói-se, \nfundamentalmente, a partir da base material \n(prática social dos homens e processos de \ntransformação da natureza por eles forjados). \nII – É a existência social dos homens que gera o \nconhecimento, pois este resulta do trabalho \nhumano, no processo histórico de transformação \ndo mundo e da sociedade, através da reflexão \nsobre esse processo. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Varginha · Supervisor Pedagógico", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q47", "n": 47, "area": "CE", "eixo": "LEG_LDB", "topic": "LDB", "key": "E", "img": "img/VAR25-SUP-Q47.webp", "pages": ["img/VAR25-SUP-p12.webp"], "base": null, "text": "QUESTÃO 47 \nA respeito dos princípios que regem o ensino no \nBrasil, conforme o Art. 3º da LDB, analise as \nproposições a seguir e assinale a alternativa \ncorreta: \nI – O ensino será ministrado com base no \nprincípio da liberdade de aprender, ensinar, \npesquisar e divulgar a cultura, o pensamento, a \narte e o saber. \nII – O ensino será ministrado com base no \nprincípio da vinculação entre a educação escolar, \no trabalho e as práticas sociais. \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Varginha · Supervisor Pedagógico", "p": 12, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q49", "n": 49, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "C", "img": "img/VAR25-SUP-Q49.webp", "pages": ["img/VAR25-SUP-p13.webp"], "base": null, "text": "QUESTÃO 49 \nA respeito da avaliação institucional nas escolas, \nconforme \no \nnovo \npanorama \neducacional \nbrasileiro, analise as proposições abaixo e \nassinale a alternativa correta: \nI – As contribuições da avaliação institucional \npara as reflexões sobre os currículos das escolas \npodem se dar à medida que as instituições \ntiverem clareza em relação ao por que querem \navaliar, para que serve a avaliação, quais os \nobjetivos a serem alcançados, quais os valores a \nserem disseminados. \nII – Mesmo que a avaliação institucional seja \nconstruída, implementada e avaliada a partir de \nreflexões coletivas, dificilmente ela pode \ninfluenciar positivamente o processo educacional \ne provocar reformulações curriculares. \n \n(A) A asserção I é uma proposição falsa, e a II é \numa proposição verdadeira. \n(B) As asserções I e II são proposições \nverdadeiras, e a II é um complemento da I. \n(C) A asserção I é uma proposição verdadeira, e \na II é uma proposição falsa. \n(D) As asserções I e II são proposições falsas. \n(E) As asserções I e II são proposições \nverdadeiras, mas a II não é um complemento da \nI.", "source": "Varginha · Supervisor Pedagógico", "p": 13, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "VAR25-SUP-Q50", "n": 50, "area": "CE", "eixo": "CE10", "topic": "Avaliação institucional", "key": "C", "img": "img/VAR25-SUP-Q50.webp", "pages": ["img/VAR25-SUP-p13.webp"], "base": null, "text": "QUESTÃO 50 \nSobre eficácia escolar, analise as afirmativas a \nseguir: \nI – A eficácia escolar representa a área de \npesquisa científica em Educação envolvida em \nestimar o efeito-escola (mede o contributo das \nvariáveis controláveis pela escola para os \nresultados de aprendizagem dos alunos, e \ninvestiga políticas e práticas para a melhoria do \nseu desempenho). \nII – A mensuração da qualidade escolar exige o \nuso de métodos confiáveis e adequados, o que \nestá fora do escopo da pesquisa sobre eficácia \nescolar. \nIII – A eficácia escolar é compreendida como o \ngrau em que um sistema educacional, seus \nintegrantes e stakeholders alcançam efeitos e \nobjetivos específicos desejados por eles. \n \nAssinale a alternativa correta: \n(A) Apenas as afirmativas I e II estão corretas. \n(B) Apenas as afirmativas II e III estão corretas. \n(C) Apenas as afirmativas I e III estão corretas. \n(D) Apenas a afirmativa III está correta. \n(E) Apenas a afirmativa II está correta.", "source": "Varginha · Supervisor Pedagógico", "p": 13, "role": "both", "preferred": "SUP", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q01", "n": 1, "area": "LP", "eixo": "LP01", "topic": "Interpretação e tipos de texto", "key": "C", "img": "img/CAI25-DIR-Q01.webp", "pages": ["img/CAI25-DIR-p2.webp"], "base": "CAI25-DIR-T1", "text": "QUESTÃO 01 \nNa visão da narradora do texto, entende-se que: \n(A) Sentir-se angustiado depende apenas da \nvontade própria do indivíduo. \n(B) A angústia não tem qualquer relação com a \nalienação de si mesmo.    \n(C) A angústia é um sentimento natural \nrelacionado à condição de se estar vivo. \n(D) O vazio existencial permite que se entenda o \nque é a angústia. \n(E) A angústia faz com que as pessoas que a \nsentem se tornem superiores.", "source": "Caieiras · Diretor de Escola", "p": 2, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q02", "n": 2, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "B", "img": "img/CAI25-DIR-Q02.webp", "pages": ["img/CAI25-DIR-p2.webp"], "base": "CAI25-DIR-T1", "text": "QUESTÃO 02 \nO adjetivo ‘incauto’, que ocorre em “Para \nalguns incautos, inclusive, é palavra que se \norgulham de pronunciar”, tem relação com o \nsubstantivo ‘cautela’. Identifique o par de \npalavras a seguir em que o adjetivo não tem \nrelação com o substantivo com o qual se \napresenta. \n(A) chumbo – plúmbeo. \n(B) linha – lígneo. \n(C) realeza – real. \n(D) gênero – genérico. \n(E) seda – sérico.", "source": "Caieiras · Diretor de Escola", "p": 2, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q03", "n": 3, "area": "LP", "eixo": "LP09", "topic": "Colocação pronominal", "key": "B", "img": "img/CAI25-DIR-Q03.webp", "pages": ["img/CAI25-DIR-p2.webp"], "base": "CAI25-DIR-T1", "text": "QUESTÃO 03 \nAnalise a colocação pronominal dos excertos \napresentados a seguir: \nI. Ou não se confessar nem a si próprio. \nII.  Mas angústia faz parte: o que é vivo, por ser \nvivo, se contrai. \nIII. Enquanto se espera que o coração entenda. \nDe acordo com a norma-padrão da língua \nportuguesa, nos casos apresentados, a ênclise \nnão é vetada apenas em: \n(A) I. \n(B) II. \n(C) III. \n(D) I e II. \n(E) II e III.", "source": "Caieiras · Diretor de Escola", "p": 2, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q04", "n": 4, "area": "LP", "eixo": "LP04", "topic": "Ortografia e acentuação", "key": "D", "img": "img/CAI25-DIR-Q04.webp", "pages": ["img/CAI25-DIR-p2.webp"], "base": "CAI25-DIR-T1", "text": "QUESTÃO 04 \nA palavra ‘angústia’ é uma proparoxítona \naparente, assim como: \n(A) facílimo. \n(B) rápido. \n(C) amídala. \n(D) espécie. \n(E) árbitro.", "source": "Caieiras · Diretor de Escola", "p": 2, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q05", "n": 5, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "C", "img": "img/CAI25-DIR-Q05.webp", "pages": ["img/CAI25-DIR-p3.webp"], "base": "CAI25-DIR-T1", "text": "QUESTÃO 05 \nA flexão da forma verbal “acha”, em “você não \nacha que há um vazio sinistro em tudo?”, indica \na:  \n(A) primeira pessoa do singular. \n(B) segunda pessoa do singular. \n(C) terceira pessoa do singular. \n(D) primeira pessoa do plural.  \n(E) segunda pessoa do plural.", "source": "Caieiras · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q06", "n": 6, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "C", "img": "img/CAI25-DIR-Q06.webp", "pages": ["img/CAI25-DIR-p3.webp"], "base": "CAI25-DIR-T1", "text": "QUESTÃO 06 \nO sentido do verbo ‘haver’, empregado em “Há \nsim”, é o mesmo que ocorre em: \n(A) Houveram por bem adiar os exames do \nprocesso seletivo municipal. \n(B) Os rapazes haviam dito que prestariam contas \nde tudo. \n(C) Não houve uma só ação que fosse bem \ninterpretada naquele dia.  \n(D) Os fazendeiros houveram grandes riquezas \nno interior do país. \n(E) As minhas filhas hão de conseguir novos \nempregos.", "source": "Caieiras · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q07", "n": 7, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "E", "img": "img/CAI25-DIR-Q07.webp", "pages": ["img/CAI25-DIR-p3.webp"], "base": null, "text": "QUESTÃO 07 \nEm todas as construções a seguir, os elementos \ndestacados têm valor de advérbio, exceto em: \n(A) A feira acontece de manhã. \n(B) Tem viajado de trem. \n(C) O dia acabou de repente.  \n(D) Apresentou-se de improviso.  \n(E) Uma bela manhã de primavera.", "source": "Caieiras · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q08", "n": 8, "area": "LP", "eixo": "LP02", "topic": "Semântica e vocabulário", "key": "B", "img": "img/CAI25-DIR-Q08.webp", "pages": ["img/CAI25-DIR-p3.webp"], "base": null, "text": "QUESTÃO 08 \nObserve o sentido expresso pelo pronome \nindefinido na oração “Homem nenhum vai me \nprivar de viver os meus sonhos”. As sentenças a \nseguir empregam outro pronome indefinido, que \nsó exprime o mesmo sentido de “nenhum” em: \n(A) Algum dia terei dinheiro suficiente para \nviajar. \n(B) De modo algum agi por interesse.  \n(C) Algum de vocês terá de solucionar o \nproblema. \n(D) Algum pedaço da estrutura de madeira já está \npodre. \n(E) Já demonstra ter algum sucesso nesse \nesporte.", "source": "Caieiras · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q09", "n": 9, "area": "LP", "eixo": "LP06", "topic": "Classes gramaticais", "key": "D", "img": "img/CAI25-DIR-Q09.webp", "pages": ["img/CAI25-DIR-p3.webp"], "base": null, "text": "QUESTÃO 09 \nNão se estabelece, no emprego das formas \nverbais, a correlação temporal necessária ao \ncontexto apenas em: \n(A) Mande lembranças a Ana quando a vir.  \n(B) Seguiu viagem, embora quisesse voltar para \ncasa.  \n(C) Ela chorou ainda mais quando descobrira a \nmorte do pai.  \n(D) Se descesse do ônibus com algum apoio, não \nse machuca tanto.  \n(E) Após ter perdido o controle do carro, sofreu \num grave acidente.", "source": "Caieiras · Diretor de Escola", "p": 3, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q11", "n": 11, "area": "MRL", "eixo": "MRL10", "topic": "Medidas e conversões", "key": "A", "img": "img/CAI25-DIR-Q11.webp", "pages": ["img/CAI25-DIR-p4.webp"], "base": null, "text": "QUESTÃO 11 \nEm uma fazenda, cria-se peixes em um \nreservatório em forma de paralelepípedo que tem \nárea da base de 200 metros quadrados. Os \nengenheiros sabem que o nível da água diminui \ndevido à evaporação numa velocidade de 3 cm \npor dia. Para que o nível de água fique sempre \nconstante, o engenheiro colocará uma mangueira \nvertendo água exatamente com a vazão \nnecessária para suprir a demanda da evaporação. \nQual deve ser a vazão da torneira, em litros por \nhora, neste caso? \n(A) 250. \n(B) 600. \n(C) 60. \n(D) 6000. \n(E) 2500.", "source": "Caieiras · Diretor de Escola", "p": 4, "role": "both", "preferred": "DIR", "fallback": false, "author": null, "secondary": []}, {"id": "CAI25-DIR-Q12", "n": 12, "area": "MRL", "eixo": "MRL09", "topic": "Tabelas e gráficos", "key": "C", "img": "img/CAI25-DIR-Q12.webp", "pages": ["img/CAI25-DIR-p4.webp"], "base": null, "text": "QUES
