P26-BIB-Q23", "n": 23, "area": "INF", "eixo": "INF02", "topic": "Word", "key": "D", "img": "img/VGP26-BIB-Q23.webp", "pages": ["img/VGP26-BIB-p7.webp"], "base": null, "text": "", "source": "Vargem Grande Paulista · Bibliotecário", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VGP26-BIB-Q24", "n": 24, "area": "INF", "eixo": "INF06", "topic": "Internet e segurança", "key": "C", "img": "img/VGP26-BIB-Q24.webp", "pages": ["img/VGP26-BIB-p7.webp"], "base": null, "text": "", "source": "Vargem Grande Paulista · Bibliotecário", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}, {"id": "VGP26-BIB-Q25", "n": 25, "area": "INF", "eixo": "INF04", "topic": "PowerPoint", "key": "B", "img": "img/VGP26-BIB-Q25.webp", "pages": ["img/VGP26-BIB-p7.webp"], "base": null, "text": "", "source": "Vargem Grande Paulista · Bibliotecário", "p": 7, "role": "both", "preferred": "both", "fallback": false, "author": null, "secondary": []}], "bases": {"GAR26-DIR-T1": {"imgs": ["img/GAR26-DIR-T1-0.webp", "img/GAR26-DIR-T1-1.webp"], "text": "", "original": "img/GAR26-DIR-p2.webp", "numbered": ["img/GAR26-DIR-T1-aux-0.webp", "img/GAR26-DIR-T1-aux-1.webp"]}, "AMP26-DIR-T1": {"imgs": ["img/AMP26-DIR-T1-0.webp", "img/AMP26-DIR-T1-1.webp"], "text": "", "original": "img/AMP26-DIR-p2.webp", "numbered": ["img/AMP26-DIR-T1-aux-0.webp", "img/AMP26-DIR-T1-aux-1.webp"]}, "POT26-DIR-T1": {"imgs": ["img/POT26-DIR-T1-0.webp", "img/POT26-DIR-T1-1.webp"], "text": "LÍNGUA PORTUGUESA \nTEXTO \nLeia o texto a seguir para responder às\nquestões de 01 a 03. \n \nAs crianças não são o futuro do mundo \n \nSó existe uma frase que me incomoda\nmais do que perguntar a uma criança o que ela\nquer ser quando crescer, que é quando nos\nreferimos aos pequenos como sendo eles o futuro\ndo mundo. \nAinda tocado pela palestra da jornalista\nEliane Brum, a que tive o privilégio de assistir na\núltima semana aqui em Santa Maria, guardei em\nminhas anotações algo dito por ela, que se\nencaixa perfeitamente no meu texto de hoje. \nEnquanto falava acerca de sua luta em\ndefesa da Amazônia e do quanto precisamos\n“acordar” em relação ao aquecimento global, a\njornalista mais premiada da história do nosso país\nfoi enfática quando afirmou que “estamos\ndestruindo o mundo dos nossos filhos”. \nForam palavras que me atingiram em\ncheio, como uma flecha precisamente lançada\nsobre o peito, que impacta, causa dor e\ndesconforto. O que eu senti tem a ver com o\nsignificado prático dessa frase, é claro: estamos\ndestruindo o mundo. Mas, para além disso, fui\nimediatamente tocado por algo que é inseparável\nde mim há quase quatro anos, desde que me\ntornei pai. \nSó de imaginar que a minha filha poderá\nencontrar um mundo com a natureza destruída e\nsem elementos básicos para a sua sobrevivência,\ncomo, por exemplo, água potável, senti uma\nangústia que preciso compartilhar. \nEu sei que já existem muitas pessoas\nconectadas por esta mínima consciência de que\nprecisamos mudar os nossos hábitos, se\nquisermos preservar a nossa espécie. Mas ainda\nsão poucos, muito poucos. Eu, por exemplo, já\nconsigo separar cotidianamente o lixo orgânico\ndo seco; porém, me vejo tomado por hábitos de\nconsumo \n– \ne \ngeração \nde \nresíduos \n–\ncompletamente desnecessários. Eu não tenho\ncolaborado para que o mundo da minha própria\nfilha exista no futuro. \nO que tudo isso tem a ver com dizer para\nas crianças que elas são o futuro do mundo?\nTudo! Percebam a dupla violência que estamos\n\ncometendo com as crianças de hoje e também \ncom as que ainda estão por nascer. Colocamos \nnelas a responsabilidade de “ser o futuro” de um \nmundo que nós estamos destruindo. (...) \n \nRIBEIRO, Gilvan. As crianças não são o futuro \ndo \nmundo. \nDisponível \nem \n<https://claudemirpereira.com.br/2019/05/croni\nca-gilvan-ribeiro-o-ambiente-e-o-mundo-que-\nestamos-produzindo-para-entregar-as-nossas-\ncriancas/>.", "original": "img/POT26-DIR-p2.webp", "numbered": ["img/POT26-DIR-T1-aux-0.webp", "img/POT26-DIR-T1-aux-1.webp"]}, "POT26-SUP-T1": {"imgs": ["img/POT26-SUP-T1-0.webp", "img/POT26-SUP-T1-1.webp"], "text": "LÍNGUA PORTUGUESA \nTEXTO \nLeia o texto a seguir para responder às\nquestões de 01 a 03. \n \nUm grande passo para a humanidade \n \nPara os meninos de hoje, as viagens do\nônibus espacial são rotina e dizem muito pouco,\nquando não passam desapercebidas, porque não\ntêm mais emoção e se sucedem com frequência,\ncomo se fizessem eternamente parte do dia a dia\nhumano. \nMas, quando eu era criança, a conquista\ndo espaço implicava emoções fortes. De repente,\nFlash Gordon deixava de ser ficção para se\nmaterializar nos foguetes russos e americanos\nque subiam aos céus, levando primeiro\ncachorros, como a Laica, e depois homens, para\ndar a volta do planeta em órbitas fantásticas onde\naparecíamos aos seus olhos pintados de azuis. \n(...) \nDe repente, ainda que seguindo os passos\nde um cronograma lógico e rigoroso, estávamos\nna lua, com tudo de mítico e lúdico que esse voo\ntinha. \nNum dia de julho o homem rompeu a\ncadeia que o prendia à Terra desde o começo da\nnossa história; dali para a frente a nova fronteira\nseria os confins do espaço. \nO planeta parou para assistir pela\ntelevisão ao pouso do módulo lunar na superfície\nda lua. \nMeu Deus do céu, assistir pela televisão o\nhomem andar na lua! \nNão bastava o feito fantástico, a\ncapacidade intelectual e a coragem envolvidas,\nainda por cima, nós, míseros mortais espalhados\npela superfície do nosso planeta menor, tínhamos\na chance de ver, ao vivo, pelas telas das\ntelevisões ligadas nos 4 cantos da Terra, a\nhistória ser feita, no momento em que a história\nera feita; na marca maravilhosa gravada para\nsempre – como um padrão real plantado no\ncosmos – da pegada da sola da bota de um\nhomem na superfície da lua. \n \nMENDONÇA, Antonio Penteado. Um grande\npasso para a humanidade. Crônicas da cidade.\nDisponível \nem\n\n<https://cronicasdacidade.com.br/cronicas/2021/\n10/30/um-grande-passo-para-a-humanidade/>.", "original": "img/POT26-SUP-p2.webp", "numbered": ["img/POT26-SUP-T1-aux-0.webp", "img/POT26-SUP-T1-aux-1.webp"]}, "POT26-COO-T1": {"imgs": ["img/POT26-COO-T1-0.webp", "img/POT26-COO-T1-1.webp"], "text": "LÍNGUA PORTUGUESA \nTEXTO \nLeia o texto a seguir para responder às\nquestões de 01 a 03. \n \nUm grande passo para a humanidade \n \nPara os meninos de hoje, as viagens do\nônibus espacial são rotina e dizem muito pouco,\nquando não passam desapercebidas, porque não\ntêm mais emoção e se sucedem com frequência,\ncomo se fizessem eternamente parte do dia a dia\nhumano. \nMas, quando eu era criança, a conquista\ndo espaço implicava emoções fortes. De repente,\nFlash Gordon deixava de ser ficção para se\nmaterializar nos foguetes russos e americanos\nque subiam aos céus, levando primeiro\ncachorros, como a Laica, e depois homens, para\ndar a volta do planeta em órbitas fantásticas onde\naparecíamos aos seus olhos pintados de azuis. \n(...) \nDe repente, ainda que seguindo os passos\nde um cronograma lógico e rigoroso, estávamos\nna lua, com tudo de mítico e lúdico que esse voo\ntinha. \nNum dia de julho o homem rompeu a\ncadeia que o prendia à Terra desde o começo da\nnossa história; dali para a frente a nova fronteira\nseria os confins do espaço. \nO planeta parou para assistir pela\ntelevisão ao pouso do módulo lunar na superfície\nda lua. \nMeu Deus do céu, assistir pela televisão o\nhomem andar na lua! \nNão bastava o feito fantástico, a\ncapacidade intelectual e a coragem envolvidas,\nainda por cima, nós, míseros mortais espalhados\npela superfície do nosso planeta menor, tínhamos\na chance de ver, ao vivo, pelas telas das\ntelevisões ligadas nos 4 cantos da Terra, a\nhistória ser feita, no momento em que a história\nera feita; na marca maravilhosa gravada para\nsempre – como um padrão real plantado no\ncosmos – da pegada da sola da bota de um\nhomem na superfície da lua. \n \nMENDONÇA, Antonio Penteado. Um grande\npasso para a humanidade. Crônicas da cidade.\nDisponível \nem\n\n<https://cronicasdacidade.com.br/cronicas/2021/\n10/30/um-grande-passo-para-a-humanidade/>.", "original": "img/POT26-COO-p2.webp", "numbered": ["img/POT26-COO-T1-aux-0.webp", "img/POT26-COO-T1-aux-1.webp"]}, "VAR25-SUP-T1": {"imgs": ["img/VAR25-SUP-T1-0.webp", "img/VAR25-SUP-T1-1.webp"], "text": "LÍNGUA PORTUGUESA \nTEXTO \nLeia o texto a seguir para responder às\nquestões de 1 a 5. \n \nA casa cai \n \nMorou mais de 20 anos nesta casa? Então\nvai sentir “uma coisa” quando ela for demolida. \nComeçou a demolição. Passando pela\nrua, ele viu a casa já sem telhado, e operários,\nna poeira, removendo caibros. Aquele telhado\nque lhe dera tanto trabalho, por causa das\ngoteiras, tapadas aqui, reaparecendo ali. Seu\nquarto de dormir estava exposto ao céu, no calor\nda manhã. Ao fundo, no terraço, tinham\ndesaparecido as colunas da pérgula, e a cobertura\nde ramos de buganvília - dois troncos subindo do\npátio lá embaixo e enchendo de florinhas\nvermelhas o chão, de ladrilho, onde os gatos da\nvizinhança amavam fazer sesta e surpreender\ntico-ticos. \nPassou nos dias seguintes e viu o\nprogressivo \ndesfazer-se \ndas \nparedes, \nque\nescancarava a casa de frente e de flancos\njogando-a por assim dizer na rua. Os marcos das\nportas apareciam emoldurando o vazio. O azul e\nas nuvens circulavam pelos cômodos, numa\ncomposição surrealista. E o pequeno balcão da\nfachada, cercado de ar, parecia um mirante\nespacial, baixado ao nível dos míopes. \nA \ndemolição \nprosseguiu \nà \nnoite,\nespontaneamente. Um lanço de parede desabou\nsozinho, para fora do tapume, quando já cessara\nna rua o movimento dos lotações. Caiu discreto\nsem ferir ninguém, apenas avariando —\ndesculpem — a rede telefônica.   \nA casa encolhera-se, em processo\ninvolutivo. Já agora de um só pavimento, sem\nteto, aspirava mesmo à desintegração. Chegou a\nvez da pequena sala de estar, da sala de jantar\ncom seu lambri envernizado a preto, que ele\npassara meses raspando a poder de gilete, para\nrecuperar a cor da madeira. E a vez do escritório,\nparte pensante e sentinte de seu mecanismo\nindividual, \nde \nseu \neu \nmais \níntimo \ne\nsimultaneamente mais público, eu de gavetas\nsigilosas manuseadas por um profissional da\nescrita. De todo tempo que vivera na casa, fora\nali que passara o maior número de horas, sentado,\nmeio corcunda, desligado de acontecimentos,\n\nouvindo, sem escutar, rumores que chegavam de \noutro mundo - cantoria de bêbados, motor de \navião, chorinho de bebê, galo na madrugada. \nE não sentiu dor vendo esfarinharem-se \nesses compartimentos de sua história pessoal. \nNem sequer a melancolia do desvanecimento das \ncoisas físicas. Elas tinham durado e cumprido a \ntarefa. Chega o instante em que compreendemos \na demolição como um resgate de formas \ncansadas, uma sentença de liberdade. Talvez \nsejamos levados a essa compreensão pelo \ntrabalho similar, mais surdo, que se vai operando \nem nós. E não é preciso imaginar a alegria de \nformas \nnovas, \nmais \nclaras, \na \nsurgirem \nconstantemente de formas caducas, para aceitar \nde coração sereno o fim das coisas que se ligaram \nà nossa vida. \nFitou tranquilo o que tinha sido sua casa \ne era um amontoado de caliça e tijolo, a ser \nremovido. Em breve restaria um lote, à espera de \noutra casa maior, sem sinal dele e dos de outra \ncasa maior, sem sinal dele e dos seus, mas \ndestinada a concentrar outras vivências. Uma \nordem, um estatuto pairava sobre os destroços, e \ntudo era como devia ser, sem ilusão de \npermanência.   \nANDRADE, C. D. Correio da Manhã. Disponível em \n<https://cronicabrasileira.org.br/cronicas/17514/a-\ncasa-cai>.", "original": "img/VAR25-SUP-p2.webp", "numbered": ["img/VAR25-SUP-T1-aux-0.webp", "img/VAR25-SUP-T1-aux-1.webp"]}, "CAI25-DIR-T1": {"imgs": ["img/CAI25-DIR-p2.webp"], "text": "Prefeitura Municipal de Caieiras – Concurso Público - 01/2024                                                             INSTITUTO AVANÇA SÃO PAULO \n \nDIRETOR DE ESCOLA                                                                                                                                  Página 2 de 16 \nLÍNGUA PORTUGUESA  \nLeia o texto a seguir para responder às \nquestões de 1 a 6.  \n \nO que é angústia \n \nUm rapaz fez-me essa pergunta difícil de \nser respondida. Pois depende do angustiado. Para \nalguns incautos, inclusive, é palavra que se \norgulham de pronunciar como se com ela \nsubissem de categoria – o que também é uma \nforma de angústia. \nAngústia pode ser não ter esperança na \nesperança. Ou conformar-se sem se resignar. Ou \nnão se confessar nem a si próprio. Ou não ser o \nque realmente se é, e nunca se é. Angústia pode \nser o desamparo de estar vivo. Pode ser também \nnão ter coragem de ter angústia – e a fuga é outra \nangústia. Mas angústia faz parte: o que é vivo, \npor ser vivo, se contrai. \nEsse mesmo rapaz perguntou-me: você \nnão acha que há um vazio sinistro em tudo? Há \nsim. Enquanto se espera que o coração entenda. \n \nLISPECTOR, C. O que é angústia. Todas as crônicas. \nRio \nde \nJaneiro: \nRocco, \n2018, \np. \n535.  \n \nQUESTÃO 01 \nNa visão da narradora do texto, entende-se que: \n(A) Sentir-se angustiado depende apenas da \nvontade própria do indivíduo. \n(B) A angústia não tem qualquer relação com a \nalienação de si mesmo.    \n(C) A angústia é um sentimento natural \nrelacionado à condição de se estar vivo. \n(D) O vazio existencial permite que se entenda o \nque é a angústia. \n(E) A angústia faz com que as pessoas que a \nsentem se tornem superiores. \n \n \n \n \n \n \n \n \n \nQUESTÃO 02 \nO adjetivo ‘incauto’, que ocorre em “Para \nalguns incautos, inclusive, é palavra que se \norgulham de pronunciar”, tem relação com o \nsubstantivo ‘cautela’. Identifique o par de \npalavras a seguir em que o adjetivo não tem \nrelação com o substantivo com o qual se \napresenta. \n(A) chumbo – plúmbeo. \n(B) linha – lígneo. \n(C) realeza – real. \n(D) gênero – genérico. \n(E) seda – sérico. \n \nQUESTÃO 03 \nAnalise a colocação pronominal dos excertos \napresentados a seguir: \nI. Ou não se confessar nem a si próprio. \nII.  Mas angústia faz parte: o que é vivo, por ser \nvivo, se contrai. \nIII. Enquanto se espera que o coração entenda. \nDe acordo com a norma-padrão da língua \nportuguesa, nos casos apresentados, a ênclise \nnão é vetada apenas em: \n(A) I. \n(B) II. \n(C) III. \n(D) I e II. \n(E) II e III. \n \nQUESTÃO 04 \nA palavra ‘angústia’ é uma proparoxítona \naparente, assim como: \n(A) facílimo. \n(B) rápido. \n(C) amídala. \n(D) espécie. \n(E) árbitro.", "original": "img/CAI25-DIR-p2.webp"}, "VAR25-ORI-T1": {"imgs": ["img/VAR25-ORI-T1-0.webp", "img/VAR25-ORI-T1-1.webp"], "text": "LÍNGUA PORTUGUESA \nTEXTO \nLeia o texto a seguir para responder às\nquestões de 1 a 5. \n \nMeu coração  \n \nNo fim, desculpe a literatura, é tudo entre\nnós e o nosso coração. Depois do dito e do feito,\ndepois da paixão e da razão, depois da vida das\ncélulas e da vida social e da vida cívica e das idas\ne das voltas, e da História e da biografia, e do que\nos outros fizeram conosco e nós fizemos com os\noutros, é tudo entre nós e ele. Segundos fora. Nós\ne ele. A única conversa que vale, a única\nintimidade que conta. O coração não tem nada a\nver com nada, fora a sístole e a diástole e a sua\nfisiologia medíocre. Ele nem nos daria conversa,\nse não dependesse de nós, se não precisasse da\nembalagem, dos terminais e de alguém que cuide\ndele. Tudo que lhe atribuem, do mais romântico\nao mais calhorda, é falso. Trata-se de um mero\nmúsculo, e de um músculo egoísta, que só quer\nsaber da sua própria sobrevivência. Da qual, por\numa cruel coincidência, depende a nossa.  \nFala-se do “time do coração”. Mentira. O\ncoração não tem time. O coração não se interessa\npor futebol. Só hoje, por exemplo, o meu se deu\nconta de onde estava. Paris, Nantes, Marselha ou\nqualquer outra cidade, é tudo o mesmo para ele,\ndesde que ele tenha um lugar seguro onde possa\nbater e cuidar da sua vidinha. Mas de repente ele\nse deu conta e pediu satisfações. Para onde eu o\ntinha trazido? Expliquei. A França, a Copa, o\nBrasil, os jogos, a beleza dos jogos...  \nMeu coração não quis ouvir falar da\nbeleza dos jogos. Ele não tem nenhum senso\nestético. Quis saber que história era aquela de\nmorte súbita.  \n— É uma maneira nova de decidir as\npartidas que acabam empatadas. Há uma\nprorrogação e quem marcar o primeiro gol\nganha.  \nMeu coração não quis acreditar.  \n— Quer dizer que, se esse time pelo qual\nvocê torce, como é mesmo o nome?  \n— Brasil.  \n— Quer dizer que, se o Brasil empatar\ncom algum outro time, tem prorrogação com\nmorte súbita?  \n— É...  \n\n— Você sabia disso quando me trouxe \npara cá?  \n— Sabia.  \n— Você deliberadamente me trouxe a um \nevento em que eu posso parar de repente, mesmo \nnão tendo nada a ver com isso? Não era para ser \num campeonato de futebol, um esporte, um \ndivertimento, enfim, nada que me dissesse \nrespeito?  \n— Desculpe. Eu tentei substituí-lo pelo \ndistanciamento crítico, mas...  \n— Só me diz uma coisa. Se a prorrogação \nterminar sem que ninguém marque gol, o que \nacontece?  \n— Aí decidem nos pênaltis.  \n— Me leva pra casa. Me leva pra casa \nimediatamente. E pare de me envolver nos seus \ndivertimentos. Você parece que não tem \ncoração.  \n— Mas nada disso vai acontecer com o \nBrasil. Prorrogação, pênaltis, nada disso.  \n— Quase aconteceu contra a Dinamarca!  \n— É, mas...  \n— Me tira daqui! \nVERISSIMO, L. F. Verissimo antológico: meio século de \ncrônicas, ou coisa parecida. São Paulo: Objetiva, 2020.", "original": "img/VAR25-ORI-p2.webp", "numbered": ["img/VAR25-ORI-T1-aux-0.webp", "img/VAR25-ORI-T1-aux-1.webp"]}, "CAI25-SUP-T1": {"imgs": ["img/CAI25-SUP-T1-0.webp", "img/CAI25-SUP-T1-1.webp"], "text": "LÍNGUA PORTUGUESA  \nLeia o texto a seguir para responder às\nquestões de 1 a 6. \n \nAté breve \n \nHá \ntemperamentos \nurbanos \npor\nnascimento, \nmas \nhá, \nigualmente, \nos\ntemperamentos rurais. Uns só podem viver no\nasfalto, embalam-se com o escapamento das\nlambretas, escutam a voz dos anjos no rádio do\nvizinho e vão para a fila da carne como para\nfestinha de aniversário. O rural, ao contrário, só\nconsegue viver na cidade como escafandrista\ndebaixo d’água: de vez em quando carece ir à\ntona, a fim de se livrar da pressão; doses\nilimitadas de cidade são, para tal gente, perigo de\nmorte certa, bolha de ar no sangue, pulmão\nachatado, colapso periférico. Que fazer se sou um\ndesses — se aqui em casa somos rurais? \nEis por que esta semana me parto, em\nprocura do retiro sertanejo de todos os anos.\nAlguns meses passaremos entre céu e terra, sem\nedifícios nem ruas, nem lotações, nem política,\nnem literatos, nem teatro, nem cinema; nenhum\ndos encantos da civilização a prejudicar o\nindispensável recolhimento pelo qual a alma\nchora e que o corpo não dispensa, sob pena de\nmorrer ou enloucar e sair brizolando por aí,\natirando pedra em quem não merece. \nDirá quem não gosta de mim que isso é\nfolga, que lugar de cronista é no asfalto, e que só\nse podem comentar acontecimentos estando no\nmeio deles. E eu responderei que folgados têm\nmuitos, mas não sou desses, minha lei e minha fé\né o esforço e o sofrimento; e lembrarei também a\nverdade elementar de que não há perspectiva sem\ndistância, e se há uma coisa neste país de que\ncarecemos tanto quanto de divisas fortes, é de\nperspectiva. \nVivemos \ndentro \ndemais \ndos\nacontecimentos, somos absorvidos por eles,\nsugestionados por eles, exacerbados por eles.\nEles é que nos arrastam, não somos nós que os\nesmiuçamos. [...] Envolvida pela fofoca, o\ntransitório, o gás néon, perde a gente aqui os\nolhos de ver as grandes coisas. \nE tem mais: lembremo-nos de que hoje\nem dia já não há isolamento campestre que nos\nafaste do noticiário. Na selva mais perdida basta\num pequeno transistor para nos transformar na\n\ntestemunha auditiva da história. [...] Que vale a \ndistância quando temos as asas do rádio? [...] \nVocês aqui, e nas outras cidades grandes, \npensam que são os únicos seres vivos do mundo \n— ou pelo menos do só mundo que interessa. \nTalvez, talvez contudo, ainda sobre muito mundo \npor aí. Vocês são os dançarinos no palco e não \nenxergam a plateia no escuro, por causa dos \nholofotes que só botam luz no pessoal do balé. \nPorém, há mais gente do lado de lá do que do lado \nde cá. Deixem-me ir para lá um pouquinho, para \nver se lhes mando o eco do que vocês cantam, \npara lhes dizer na verdade se vocês funcionam e \nestão vivos. Lá para onde eu vou tem milhões, \nsim, milhões mais de povo do que aqui. Vocês \nnão sabem deles, mas eles sabem de vocês. A \ncomparação da plateia é certa: lindo pode ser o \nespetáculo, mas sem plateia não tem razão de ser; \nsó da plateia é que parte a ovação ou a pateada. \nMeu Deus, estou falando tão bobo, cheia \nde imagens e de charadas, mas é isso — preciso \nmesmo sair de baixo da pressão, limpar o sangue. \nSentiram o drama? O doutor bota aqui a lei do \narroz, do açúcar ou da carne — deixem a gente ir \nver como é que essa lei funciona lá no roçado \nonde o arroz nasce! [...] Enfim, enfim, as \ndesculpas são muitas, mas a verdade é uma: está \nchovendo no Ceará que é uma beleza... Adeus, \nGuanabara, adeus! \nQUEIROZ, R. de. Até breve. O cruzeiro. (Adaptado). \nDisponível \nem: \n<https://cronicabrasileira.org.br/cronicas/19085/ate-\nbreve>.", "original": "img/CAI25-SUP-p2.webp", "numbered": ["img/CAI25-SUP-T1-aux-0.webp", "img/CAI25-SUP-T1-aux-1.webp"]}, "CAI25-COO-T1": {"imgs": ["img/CAI25-COO-T1-0.webp", "img/CAI25-COO-T1-1.webp"], "text": "LÍNGUA PORTUGUESA  \nLeia o texto a seguir para responder às\nquestões de 1 a 6. \n \nAté breve \n \nHá \ntemperamentos \nurbanos \npor\nnascimento, \nmas \nhá, \nigualmente, \nos\ntemperamentos rurais. Uns só podem viver no\nasfalto, emb  era tão extraordinário quanto\nminucioso, mas não servia para grande coisa. \nEra tão vasto que se tornava impraticável\nconsultá-lo; e tão minudente que melhor seria\npercorrer a própria região a pé ou a cavalo,\nconferindo \nrelevos, \ndepressões, \nplatôs \ne\nplanícies. \nBorges não diz, mas é de se supor que\ndurante a preparação do tal mapa passaram-se\ntantos e tantos anos que alguns dos cartógrafos\nterão sido surpreendidos pela morte; que os\ndemais envelheceram a ponto de serem\nsubstituídos por cartógrafos da nova geração; que\nos estudantes que aguardavam a espantosa\nnovidade concluíram seus cursos, receberam\nseus diplomas e decidiram conhecer a geografia\nque lhes era possível sem o concurso do mapa. \nMas, principalmente, nesse entretempo,\nhavia acontecido um sem número de revoluções\ne \na \ngeografia \njá \nera \noutra.\nAs fronteiras tinham-se alargado aqui e\nestreitado ali, novas cidades haviam surgido, rios\ntinham sido desviados e grandes represas\nconstruídas na esteira da expansão industrial e da\ndemanda urbana. \nEnfim, antes mesmo de dar-se por\nterminado e impresso, o grande mapa já era um\ndocumento de arquivo, uma relíquia do passado. \nSe tivesse sobrevivido à derrocada do\nsistema soviético a partir de 1989, Borges teria\ntalvez sorrido à ideia quase surreal de que todos\nos mapas-múndi se desatualizavam de uma só\nvez, como o fantástico (porém inútil) mapa de\nseus cartógrafos. (...) \n\nA velocidade da história parece sugerir, \nmuito borgianamente, que os novos mapas \ncheguem a seu destino – isto é, a seus leitores – \nno bojo de veículos que demonstrem ser tão \nrápidos quanto a própria história. (...) \n \nMARTINS FILHO, José. A velocidade da história. Folha \nde \nS. \nPaulo. \nDisponível \nem \n<https://www1.folha.uol.com.br/fsp/1994/8/14/painel/2.ht\nml>.", "original": "img/JER26-ORI-p2.webp", "numbered": ["img/JER26-ORI-T1-aux-0.webp", "img/JER26-ORI-T1-aux-1.webp"]}, "JER26-COO-T1": {"imgs": ["img/JER26-COO-T1-0.webp", "img/JER26-COO-T1-1.webp"], "text": "LÍNGUA PORTUGUESA \nTEXTO \nLeia o texto a seguir para responder às\nquestões de 01 a 03. \n \nA solidão dentro dos elevadores \n \nOs elevadores modernos são máquinas\ndeslumbrantes. Reluzentes em seus metais\npolidos, \nem \nseus \nnúmeros \niluminados,\nacompanhando setinhas que sobem e descem,\nenquanto uma voz diz o andar e quem está nele...\nSão máquinas que mostram a arrogância\ndos homens e seu poder quase ilimitado no trato\ndas coisas físicas.  Máquinas que são incenso e\naltar para a arrogância quase infinita dos homens\nque se esquecem do exemplo da Torre de Babel\n(...). \nE, no entanto, nada é mais contraditório\ndo que um elevador, na primeira hora da jornada\nde trabalho, numa manhã de inverno, fria e\númida, cinza e triste, como as ruas da cidade. \nNada é mais triste do que ele, ou melhor,\ndo que vê-lo transportando os mesmos seres\nhumanos que se julgam \ntão superiores,\nencolhidos dentro de seu frio interno, muito mais\nfrio do que o frio das ruas que o vento assola e a\ngaroa tortura. \nÉ quase constrangedor entrar numa destas\nmáquinas às 8 ou 9 da manhã de um dia de\ntrabalho e ver as pessoas dentro, normalmente\nolhando para o lado ou para o chão, como que\ncom medo de encarar os outros, ou com medo de\nque os outros olhem para elas. \nE é mais triste ainda entrar no elevador e\ndar bom dia para os que já estão dentro.  \nÉ quase certo que tomarão um susto, e se\nsentirão completamente desnorteados, sem saber\nque atitude tomar, se respondem ou continuam\nolhando para o chão, ou se sorriem, ou sabe-se lá\no quê... \nÉ triste, triste como a solidão das ruas,\nque é a mesma, mas que dentro de um elevador\npode ser mais dura e mais cinza. \n\nA solidão de quem vive na cidade grande, \ncercado por milhões de outros seres humanos, \ntodos estranhos e distantes, todos com medo de \nnão ter medo, todos apavorados ante a \npossibilidade de um simples bom dia. \n \nMENDONÇA, Antonio Penteado. A solidão dentro dos \nelevadores. \nCrônicas \nda \ncidade. \nDisponível \nem \n<https://cronicasdacidade.com.br/cronicas/2024/07/06/a-\nsolidao-dentro-dos-elevadores/>.", "original": "img/JER26-COO-p2.webp", "numbered": ["img/JER26-COO-T1-aux-0.webp", "img/JER26-COO-T1-aux-1.webp"]}, "JER26-INF-T1": {"imgs": ["img/JER26-INF-T1-0.webp", "img/JER26-INF-T1-1.webp"], "text": "LÍNGUA PORTUGUESA \nTEXTO \nLeia o texto a seguir para responder às\nquestões de 01 a 03. \n \nA velocidade da história \n \nNum de seus contos mais notáveis, Jorge\nLuis Borges fala de uma equipe de cartógrafos\nque imaginou um mapa tão perfeito e detalhado\nque, uma vez estendido sobre a plataforma\ngeográfica, correspondia em extensão a cada\nmilímetro da região cartografada. Ou seja, o\ngigantesco mapa era tão extraordinário quanto\nminucioso, mas não servia para grande coisa. \nEra tão vasto que se tornava impraticável\nconsultá-lo; e tão minudente que melhor seria\npercorrer a própria região a pé ou a cavalo,\nconferindo \nrelevos, \ndepressões, \nplatôs \ne\nplanícies. \nBorges não diz, mas é de se supor que\ndurante a preparação do tal mapa passaram-se\ntantos e tantos anos que alguns dos cartógrafos\nterão sido surpreendidos pela morte; que os\ndemais envelheceram a ponto de serem\nsubstituídos por cartógrafos da nova geração; que\nos estudantes que aguardavam a espantosa\nnovidade concluíram seus cursos, receberam\nseus diplomas e decidiram conhecer a geografia\nque lhes era possível sem o concurso do mapa. \nMas, principalmente, nesse entretempo,\nhavia acontecido um sem número de revoluções\ne \na \ngeografia \njá \nera \noutra.\nAs fronteiras tinham-se alargado aqui e\nestreitado ali, novas cidades haviam surgido, rios\ntinham sido desviados e grandes represas\nconstruídas na esteira da expansão industrial e da\ndemanda urbana. \nEnfim, antes mesmo de dar-se por\nterminado e impresso, o grande mapa já era um\ndocumento de arquivo, uma relíquia do passado. \nSe tivesse sobrevivido à derrocada do\nsistema 'use strict';const D=JSON.parse(document.getElementById('data').textContent),Q=D.questions,B=D.bases,$=x=>document.getElementById(x),M=Object.fromEntries(Q.map(q=>[q.id,q]));const areas={LP:'Língua Portuguesa',MRL:'Matemática e raciocínio lógico',INF:'Informática',CE:'Conhecimentos específicos'},quota={LP:10,MRL:10,INF:5,CE:25};const roles={DIR:'Diretor de Escola',SUP:'Supervisor de Ensino'};const K='avanca-lais-v1';let state={role:'DIR',history:[],session:null};try{const s=JSON.parse(localStorage.getItem(K)||'null');if(s)state={...state,...s}}catch{}let selectedAreas=new Set(),selectedTopics=new Set(),screen='home',tick=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const src=p=>window.AVANCA_IMAGENS?.[p]||D.images?.[p]||p;const image=(p,cl='questionimg')=>`<img class="${cl}" src="${esc(src(p))}" alt="Recorte original da prova" data-img="${esc(p)}">`;function save(){try{localStorage.setItem(K,JSON.stringify(state))}catch{}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}$('close').onclick=()=>$('modal').close();function rolePool(){return Q.filter(q=>q.role==='both'||q.role===state.role)}function setRole(r){state.role=r;save();home()}function home(){screen='home';clearInterval(tick);const h=state.history,correct=h.filter(x=>x.correct).length;$('app').innerHTML=`<section class="card"><div class="tag">Seu plano de estudos</div><h2>Olá, Laís!</h2><p>Questões reais da Avança, reunidas para a sua preparação.</p><label for="role">Cargo</label><select id="role" style="display:block;width:100%;margin-top:7px">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${state.role===k?'selected':''}>${v}</option>`).join('')}</select>${state.session&&!state.session.finished?'<button class="primary" style="margin-top:12px;width:100%" id="resume">Continuar atividade</button>':''}</section><div class="tiles"><button class="tile" id="exam"><b>Simulado completo</b><small>50 questões · 3 horas</small></button><button class="tile" id="study"><b>Estudar por assunto</b><small>Escolha o que praticar</small></button><button class="tile" id="stats"><b>Meu desempenho</b><small>${h.length?h.length+' respostas registradas':'Acompanhe sua evolução'}</small></button><button class="tile" id="tips"><b>Dicas para sua prova</b><small>Prioridades e leituras</small></button></div><p class="muted" style="margin:14px 2px">${rolePool().length} questões disponíveis para este percurso. ${h.length?'Aproveitamento nas tentativas: '+Math.round(100*correct/h.length)+'%.':''}</p>`;$('role').onchange=e=>setRole(e.target.value);$('exam').onclick=()=>startExam();$('study').onclick=()=>study();$('stats').onclick=stats;$('tips').onclick=tips;if($('resume'))$('resume').onclick=renderQuestion}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pick(a,n){const done=new Set(state.history.map(x=>x.id));return [...shuffle(a.filter(q=>!done.has(q.id))),...shuffle(a.filter(q=>done.has(q.id)))].slice(0,n)}function startExam(){if(state.session&&!state.session.finished&&!confirm('Iniciar outro simulado? A atividade atual será substituída.'))return;let pool=rolePool(),out=[];for(const [a,n] of Object.entries(quota)){let aa=pool.filter(q=>q.area===a);if(aa.length<n){toast('Não há questões suficientes para um simulado completo.');return}let batch=pick(aa,n);if(a==='CE'){// preferência moderada por cadernos do cargo, sem excluir a base comum
 let pref=aa.filter(q=>q.preferred===state.role),first=pick(pref,Math.min(8,pref.length));batch=[...first,...pick(aa.filter(q=>!first.includes(q)),n-first.length)];}
 if(a==='LP')batch.sort((x,y)=>(x.eixo==='LP01'?-1:x.eixo==='LP13'?1:0)-(y.eixo==='LP01'?-1:y.eixo==='LP13'?1:0));if(a==='INF'){let o={INF01:0,INF02:1,INF03:2};batch.sort((x,y)=>(o[x.eixo]??3)-(o[y.eixo]??3))}out.push(...batch)}start(out,'exam')}
function study(preset=null){screen='study';clearInterval(tick);if(preset){selectedAreas=new Set(preset.areas||[]);selectedTopics=new Set(preset.topics||[])}else{selectedAreas=new Set();selectedTopics=new Set()}renderStudy()}function filtered(){return rolePool().filter(q=>(!selectedAreas.size||selectedAreas.has(q.area))&&(!selectedTopics.size||selectedTopics.has(q.topic)||selectedTopics.has(q.author)||q.secondary.some(t=>selectedTopics.has(t))))}function renderStudy(){const topics=[...new Set(rolePool().filter(q=>!selectedAreas.size||selectedAreas.has(q.area)).flatMap(q=>[q.topic,q.author,...q.secondary].filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'pt'));let n=filtered().length;$('app').innerHTML=`<section class="card"><h2>Estudar por assunto</h2><p>Escolha uma ou mais áreas. Se quiser, refine por assunto ou autor.</p><div class="chips">${Object.entries(areas).map(([k,v])=>`<button class="${selectedAreas.has(k)?'on':''}" data-area="${k}">${v}</button>`).join('')}</div><details ${selectedTopics.size?'open':''}><summary>Escolher assuntos (opcional)</summary><input id="search" placeholder="Buscar assunto ou autor" style="width:100%;border:1px solid #ccd8cf;padding:8px;margin:8px 0;border-radius:7px"><div class="topiclist">${topics.map(t=>`<label data-label="${esc(t.toLowerCase())}"><input type="checkbox" data-topic="${esc(t)}" ${selectedTopics.has(t)?'checked':''}>${esc(t)} <small>(${rolePool().filter(q=>q.topic===t||q.author===t||q.secondary.includes(t)).length})</small></label>`).join('')}</div></details><p><b id="avail">${n}</b> questões disponíveis</p><label>Quantidade <select id="amount">${[5,10,15,20,25,50].map(x=>`<option ${x===10?'selected':''} value="${x}">${x}</option>`).join('')}<option value="all">Todas</option></select></label><button class="primary" id="start" style="width:100%;margin-top:14px" ${n?'':'disabled'}>Começar treino</button></section>`;document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{selectedAreas.has(b.dataset.area)?selectedAreas.delete(b.dataset.area):selectedAreas.add(b.dataset.area);selectedTopics.clear();renderStudy()});document.querySelectorAll('[data-topic]').forEach(b=>b.onchange=()=>{b.checked?selectedTopics.add(b.dataset.topic):selectedTopics.delete(b.dataset.topic);$('avail').textContent=filtered().length;$('start').disabled=!filtered().length});$('search').oninput=e=>document.querySelectorAll('[data-label]').forEach(l=>l.hidden=!l.dataset.label.includes(e.target.value.toLowerCase()));$('start').onclick=()=>{const a=filtered(),v=$('amount').value;if(!a.length)return;if(state.session&&!state.session.finished&&!confirm('Substituir a atividade atual?'))return;start(pick(a,v==='all'?a.length:Math.min(a.length,+v)),'study')}}
function start(a,mode){state.session={ids:a.map(x=>x.id),mode,i:0,answers:{},revealed:{},marked:{},logged:{},started:Date.now(),deadline:mode==='exam'?Date.now()+10800000:null,finished:false,role:state.role};save();renderQuestion()}function log(q,answer,s){if(s.logged[q.id]||!answer)return;s.logged[q.id]=true;state.history.push({id:q.id,area:q.area,topic:q.topic,author:q.author,answer,correct:answer===q.key,date:Date.now(),mode:s.mode})}function record(s,q){log(q,s.answers[q.id],s);save()}function finish(){const s=state.session;if(!s||s.finished)return;for(const id of s.ids)if(s.answers[id])log(M[id],s.answers[id],s);s.finished=true;s.ended=Date.now();save();result()}
function renderQuestion(){const s=state.session;if(!s)return home();if(s.finished&&screen!=='review')return result();screen=s.finished?'review':'question';clearInterval(tick);const q=M[s.ids[s.i]];if(!q)return home();const a=s.answers[q.id],show=s.finished||!!s.revealed[q.id],exam=s.mode==='exam',base=q.base?B[q.base]:null;const num=s.i+1,answered=Object.keys(s.answers).length;$('app').innerHTML=`<section class="card"><div class="row between"><span class="tag">${esc(areas[q.area])}</span><span class="timer" id="timer"></span><span>${num}/${s.ids.length}</span></div><div class="bar"><i style="width:${answered/s.ids.length*100}%"></i></div><h2>Questão ${num}</h2>${base?`<details open><summary>Texto ou material de apoio</summary>${base.numbered?`<label><input id="numlines" type="checkbox" ${state.numbered?'checked':''}> Numeração auxiliar (não oficial)</label>`:''}${(state.numbered&&base.numbered?base.numbered:base.imgs).map(p=>image(p,'baseimg')).join('')}<button id="originalBase">Ver página do texto-base</button></details>`:''}${image(q.img)}<div class="row between"><small>Toque na imagem para ampliar.</small><button id="original">Ver página original</button></div><div class="answers">${'ABCDE'.split('').map(k=>`<button data-answer="${k}" class="${show&&k===q.key?'right':show&&a===k&&a!==q.key?'wrong':a===k?'on':''}" ${show?'disabled':''}>${k}</button>`).join('')}</div>${show?`<div class="notice"><b>${a?a===q.key?'Resposta correta!':'Gabarito oficial: '+q.key:'Gabarito oficial: '+q.key}</b><br><small>${esc(q.topic)}${q.author?' · '+esc(q.author):''}</small></div><div class="row" style="margin-top:10px"><button id="copy">Copiar para a Sofia</button><button id="exportImage">Salvar imagem da questão</button></div>`:!exam?'<button class="primary" id="reveal">Ver resposta</button>':''}<div class="row between line"><button id="prev" ${num===1?'disabled':''}>Anterior</button><label><input id="mark" type="checkbox" ${s.marked[q.id]?'checked':''}> Rever depois</label><button id="next" ${num===s.ids.length?'disabled':''}>Próxima</button></div><details><summary>Mapa das questões</summary><div class="navigator">${s.ids.map((id,i)=>`<button data-n="${i}" class="${s.answers[id]?'answered ':''}${i===s.i?'current':''}">${i+1}${s.marked[id]?'*':''}</button>`).join('')}</div></details><div class="row between line"><button id="leave">${s.finished?'Voltar ao resultado':'Salvar e sair'}</button>${s.finished?'':'<button class="primary" id="finish">Finalizar '+(exam?'simulado':'treino')+'</button>'}</div><small>${show?esc(q.source)+' · questão original '+q.n+' · p. '+q.p:''}</small></section>`;if(exam&&!s.finished){const time=()=>{let t=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if(!t){finish();return} $('timer').textContent=[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(x=>String(x).padStart(2,'0')).join(':')};time();if(s.finished)return;tick=setInterval(time,1000)}document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{s.answers[q.id]=b.dataset.answer;save();renderQuestion()});document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>modal('Imagem ampliada',`<img src="${esc(src(b.dataset.img))}" alt="Original">`));$('original').onclick=()=>modal('Página original · questão '+q.n,q.pages.map(p=>image(p)).join(''));if($('numlines'))$('numlines').onchange=e=>{state.numbered=e.target.checked;save();renderQuestion()};if($('originalBase'))$('originalBase').onclick=()=>modal('Texto-base original',image(base.original));$('mark').onchange=e=>{s.marked[q.id]=e.target.checked;save()};if($('reveal'))$('reveal').onclick=()=>{s.revealed[q.id]=true;record(s,q);renderQuestion()};$('prev').onclick=()=>{s.i--;save();renderQuestion()};$('next').onclick=()=>{s.i++;save();renderQuestion()};document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{s.i=+b.dataset.n;save();renderQuestion()});$('leave').onclick=()=>s.finished?result():home();if($('finish'))$('finish').onclick=()=>{if(answered<s.ids.length&&!confirm('Finalizar com '+(s.ids.length-answered)+' questões sem resposta?'))return;finish()};if($('copy'))$('copy').onclick=()=>copyQuestion(q,s);if($('exportImage'))$('exportImage').onclick=()=>exportImage(q)}
async function copyQuestion(q,s){let b=q.base?B[q.base]:null;let txt=`Sofia, ajude-me a corrigir esta questão da Avança. Explique o raciocínio e os distratores, sem pressupor que o gabarito seja infalível.\n\n${q.source}, questão ${q.n}, página ${q.p}.\nAssunto: ${q.topic}\nMinha resposta: ${s.answers[q.id]||'não marcada'}\nGabarito oficial: ${q.key}\n\n${q.text?((b?.text?'Texto-base (extração do PDF; conferir imagem):\n'+b.text+'\n\n':'')+'Questão (extração textual do PDF; conferir destaques e figuras na imagem):\n'+q.text):'O enunciado está na imagem original. Vou anexar a imagem salva pelo aplicativo.'}`;try{await navigator.clipboard.writeText(txt);toast('Texto copiado. Anexe a imagem quando necessário.')}catch{modal('Copiar para a Sofia',`<p>Selecione e copie o texto abaixo. Para figuras ou provas digitalizadas, anexe a imagem salva.</p><textarea id="copied">${esc(txt)}</textarea>`);$('copied').select()}}
async function exportImage(q){try{let paths=[...(q.base?B[q.base].imgs:[]),q.img];let ims=await Promise.all(paths.map(p=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src(p)})));let w=Math.max(...ims.map(i=>i.width)),h=ims.reduce((a,i)=>a+i.height+18,0),can=document.createElement('canvas');can.width=w;can.height=h;let ctx=can.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);let y=0;for(let im of ims){ctx.drawImage(im,0,y);y+=im.height+18}let a=document.createElement('a');a.href=can.toDataURL('image/png');a.download=q.id+'.png';a.click()}catch{modal('Imagem para anexar',[...(q.base?B[q.base].imgs:[]),q.img].map(p=>image(p)).join(''));toast('Salve as imagens pelo navegador.')}}
function result(){screen='result';clearInterval(tick);let s=state.session;if(!s?.finished)return home();let right=s.ids.filter(id=>s.answers[id]===M[id].key).length;$('app').innerHTML=`<section class="card"><div class="tag">Atividade concluída</div><h2>Seu resultado</h2><div class="result">${right}/${s.ids.length} acertos · ${Math.round(100*right/s.ids.length)}%</div><p>${Object.keys(s.answers).length} respostas marcadas</p>${Object.keys(areas).map(k=>{let ids=s.ids.filter(id=>M[id].area===k);return ids.length?metric(areas[k],ids.filter(id=>s.answers[id]===M[id].key).length,ids.length):''}).join('')}<div class="row"><button class="primary" id="errors">Revisar erros</button><button id="allreview">Ver todas</button><button id="performance">Meu desempenho</button></div></section>`;$('errors').onclick=()=>{let i=s.ids.findIndex(id=>s.answers[id]!==M[id].key);if(i<0)return toast('Você acertou todas!');s.i=i;screen='review';renderQuestion()};$('allreview').onclick=()=>{s.i=0;screen='review';renderQuestion()};$('performance').onclick=stats}
function metric(label,c,n){return `<div class="row between"><span>${esc(label)}</span><small>${c}/${n} · ${n?Math.round(c/n*100):0}%</small></div><div class="bar"><i style="width:${n?c/n*100:0}%"></i></div>`}function stats(){screen='stats';clearInterval(tick);const h=state.history,c=h.filter(x=>x.correct).length,groups={};for(let a of h){let g=groups[a.topic]??={n:0,c:0,area:a.area};g.n++;g.c+=a.correct?1:0}let list=Object.entries(groups).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n);$('app').innerHTML=`<section class="card"><h2>Meu desempenho</h2><div class="result">${h.length?Math.round(100*c/h.length)+'%':'—'}</div><p>${h.length} tentativas · ${new Set(h.map(x=>x.id)).size} questões diferentes</p>${Object.entries(areas).map(([k,v])=>{let a=h.filter(x=>x.area===k);return metric(v,a.filter(x=>x.correct).length,a.length)}).join('')}<h3>Desempenho por assunto</h3>${list.length?list.map(([k,v])=>metric(k,v.c,v.n)).join(''):'<p class="muted">Faça uma atividade para acompanhar seus resultados.</p>'}<div class="row"><button id="weak" ${list.length?'':'disabled'}>Treinar pontos fracos</button><button id="report">Exportar histórico</button></div><small>Os resultados são salvos neste navegador. Trocar de dispositivo não transfere o histórico automaticamente.</small></section>`;$('weak').onclick=()=>{const t=list.filter(x=>x[1].c<x[1].n).slice(0,5).map(x=>x[0]);if(!t.length)return toast('Nenhum ponto fraco identificado nas respostas registradas.');study({topics:t})};$('report').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(h,null,2)],{type:'application/json'}));a.download='avanca-lais-historico.json';a.click()}}
function tips(){screen='tips';clearInterval(tick);$('app').innerHTML=`<section class="card"><h2>Dicas para sua prova</h2><p>Nos 16 blocos gerais do levantamento histórico, 14 começam por interpretação ou tipologia textual. Em Informática, Windows aparece na posição 21 ou 22 em 14 blocos. São tendências, não previsões.</p><div class="chips"><button data-tip="Interpretação e tipos de texto">Treinar interpretação</button><button data-tip="Windows">Treinar Windows</button></div><h3>Autores para priorizar</h3><p>Freire, Luckesi e Arroyo foram recorrentes em cinco das sete seleções educacionais do levantamento anterior. Use as questões para revisar os conceitos, não para supor o que cairá.</p>${['Paulo Freire','Cipriano Luckesi','Miguel Arroyo','Dermeval Saviani','Celso Vasconcellos','Heloísa Lück','José Carlos Libâneo'].map(a=>`<div class="row between line"><b>${a}</b><button data-tip="${a}">Treinar (${rolePool().filter(q=>q.author===a).length})</button></div>`).join('')}<h3>Leitura complementar</h3><p>O acervo não substitui o edital, especialmente as normas municipais de Limeira e as referências novas ou pouco representadas.</p><p><a target="_blank" rel="noopener" href="https://avancasp.selecao.net.br/informacoes/21/">Edital e retificações oficiais</a></p><p><a target="_blank" rel="noopener" href="https://www.planalto.gov.br/ccivil_03/leis/l9394.htm">LDB — texto atualizado</a> · <a target="_blank" rel="noopener" href="https://www.planalto.gov.br/ccivil_03/leis/l8069.htm">ECA — texto atualizado</a></p><p><a target="_blank" rel="noopener" href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/l15388.htm">Novo PNE</a> · <a target="_blank" rel="noopener" href="https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14533.htm">Educação digital</a></p><p>Consulte ainda o Estatuto do Magistério, o Estatuto dos Funcionários, o currículo municipal e as demais normas do edital. Essas referências exigem leitura direta.</p></section>`;document.querySelectorAll('[data-tip]').forEach(b=>b.onclick=()=>study({topics:[b.dataset.tip]}))}$('home').onclick=home;home();
</script></body></html>
